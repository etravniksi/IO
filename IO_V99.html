function analyzeBuffer(){
  const s = currentSite(); if(!s) return;
  const buf = OSCBUF[s.id] || [];
  if(!buf.length){ logDebug(T('bufDumpEmpty')); ensureLogOpen(); return; }
  clearDebugLog(); ensureLogOpen();
  let oldest = null, newest = null, minT = null, maxT = null;
  const ids = [];
  for(const p of buf){
    if(p.recId){
      ids.push(p.recId);
      if(oldest === null || p.recId < oldest.recId) oldest = p;
      if(newest === null || p.recId > newest.recId) newest = p;
    }
    if(minT === null || p.t < minT) minT = p.t;
    if(maxT === null || p.t > maxT) maxT = p.t;
  }
  ids.sort((a,b) => a-b);
  const S = seenSet(s.id);
  const boot = BOOT_ID[s.id];
  const gaps = [];
  let missing = 0;
  if(oldest && newest){
    let gapStart = null;
    for(let x = oldest.recId; x <= newest.recId; x++){
      const have = S.has(rk(s.id, x, boot));
      if(!have){ missing++; if(gapStart === null) gapStart = x; }
      else if(gapStart !== null){ gaps.push([gapStart, x-1]); gapStart = null; }
    }
    if(gapStart !== null) gaps.push([gapStart, newest.recId]);
  }
  const durS = (minT !== null && maxT !== null) ? ((maxT - minT) / 1000).toFixed(1) : '?';
  logDebug(`[ANALIZA] ${s.id}: ${buf.length} zapisov v bufferju, razpon ${durS}s`);
  if(oldest) logDebug(`[ANALIZA] najstarejsi id=${oldest.recId}`);
  if(newest) logDebug(`[ANALIZA] najmlajsi id=${newest.recId}`);
  logDebug(`[ANALIZA] ${s.id}: manjka ${missing} v ${gaps.length} vrzeli`);
  if(gaps.length) logDebug(`[ANALIZA] ${s.id}: vrzeli: ${gaps.slice(0,10).map(g=>g[0]+'..'+g[1]).join(', ')}`);
}

let HIST_INFO = {};
let TB_MISMATCH = {};
let LAST_TB = {};

function decodeScopeBlock(id, arrBuf){
  try{
    const dv = new DataView(arrBuf);
    if(dv.byteLength < 8) return;
    const tbMs = dv.getUint32(0, true) || 1;
    const n = dv.getUint16(4, true);
    const blkFlags = dv.getUint8(6);
    const L = ensureLive(id);
    let off = 8, last = null, firstRecId = null;
    const _pb = OSCBUF[id];
    const _prevNewestT = (_pb && _pb.length) ? _pb[_pb.length-1].t : null;   // V95: za DISP_LAG
    for(let i=0;i<n;i++){
      if(off+19 > dv.byteLength) break;
      const recId = dv.getUint32(off, true);
      const tm    = dv.getUint32(off+4, true);
      if(RAW_MIRROR){
        const rrb = dv.getUint8(off+8), rs1 = dv.getUint8(off+9), rs2 = dv.getUint8(off+10);
        logDebug(`[RAW] ${id}: id=${recId} millis=${tm} rele=${[1,2,4,8].map(b=>(rrb&b)?1:0).join('')} `
               + `servo=${rs1},${rs2} adc=${(dv.getUint16(off+11,true)/10).toFixed(1)}/`
               + `${(dv.getUint16(off+13,true)/10).toFixed(1)}/${(dv.getUint16(off+15,true)/10).toFixed(1)}/`
               + `${(dv.getUint16(off+17,true)/10).toFixed(1)}`);
      }
      if(recId > MAX_VALID_REC_ID){
        if(SEEN_INVALID_ID[id] !== recId){ SEEN_INVALID_ID[id] = recId; logDebug(`scope ${id}: neveljaven ID ${recId}`, true); }
        off += 19;
        continue;
      }
      const rb    = dv.getUint8(off+8);
      const s1    = dv.getUint8(off+9), s2 = dv.getUint8(off+10);
      // V94: segmentacija po zagonih naprave - zgodovinski zapis iz PREJSNJEGA
      // zagona dobi odmik svojega zagona, ne trenutnega.
      const isHistBlk = !!(blkFlags & 2);
      if(rb === 0xFF) segAddMark(id, recId, tm); else segNoteData(id, recId, tm);
      let tAbs;
      if(isHistBlk){ const rt = recTime(id, recId, tm); tAbs = (rt !== null) ? rt : deviceTime(id, tm, true); }
      else tAbs = deviceTime(id, tm, false);
      const sample = {
        recId, tm,
        t: tAbs,
        rele: [!!(rb&1), !!(rb&2), !!(rb&4), !!(rb&8)],
        servo: [s1, s2],
        analog: { a1: dv.getUint16(off+11,true)/10, a2: dv.getUint16(off+13,true)/10,
                  a3: dv.getUint16(off+15,true)/10, a4: dv.getUint16(off+17,true)/10 }
      };
      xferNoteRec(id, recId, sample.t, !!(blkFlags & 2));
      const isHist = (LAST_REC_ID[id] !== undefined && recId <= LAST_REC_ID[id]);
      if(isHist){
        if(!wasRequested(id, recId)) logDebug(`scope ${id}: nepricakovan starejsi ID ${recId}`, true);
      } else {
        if(LAST_REC_ID[id] !== undefined && recId > LAST_REC_ID[id] + 1){
          const from = LAST_REC_ID[id] + 1, to = recId - 1;
          const miss = countMissing(id, from, to);
          if(miss > 0){
            logDebug(`scope ${id}: vrzel ${miss} zapisov (${LAST_REC_ID[id]} -> ${recId})`, true);
            requestGapFill(id, from, to - from + 1);
          }
        }
        LAST_REC_ID[id] = recId;
      }
      if(i === 0){
        const site = CFG.sites.find(x=>x.id===id);
        if(site && site.opMode === 'real' && currentTab === 'osciloskop'){
          const want = OSC_TIMEBASE;
          const mismatch = Math.abs(tbMs - want) > Math.max(2, want*0.5);
          if(mismatch){
            if(!TB_MISMATCH[id]) TB_MISMATCH[id] = Date.now();
            else if(Date.now() - TB_MISMATCH[id] > 10000){
              TB_MISMATCH[id] = Date.now();
              logDebug(`OSC ${id}: naprava vzorci na ${tbMs}ms, izbrano ${want}ms`, true);
              sendCommand(site, 'scope/set', { timebase_ms: want });
            }
          } else TB_MISMATCH[id] = 0;
        }
        const hz = tbMs > 0 ? (1000/tbMs).toFixed(1) : '?';
        LAST_TB[id] = tbMs;
        logDebug(`REC ${id}: id=${recId} millis=${tm} odmik=${Math.round(CLOCK_OFF[id]||0)}ms `
               + `dejansko=${tbMs}ms (${hz}Hz) rele=${sample.rele.map(b=>b?1:0).join('')} servo=${s1},${s2} `
               + `adc=${sample.analog.a1.toFixed(1)}/${sample.analog.a2.toFixed(1)}/${sample.analog.a3.toFixed(1)}/${sample.analog.a4.toFixed(1)} `
               + `n=${n} tb=${tbMs}ms buf=${(OSCBUF[id]||[]).length}`);
      }
      if(rb === 0xFF){
        // V94: oznaka vklopa gre v SEEN in na disk (prej ni - backfill jo je
        // zato imel za manjkajoco in ob nalaganju z diska ni bilo mogoce
        // razdeliti zgodovine po zagonih). Cas oznake (RESETS) se izracuna
        // v retimeTick() iz tabele zagonov.
        seenSet(id).add(rk(id, recId, BOOT_ID[id]));
        if(BOOT_ID[id] && SITE_IS_REAL(id)){
          storePush(id, BOOT_ID[id], recId, new Uint8Array(arrBuf.slice(off, off+19)), CLOCK_OFF[id] || 0, true);
        }
        last = null;
        off += 19;
        continue;
      }
      if(firstRecId === null) firstRecId = recId;
      sample.boot = BOOT_ID[id];
      if(isHistBlk) hrqNoteRec(id, recId, !seenSet(id).has(rk(id, recId, BOOT_ID[id])));   // V97
      pushOscSample(id, sample);
      checkLegacyBoot(id, recId, tm);
      if(BOOT_ID[id] && SITE_IS_REAL(id)){
        storePush(id, BOOT_ID[id], recId, new Uint8Array(arrBuf.slice(off, off+19)), CLOCK_OFF[id] || 0, !!(blkFlags & 2));
      }
      last = sample;
      off += 19;
    }
    if(last){
      L.online = true; L.stale = false; L.lastSeen = Date.now();
      L.pinging = false;
      L.rele = last.rele.slice(); L.servo = last.servo.slice(); L.analog = last.analog;
      const lag = Date.now() - last.t;
      rateNote(id, n, lag > 0 ? lag : 0, firstRecId, last.recId, blkFlags);
      if(!(blkFlags & 2)) dispLagNote(id, _prevNewestT);   // V95: samo zivi bloki
    }
    renderSiteMenu(); renderConnPill();
    if(currentTab==='nadzor') updateNadzorState();
  }catch(e){ logDebug(`decodeScopeBlock ${id}: ${e.message}`, true); }
}

function onMqttMsg(topic, payload){
  const m = topic.match(/^naprava\/([0-9A-Fa-f]{6})\/(.+)$/);
  if(!m){ logDebug(`onMqttMsg: tema ne ustreza: ${topic}`, true); return; }
  const id = m[1].toUpperCase(), sub = m[2];

  if(sub==='scope/ping'){
    const L = ensureLive(id);
    L.online = true; L.stale = false; L.lastSeen = Date.now();
    L.pinging = true;
    renderSiteMenu(); renderConnPill();
    if(currentTab==='nadzor') updateNadzorState();
    return;
  }
  if(sub==='hist/info'){
    try{
      const d = JSON.parse(payload.toString());
      HIST_INFO[id] = Object.assign({}, HIST_INFO[id], d);
      if(d.status === 'sending'){
        logDebug(`ZGODOVINA ${id}: naprava poslja ID ${d.histFrom}..${d.histTo}`);
        if(!ARCHIVE_XFER_START[id]) ARCHIVE_XFER_START[id] = Date.now();
      }
      else if(d.status === 'out_of_range'){ logDebug(`ZGODOVINA ${id}: zahteva izven obsega`, true); hrqOnStatus(id, 'out_of_range'); }
      else if(d.status === 'done'){
        logDebug(`ZGODOVINA ${id}: prenos koncan`);
        if(ARCHIVE_XFER_START[id]){
          const elapsed = Date.now() - ARCHIVE_XFER_START[id];
          ARCHIVE_DELAY[id] = Math.max(1000, Math.min(10000, elapsed * 3));
          delete ARCHIVE_XFER_START[id];
        }
        hrqOnStatus(id, 'done');   // V97: centralna vrsta zahtev
      }
    }catch(e){}
    return;
  }
  if(sub==='scope/data'){
    xferD(id).pkts++;
    const buf = payload.buffer ? payload.buffer.slice(payload.byteOffset, payload.byteOffset+payload.byteLength) : payload;
    decodeScopeBlock(id, buf);
    return;
  }
  if(sub==='status'){
    const L = ensureLive(id);
    L.lastSeen = Date.now(); L.stale = false;
    const wasOnline = L.online;
    L.online = (payload.toString()==='online');
    if(wasOnline !== L.online) logDebug(`STATUS ${id}: ${L.online?'ONLINE':'OFFLINE'}`, !L.online);
    renderSiteMenu(); renderConnPill();
  }
  if(sub==='stanje/izhodi'){
    try{
      const d = JSON.parse(payload.toString());
      const uc = ensureUICmd(id);
      const L  = ensureLive(id);
      const ch = [];
      if(Array.isArray(d.rele)){
        d.rele.forEach((r,i)=>{
          if(i>3) return;
          if(cardLocked(id,'rele',i)) return;
          const m = (r.m==='blink') ? 'period' : 'manual';
          if(uc.rele[i].mode !== m) ch.push(`R${i+1} nacin ${uc.rele[i].mode}->${m}`);
          if(m==='period'){
            if(uc.rele[i].ton !== r.ton || uc.rele[i].toff !== r.toff) ch.push(`R${i+1} ${r.ton}/${r.toff}s`);
            uc.rele[i].ton = r.ton; uc.rele[i].toff = r.toff;
          } else uc.rele[i].on = !!r.s;
          uc.rele[i].mode = m;
          L.rele[i] = !!r.s;
        });
      }
      if(Array.isArray(d.servo)){
        d.servo.forEach((v,i)=>{
          if(i>1) return;
          if(cardLocked(id,'servo',i)) return;
          const m = (v.m==='oscillate') ? 'period' : 'manual';
          if(uc.servo[i].mode !== m) ch.push(`S${i+1} nacin ${uc.servo[i].mode}->${m}`);
          uc.servo[i].mode = m;
          uc.servo[i].posA = v.a; uc.servo[i].posB = v.b;
          uc.servo[i].posOff = v.off; uc.servo[i].posOn = v.on;
          uc.servo[i].ton = v.ton; uc.servo[i].toff = v.toff;
          uc.servo[i].rampMsP = v.ramp;
          uc.servo[i].on = (Math.abs(v.pos - v.on) < Math.abs(v.pos - v.off));
          L.servo[i] = v.pos;
        });
      }
      L.forcedOff = !!d.forced;
      if(d.effMs!==undefined)  L.effMs  = d.effMs;
      if(d.prio!==undefined)   L.prio   = d.prio;
      if(d.heap!==undefined)   L.heap   = d.heap;
      if(d.histCap!==undefined) L.histCap = d.histCap;
      L.outFromDevice = true;
      saveUICmd();
      if(ch.length) logDebug(`IZHODI ${id}: ${ch.join(', ')}`);
      outPendingClear(id, d);
      if(currentTab==='nadzor') renderNadzorControls();
    }catch(e){ logDebug(`IZHODI ${id}: neveljavno sporocilo (${e.message})`, true); }
    return;
  }
  if(sub==='config/stanje'){
    try{
      const d = JSON.parse(payload.toString());
      const L = ensureLive(id);
      if(d.fw!==undefined) L.fw = String(d.fw);
      if(d.boot!==undefined) onDeviceBoot(id, String(d.boot));
      if(d.offlineGuard!==undefined) L.offlineGuard = !!d.offlineGuard;
      if(d.samplePriority!==undefined) L.samplePriority = d.samplePriority|0;
      if(d.bootRestore!==undefined)  L.bootRestore  = !!d.bootRestore;
      if(d.offlineTimeoutS!==undefined) L.offlineTimeoutS = d.offlineTimeoutS;
      if(d.histOldest!==undefined){
        HIST_INFO[id] = Object.assign({}, HIST_INFO[id], {
          oldest: d.histOldest, newest: d.histNewest,
          oldestTm: d.histOldestTm, newestTm: d.histNewestTm,
          fsBlocks: d.fsBlocks, fsTotal: d.fsTotal
        });
        if(!SYNCED_ONCE[id]){
          SYNCED_ONCE[id] = true;
          syncWithDevice(id).catch(e=>logDebug(`SINHRONIZACIJA ${id}: ${e && e.message || e}`, true));
        }
        fillDiskGaps(id);
      }
      if(Array.isArray(d.posOff) || Array.isArray(d.posOn)){
        const uc = ensureUICmd(id);
        for(let i=0;i<2;i++){
          if(Array.isArray(d.posOff) && d.posOff[i]!==undefined) uc.servo[i].posOff = d.posOff[i];
          if(Array.isArray(d.posOn)  && d.posOn[i]!==undefined)  uc.servo[i].posOn  = d.posOn[i];
        }
        saveUICmd();
      }
      if(d.binOn!==undefined)     L.binOn     = !!d.binOn;
      if(d.binPeriod!==undefined) L.binPeriod = d.binPeriod;
      L.cfgFromDevice = true;
      logCfgDiff(id);
      cfgPendingTick();
      if(DRAFT && !DRAFT.dirty && DRAFT.cfg && DRAFT.cfg[id]){
        DRAFT.cfg[id] = { offlineGuard:!!L.offlineGuard, bootRestore:!!L.bootRestore,
                          offlineTimeoutS: L.offlineTimeoutS||60, samplePriority: L.samplePriority|0 };
        renderSettings();
      }
      logDebug(`CONFIG ${id}: fw=${L.fw||'?'} offlineGuard=${L.offlineGuard} timeout=${L.offlineTimeoutS||60}s bootRestore=${L.bootRestore} binOn=${L.binOn}`);
      if(currentTab==='nadzor') renderNadzorControls();
      renderSettings();
    }catch(e){ logDebug(`CONFIG ${id}: napaka parsanja: ${e.message}`, true); }
  }
}

const PENDING = {};
function expectAfterCommand(site, subtopic, obj){
  let check = null;
  const relM = subtopic.match(/^rele\/(\d)\/set$/);
  const srvM = subtopic.match(/^servo\/(\d)\/set$/);
  if(relM && obj.mode === 'static'){ const i = parseInt(relM[1])-1; check = ()=> !!ensureLive(site.id).rele[i] === !!obj.state; }
  else if(srvM && obj.mode === 'static'){ const i = parseInt(srvM[1])-1; check = ()=> Math.abs((ensureLive(site.id).servo[i]||0) - (obj.pos||0)) <= 2; }
  else if(subtopic === 'binarno/set'){ check = ()=> !!ensureLive(site.id).binOn === !!obj.on; }
  if(!check) return;
  const key = site.id + '/' + subtopic;
  if(PENDING[key]) clearTimeout(PENDING[key].timer);
  const tries = (PENDING[key] ? PENDING[key].tries : 0) + 1;
  PENDING[key] = { tries, timer: setTimeout(()=>{
    if(check()){ logDebug(`UKAZ ${subtopic}: potrjen`); delete PENDING[key]; return; }
    if(tries < 2){
      logDebug(`UKAZ ${subtopic}: NI potrjen po 500ms - ponavljam`, true);
      delete PENDING[key];
      sendCommand(site, subtopic, obj);
    } else {
      delete PENDING[key];
      logDebug(`UKAZ ${subtopic}: NI POTRJEN po 2 poskusih`, true);
      showToast(T('cmdFailed'));
    }
  }, 500) };
}

function sendCommand(site, subtopic, obj, quiet){
  if(!quiet) logDebug(`sendCommand naprava/${site.id}/${subtopic} ${JSON.stringify(obj)} [opMode=${site.opMode}]`);
  if(site.opMode==='sim_local'){ applySimCommand(site, subtopic, obj); return; }
  const c = getClient(site.mqtt);
  if(!c){ logDebug(`sendCommand: NI MQTT klienta (${site.mqtt})`, true); showToast(T('alertNoMqtt')); return; }
  const payload = JSON.stringify(obj);
  c.publish(`naprava/${site.id}/${subtopic}`, payload, {qos:0});
  expectAfterCommand(site, subtopic, obj);
  if(!quiet) logDebug(`PUB -> naprava/${site.id}/${subtopic} (${payload.length}B) qos0`);
}

const CARD_LOCK_MS = 6000;
let CARD_LOCK = {};
function cardKey(dev, kind, i){ return `${dev}|${kind}|${i}`; }
function cardLock(dev, kind, i){ CARD_LOCK[cardKey(dev,kind,i)] = Date.now(); }
function cardUnlock(dev, kind, i){ delete CARD_LOCK[cardKey(dev,kind,i)]; }
function cardLocked(dev, kind, i){
  const t = CARD_LOCK[cardKey(dev,kind,i)];
  if(t === undefined) return false;
  if(Date.now() - t > CARD_LOCK_MS){ cardUnlock(dev,kind,i); return false; }
  return true;
}
function outPendingClear(dev, d){
  if(Array.isArray(d.rele)) d.rele.forEach((r,i)=>{
    if(i>3 || !cardLocked(dev,'rele',i)) return;
    const uc = ensureUICmd(dev);
    const m = (r.m==='blink') ? 'period' : 'manual';
    if(uc.rele[i].mode !== m) return;
    if(m==='period' && (uc.rele[i].ton !== r.ton || uc.rele[i].toff !== r.toff)) return;
    if(m==='manual' && !!uc.rele[i].on !== !!r.s) return;
    cardUnlock(dev,'rele',i);
    logDebug(`IZHODI ${dev}: R${i+1} potrjen z naprave`);
  });
  if(Array.isArray(d.servo)) d.servo.forEach((v,i)=>{
    if(i>1 || !cardLocked(dev,'servo',i)) return;
    const uc = ensureUICmd(dev);
    const m = (v.m==='oscillate') ? 'period' : 'manual';
    if(uc.servo[i].mode !== m) return;
    cardUnlock(dev,'servo',i);
    logDebug(`IZHODI ${dev}: S${i+1} potrjen z naprave`);
  });
}
function ensureUICmd(id){
  if(!UICMD[id]) UICMD[id] = {
    rele: [0,1,2,3].map(()=>({mode:'manual', on:false, ton:1, toff:1})),
    servo: [0,1].map(()=>({mode:'manual', on:false, posOff:0, posOn:255, pos:0, rampMs:0, posA:0, posB:255, ton:1, toff:1, rampMsP:0}))
  };
  UICMD[id].servo.forEach(sv=>{
    if(sv.on===undefined) sv.on=false;
    if(sv.posOff===undefined) sv.posOff=0;
    if(sv.posOn===undefined) sv.posOn=255;
  });
  return UICMD[id];
}
function nearestStepIdx(v){
  let bi=0, bd=Infinity;
  STEP_VALUES.forEach((sv,i)=>{ const d=Math.abs(sv-v); if(d<bd){bd=d; bi=i;} });
  return bi;
}

let lastOnlineFlag = null, lastBinOnFlag = null;
function updateNadzorState(){
  if(currentTab!=='nadzor') return;
  const s = currentSite(); if(!s) return;
  const L = ensureLive(s.id);
  const on = isDeviceOnline();
  if(lastOnlineFlag !== on || lastBinOnFlag !== !!L.binOn){
    lastOnlineFlag = on; lastBinOnFlag = !!L.binOn;
    renderNadzorControls();
    return;
  }
  for(let i=0;i<4;i++){
    const btn = document.getElementById('relOnOff'+i);
    if(!btn) continue;
    const isOn = !!L.rele[i];
    if(btn.classList.contains('on') !== isOn){
      btn.classList.toggle('on', isOn); btn.classList.toggle('off', !isOn);
      btn.textContent = isOn ? T('lblOn') : T('lblOff');
    }
  }
  const binBadge = document.getElementById('binBadge');
  if(binBadge){ binBadge.textContent = L.binOn?T('stateActive'):T('stateInactive'); binBadge.classList.toggle('on', !!L.binOn); }
  const binValShow = document.getElementById('binValShow');
  if(binValShow) binValShow.textContent = T('lblBinValue')+': '+(L.binarno||0);
  const ucS = ensureUICmd(s.id);
  for(let i=0;i<2;i++){
    const btn = document.getElementById('srvOnOff'+i);
    if(!btn) continue;
    const cur = L.servo[i]||0;
    const dOn = Math.abs(cur - (ucS.servo[i].posOn||255));
    const dOff = Math.abs(cur - (ucS.servo[i].posOff||0));
    const isOn = dOn < dOff;
    if(btn.classList.contains('on') !== isOn){
      btn.classList.toggle('on', isOn); btn.classList.toggle('off', !isOn);
      btn.textContent = isOn ? T('lblOn') : T('lblOff');
    }
  }
  for(let i=0;i<4;i++){
    const dot = document.getElementById('relLive'+i);
    if(dot) dot.classList.toggle('on', !!(L.rele && L.rele[i]));
  }
  for(let i=1;i<=4;i++){
    const v = L.analog['a'+i];
    const el = document.getElementById('anVal'+i);
    if(el) el.textContent = v!==undefined ? v.toFixed(1) : '?';
  }
}
setInterval(()=>{ updateNadzorState(); }, 250);

function sendRelay(i){
  const s = currentSite(); if(!s) return;
  const uc = ensureUICmd(s.id);
  cardLock(s.id, 'rele', i);
  const mode = relUIMode[i]||'manual';
  uc.rele[i].mode = mode;
  if(mode==='manual'){
    const isOn = document.getElementById('relOnOff'+i).classList.contains('on');
    uc.rele[i].on = isOn;
    sendCommand(s, `rele/${i+1}/set`, { mode:'static', state: isOn });
  } else {
    const tonV = parseFloat(document.getElementById('relTon'+i).value);
    const toffV = parseFloat(document.getElementById('relToff'+i).value);
    const ton = isNaN(tonV)?1:tonV, toff = isNaN(toffV)?1:toffV;
    uc.rele[i].ton = ton; uc.rele[i].toff = toff;
    sendCommand(s, `rele/${i+1}/set`, { mode:'blink', ton, toff });
  }
  saveUICmd();
}
function sendBinary(){
  const s = currentSite(); if(!s) return;
  const L = ensureLive(s.id);

function toggleSrvOnOff(i){
  const btn = document.getElementById('srvOnOff'+i);
  const goingOn = btn.classList.contains('off');
  btn.classList.toggle('on', goingOn); btn.classList.toggle('off', !goingOn);
  btn.textContent = goingOn ? T('lblOn') : T('lblOff');
  const s = currentSite(); if(!s) return;
  const uc = ensureUICmd(s.id);
  const posOff = parseInt(document.getElementById('srvPosOff'+i).value);
  const posOn  = parseInt(document.getElementById('srvPosOn'+i).value);
  let rampMs = parseInt(document.getElementById('srvRampM'+i).value)||0;
  if(rampMs > 0 && rampMs < 50){ rampMs = 50; document.getElementById('srvRampM'+i).value = 50; }
  uc.servo[i].posOff = isNaN(posOff)?0:posOff;
  uc.servo[i].posOn  = isNaN(posOn)?255:posOn;
  uc.servo[i].rampMs = rampMs;
  uc.servo[i].on = goingOn;
  uc.servo[i].mode = 'manual';
  saveUICmd();
  const targetPos = goingOn ? uc.servo[i].posOn : uc.servo[i].posOff;
  const L = ensureLive(s.id); L.servo[i] = targetPos;
  sendCommand(s, `servo/${i+1}/set`, { mode:'static', pos: targetPos, posOff: uc.servo[i].posOff, posOn: uc.servo[i].posOn, rampMs });
  updateNadzorState();
}
function sendServo(i){
  const s = currentSite(); if(!s) return;
  cardLock(s.id, 'servo', i);
  const uc = ensureUICmd(s.id);
  const mode = srvUIMode[i]||'manual';
  uc.servo[i].mode = mode;
  if(mode==='manual'){
    const uc2 = uc.servo[i];
    let rampMs = parseInt(document.getElementById('srvRampM'+i).value)||0;
    if(rampMs > 0 && rampMs < 50){ rampMs = 50; document.getElementById('srvRampM'+i).value = 50; }
    const posOff = parseInt(document.getElementById('srvPosOff'+i).value);
    const posOn  = parseInt(document.getElementById('srvPosOn'+i).value);
    uc2.posOff = isNaN(posOff)?0:posOff;
    uc2.posOn  = isNaN(posOn)?255:posOn;
    uc2.rampMs = rampMs;
    saveUICmd();
    sendCommand(s, `servo/${i+1}/set`, { mode:'static', pos: uc2.on ? uc2.posOn : uc2.posOff, posOff: uc2.posOff, posOn: uc2.posOn, rampMs });
    return;
  } else {
    const posA = parseInt(document.getElementById('srvPosA'+i).value)||0;
    const posB = parseInt(document.getElementById('srvPosB'+i).value)||255;
    const tonV = parseFloat(document.getElementById('srvTon'+i).value);
    const toffV = parseFloat(document.getElementById('srvToff'+i).value);
    const ton = isNaN(tonV)?1:tonV, toff = isNaN(toffV)?1:toffV;
    let rampMs = parseInt(document.getElementById('srvRampP'+i).value)||0;
    if(rampMs > 0 && rampMs < 50){ rampMs = 50; document.getElementById('srvRampP'+i).value = 50; }
    uc.servo[i].posA=posA; uc.servo[i].posB=posB; uc.servo[i].ton=ton; uc.servo[i].toff=toff; uc.servo[i].rampMsP=rampMs;
    sendCommand(s, `servo/${i+1}/set`, { mode:'oscillate', posA, posB, ton, toff, rampMs });
  }
  saveUICmd();
}

let DRAFT = null;
let CFG_PENDING = {}, CFG_LAST = {};
const CFG_RETRY_MS = 800, CFG_TRIES = 3;
function cfgMatches(id, want){
  const L = ensureLive(id);
  if(!!L.offlineGuard !== !!want.offlineGuard) return false;
  if(!!L.bootRestore  !== !!want.bootRestore)  return false;
  if((L.offlineTimeoutS|0) !== (want.offlineTimeoutS|0)) return false;
  if((L.samplePriority|0) !== (want.samplePriority|0)) return false;
  return true;
}
function cfgPendingTick(){
  for(const id of Object.keys(CFG_PENDING)){
    const p = CFG_PENDING[id];
    const site = CFG.sites.find(x=>x.id===id);
    if(!site){ delete CFG_PENDING[id]; continue; }
    if(cfgMatches(id, p.want)){ logDebug(`NASTAVITVE ${id}: potrjene z naprave`); delete CFG_PENDING[id]; renderSettings(); continue; }
    if(Date.now() - p.at < CFG_RETRY_MS) continue;
    p.tries++;
    if(p.tries < CFG_TRIES){
      p.at = Date.now();
      logDebug(`NASTAVITVE ${id}: NI potrditve - ponavljam`, true);
      sendCommand(site, 'config/set', p.want);
    } else {
      delete CFG_PENDING[id];
      logDebug(`NASTAVITVE ${id}: NI POTRJENO po ${CFG_TRIES} poskusih`, true);
      showToast(T('cfgFailed'));
      renderSettings();
    }
  }
}
setInterval(cfgPendingTick, 500);
function logCfgDiff(id){
  const L = ensureLive(id);
  const now = { g:!!L.offlineGuard, b:!!L.bootRestore, t:L.offlineTimeoutS|0, fw:L.fw||'?' };
  const was = CFG_LAST[id];
  CFG_LAST[id] = now;
  if(!was) return;
  const ch = [];
  if(was.g !== now.g) ch.push(`offlineGuard ${was.g}->${now.g}`);
  if(was.b !== now.b) ch.push(`bootRestore ${was.b}->${now.b}`);
  if(was.t !== now.t) ch.push(`timeout ${was.t}s->${now.t}s`);
  if(was.fw !== now.fw) ch.push(`firmware ${was.fw}->${now.fw}`);
  if(ch.length) logDebug(`NASTAVITVE ${id}: naprava javlja spremembo - ${ch.join(', ')}`);
}
function ensureDraft(){
  if(!DRAFT){
    DRAFT = { sites: JSON.parse(JSON.stringify(CFG.sites)), cfg:{} };
    CFG.sites.forEach(s=>{
      const L = ensureLive(s.id);
      DRAFT.cfg[s.id] = { offlineGuard:!!L.offlineGuard, bootRestore:!!L.bootRestore,
                          offlineTimeoutS: L.offlineTimeoutS||60, samplePriority: L.samplePriority|0 };
    });
  }
  return DRAFT;
}
function draftSet(i, field, val){ ensureDraft().sites[i][field] = val; markDirty(); }
function draftSetId(i, raw){
  const d = ensureDraft();
  const oldId = d.sites[i].id;
  const newId = String(raw||'').toUpperCase().replace(/[^0-9A-F]/g,'').slice(0,6);
  if(!newId || newId === oldId){ renderSettings(); return; }
  d.sites[i].id = newId;
  if(d.cfg[oldId]){ d.cfg[newId] = d.cfg[oldId]; delete d.cfg[oldId]; }
  if(UICMD[oldId]){ UICMD[newId] = UICMD[oldId]; delete UICMD[oldId]; saveUICmd(); }
  if(LIVE[oldId]){ LIVE[newId] = LIVE[oldId]; delete LIVE[oldId]; }
  if(SIMS[oldId]){ SIMS[newId] = SIMS[oldId]; delete SIMS[oldId]; saveSims(); }
  delete LAST_REC_ID[oldId]; delete CLOCK_OFF[oldId];
  if(SEEN[oldId]){ SEEN[newId] = SEEN[oldId]; delete SEEN[oldId]; }
  if(BOOT_ID[oldId]){ BOOT_ID[newId] = BOOT_ID[oldId]; delete BOOT_ID[oldId]; }
  if(OSCBUF[oldId]){ OSCBUF[newId] = OSCBUF[oldId]; delete OSCBUF[oldId]; }
  delete LOADED[oldId]; delete LOADED[newId];
  storeRename(oldId, newId);
  logDebug(`ID naprave spremenjen: ${oldId} -> ${newId}`);
  markDirty(); renderSettings();
}
function draftCfg(i, field, val){
  if(DRAFT) DRAFT.dirty = true;

  if(!d.cfg[id]) d.cfg[id] = {offlineGuard:false, bootRestore:false, offlineTimeoutS:60};
  d.cfg[id][field] = val; markDirty();
}

function tickRelaySim(r, now){
  if(r.mode!=='blink') return;
  const durMs = (r.phaseOn ? r.ton : r.toff) * 1000;
  if(now - r.last >= durMs){ r.phaseOn = !r.phaseOn; r.state = r.phaseOn; r.last = now; }
}
function advanceRampSim(sv, now){
  if(sv.pos === sv.target) return true;
  if(!sv.rampMs){ sv.pos = sv.target; return true; }
  const frac = (now - (sv.rampStart||0)) / sv.rampMs;
  if(frac >= 1) sv.pos = sv.target;
  else sv.pos = Math.max(0, Math.min(255, Math.round(sv.rampFrom + (sv.target - sv.rampFrom) * frac)));
  return sv.pos === sv.target;
}
function tickServoSim(sv, now, site, idx){
  if(sv.mode!=='oscillate'){ advanceRampSim(sv, now); return; }
  switch(sv.phase){
    case 'RAMP_A': if(advanceRampSim(sv, now)){ sv.phase='HOLD_A'; sv.phaseStart=now; } break;
    case 'HOLD_A':
      if(now - sv.phaseStart >= sv.ton*1000){
        sv.rampFrom = sv.pos; sv.target = sv.posB;
        sv.rampStart = now; sv.phase='RAMP_B'; sv.phaseStart = now;
      } break;
    case 'RAMP_B': if(advanceRampSim(sv, now)){ sv.phase='HOLD_B'; sv.phaseStart=now; } break;
    case 'HOLD_B':
      if(now - sv.phaseStart >= sv.toff*1000){
        sv.rampFrom = sv.pos; sv.target = sv.posA;
        sv.rampStart = now; sv.phase='RAMP_A'; sv.phaseStart = now;
      } break;
    default: sv.phase='RAMP_A'; sv.phaseStart=now;
  }
}
function simEncodeRecord(sim, releState, servoState, now){
  const buf = new ArrayBuffer(8 + 19);
  const dv = new DataView(buf);
  dv.setUint32(0, 100, true);
  dv.setUint16(4, 1, true);
  dv.setUint16(6, 0, true);
  const relBits = releState.reduce((a,b,i)=>a|(b?(1<<i):0), 0);
  dv.setUint32(8, ++sim._recId, true);
  dv.setUint32(12, Math.round(performance.now()) >>> 0, true);
  dv.setUint8(16, relBits);
  dv.setUint8(17, servoState[0]); dv.setUint8(18, servoState[1]);
  dv.setUint16(19, Math.round((sim.analog.a1||0)*10), true);
  dv.setUint16(21, Math.round((sim.analog.a2||0)*10), true);
  dv.setUint16(23, Math.round((sim.analog.a3||0)*10), true);
  dv.setUint16(25, Math.round((sim.analog.a4||0)*10), true);
  return new Uint8Array(buf);
}
function simOfflineGuardTick(site, sim, now){
  const L = ensureLive(site.id);
  if(!L.offlineGuard){ sim._forcedOff = false; sim._clientGoneAt = 0; return false; }
  const clientOnline = !document.hidden;
  if(clientOnline){
    if(sim._forcedOff) logDebug(`SIM ${site.id}: klient spet prisoten - guard sproscen`);
    sim._forcedOff = false; sim._clientGoneAt = 0;
    return false;
  }
  if(!sim._clientGoneAt) sim._clientGoneAt = now;
  const timeoutMs = Math.max(5, L.offlineTimeoutS||60) * 1000;
  if(!sim._forcedOff && now - sim._clientGoneAt >= timeoutMs){
    sim._forcedOff = true;
    sim.rele.forEach(r=>{ r.state = false; r.mode = 'static'; });
    sim.servo.forEach(sv=>{ sv.pos = 0; sv.target = 0; sv.mode = 'static'; });
    sim.binMode = false;
    logDebug(`SIM ${site.id}: OFFLINE GUARD - izhodi na 0 po ${timeoutMs/1000}s`, true);
  }
  return sim._forcedOff;
}
function pushSimStateNow(site, sim){
  const now = Date.now();
  simOfflineGuardTick(site, sim, now);
  if(sim._recId === undefined) sim._recId = 0;
  const releState = sim.binMode ? [0,1,2,3].map(i=>!!((sim.binVal>>i)&1)) : sim.rele.map(r=>r.state);
  const servoState = sim.servo.map(x=>x.pos);
  const L = ensureLive(site.id);
  if(site.opMode==='sim_local'){
    pushOscSample(site.id, { t: now, rele: releState.slice(), servo: servoState.slice(), analog: Object.assign({}, sim.analog) });
    L.online = true; L.stale = false; L.lastSeen = now;
    L.rele = releState; L.binarno = sim.binVal; L.binMode = sim.binMode;
    L.binOn = !!sim.binMode; L.binPeriod = sim.binPeriod||1;
    L.servo = servoState; L.analog = sim.analog;
  } else if(site.opMode==='sim_broker'){
    const c = getClient(site.mqtt);
    if(c && c.connected){
      if(!sim._lastPub) sim._lastPub = { adc:0, status:0 };
      const lp = sim._lastPub;
      const relKey = releState.map(b=>b?1:0).join('') + '|' + servoState.join(',');
      const changed = (lp.key !== relKey);
      if(changed || now - lp.adc >= 200){
        lp.adc = now; lp.key = relKey;
        c.publish(`naprava/${site.id}/scope/data`, simEncodeRecord(sim, releState, servoState, now));
      }
      if(now - lp.status >= 5000){
        lp.status = now;
        c.publish(`naprava/${site.id}/status`, 'online', {retain:true});
        c.publish(`naprava/${site.id}/config/stanje`, JSON.stringify({
          offlineGuard: !!L.offlineGuard, bootRestore: !!L.bootRestore,
          binOn: !!sim.binMode, binPeriod: sim.binPeriod||1 }), {retain:true});
      }
    }
  }
  if(currentSite() && currentSite().id===site.id){
    renderSiteMenu();
    if(currentTab==='nadzor') updateNadzorState();
  }
}
function applySimCommand(site, subtopic, d){
  logDebug(`applySimCommand ${site.id} ${subtopic} <- ${JSON.stringify(d)}`);
  const sim = ensureSim(site.id);
  const relM = subtopic.match(/^rele\/(\d)\/set$/);
  const srvM = subtopic.match(/^servo\/(\d)\/set$/);
  if(relM){
    const i = parseInt(relM[1])-1;
    if(sim.binMode) return;
    const mode = d.mode||'static';
    sim.rele[i].mode = mode;
    if(mode==='static') sim.rele[i].state = !!d.state;
    else {
      sim.rele[i].ton = d.ton ?? 1; sim.rele[i].toff = d.toff ?? 1;
      sim.rele[i].phaseOn = true; sim.rele[i].state = true; sim.rele[i].last = Date.now();
    }
  } else if(srvM){
    const i = parseInt(srvM[1])-1;
    const mode = d.mode||'static';
    const sv = sim.servo[i];
    sv.mode = mode;
    if(d.rampMs!==undefined) sv.rampMs = d.rampMs|0;
    const now = Date.now();
    if(d.posOff!==undefined) sv.posOff = d.posOff;
    if(d.posOn!==undefined)  sv.posOn  = d.posOn;
    if(mode==='static'){
      sv.phase = 'RAMP_A'; sv.phaseStart = now;
      sv.rampFrom = sv.pos; sv.target = d.pos ?? 0; sv.rampStart = now;
      if(!sv.rampMs) sv.pos = sv.target;
    } else {
      sv.posA = d.posA ?? 0; sv.posB = d.posB ?? 255;
      sv.ton = d.ton ?? 1; sv.toff = d.toff ?? 1;
      sv.rampFrom = sv.pos; sv.target = sv.posA; sv.rampStart = now;
      sv.phase = 'RAMP_A'; sv.phaseStart = now;
      if(!sv.rampMs) sv.pos = sv.target;
    }
  } else if(subtopic==='binarno/set'){
    const wasOn = sim.binMode;
    if(d.on!==undefined) sim.binMode = !!d.on;
    if(d.perioda!==undefined) sim.binPeriod = Math.max(0.1, d.perioda);
    if(sim.binMode && !wasOn){ sim.binVal = 0; sim.binLast = Date.now(); }
    if(!sim.binMode && wasOn){ sim.rele.forEach(r=>{ if(r.mode!=='blink'){ r.state = false; } }); }
    const Lb = ensureLive(site.id);
    Lb.binOn = sim.binMode; Lb.binPeriod = sim.binPeriod||1;
  } else if(subtopic==='config/set'){
    const Lc = ensureLive(site.id);
    if(d.offlineGuard!==undefined) Lc.offlineGuard = !!d.offlineGuard;
    if(d.bootRestore!==undefined)  Lc.bootRestore  = !!d.bootRestore;
  }
  saveSims();
  pushSimStateNow(site, sim);
}
setInterval(()=>{
  const now = Date.now();
  CFG.sites.forEach(site=>{
    if(site.opMode==='real') return;

}, 100);

let OSC_RUNNING = true;
let OSC_FROZEN_AT = 0;
let OSC_PAN = 0;

/* ============================================================
   V95: DRSECI GRAF
   ------------------------------------------------------------
   Prej je bil desni rob okna vezan na NAJNOVEJSI vzorec v bufferju -
   graf se je premaknil samo ob prihodu novega bloka (~vsaki 2 s) in
   "skakal". Zdaj je desni rob zvezni cas telefona, zamaknjen v
   preteklost za zakasnitev prenosa (DISP_LAG), zato graf gladko drsi v
   levo, na desnem robu pa so podatki vedno ze prispeli.
   - DISP_LAG se uci iz zivih blokov: koliko je bil najnovejsi vzorec
     star tik pred prihodom naslednjega bloka (pocasi padajoci maksimum).
   - Ce naprava neha posiljati (podatki starejsi od 2x DISP_LAG), graf
     obstane na zadnjem vzorcu in ostane viden.
   - Posnetek (Open JSON) je se vedno vezan na zadnji vzorec posnetka.
   ============================================================ */
var DISP_LAG = {};
function dispLagNote(id, prevNewestT){
  if(prevNewestT === null || prevNewestT === undefined) return;
  const stale = Date.now() - prevNewestT;   // starost zadnjega vzorca tik pred novim blokom
  const hi = Math.max(15000, 2*OSC_TIMEBASE + 3000);
  const cur = DISP_LAG[id] || 2500;
  const next = Math.max(stale + 300, cur * 0.98);
  DISP_LAG[id] = Math.min(hi, Math.max(300, next));
}
function oscLiveNow(){
  const site = currentSite();
  if(site){
    const buf = (typeof SNAPSHOT !== 'undefined' && SNAPSHOT) ? SNAPSHOT.data : OSCBUF[site.id];
    if(buf && buf.length){
      const newest = buf[buf.length-1].t;
      if(typeof SNAPSHOT !== 'undefined' && SNAPSHOT) return newest;
      const lag = DISP_LAG[site.id] || 2500;
      const now = Date.now() - lag;
      // naprava ne posilja vec -> obstani na zadnjem vzorcu
      if(newest < now - lag) return newest;
      return now;
    }
  }
  return Date.now();
}
function oscNowRef(){
  if(!OSC_RUNNING) return OSC_FROZEN_AT - OSC_PAN;
  return oscLiveNow() - OSC_PAN;
}

function visibleIdRange(siteId){
  const buf = (SNAPSHOT ? SNAPSHOT.data : OSCBUF[siteId]) || [];
  if(!buf.length) return null;
  const windowMs = oscWindowMs();
  const now = oscNowRef();
  const from = now - windowMs;
  let first = null, last = null;
  for(const p of buf){
    if(p.t < from || p.t > now) continue;
    if(p.recId === undefined) continue;
    if(first === null) first = p.recId;
    last = p.recId;
  }
  return (first === null) ? null : { first, last };
}
function updateOscPosInfo(){
  const el = document.getElementById('oscPosInfo');
  if(!el) return;
  if(OSC_RUNNING && OSC_PAN === 0){
    const s2 = currentSite();

    const want = Math.round(1000/OSC_TIMEBASE);
    const s2r = currentSite();
    const Lr  = s2r ? LIVE[s2r.id] : null;
    const eff = Lr && Lr.effMs;
    const devHz = eff ? Math.round(1000/eff) : real;
    const st  = s2r ? rateStats(s2r.id) : null;
    const gotHz = st ? st.hz : null;
    const weak = (gotHz !== null && devHz && gotHz < devHz * 0.7);
    const evtTxt = (st && st.evt) ? ` (+${st.evt} ${T('oscEvt')}/s)` : '';
    const gotTxt = gotHz !== null
      ? ` / <span style="color:${weak?'var(--warn,#E2A03F)':'inherit'}">${gotHz} Hz ${T('oscGot')}</span>${evtTxt}`
      : '';

let SNAPSHOT = null;
let LIVE_BACKUP = null;
let GAP_PENDING = {};
function requestGapFill(id, fromId, count){
  const site = CFG.sites.find(x=>x.id===id);
  if(!site || site.opMode !== 'real') return;
  if(ensureLive(id).prio){
    if(!GAPMUTE[id] || Date.now()-GAPMUTE[id] > 30000){
      GAPMUTE[id] = Date.now();
      logDebug(`ZGODOVINA ${id}: nacin popolnega vzorcenja - sprotno dopolnjevanje je izklopljeno`);
    }
    return;
  }
  const cur = OSCBUF[id] || [];
  if(cur.length >= bufCap(id)){
    const oldestHave = cur.length ? cur[0].recId : 0;
    const wantsOlder = oldestHave && fromId < oldestHave;
    if(wantsOlder){ logDebug(`ZGODOVINA ${id}: buffer poln (${bufCap(id)}) - starejsih ne dopolnjujem`); return; }
  }
  const info = HIST_INFO[id];
  if(info && info.oldest && fromId < info.oldest){
    logDebug(`ZGODOVINA ${id}: del vrzeli je ze prepisan (najstarejsi ${info.oldest})`, true);
    fromId = info.oldest;
  }
  const p = GAP_PENDING[id];
  if(p){ clearTimeout(p.timer); p.count = Math.max(p.count, count); }
  else GAP_PENDING[id] = { from: fromId, count };
  GAP_PENDING[id].timer = setTimeout(()=>{
    const g = GAP_PENDING[id]; delete GAP_PENDING[id];
    if(!g) return;
    const MAX_SYNC_GAP = 5000;
    if(g.count > MAX_SYNC_GAP){ logDebug(`ZGODOVINA ${id}: vrzel prevelika (${g.count})`, true); return; }
    let from = g.from, to = g.from + g.count - 1;
    const S = seenSet(id);
    while(from <= to && S.has(rk(id, from))) from++;
    while(to >= from && S.has(rk(id, to))) to--;
    if(to < from){ logDebug(`ZGODOVINA ${id}: vrzel je medtem ze zapolnjena`); return; }
    hrqEnqueue(id, from, to, 1, 'vrzel v zivem toku');   // V97
  }, 800);
}

function xferD(id){

    reqSent:0, reqOk:0, reqTimeout:0, skipped:0, lastBlk:null, _pl:0, _pp:0, lrps:0, pps:0 };

function xferNoteRec(id, recId, t, isHist){

function xferAgo(ts){

/* ============================================================
   V97: CENTRALNA VRSTA ZAHTEV ZA ZGODOVINO
   ------------------------------------------------------------
   Naprava ima SAMO EN prenos zgodovine naenkrat - nova zahteva prekine
   tekoco. Prej so zahteve posiljale stiri neodvisne poti (dopolnitev
   zivega toka, sinhronizacija, popravilo diska, backfill) in so se
   med seboj "pojedle". Zdaj vse gredo v to vrsto:
   - na napravo gre vedno samo ENA zahteva,
   - naslednja sele 1 s po "prenos koncan" (ali po "izven obsega" /
     timeoutu 10 s),
   - vsaka zahteva se tik pred posiljanjem omeji na obseg naprave
     (info.oldest..info.newest) in obreze za ze znane ID-je - ce ne
     ostane nic, se ne poslje,
   - prednost: 1 zivi tok, 2 sinhronizacija, 3 popravilo diska,
     4 backfill; znotraj iste prednosti najprej NAJNOVEJSI ID-ji (V98),
   - kos najvec HRQ_PIECE zapisov,
   - po HRQ_MAX_TRIES neuspelih poskusih se kos opusti (backfill ga
     preskoci do konca cikla).
   ============================================================ */
const HRQ_PIECE = 500, HRQ_TIMEOUT = 10000, HRQ_MAX_TRIES = 3, HRQ_NEXT_MS = 1000;
const HRQ_SRC = { 1:'zivi', 2:'sinh', 3:'disk', 4:'backfill' };
var HRQ = {};   // id -> { items:[{from,to,prio,src,tries,seq}], cur:null, seq:0 }
function hrq(id){ return HRQ[id] || (HRQ[id] = { items:[], cur:null, seq:0 }); }
function hrqReset(id, why){
  const Q = HRQ[id]; if(!Q) return;
  if(Q.cur && Q.cur.timer) clearTimeout(Q.cur.timer);
  if(Q.cur || Q.items.length) logDebug(`ZGODOVINA ${id}: vrsta zahtev izpraznjena (${why}) - opuscenih ${Q.items.length + (Q.cur?1:0)}`);
  delete HRQ[id];
}
// obreze [from,to] na obseg naprave in odstrani ze znane ID-je na obeh koncih
function hrqTrim(id, from, to){
  const info = HIST_INFO[id];
  if(info && info.oldest && info.newest){ from = Math.max(from, info.oldest); to = Math.min(to, info.newest); }
  const S = seenSet(id), b = BOOT_ID[id];
  while(from <= to && S.has(rk(id, from, b))) from++;
  while(to >= from && S.has(rk(id, to, b))) to--;
  return (to < from) ? null : [from, to];
}
function hrqCovered(id, from, to){
  const Q = hrq(id);
  const inR = it => it && it.from <= from && it.to >= to;
  return inR(Q.cur && Q.cur.item) || Q.items.some(inR);
}
function hrqBusy(id, src){
  const Q = HRQ[id]; if(!Q) return false;
  return (Q.cur && Q.cur.item.src === src) || Q.items.some(it=>it.src === src);
}
function hrqEnqueue(id, from, to, prio, why){
  const site = CFG.sites.find(x=>x.id===id);
  if(!site || site.opMode !== 'real' || !(to >= from)) return;
  const Q = hrq(id), src = HRQ_SRC[prio] || '?';
  let n = 0;
  for(let a = from; a <= to; a += HRQ_PIECE){
    const b = Math.min(to, a + HRQ_PIECE - 1);
    if(hrqCovered(id, a, b)) continue;
    Q.items.push({ from:a, to:b, prio, src, tries:0, seq: ++Q.seq });
    n++;
  }
  if(n) logDebug(`ZGODOVINA ${id}: [${src}] v vrsto ${from}..${to} (${n} kos.)${why?' - '+why:''} · v vrsti ${Q.items.length}`);
  hrqPump(id);
}
function hrqPump(id){
  const Q = hrq(id);
  if(Q.cur) return;                          // na napravi ze tece zahteva
  const site = CFG.sites.find(x=>x.id===id);
  if(!site || site.opMode !== 'real'){ hrqReset(id, 'naprava ni v realnem nacinu'); return; }
  const info = HIST_INFO[id];
  if(!info || !info.newest){                 // obseg naprave se ni znan
    if(Q.items.length && !Q.waitTimer) Q.waitTimer = setTimeout(()=>{ Q.waitTimer = null; hrqPump(id); }, 1000);
    return;
  }
  while(Q.items.length){
    // V98: znotraj iste prednosti NAJPREJ NAJNOVEJSI kos (od najmlajsega proti najstarejsemu)
    Q.items.sort((a,b)=> a.prio - b.prio || b.from - a.from || a.seq - b.seq);
    const it = Q.items.shift();
    const r = hrqTrim(id, it.from, it.to);
    if(!r){ continue; }                        // medtem ze znano ali izven obsega - ne posiljaj
    it.from = r[0]; it.to = r[1];
    const cnt = it.to - it.from + 1;
    Q.cur = { item: it, sentAt: Date.now(), n:0, fresh:0, doneAt:0 };
    markRequested(id, it.from, it.to);
    xferD(id).reqSent++;
    sendCommand(site, 'scope/set', { history_from_id: it.from, count: cnt });
    logDebug(`ZGODOVINA ${id}: [${it.src}] zahtevam ${it.from}..${it.to} (${cnt})${it.tries?` - poskus ${it.tries+1}/${HRQ_MAX_TRIES}`:''} · v vrsti ${Q.items.length}`);
    Q.cur.timer = setTimeout(()=>hrqTimeout(id), HRQ_TIMEOUT);
    return;
  }
}
function hrqTimeout(id){
  const Q = HRQ[id]; if(!Q || !Q.cur) return;
  const it = Q.cur.item; Q.cur = null;
  it.tries++;
  xferD(id).reqTimeout++;
  if(it.tries < HRQ_MAX_TRIES){
    logDebug(`ZGODOVINA ${id}: [${it.src}] ${it.from}..${it.to} ni prispel v ${HRQ_TIMEOUT/1000} s - ponovim (${it.tries+1}/${HRQ_MAX_TRIES})`, true);
    Q.items.unshift(it);
  } else {
    xferD(id).skipped++;
    logDebug(`ZGODOVINA ${id}: [${it.src}] ${it.from}..${it.to} opuscen po ${HRQ_MAX_TRIES} poskusih`, true);
    if(it.src === 'backfill'){
      if(!BACKFILL_SKIP[id]) BACKFILL_SKIP[id] = new Set();
      BACKFILL_SKIP[id].add(it.from+'-'+it.to);
    }
  }
  hrqPump(id);
}
// klic iz hist/info: status 'done' ali 'out_of_range'
function hrqOnStatus(id, status){
  const Q = HRQ[id]; if(!Q || !Q.cur || Q.cur.doneAt) return;
  const c = Q.cur; c.doneAt = Date.now();
  if(c.timer) clearTimeout(c.timer);
  // povzetek sele cez HRQ_NEXT_MS - morebitni zadnji paket podatkov prispe za statusom
  setTimeout(()=>{
    if(HRQ[id] !== Q || Q.cur !== c) return;
    const it = c.item, X = xferD(id), dur = ((c.doneAt - c.sentAt)/1000).toFixed(1);
    if(status === 'done'){
      X.reqOk++;
      X.lastBlk = { from:it.from, to:it.to, durMs: c.doneAt - c.sentAt, at: Date.now() };
      const bad = c.n > 0 && c.fresh === 0;
      logDebug(`ZGODOVINA ${id}: [${it.src}] ${it.from}..${it.to} prejet v ${dur} s - ${c.n}/${it.to-it.from+1} zapisov, novih ${c.fresh}${bad?' (VSI ZE ZNANI!)':''}`, bad);
    } else {
      logDebug(`ZGODOVINA ${id}: [${it.src}] ${it.from}..${it.to} izven obsega naprave - opuscen`, true);
    }
    Q.cur = null;
    hrqPump(id);
    if(it.src === 'backfill') backfillTick(id);   // naslednja vrzel takoj
  }, HRQ_NEXT_MS);
}
// stetje prejetih zgodovinskih zapisov za tekoco zahtevo
function hrqNoteRec(id, recId, fresh){
  const Q = HRQ[id]; if(!Q || !Q.cur) return;
  const it = Q.cur.item;
  if(recId < it.from || recId > it.to) return;
  Q.cur.n++; if(fresh) Q.cur.fresh++;
}

const BACKFILL_CHUNK = 214;
let BACKFILL = {};
const BACKFILL_STALE_MS = 10000;
const BACKFILL_MAX_FAILS = 3;
let BACKFILL_SKIP = {};
var ARCH_FULL = {};   // V97: zadnje javljeno stanje 'arhiv popoln'
let ARCHIVE_STATS = {};
function backfillTick(id){
  if(document.hidden || currentTab !== 'osciloskop' || !currentSite() || currentSite().id !== id) return;
  const site = CFG.sites.find(x=>x.id===id);
  const info = HIST_INFO[id];
  if(!site || site.opMode !== 'real' || !info || !info.oldest || !info.newest) return;
  if(info.oldest > info.newest) return;
  if(!diskReady(id)) return;   // V96: najprej disk, sicer bi zahteval ze shranjeno
  const S = seenSet(id);
  const skip = BACKFILL_SKIP[id];
  let gapFrom = null, hadSkipped = false, have = 0, missing = 0;
  for(let x = info.newest; x >= info.oldest; x--){
    if(S.has(rk(id, x, BOOT_ID[id]))){ have++; continue; }
    missing++;
    if(skip && skip.size){
      const blkStartX = Math.floor((x - 1) / CHUNK) * CHUNK + 1;
      const blkToX = Math.min(info.newest, blkStartX + CHUNK - 1);
      if(skip.has(blkStartX+'-'+blkToX)){ hadSkipped = true; continue; }
    }
    if(gapFrom === null) gapFrom = x;
  }
  ARCHIVE_STATS[id] = { have, missing, total: info.newest - info.oldest + 1 };
  if(hrqBusy(id, 'backfill')) return;   // V97: backfill ima v vrsti najvec en kos
  if(gapFrom === null){
    if(hadSkipped){ delete BACKFILL_SKIP[id]; logDebug(`ZGODOVINA ${id}: cikel koncan - preskocene bloke poskusim znova`); ARCH_FULL[id] = false; }
    else if(!ARCH_FULL[id]){   // V97: samo ob spremembi stanja
      ARCH_FULL[id] = true;
      logDebug(`ZGODOVINA ${id}: arhiv popoln (enak napravi, ID ${info.oldest}..${info.newest})`);
    }
    return;
  }
  ARCH_FULL[id] = false;
  const blkStart = Math.floor((gapFrom - 1) / CHUNK) * CHUNK + 1;
  const from = Math.max(info.oldest, blkStart);
  const to   = Math.min(info.newest, from + CHUNK - 1);
  if(to < from) return;
  hrqEnqueue(id, from, to, 4, `vrzel pri ID ${gapFrom}, manjka skupaj ${missing}`);
}

const HIST_FIRST = 500;
let histLoadedFrom = {}, SYNCED_ONCE = {}, DISK_GAPS = {};
async function pruneOrphanedChunks(dev, oldest){
  const st = await tx('chunks','readwrite'); if(!st) return 0;
  let all;
  try{ all = await req2p(st.index('dev').getAll(dev)); }catch(e){ return 0; }
  let n = 0;
  for(const c of all){
    const maxRid = (c.blk+1) * CHUNK;
    if(maxRid < oldest){ try{ await req2p(st.delete(c.k)); n++; }catch(e){} }
  }
  return n;
}
function pruneOrphanedMemory(id, oldest){
  const buf = OSCBUF[id]; if(!buf || !buf.length) return 0;
  const before = buf.length;
  OSCBUF[id] = buf.filter(p => !p.recId || p.recId >= oldest);
  return before - OSCBUF[id].length;
}
async function syncWithDevice(id){
  const site = CFG.sites.find(x=>x.id===id);
  if(!site || site.opMode !== 'real') return;
  const info = HIST_INFO[id];
  if(!info || !info.oldest || !info.newest) return;
  if(!diskReady(id)){   // V96
    logDebug(`SINHRONIZACIJA ${id}: cakam na nalaganje z diska`);
    setTimeout(()=>syncWithDevice(id), 1000);
    return;
  }
  const removedDisk = await pruneOrphanedChunks(id, info.oldest);
  const removedMem  = pruneOrphanedMemory(id, info.oldest);
  if(removedDisk || removedMem){ logDebug(`SINHRONIZACIJA ${id}: izbrisanih ${removedDisk} koscev, ${removedMem} zapisov`); renderOscFull(); }
  const have = LAST_REC_ID[id] || 0;
  let from = have + 1;
  if(from < info.oldest) from = info.oldest;
  if(from <= info.newest){
    if(histLoadedFrom[id]){ logDebug(`SINHRONIZACIJA ${id}: prevzem ze tece`); return; }
    histLoadedFrom[id] = from;
    const cnt = info.newest - from + 1;
    logDebug(`SINHRONIZACIJA ${id}: dopolnjujem ${from}..${info.newest} (${cnt})`);
    requestHistory(site, from, cnt);
  } else logDebug(`SINHRONIZACIJA ${id}: ze usklajeno`);
}
function fillDiskGaps(id){
  const gaps = DISK_GAPS[id];
  if(!gaps || !gaps.length) return;
  const info = HIST_INFO[id];
  if(!info || !info.oldest || !info.newest) return;
  const site = CFG.sites.find(x=>x.id===id);
  if(!site || site.opMode !== 'real') return;
  delete DISK_GAPS[id];
  let queued = 0;
  gaps.forEach(([from,to])=>{
    const f = Math.max(from, info.oldest);
    const t = Math.min(to, info.newest);
    if(f > t) return;
    requestHistory(site, f, t - f + 1, 3, 'vrzel na disku');
    queued++;
  });
  if(queued) logDebug(`SINHRONIZACIJA ${id}: dopolnjujem ${queued} notranjih vrzeli`);
}
function syncNowClicked(){
  const st = currentSite();
  if(!st || st.opMode !== 'real') return;
  delete histLoadedFrom[st.id];
  syncWithDevice(st.id);
  fillDiskGaps(st.id);
}
const HIST_CHUNK = 200, HIST_CHUNK_TIMEOUT = 5000;
let HQ = {};
function histQueueStart(site, fromId, toId){
  const id = site.id;
  histQueueStop(id);
  HQ[id] = { from: fromId, to: toId, cur: fromId, tries: 0, timer: null };
  logDebug(`ZGODOVINA ${id}: prevzem ${fromId}..${toId} po ${HIST_CHUNK}`);
  histQueueNext(site);
}
function histQueueStop(id){ if(HQ[id] && HQ[id].timer) clearTimeout(HQ[id].timer); delete HQ[id]; }
function histQueueNext(site){
  const id = site.id, q = HQ[id];
  if(!q) return;
  if(q.cur > q.to){ logDebug(`ZGODOVINA ${id}: prevzem koncan`); histQueueStop(id); return; }
  const n = Math.min(HIST_CHUNK, q.to - q.cur + 1);
  markRequested(id, q.cur, q.cur + n - 1);
  sendCommand(site, 'scope/set', { history_from_id: q.cur, count: n });
  q.timer = setTimeout(()=>{
    if(!HQ[id]) return;
    q.tries++;
    if(q.tries === 1){ logDebug(`ZGODOVINA ${id}: kos od ${q.cur} ni prispel - ponavljam`, true); histQueueNext(site); }
    else { logDebug(`ZGODOVINA ${id}: kos od ${q.cur} preskocen`, true); q.cur += n; q.tries = 0; histQueueNext(site); }
  }, HIST_CHUNK_TIMEOUT);
}
function histQueueAck(id){
  const q = HQ[id]; if(!q) return;
  const site = CFG.sites.find(x=>x.id===id); if(!site){ histQueueStop(id); return; }
  if(q.timer) clearTimeout(q.timer);
  q.cur += Math.min(HIST_CHUNK, q.to - q.cur + 1);
  q.tries = 0;
  histQueueNext(site);
}
// V97: vse gre skozi centralno vrsto (HQ/histQueue se ne uporablja vec)
function requestHistory(site, fromId, count, prio, why){
  if(!site || site.opMode !== 'real') return;
  hrqEnqueue(site.id, fromId, fromId + count - 1, prio || 2, why || 'sinhronizacija');
}
function exportGraph(fmt){
  const s = currentSite(); if(!s) return;
  const buf = (SNAPSHOT ? SNAPSHOT.data : OSCBUF[s.id]) || [];
  if(!buf.length){ showToast(T('oscNoData')); return; }
  const stamp = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  let content, mime, name;
  if(fmt === 'json'){
    content = JSON.stringify({ app: APP_VERSION, device: s.id, name: s.name, exported: new Date().toISOString(), count: buf.length, data: buf });
    mime = 'application/json'; name = `graf_${s.id}_${stamp}.json`;
  } else {
    const head = 'cas\tR1\tR2\tR3\tR4\tS1\tS2\tA1\tA2\tA3\tA4';
    const rows = buf.map(p=>[ new Date(p.t).toISOString(), ...p.rele.map(b=>b?1:0), p.servo[0], p.servo[1],
      p.analog.a1.toFixed(1), p.analog.a2.toFixed(1), p.analog.a3.toFixed(1), p.analog.a4.toFixed(1) ].join('\t'));
    content = head + '\n' + rows.join('\n');
    mime = 'text/plain'; name = `graf_${s.id}_${stamp}.txt`;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type:mime}));
  a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  logDebug(`IZVOZ ${fmt.toUpperCase()}: ${buf.length} zapisov -> ${name}`);
  showToast(T('exported'));
}
// V99: hitrejse odpiranje JSON
// - racunalnik (Chrome/Edge): showOpenFilePicker, odpre se NEPOSREDNO v mapi Downloads
// - telefon: <input type=file> z omejitvijo tipa -> Android preskoci meni
//   "Kamera / Datoteke" in odpre takoj brskalnik datotek. Zacetne mape na
//   Androidu spletna stran ne more dolociti (odpre zadnjo uporabljeno).
//   text/plain + application/octet-stream: nekateri telefoni .json shranijo
//   kot "neznan tip" - brez tega bi bila datoteka siva/neizbirljiva.
const IMPORT_ACCEPT = '.json,application/json,text/plain,application/octet-stream';
function importGraph(){
  const isMobile = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
  if(!isMobile && window.showOpenFilePicker){
    window.showOpenFilePicker({
      startIn: 'downloads',
      multiple: false,
      types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
    }).then(async hs=>{
      const f = hs && hs[0] ? await hs[0].getFile() : null;
      if(f) importGraphFile(f);
    }).catch(e=>{
      if(e && e.name === 'AbortError') return;   // uporabnik je zaprl izbirnik
      logDebug(`UVOZ: izbirnik ni na voljo (${e && e.message}) - uporabim klasicnega`, true);
      importGraphInput();
    });
    return;
  }
  importGraphInput();
}
function importGraphInput(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = IMPORT_ACCEPT;
  inp.onchange = ()=>{
    const f = inp.files && inp.files[0];
    if(!f){ logDebug('UVOZ: datoteka ni izbrana', true); return; }
    importGraphFile(f);
  };
  inp.click();
}
function importGraphFile(f){
    logDebug(`UVOZ: datoteka '${f.name}' (${f.size}B)`);
    const rd = new FileReader();
    rd.onerror = ()=>{ showToast(T('errRead')); logDebug(`UVOZ: branje ni uspelo`, true); };
    rd.onload = ()=>{
      let txt = rd.result;
      if(typeof txt !== 'string'){ showToast(T('errRead')); return; }
      txt = txt.replace(/^\uFEFF/, '').trim();
      if(!txt){ showToast(T('errEmptyFile')); return; }
      logDebug(`UVOZ: vsebina (${txt.length} znakov): ${txt.slice(0,200)}`);
      let d;
      try{ d = JSON.parse(txt); }
      catch(e){ showToast(T('errBadJson')); logDebug(`UVOZ: neveljaven JSON - ${e.message}`, true); return; }
      if(!d || typeof d !== 'object'){ showToast(T('errBadJson')); return; }
      if(!Array.isArray(d.data)){ showToast(T('errNoData')); return; }
      if(d.data.length === 0){ showToast(T('errEmpty')); return; }
      const bad = d.data.find(p=>!p || typeof p.t !== 'number' || !Array.isArray(p.rele));
      if(bad){ showToast(T('errBadRec')); return; }
      const cur = currentSite();
      if(cur){
        LIVE_BACKUP = { id: cur.id, data: OSCBUF[cur.id] || [], lastId: LAST_REC_ID[cur.id] };
        logDebug(`POSNETEK: zivi buffer shranjen (${LIVE_BACKUP.data.length} zapisov)`);
        OSCBUF[cur.id] = [];
      }
      SNAPSHOT = d;
      OSC_RUNNING = false; OSC_PAN = 0;
      OSC_FROZEN_AT = d.data[d.data.length-1].t;
      logDebug(`UVOZ: ${d.data.length} zapisov`);
      renderOscFull();
      showToast(T('imported'));
    };
    rd.readAsText(f);
}
let MARK_A = null, MARK_B = null;
function addTimeMark(t){
  if(MARK_A === null){ MARK_A = t; MARK_B = null; logDebug(`MERJENJE: tocka A`); }
  else if(MARK_B === null){
    MARK_B = t;
    const dt = Math.abs(MARK_B - MARK_A);
    const hz = dt > 0 ? (1000/dt) : 0;
    const msg = `Δt = ${dt < 1000 ? dt.toFixed(0)+' ms' : (dt/1000).toFixed(2)+' s'}`
              + (dt > 0 ? `  ·  ${hz < 1 ? hz.toFixed(2) : hz.toFixed(1)} Hz` : '');
    logDebug(`MERJENJE: ${msg}`);
    showToast(msg);
  } else { MARK_A = t; MARK_B = null; logDebug('MERJENJE: nova tocka A'); }
  renderOscFull();
}

function exportPng(){
  const s = currentSite(); if(!s) return;
  const grps = ['rele','servo','analog'].map(g=>document.getElementById('oscCanvas_full_'+g)).filter(Boolean);
  if(!grps.length){ showToast(T('oscNoData')); return; }
  const w = Math.max(...grps.map(c=>c.width));
  const h = grps.reduce((a,c)=>a+c.height+10, 0);
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  const ctx = out.getContext('2d');
  const cs = getComputedStyle(document.documentElement);
  ctx.fillStyle = (cs.getPropertyValue('--ink')||'#000').trim();
  ctx.fillRect(0,0,w,h);
  let y = 0;
  grps.forEach(c=>{ ctx.drawImage(c, 0, y); y += c.height + 10; });
  const stamp = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  const a = document.createElement('a');
  a.href = out.toDataURL('image/png');
  a.download = `graf_${s.id}_${stamp}.png`;
  a.click();
  logDebug(`IZVOZ PNG: ${w}x${h}`);
  showToast(T('exported'));
}

function closeSnapshot(){
  SNAPSHOT = null; OSC_RUNNING = true; OSC_PAN = 0;
  if(LIVE_BACKUP){
    const id = LIVE_BACKUP.id;
    const now = OSCBUF[id] || [];
    OSCBUF[id] = LIVE_BACKUP.data.concat(now);
    if(OSCBUF[id].length > bufCap(id)) OSCBUF[id] = OSCBUF[id].slice(-bufCap(id));
    logDebug(`POSNETEK zaprt: obnovljenih ${LIVE_BACKUP.data.length} + ${now.length}`);
    if(LIVE_BACKUP.lastId && LAST_REC_ID[id] && LAST_REC_ID[id] > LIVE_BACKUP.lastId + 1){
      requestGapFill(id, LIVE_BACKUP.lastId + 1, LAST_REC_ID[id] - LIVE_BACKUP.lastId - 1);
    }
    LIVE_BACKUP = null;
  } else logDebug('POSNETEK zaprt - nazaj v zivi prikaz');
  renderOscFull();
}

function fmtDur(ms, windowMs){
  const ref = (windowMs===undefined) ? ms : windowMs;
  const s = ms/1000;
  if(ref < 1000)      return Math.round(ms)+'ms';
  if(ref < 10000)     return s.toFixed(1)+'s';
  if(ref < 120000)    return Math.round(s)+'s';
  if(ref < 7200000)   return (s/60).toFixed(s/60<10?1:0)+'min';
  if(ref < 172800000) return (s/3600).toFixed(1)+'h';
  return (s/86400).toFixed(1)+'d';
}

  if(SYNC_VISIBLE) renderSyncLog();   // V96
}
let OSC_COLORS = ['#FFD23F','#86B06A','#62A8C4','#D3543A'];
let GRID_COLOR = '#38423C';
let WARN_COLOR = '#E2A03F';
let AXIS_TXT_COLOR = '#8A968F';
const TRACE_DARK  = ['#FFD23F','#4FD37C','#4FA8FF','#FF5A3D'];
const TRACE_LIGHT = ['#8A5200','#0F5B33','#00417A','#A80000'];
function isLightTheme(){
  const ink = (getComputedStyle(document.documentElement).getPropertyValue('--ink')||'').trim();
  const h = ink.replace('#','');
  if(h.length < 6) return false;
  const r = parseInt(h.slice(0,2),16), g2 = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return (r+g2+b) > 380;
}
function syncOscColors(){
  const cs = getComputedStyle(document.documentElement);
  const g = n => (cs.getPropertyValue('--'+n)||'').trim();
  OSC_COLORS = isLightTheme() ? TRACE_LIGHT.slice() : TRACE_DARK.slice();
  GRID_COLOR = g('line')||GRID_COLOR;
  WARN_COLOR = g('warn')||WARN_COLOR;
  AXIS_TXT_COLOR = g('mute')||AXIS_TXT_COLOR;
}
let _drawErrShown = {};
function drawOscGroup(key, siteId, grp){
  try{ drawOscGroupInner(key, siteId, grp); }
  catch(e){
    if(!_drawErrShown[grp]){
      _drawErrShown[grp] = true;
      logDebug(`IZRIS ${grp}: NAPAKA - ${e.message}`, true);
      console.error('drawOscGroup', grp, e);
    }
  }
}
function drawOscGroupInner(key, siteId, grp){
  const canvas = document.getElementById('oscCanvas_'+key);
  const wrap = document.getElementById('oscCanvasWrap_'+key);
  if(!canvas || !wrap) return;
  const dpr = window.devicePixelRatio || 1;
  const w = wrap.clientWidth || 300, h = wrap.clientHeight || 64;
  canvas.width = w*dpr; canvas.height = h*dpr;
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const isMini = key.startsWith('mini');
  const marginL = isMini ? 4 : 30;
  const marginB = isMini ? 0 : 14;
  const marginT = 4, marginR = 4;
  const plotX = marginL, plotY = marginT;
  const plotW = w - marginL - marginR, plotH = h - marginT - marginB;
  ctx.strokeStyle = GRID_COLOR; ctx.lineWidth = 1;
  ctx.strokeRect(plotX+0.5, plotY+0.5, plotW-1, plotH-1);
  const buf = (SNAPSHOT ? SNAPSHOT.data : OSCBUF[siteId]) || [];
  const windowMs = oscWindowMs();
  const now = oscNowRef();
  const samples = buf.slice(lowerBound(buf, now-windowMs));
  let vMin = 0, vMax = ADC_SCALE;
  if(grp==='analog' && ADC_AUTO && samples.length){
    vMin = Infinity; vMax = -Infinity;
    samples.forEach(p=>{
      ['a1','a2','a3','a4'].forEach(k=>{
        const v = adcVs((p.analog && p.analog[k]) || 0);
        if(v < vMin) vMin = v; if(v > vMax) vMax = v;
      });
    });
    const pad = Math.max(0.5, (vMax - vMin) * 0.1);
    vMin = Math.max(0, vMin - pad); vMax = Math.min(40, vMax + pad);
    if(vMax - vMin < 1) vMax = vMin + 1;
  }
  if(!isMini){
    ctx.strokeStyle = GRID_COLOR; ctx.lineWidth = 1;
    ctx.font = '9px monospace'; ctx.fillStyle = AXIS_TXT_COLOR;
    for(let d=0; d<=4; d++){
      const x = plotX + plotW*(d/4);
      ctx.beginPath(); ctx.moveTo(x, plotY); ctx.lineTo(x, plotY+plotH); ctx.stroke();
      const label = d===4 ? T('oscNow') : '-'+fmtDur(windowMs*(4-d)/4, windowMs);
      ctx.textAlign = d===0?'left':(d===4?'right':'center');
      ctx.fillText(label, x, h-2);
    }
    if(grp === 'rele'){
      const rowH0 = plotH/4;
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.setLineDash([2,3]);
      for(let ch=0; ch<4; ch++){
        ctx.strokeStyle = OSC_COLORS[ch];
        const y = plotY + ch*rowH0 + rowH0 - 3;
        ctx.beginPath(); ctx.moveTo(plotX, y); ctx.lineTo(plotX+plotW, y); ctx.stroke();
      }
      ctx.restore();
      ctx.strokeStyle = GRID_COLOR;
    } else {
      for(let d=0; d<=2; d++){
        const y = plotY + plotH*(d/2);
        ctx.beginPath(); ctx.moveTo(plotX, y); ctx.lineTo(plotX+plotW, y); ctx.stroke();
      }
    }
    ctx.textAlign = 'right';
    if(grp==='servo'){ ctx.fillText('255', marginL-3, plotY+8); ctx.fillText('0', marginL-3, plotY+plotH-1); }
    else if(grp==='analog'){
      const f = (v)=> (vMax-vMin) < 10 ? v.toFixed(1)+'V' : Math.round(v)+'V';
      ctx.fillText(f(vMax), marginL-3, plotY+8);
      ctx.fillText(f((vMin+vMax)/2), marginL-3, plotY+plotH/2+3);
      ctx.fillText(f(vMin), marginL-3, plotY+plotH-1);
    } else if(grp==='rele'){
      const rowH = plotH/4;
      ['R1','R2','R3','R4'].forEach((nm,i)=>{ ctx.fillText(nm, marginL-3, plotY+i*rowH+rowH/2+3); });
    }
  }
  if(samples.length < 2){
    ctx.fillStyle = AXIS_TXT_COLOR; ctx.font = '11px monospace'; ctx.textAlign='left';
    ctx.fillText(T('oscNoData'), plotX+8, plotY+plotH/2);
    return;
  }
  const t0 = now-windowMs, t1 = now;
  const xOf = (t)=> plotX + ((t-t0)/(t1-t0)) * plotW;
  if(!isMini){
    const hiA = HIST_INFO[siteId];
    const bufA = (SNAPSHOT ? SNAPSHOT.data : OSCBUF[siteId]) || [];
    if(hiA && hiA.oldestTm && bufA.length && hiA.oldestTm > 0){
      const devOldest = hiA.oldestTm + (CLOCK_OFF[siteId] || 0);
      if(devOldest > t0){
        const x2 = Math.min(xOf(devOldest), plotX + plotW);
        if(x2 > plotX + 1){
          ctx.save();
          ctx.fillStyle = 'rgba(127,127,127,0.13)';
          ctx.fillRect(plotX, plotY, x2 - plotX, plotH);
          if(grp === 'rele'){
            ctx.fillStyle = AXIS_TXT_COLOR; ctx.font = '9px monospace'; ctx.textAlign = 'left';
            ctx.fillText(T('noDataBand'), plotX + 4, plotY + plotH - 4);
          }
          ctx.restore();
        }
      }
    }
  }
  /* ============================================================
     V93: RESET ?RTE iz vrzeli > 120 s + obstoje?i RESETS
     ============================================================ */
  if(!isMini){
    const resetPts = getResetPoints(siteId);
    if(resetPts.length){
      ctx.save();
      ctx.strokeStyle = WARN_COLOR;
      ctx.setLineDash([3,3]); ctx.lineWidth = 1;
      resetPts.forEach(rt=>{
        if(rt < t0 || rt > t1) return;
        const rx = xOf(rt);
        ctx.beginPath(); ctx.moveTo(rx, plotY); ctx.lineTo(rx, plotY+plotH); ctx.stroke();
        if(grp === 'rele'){
          ctx.setLineDash([]); ctx.fillStyle = WARN_COLOR; ctx.font = '9px monospace';
          ctx.textAlign = 'left'; ctx.fillText('RESET', rx+2, plotY+9);
          ctx.setLineDash([3,3]);
        }
      });
      ctx.restore();
    }
  }
  /* ============================================================
     RISANJE SIGNALOV - ob vrzeli > RESET_GAP_MS prekini ?rto
     ============================================================ */
  if(grp==='rele'){
    for(let ch=0; ch<4; ch++){
      ctx.strokeStyle = OSC_COLORS[ch]; ctx.lineWidth = 1.5;
      const rowH = plotH/4, yOn = plotY+ch*rowH+3, yOff = plotY+ch*rowH+rowH-3;
      let prevY = samples[0].rele[ch] ? yOn : yOff;
      ctx.beginPath();
      ctx.moveTo(xOf(samples[0].t), prevY);
      for(let i=1;i<samples.length;i++){
        const x = xOf(samples[i].t), y = samples[i].rele[ch] ? yOn : yOff;
        if(samples[i].t - samples[i-1].t > RESET_GAP_MS){
          ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y); prevY = y; continue;
        }
        if(y !== prevY){ ctx.lineTo(x, prevY); ctx.lineTo(x, y); prevY = y; }
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    [MARK_A, MARK_B].forEach((mt,mi)=>{
      if(mt === null || mt < t0 || mt > t1) return;
      ctx.save();
      ctx.strokeStyle = OSC_COLORS[mi===0?0:3]; ctx.setLineDash([4,3]); ctx.lineWidth = 1;
      const mx = xOf(mt);
      ctx.beginPath(); ctx.moveTo(mx, plotY); ctx.lineTo(mx, plotY+plotH); ctx.stroke();
      ctx.restore();
    });
  } else if(grp==='servo'){
    for(let ch=0; ch<2; ch++){
      ctx.strokeStyle = OSC_COLORS[ch]; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(xOf(samples[0].t), plotY + plotH - (samples[0].servo[ch]/255)*plotH);
      for(let i=1;i<samples.length;i++){
        const x = xOf(samples[i].t), y = plotY + plotH - (samples[i].servo[ch]/255)*plotH;
        if(samples[i].t - samples[i-1].t > RESET_GAP_MS){
          ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y);
        } else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  } else {
    ['a1','a2','a3','a4'].forEach((k,ch)=>{
      ctx.strokeStyle = OSC_COLORS[ch]; ctx.lineWidth = 1.5;
      ctx.beginPath();
      const v0 = adcVs((samples[0].analog && samples[0].analog[k]) || 0);
      const vc0 = Math.max(vMin, Math.min(vMax, v0));
      ctx.moveTo(xOf(samples[0].t), plotY + plotH - ((vc0-vMin)/(vMax-vMin))*plotH);
      for(let i=1;i<samples.length;i++){
        const p = samples[i];
        const v = adcVs((p.analog && p.analog[k]) || 0);
        const vc = Math.max(vMin, Math.min(vMax, v));
        const x = xOf(p.t), y = plotY + plotH - ((vc-vMin)/(vMax-vMin))*plotH;
        if(p.t - samples[i-1].t > RESET_GAP_MS){
          ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y);
        } else ctx.lineTo(x, y);
      }
      ctx.stroke();
    });
  }
}
function attachOscGestures(key, siteId, grp){
  const wrap = document.getElementById('oscCanvasWrap_'+key);
  const tip = document.getElementById('oscTip_'+key);
  if(!wrap) return;
  let pinchStartDist = null, pinchStartZoom = 1;
  wrap.addEventListener('touchstart', (e)=>{
    if(e.touches.length===2){
      pinchStartDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      pinchStartZoom = OSC_ZOOM;
    }
  }, {passive:true});
  wrap.addEventListener('touchmove', (e)=>{
    if(e.touches.length===2 && pinchStartDist){
      e.preventDefault();
      const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      let z = pinchStartZoom * (d/pinchStartDist);
      OSC_ZOOM = Math.max(0.2, Math.min(8, z));
      ['rele','servo','analog'].forEach(g=>drawOscGroup('full_'+g, siteId, g));
    }
  }, {passive:false});
  let panStartX = null, panStartY = null, panStartVal = 0;
  wrap.addEventListener('touchstart', (e)=>{
    if(e.touches.length===1){ panStartX = e.touches[0].clientX; panStartY = e.touches[0].clientY; panStartVal = OSC_PAN; }
  }, {passive:true});
  wrap.addEventListener('touchmove', (e)=>{
    if(panStartX===null || e.touches.length!==1) return;
    const dx = e.touches[0].clientX - panStartX;
    const dy = e.touches[0].clientY - (panStartY||0);
    if(Math.abs(dx) < 20 || Math.abs(dx) < Math.abs(dy)) return;
    e.preventDefault();
    if(OSC_RUNNING){ OSC_FROZEN_AT = oscLiveNow(); OSC_RUNNING = false; }
    const buf = OSCBUF[siteId] || [];
    const oldestT = buf.length ? buf[0].t : Date.now();
    const maxPan = Math.max(0, (OSC_FROZEN_AT || Date.now()) - oldestT);
    OSC_PAN = Math.max(0, Math.min(maxPan, panStartVal + (dx / wrap.clientWidth) * oscWindowMs()));
    if(OSC_PAN === 0 && dx < 0){ OSC_RUNNING = true; renderOscFull(); panStartX = null; return; }
    updateOscPosInfo();
    ['rele','servo','analog'].forEach(g=>drawOscGroup('full_'+g, siteId, g));
  }, {passive:false});
  wrap.addEventListener('touchend', (e)=>{
    pinchStartDist = null;
    if(panStartX!==null && Math.abs((e.changedTouches[0]||{}).clientX - panStartX) > 20){
      panStartX = panStartY = null;
      renderOscFull();
      return;
    }
    panStartX = panStartY = null;
    if(e.changedTouches && e.changedTouches.length===1 && (!e.touches || e.touches.length===0)){
      showOscTip(key, siteId, grp, e.changedTouches[0].clientX, wrap, tip);
    }
  });
  wrap.addEventListener('click', (e)=>{ showOscTip(key, siteId, grp, e.clientX, wrap, tip); });
}
function showOscTip(key, siteId, grp, clientX, wrap, tip){
  const windowMs = oscWindowMs();
  const now = oscNowRef();
  const rect = wrap.getBoundingClientRect();
  const frac = Math.max(0, Math.min(1, (clientX-rect.left)/rect.width));
  const t0 = now-windowMs, t1 = now;
  const targetT = t0 + frac*(t1-t0);
  const buf = (SNAPSHOT ? SNAPSHOT.data : OSCBUF[siteId]) || [];
  const from = lowerBound(buf, t0);
  if(from >= buf.length) return;
  let nearest = buf[from], best = Infinity;
  for(let i=from;i<buf.length && buf[i].t<=t1;i++){
    const d = Math.abs(buf[i].t - targetT);
    if(d < best){ best = d; nearest = buf[i]; }
  }
  addTimeMark(nearest.t);
  let txt = new Date(nearest.t).toLocaleTimeString() + ' · ';
  if(grp==='rele') txt += 'R:' + nearest.rele.map(b=>b?'1':'0').join('');
  else if(grp==='servo') txt += 'S1:'+nearest.servo[0]+' S2:'+nearest.servo[1];
  else txt += Object.keys(nearest.analog||{}).map(k=>k+':'+adcVs(nearest.analog[k]).toFixed(1)+'V').join(' ');
  tip.textContent = txt;
  tip.style.display = 'block';
  clearTimeout(tip._to);
  tip._to = setTimeout(()=>{ tip.style.display='none'; }, 3000);
}
setInterval(()=>{
  if(currentTab !== 'osciloskop') return;
  const s = currentSite();
  if(s && s.opMode === 'real') sendCommand(s, 'scope/set', { timebase_ms: OSC_TIMEBASE });
}, 10000);
// V95: animacija - najvec 30 sl./s; izris SAMO, ce se je slika premaknila za
// vsaj 0.5 piksla ali so prisli novi podatki (pri sirokem oknu, npr. 8 h,
// je premik pol piksla sele na ~15 s - brez nepotrebnega risanja).
const OSC_FPS = 30, OSC_FRAME_MS = 1000/OSC_FPS;
let _lastOscFrame = 0, _lastDrawNow = 0, _lastDrawKey = '';
function oscFrame(ts){
  requestAnimationFrame(oscFrame);
  if(ts - _lastOscFrame < OSC_FRAME_MS) return;
  _lastOscFrame = ts;
  if(currentTab !== 'osciloskop') return;
  if(document.hidden) return;
  if(!OSC_RUNNING) return;
  const s = currentSite(); if(!s) return;
  const buf = (SNAPSHOT ? SNAPSHOT.data : OSCBUF[s.id]) || [];
  const key = s.id + ':' + buf.length + ':' + (buf.length ? buf[buf.length-1].t : 0) + ':' + OSC_SAMPLES + ':' + OSC_TIMEBASE;
  const now = oscNowRef();
  const wrap = document.getElementById('oscCanvasWrap_full_rele');
  const plotW = Math.max(50, ((wrap && wrap.clientWidth) || 300) - 34);
  const halfPxMs = 0.5 * oscWindowMs() / plotW;
  if(key === _lastDrawKey && Math.abs(now - _lastDrawNow) < halfPxMs) return;
  _lastDrawKey = key; _lastDrawNow = now;
  ['rele','servo','analog'].forEach(g=>drawOscGroup('full_'+g, s.id, g));
}
requestAnimationFrame(oscFrame);

   ZAGON

function syncTopHeight(){
  const top = document.querySelector('.top');
  if(!top) return;
  document.documentElement.style.setProperty('--topH', top.getBoundingClientRect().height + 'px');
}
window.addEventListener('resize', syncTopHeight);
window.addEventListener('orientationchange', ()=>setTimeout(syncTopHeight, 150));

let _syncedSites = new Set();
function syncDeviceToUI(site, force){
  if(!site) return;
  if(site.opMode === 'real'){
    logDebug(`syncDeviceToUI ${site.id}: preskoceno (realna naprava je vir resnice)`);
    return;
  }
  if(!force && _syncedSites.has(site.id)) return;
  _syncedSites.add(site.id);
  const uc = ensureUICmd(site.id);
  const L = ensureLive(site.id);
  const queue = [];
  for(let i=0;i<4;i++){
    const r = uc.rele[i];
    queue.push([`rele/${i+1}/set`, r.mode === 'period'
      ? {mode:'blink', ton:r.ton, toff:r.toff}
      : {mode:'static', state:!!r.on}]);
  }
  for(let i=0;i<2;i++){
    const v = uc.servo[i];
    queue.push([`servo/${i+1}/set`, v.mode === 'period'
      ? {mode:'oscillate', posA:v.posA, posB:v.posB, ton:v.ton, toff:v.toff, rampMs:v.rampMsP}
      : {mode:'static', pos: v.on ? v.posOn : v.posOff, posOff:v.posOff, posOn:v.posOn, rampMs:v.rampMs}]);
  }
  queue.push(['binarno/set', {on: !!L.binOn, perioda: L.binPeriod||1}]);
  queue.forEach(([topic, payload], k)=>{
    setTimeout(()=>sendCommand(site, topic, payload), k*120);
  });
  logDebug(`syncDeviceToUI ${site.id}: v vrsti ${queue.length} ukazov (zamik 120ms)`);
}

}

  const box=document.getElementById('headbox'), menu=document.getElementById('siteMenu');
