<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161A17">
<title>Rele-Servo Tester</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
:root{
  --ink:#161A17; --panel:#1E2421; --panel2:#262E29; --line:#38423C;
  --paper:#E4E7E2; --mute:#8A968F;
  --volt:#FFD23F; --sage:#86B06A; --rust:#D3543A; --sky:#62A8C4; --amber:#FFA23F;
  --disp:"Archivo Narrow","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono","Roboto Mono",Consolas,monospace;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:15px;line-height:1.45;
     -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font-family:var(--mono);background:var(--panel2);border:1px solid var(--line);color:var(--paper);
             padding:7px 9px;border-radius:7px;font-size:13px}
:focus-visible{outline:2px solid var(--volt);outline-offset:2px;border-radius:4px}
.wrap{max-width:560px;margin:0 auto;padding:calc(var(--topH, 132px) + 14px) 14px 40px}
.card{scroll-margin-top:calc(var(--topH, 132px) + 14px)}
.top{position:fixed;top:0;left:0;right:0;z-index:55;background:var(--ink);padding:12px 14px 0}
.tophead{display:flex;align-items:center;gap:8px;margin-bottom:10px;position:relative}
.headbox{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;background:var(--panel);
         border:1px solid var(--line);border-radius:10px;padding:8px 12px;transition:border-color .15s}
.headbox[data-multi="1"]{cursor:pointer}
.headbox[data-multi="1"]:hover{background:var(--panel2);border-color:var(--mute)}
.headbox[data-multi="1"][data-open="1"]{border-color:var(--volt);background:var(--panel2)}
.hline{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hline b{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.04em;color:var(--paper);
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linkStatus{display:flex;align-items:center;gap:4px;font-size:9px;letter-spacing:.05em;text-transform:uppercase;
            color:var(--mute);flex:0 0 auto;cursor:pointer}
.linkStatus .lnode{white-space:nowrap;color:var(--rust)}
.linkStatus .lnode.up{color:var(--sage)}
.linkStatus .ldots{display:inline-flex;gap:2px}
.linkStatus .ldots i{width:4px;height:4px;border-radius:50%;background:var(--sage);display:inline-block}
.linkStatus .ldots.down i{background:var(--rust)}
.opmodetag{font-size:10px;color:var(--sky);letter-spacing:.05em;text-transform:uppercase;font-family:var(--mono)}
.headright{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.gear{font-size:24px;color:var(--mute);padding:4px 6px;line-height:1}
.gear:hover{color:var(--paper)}
.hb{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--volt);
    position:relative;background:var(--panel2);color:var(--volt);font-family:var(--disp);font-size:13px;font-weight:700;
    line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0}
.hb::before{content:"?"}
.hb::after{content:"";position:absolute;top:50%;left:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
.hb:hover{background:var(--volt);color:var(--ink)}
.chev{flex:0 0 auto;width:72px;height:72px;color:var(--mute);font-size:56px;transition:transform .2s;
      display:inline-flex;align-items:center;justify-content:center}
.chev.open{transform:rotate(180deg)}
.sitemenu{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:60;background:var(--panel2);
          border:1px solid var(--volt);border-radius:var(--r);padding:7px;box-shadow:0 14px 38px rgba(0,0,0,.6);
          display:none;flex-direction:column;gap:6px}
.sitemenu.open{display:flex}
.sitemenu .row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:7px;cursor:pointer}
.sitemenu .row:hover{background:var(--ink)}
.sitemenu .row.cur{color:var(--volt)}
.sitemenu small{display:block;color:var(--mute);font-size:10px;font-family:var(--mono)}
.relbits{display:flex;gap:3px;margin-left:6px}
.relbits span{width:6px;height:6px;border-radius:2px;background:var(--mute);display:inline-block}
.relbits span.on{background:var(--sage)}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-top:4px}
.tabs button{flex:1;padding:11px 6px;font-family:var(--disp);font-size:12.5px;letter-spacing:.08em;
             text-transform:uppercase;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--volt);border-bottom-color:var(--volt)}
.page{display:none;padding-top:12px}
.page.show{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:0;margin-bottom:10px;overflow:hidden}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px;cursor:pointer}
.chead h3{font-family:var(--disp);font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);flex:1}
.cbody{padding:0 14px 14px;overflow:hidden;transition:max-height .25s ease, padding .25s ease}
.cbody.collapsed{max-height:0!important;padding-top:0;padding-bottom:0}
.row2{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
label.lbl{color:var(--mute);font-size:11.5px;min-width:56px;font-family:var(--body)}
input[type=number]{width:64px}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--paper);padding:7px 13px;border-radius:7px;font-family:var(--disp);letter-spacing:.03em;font-size:13px}
.btn:hover{border-color:var(--volt)}
.btn.primary{background:var(--volt);color:var(--ink);border-color:var(--volt);font-weight:700}
.btn.ghost{background:none;color:var(--mute);border:1px solid var(--line)}
.sep{border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.small{font-size:11px;color:var(--mute)}
.analog{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.analog .a{background:var(--panel2);border-radius:8px;padding:10px;text-align:center}
.analog .a b{display:block;font-size:20px;color:var(--volt);font-family:var(--mono)}
.analog .a span{color:var(--mute);font-size:11px}
.tag{display:inline-block;padding:3px 9px;border-radius:100px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--panel2);color:var(--mute);border:1px solid var(--line)}
.tag.on{color:var(--sage);border-color:color-mix(in srgb, var(--sage) 45%, var(--line))}
.tag.off{color:var(--rust);border-color:color-mix(in srgb, var(--rust) 45%, var(--line))}
.empty{color:var(--mute);text-align:center;padding:34px 14px}
.stale-outputs{opacity:.45;position:relative}
.stale-outputs::before{content:attr(data-stale);display:block;margin-bottom:10px;padding:8px 10px;border:1px solid var(--warn,#E2A03F);border-radius:8px;color:var(--warn,#E2A03F);font-family:var(--mono);font-size:11.5px;opacity:1}
.livedot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:8px;vertical-align:middle;background:var(--line);border:1px solid var(--line)}
.livedot.on{background:var(--volt);border-color:var(--volt);box-shadow:0 0 6px var(--volt)}
.osc-tb{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.osc-tb button{padding:6px 10px;border:1px solid var(--line);border-radius:7px;font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.osc-tb button[aria-pressed="true"]{border-color:var(--volt);color:var(--volt)}
.osc-box{border:1px solid var(--line);border-radius:10px;padding:10px 10px 4px;margin-bottom:8px}
.osc-box>.osc-box-t{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 8px}
.osc-box .osc-tb{margin-bottom:6px}
.osc-grp{margin-bottom:10px}
.osc-grp .lbl2{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:4px;font-family:var(--disp);display:flex;justify-content:space-between}
.osc-canvas-wrap{position:relative;background:var(--panel2);border-radius:8px;border:1px solid var(--line);touch-action:pan-y;overflow:hidden}
.osc-canvas-wrap canvas{display:block;width:100%}
.osc-tip{position:absolute;top:4px;left:6px;background:rgba(0,0,0,.65);border:1px solid var(--volt);border-radius:6px;padding:4px 8px;font-family:var(--mono);font-size:10.5px;color:var(--paper);pointer-events:none;display:none;white-space:nowrap;z-index:5}
.osc-legend{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap}
.osc-legend span{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--mute);font-family:var(--mono)}
.osc-legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.unit-card{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:9px}
.uc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.uc-head span.nm{font-family:var(--disp);font-size:12.5px;letter-spacing:.04em;color:var(--paper)}
.mtog{display:flex;gap:0;margin-bottom:9px;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.mtog button{flex:1;padding:11px 7px;font-family:var(--disp);font-size:11.5px;letter-spacing:.04em;color:var(--mute);background:var(--panel)}
.mtog button.active{background:var(--volt);color:var(--ink);font-weight:700}
.onoff-btn{width:100%;padding:12px;border-radius:7px;font-family:var(--disp);font-size:14px;font-weight:700;letter-spacing:.08em;border:1.5px solid var(--line)}
.onoff-btn.on{background:var(--sage);color:#10160f;border-color:var(--sage)}
.onoff-btn.off{background:var(--rust);color:#1a0d0a;border-color:var(--rust)}
.tblock{margin-bottom:8px}
.tblock .trow{display:flex;gap:8px;align-items:center}
.tblock label{color:var(--mute);font-size:11px;min-width:36px}
.tblock input[type=number]{width:58px}
.stepslider{flex:1;accent-color:var(--volt);height:22px}
.pos-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.pos-row label{color:var(--mute);font-size:11px;min-width:52px}
.pos-row input[type=number]{width:64px}
.osc-full .osc-canvas-wrap{height:110px}
.osc-empty{color:var(--mute);text-align:center;padding:24px;font-size:12.5px}
.locked{opacity:.42;pointer-events:none;filter:grayscale(.5)}
.locknote{font-size:11.5px;color:var(--amber);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);margin-bottom:10px}
.debug-box{background:#0c100e;border:1px solid var(--line);border-radius:8px;padding:8px;max-height:320px;overflow-y:auto;font-family:var(--mono);font-size:10.5px;line-height:1.5;color:#9fd18a;white-space:pre-wrap;word-break:break-all;margin-top:8px}
.debug-box .err{color:var(--rust)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none}
.scrim.show{display:block}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:10px 16px 24px;max-height:82vh;overflow-y:auto;transform:translateY(105%);transition:transform .22s;box-shadow:0 -14px 40px rgba(0,0,0,.5)}
.drawer.open{transform:translateY(0)}
.grip{width:38px;height:4px;border-radius:3px;background:var(--line);margin:2px auto 12px}
.hrow{display:flex;align-items:center;gap:8px;margin:16px 0 9px}
.hrow:first-of-type{margin-top:2px}
.hrow h3{font-family:var(--disp);font-size:14px;font-weight:700;letter-spacing:.06em;color:var(--paper);flex:1}
.hrow h4{font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);flex:1}
.sitelist .r{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.sitelist .r .r1{display:flex;gap:6px}
.sitelist input{flex:1;min-width:0}
.sitelist select{width:100%}
.hclose{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);color:var(--mute);display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.hclose:hover{color:var(--paper);border-color:var(--paper)}
.hback{color:var(--mute);font-size:13px;font-family:var(--disp)}
#helpBody p{font-size:13px;line-height:1.6;margin-bottom:10px;color:var(--paper)}
#helpBody.hrich h4{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--volt);margin:14px 0 6px}
#helpBody.hrich h4:first-child{margin-top:0}
#helpBody.hrich b{color:var(--paper)}
#helpBody.hrich i{color:var(--mute);font-style:italic}
#helpBody.hrich u{text-decoration:underline}
#helpBody.hrich code{font-family:var(--mono);font-size:12px;color:var(--volt);background:rgba(127,127,127,.12);padding:1px 5px;border-radius:4px}
#helpBody.hidx button{display:block;width:100%;text-align:left;padding:11px 12px;margin-bottom:6px;border:1px solid var(--line);border-radius:9px;color:var(--paper);font-family:var(--body)}
#helpBody.hidx button:hover{border-color:var(--volt);color:var(--volt)}
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.themes button{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:9px;padding:8px;color:var(--paper);text-align:left}
.themes button[aria-pressed="true"]{border-color:var(--volt);background:var(--panel2)}
.themes .sw{display:flex;gap:2px;padding:5px;border:1px solid;border-radius:5px;flex:0 0 auto}
.themes .sw i{width:7px;height:14px;border-radius:2px;display:block}
.themes .tn{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.hc .card,body.hc .unit-card,body.hc .btn,body.hc .mtog,body.hc .onoff-btn,
body.hc .themes button,body.hc .langGrid button,body.hc input,body.hc select,
body.hc .osc-canvas-wrap,body.hc .headbox,body.hc .pill{border-width:2px}
body.hc .chead h3,body.hc .uc-head span.nm{font-weight:700}
.langGrid{display:flex;gap:8px}
.langGrid button{flex:1;padding:10px;border:1px solid var(--line);border-radius:9px;font-family:var(--disp);letter-spacing:.04em}
.langGrid button[aria-pressed="true"]{border-color:var(--volt);color:var(--volt)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,90px);background:var(--panel2);border:1px solid var(--line);border-radius:100px;padding:9px 18px;font-size:12.5px;z-index:70;transition:transform .25s;max-width:88vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="top">
  <div class="tophead">
    <div class="headbox" id="headbox" onclick="toggleSiteMenu()">
      <div class="hline">
        <b id="siteName" data-i="noDevice">—</b>
        <span class="linkStatus" id="linkStatus" onclick="event.stopPropagation();reconnectNow()" title="Aplikacija ↔ Broker ↔ Naprava">
          <span class="lnode" id="lnApp">App</span><span class="ldots" id="ld1"><i></i><i></i><i></i></span>
          <span class="lnode" id="lnBroker">Broker</span><span class="ldots" id="ld2"><i></i><i></i><i></i></span>
          <span class="lnode" id="lnIO">IO</span>
        </span>
      </div>
      <div class="opmodetag"><span id="opModeTag"></span> <span id="verTag" style="color:var(--mute)"></span></div>
    </div>
    <div class="headright">
      <button class="hb" onclick="openHelp('index')" aria-label="Help"></button>
      <button class="gear" onclick="openDrawer()" aria-label="Settings">⚙</button>
    </div>
    <div class="sitemenu" id="siteMenu"></div>
  </div>
  <div class="tabs" role="tablist" id="tabsBar"></div>
</div>

<div class="wrap">
  <div id="tab-nadzor" class="page show"></div>
  <div id="tab-simulator" class="page"></div>
  <div id="tab-osciloskop" class="page"></div>
</div>

<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer" role="dialog" aria-label="Settings">
  <div class="grip"></div>
  <div class="hrow"><h3 data-i="cfgTitle">Nastavitve</h3>
    <button class="hclose" onclick="closeDrawer()" aria-label="Close">✕</button></div>
  <div class="hrow"><h4 data-i="cfgDevices">Naprave</h4>
    <button class="hb" onclick="openHelp('hSettings')" aria-label="?"></button></div>
  <div class="sitelist" id="siteList"></div>
  <div class="row2" style="margin-top:10px">
    <button class="btn" onclick="addSite()" data-i="cfgAddDevice">+ Dodaj napravo</button>
  </div>
  <div class="row2" style="margin-top:12px">
    <button class="btn" id="saveBtn" onclick="saveSettings()" data-i="btnSave">Shrani</button>
    <button class="btn" onclick="applySettings()" data-i="btnApply">Uporabi</button>
  </div>
  <div class="hrow"><h4 data-i="cfgTheme">Barvna paleta</h4></div>
  <div class="themes" id="themeGrid"></div>
  <div class="hrow"><h4 data-i="cfgLang">Jezik / Language</h4></div>
  <div class="langGrid" id="langGrid"></div>
  <p class="lbl" style="margin-top:14px" id="kaLbl"></p>
  <div class="langGrid" id="kaGrid"></div>
  <p class="small" id="kaHint" style="margin-top:6px;color:var(--mute)"></p>
</div>

<div class="scrim" id="hscrim" onclick="closeHelp()"></div>
<div class="drawer help" id="helpSheet" role="dialog" aria-label="Help">
  <div class="grip"></div>
  <div class="hrow">
    <button class="hback" id="helpBack" onclick="openHelp('index')" hidden>‹</button>
    <h3 id="helpTitle" style="flex:1">—</h3>
    <button class="hclose" onclick="closeHelp()" aria-label="Close">✕</button>
  </div>
  <div id="helpBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const APP_VERSION = 'V99';

const THEMES=[
 {id:"pasnik", n:"Pašnik",  c:{ink:"#161A17",panel:"#1E2421",panel2:"#262E29",line:"#38423C",paper:"#E4E7E2",mute:"#8A968F",volt:"#FFD23F",sage:"#86B06A",rust:"#D3543A",sky:"#62A8C4",amber:"#FFA23F"}},
 {id:"nocna",  n:"Noč",     c:{ink:"#0E141F",panel:"#161E2C",panel2:"#1E293A",line:"#2E3D52",paper:"#DDE6F2",mute:"#7D8DA5",volt:"#5AD1F0",sage:"#5FD3A6",rust:"#F0576B",sky:"#8B9CF5",amber:"#FFB454"}},
 {id:"jantar", n:"Jantar",  c:{ink:"#1A1410",panel:"#241C16",panel2:"#2E241C",line:"#463629",paper:"#F0E3D3",mute:"#A08D77",volt:"#FFB454",sage:"#B5C25E",rust:"#E05A3C",sky:"#6FB5C9",amber:"#FF8F3C"}},
 {id:"gozd",   n:"Gozd",    c:{ink:"#0D1710",panel:"#132018",panel2:"#1A2C20",line:"#274434",paper:"#DCEEDF",mute:"#7C9C87",volt:"#B8E62E",sage:"#4FD37C",rust:"#E85D4A",sky:"#4FC3D9",amber:"#FFC24A"}},
 {id:"vino",   n:"Vino",    c:{ink:"#180F16",panel:"#22161F",panel2:"#2D1E29",line:"#452F3F",paper:"#F2DFEC",mute:"#A2849A",volt:"#FF7FB0",sage:"#9BDF6E",rust:"#F04D6A",sky:"#9C8CF0",amber:"#FFA95C"}},
 {id:"termnoc",n:"Terminal noč", c:{ink:"#0A0503",panel:"#140906",panel2:"#1E0F09",line:"#3D1F16",paper:"#E8A87C",mute:"#8C5A45",volt:"#FF8F52",sage:"#E8B86A",rust:"#FF5A3D",sky:"#D98A5C",amber:"#FFB347"}},
 {id:"jeklo",  n:"Jeklo +", hc:1, c:{ink:"#0A0C0E",panel:"#14181C",panel2:"#1F262C",line:"#5A6873",paper:"#FFFFFF",mute:"#BAC6D1",volt:"#FFB000",sage:"#3CD060",rust:"#FF3B30",sky:"#40C4FF",amber:"#FF8C00"}},

function applyTheme(id){
  const t = THEMES.find(x=>x.id===id) || THEMES[0];
  const r = document.documentElement.style;
  Object.keys(t.c).forEach(k=>r.setProperty('--'+k, t.c[k]));
  document.body.classList.toggle('hc', !!t.hc);
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', t.c.ink);
  lsSetPlain('rs_theme', id);
  buildThemeGrid();
  if(typeof syncOscColors === 'function') syncOscColors();
  if(currentTab==='osciloskop' && currentSite()) renderOscFull();
}
function buildThemeGrid(){
  const box = document.getElementById('themeGrid'); if(!box) return;
  const cur = lsGetPlain('rs_theme','pasnik');
  box.innerHTML='';
  THEMES.forEach(t=>{
    const b=document.createElement('button');
    b.type='button'; b.setAttribute('aria-pressed', t.id===cur?'true':'false');
    b.innerHTML='<span class="sw"></span><span class="tn"></span>';
    const sw=b.querySelector('.sw');
    sw.style.background=t.c.panel; sw.style.borderColor=t.c.line;
    ['volt','sky','sage','rust'].forEach(k=>{
      const d=document.createElement('i'); d.style.background=t.c[k]; sw.appendChild(d);
    });
    b.querySelector('.tn').textContent=t.n;
    b.onclick=()=>applyTheme(t.id);
    box.appendChild(b);
  });
}

  helpIdxTitle:"Kazalo pomoči",
  hStart:"Hitri začetek", hStartT:"<h4>1 · Priklopi napravo</h4><p>Ob vklopu ESP32 odpre svoje omrežje <b>IO</b>+ID (geslo <b>IOPS</b>+ID) za 10 minut. Poveži se nanj in odpri <b>http://192.168.4.1</b>.</p><h4>2 · Vpiši WiFi</h4><p>V portalu izpolni do 5 omrežij, ime naprave in MQTT strežnik (privzeto <code>broker.emqx.io:1883</code>). Portal ti pokaže tudi <b>6-mestni ID naprave</b> — zapiši si ga.</p><h4>3 · Dodaj napravo v aplikacijo</h4><p>Odpri ⚙ → <b>Dodaj napravo</b>, vpiši ime, ID iz portala in isti MQTT strežnik. Način delovanja nastavi na <b>Realno delovanje</b>.</p><h4>4 · Preveri povezavo</h4><p>V glavi mora pisati <b>ONLINE</b> in verzija v obliki <code>V60 / FW V60</code>. Če se verziji ne ujemata, na napravi teče stara firmware.</p>",
  hRelays:"Releji", hRelaysT:"<p>Vsak od štirih izhodov ima dva načina:</p><h4>Ročno</h4><p>Gumb <b>ON</b> / <b>OFF</b> preklopi izhod in ga tam pusti. Stanje se takoj shrani v napravo.</p><h4>Periodično</h4><p>Izhod utripa: <b>Ton</b> = čas vklopa, <b>Toff</b> = čas izklopa, oba v sekundah (0.1–50 s). Vrednost vpišeš v polje ali nastaviš z drsnikom. Cikel se ob vsaki spremembi <b>začne od začetka</b>, s fazo vklopa.</p><h4>Binarno štetje</h4><p>Krmili vse štiri releje hkrati kot 4-bitni števec 0–15: rele 1 = najnižji bit, rele 4 = najvišji. Vsakih <i>perioda</i> sekund se števec poveča za 1. Dokler je vklopljeno, so posamezne rele kartice zaklenjene.</p><h4>Po ponovnem zagonu</h4><p>Privzeto gredo vsi izhodi na 0 in načini se vrnejo na <b>Ročno</b> — naprava po izpadu napajanja ne sme sama sprožiti priklopljene opreme. To spremeniš z <b>Obnovi stanje</b> v nastavitvah.</p><p>Kartice se ob tem <b>same postavijo na Ročno/izklopljeno</b>. To ni izguba tvoje nastavitve, ampak resničen odraz stanja naprave: od V58 je naprava vir resnice tudi za način, ne le za stanje. Če želiš prejšnje delovanje nazaj, nastavitev ponovno pošlji.</p><p>Pika ob imenu releja kaže <b>dejansko</b> stanje izhoda na napravi. Med utripanjem utripa skupaj z njim — tako na prvi pogled ločiš „nastavljeno“ od „dejansko“.</p>",
  hServo:"Servo izhodi", hServoT:"<p>Dva izhoda, pozicija <b>0–255</b> (ustreza pulzu 500–2500 µs).</p><h4>Ročno</h4><p>Gumba <b>OFF</b> in <b>ON</b> premakneta servo v dve <i>definirani legi</i>, ki ju sam nastaviš (privzeto 0 in 255). Legi sta shranjeni v napravi, zato veljata tudi z drugega telefona.</p><h4>Nihanje</h4><p>Servo kroži med <b>PozA</b> in <b>PozB</b>. <b>Čas prehoda</b> je hitrost premika in se <u>prišteje</u> zadrževalnemu času — ne teče vzporedno z njim.</p><p>Cikel: prehod na A → zadrži <b>Ton</b> → prehod na B → zadrži <b>Toff</b> → …</p><p>Primer: Ton 1 s, Toff 1 s, prehod 1 s → cel cikel traja 4 s.</p><p>Čas prehoda 0 pomeni takojšen preskok. Vrednosti pod 50 ms se dvignejo na 50 ms, ker je hitrejši premik pri vzorčenju neviden.</p>",
  hAnalog:"Analogni vhodi", hAnalogT:"<p>Štirje vhodi merijo <b>0–40 V</b> preko delilnika 100k/8.2k (razmerje 13.2×).</p><h4>Merilo</h4><p>Nad grafom izbereš <b>AUTO</b> ali fiksno merilo 5 / 10 / 20 / 40 V. AUTO se prilagaja največji izmerjeni vrednosti.</p><h4>Umerjanje</h4><p>Delilnik je nastavljen v firmware (<code>DIVIDER_RATIO</code>). Naprava pošlje že preračunano napetost, aplikacija je ne spreminja — zato graf, izvoz TXT in JSON vedno kažejo isto številko.</p><p>Če odčitek odstopa od multimetra, je treba popraviti <code>DIVIDER_RATIO</code> in znova naložiti firmware.</p><h4>Natančnost</h4><p>Naprava uporablja tovarniško kalibracijo ADC (linearizirani milivolti). Kljub temu pričakuj nekaj desetink volta odstopanja, več pri zelo nizkih napetostih.</p>",
  hOsc:"Osciloskop", hOscT:"<p>Prikaže potek relejev, servo pozicij in analognih vhodov v času. Vsi trije grafi imajo <b>skupno časovno os</b>.</p><h4>Časovna baza</h4><p>Kako pogosto naprava zajame vzorec (1 ms – 1 min). To je <b>zgornja meja</b>, ne zagotovilo: pri 1 ms ESP32 z WiFi in MQTT realno zmore nekaj sto vzorcev na sekundo. Dejansko doseženo hitrost vidiš v vrstici <i>zajem</i>.</p><h4>Širina grafa</h4><p>Koliko zadnjih vzorcev je v oknu. Širina okna v času = število vzorcev × časovna baza.</p><h4>Premikanje</h4><p><b>Ustavi prikaz</b> zamrzne izris — zajem teče naprej. Med zamrznitvijo povleci levo/desno za pomik po zgodovini. Tapni graf za vrednost v točki; drugi tap postavi drugo oznako in izmeri razliko časov.</p><h4>Zgodovina</h4><p>Naprava hrani do 30 000 zapisov v flashu, tudi ko aplikacija ni povezana. Ob vrzeli (izpad povezave, ugasnjen zaslon) jih aplikacija sama zahteva nazaj in graf zapolni.</p>",
  hData:"Shranjevanje in izvoz", hDataT:"<h4>Save JSON</h4><p>Shrani celoten buffer z vsemi kanali in ID-ji zapisov. To je edini format, ki ga zna <b>Open JSON</b> naložiti nazaj.</p><h4>Save TXT</h4><p>Berljiva tabela za nadaljnjo obdelavo v preglednici. Nazaj je ni mogoče naložiti.</p><h4>PNG</h4><p>Slika vseh treh grafov skupaj — za poročilo ali dokumentacijo okvare.</p><h4>Open JSON</h4><p>Naloži shranjen posnetek. Živi buffer se med tem <b>ohrani</b>; z gumbom <b>V živo</b> se vrneš nanj, novi podatki pa se zlijejo z že zbranimi.</p><h4>Počisti</h4><p>Izbriše samo prikazani buffer v aplikaciji. Zgodovina na napravi ostane.</p><h4>Sinhroniziraj zdaj</h4><p>Ročno sproži isto uskladitev z napravo, ki se sicer zgodi samodejno ob vsaki povezavi: izbriše lokalne zapise, ki jih naprava ne hrani več, in dopolni, kar manjka do njenega trenutnega stanja.</p>",
  hOffline:"Varovala", hOfflineT:"<h4>Zaznavanje odsotnosti</h4><p>Ko je vklopljeno, naprava po nastavljenem času brez aplikacije <b>ustavi vse</b> — releje, utripanje, nihanje — in postavi izhode na 0. Privzeto je <b>izklopljeno</b>, ker se dolgi testi z zaklenjenim telefonom ne smejo prekiniti.</p><p>Časovna omejitev je nastavljiva (najmanj 5 s, privzeto 60 s). Ob ponovni prijavi se delovanje ne prekine in ne spremeni — aplikacija samo prevzame trenutno stanje.</p><h4>Obnovi stanje ob zagonu</h4><p>Izklopljeno (privzeto): po izpadu napajanja gredo vsi izhodi na 0. Vklopljeno: naprava obnovi zadnje shranjeno stanje. Utripanje se v obeh primerih začne od začetka cikla.</p><h4>Vir resnice</h4><p>Nastavitvi hrani <b>naprava</b>, ne telefon. Ob vsaki prijavi ju aplikacija prevzame z naprave, zato sta enaki na vseh telefonih.</p>",
  hSim:"Načini delovanja", hSimT:"<p>Vsaka naprava ima svoj način (⚙ → Način):</p><h4>Realno delovanje</h4><p>Ukazi gredo preko MQTT pravi napravi, podatki prihajajo z nje. To je normalna uporaba.</p><h4>Simulacija lokalno</h4><p>Virtualna naprava teče v telefonu, brez MQTT. Uporabno za spoznavanje vmesnika in za preizkus brez strojne opreme.</p><h4>Simulacija broker</h4><p>Virtualna naprava pošilja in sprejema <b>prava</b> MQTT sporočila. S tem preizkusiš celotno pot — teme, format zapisov, obnašanje ob izpadu — brez ESP32.</p><h4>Dnevnik</h4><p>Na dnu zavihka Osciloskop je diagnostični dnevnik: povezave, poslani ukazi, prejeti zapisi, vrzeli in napake. Ob težavi ga kopiraj in priloži.</p>",
  hSettings:"Nastavitve naprav", hSettingsT:"<h4>Naprava</h4><p><b>Ime</b> je poljubno. <b>ID</b> je zadnjih 6 hex znakov MAC naslova ESP32 — najdeš ga v WiFi portalu naprave ali na serijskem izpisu ob zagonu.</p><p><b>MQTT strežnik</b> mora biti isti kot v napravi, v obliki <code>naslov:vrata</code>. Aplikacija se poveže preko WebSocketa.</p><h4>Več naprav</h4><p>Naprav lahko dodaš več; med njimi preklapljaš s spustnim seznamom v glavi. Vsaka ima svoj buffer in svoje nastavitve.</p><h4>Videz</h4><p>V nastavitvah izbereš tudi barvno shemo in jezik (slovenščina / angleščina).</p>",
  hTrouble:"Odpravljanje težav", hTroubleT:"<h4>Napis OFFLINE</h4><p>Preveri, da sta v napravi in v aplikaciji isti MQTT strežnik in isti ID. Če naprava ni na WiFi, sama znova odpre portal <b>IO</b>+ID.</p><h4>Verziji se ne ujemata</h4><p>Napis <code>V60 / FW V54</code> pomeni, da nova firmware ni bila naložena. Večina protokolarnih težav izvira od tod.</p><h4>Graf je prazen ali redek</h4><p>Pri zelo hitrih bazah je omejitev povezava, ne naprava. Primerjaj <i>zajem</i> z izbrano bazo; če je bistveno nižji, izberi počasnejšo bazo ali se približaj dostopni točki.</p><h4>Ukaz ni potrjen</h4><p>Ukazi gredo z QoS 0 (brez potrditve brokerja). Aplikacija vsak ročni ukaz po 500 ms sama enkrat ponovi, če naprava ne javi pričakovanega stanja.</p><h4>Meritev odstopa</h4><p>Popravi <code>DIVIDER_RATIO</code> v firmware in znova naloži. Če vrednost niha, je vzrok najverjetneje previsoka izhodna impedanca delilnika.</p><h4>Nič od tega ne pomaga</h4><p>Osciloskop → <b>Kopiraj dnevnik</b> in priloži izpis.</p>",

  emptyNoDevice:"No device added. Open settings (⚙) and add a device.", waitingForData:"Waiting for device data…",
  helpIdxTitle:"Help index",
  hStart:"Quick start", hStartT:"<h4>1 · Power up the device</h4><p>On boot the ESP32 opens its own network <b>IO</b>+ID (password <b>IOPS</b>+ID) for 10 minutes. Connect to it and open <b>http://192.168.4.1</b>.</p><h4>2 · Enter WiFi</h4><p>In the portal fill in up to 5 networks, the device name and the MQTT server (default <code>broker.emqx.io:1883</code>). The portal also shows the <b>6-character device ID</b> — write it down.</p><h4>3 · Add the device here</h4><p>Open ⚙ → <b>Add device</b>, enter a name, the ID from the portal and the same MQTT server. Set the mode to <b>Real operation</b>.</p><h4>4 · Check the connection</h4><p>The header must read <b>ONLINE</b> and a version in the form <code>V60 / FW V60</code>. If the two differ, the device is running old firmware.</p>",
  hRelays:"Relays", hRelaysT:"<p>Each of the four outputs has two modes:</p><h4>Manual</h4><p><b>ON</b> / <b>OFF</b> toggles the output and leaves it there. The state is saved to the device immediately.</p><h4>Period</h4><p>The output blinks: <b>Ton</b> = on time, <b>Toff</b> = off time, both in seconds (0.1–50 s). Type a value or use the slider. On every change the cycle <b>restarts from the beginning</b>, with the on phase.</p><h4>Binary counting</h4><p>Drives all four relays at once as a 4-bit counter 0–15: relay 1 = lowest bit, relay 4 = highest. Every <i>period</i> seconds the counter increments. While active, the individual relay cards are locked.</p><h4>After a restart</h4><p>By default all outputs go to 0 and the modes return to <b>Manual</b> — a device must not switch connected equipment on by itself after a power cut. Change this with <b>Restore state</b> in settings.</p><p>The cards <b>set themselves to Manual/off</b> as a result. This is not a loss of your settings but a true reflection of the device state: since V58 the device is the source of truth for the mode as well, not just the state. To get the previous behaviour back, send the setting again.</p><p>The dot next to the relay name shows the <b>actual</b> output state on the device. While blinking it blinks along — so you can tell &lsquo;configured&rsquo; from &lsquo;actual&rsquo; at a glance.</p>",
  hServo:"Servo outputs", hServoT:"<p>Two outputs, position <b>0–255</b> (maps to a 500–2500 µs pulse).</p><h4>Manual</h4><p><b>OFF</b> and <b>ON</b> move the servo to two <i>defined positions</i> that you set yourself (0 and 255 by default). Both are stored on the device, so they apply from any phone.</p><h4>Oscillate</h4><p>The servo cycles between <b>PosA</b> and <b>PosB</b>. <b>Transition time</b> is the travel speed and is <u>added to</u> the hold time — it does not run in parallel with it.</p><p>Cycle: move to A → hold <b>Ton</b> → move to B → hold <b>Toff</b> → …</p><p>Example: Ton 1 s, Toff 1 s, transition 1 s → full cycle takes 4 s.</p><p>A transition time of 0 means an instant jump. Values below 50 ms are raised to 50 ms, because faster travel is invisible at the sampling rate.</p>",
  hAnalog:"Analog inputs", hAnalogT:"<p>Four inputs measure <b>0–40 V</b> through a 100k/8.2k divider (ratio 13.2×).</p><h4>Scale</h4><p>Above the graph choose <b>AUTO</b> or a fixed 5 / 10 / 20 / 40 V scale. AUTO follows the largest measured value.</p><h4>Calibration</h4><p>The divider is set in the firmware (<code>DIVIDER_RATIO</code>). The device sends an already-converted voltage and the app does not alter it — so the graph, the TXT export and the JSON always show the same number.</p><p>If a reading differs from a multimeter, correct <code>DIVIDER_RATIO</code> and reflash.</p><h4>Accuracy</h4><p>The device uses the factory ADC calibration (linearised millivolts). Even so, expect a few tenths of a volt of error, more at very low voltages.</p>",
  hOsc:"Oscilloscope", hOscT:"<p>Shows relays, servo positions and analog inputs over time. All three graphs share a <b>common time axis</b>.</p><h4>Time base</h4><p>How often the device takes a sample (1 ms – 1 min). This is an <b>upper limit</b>, not a guarantee: at 1 ms an ESP32 with WiFi and MQTT realistically manages a few hundred samples per second. The rate actually achieved is shown in the <i>rate</i> line.</p><h4>Graph width</h4><p>How many of the most recent samples fit in the window. Window width in time = number of samples × time base.</p><h4>Navigating</h4><p><b>Freeze</b> stops the drawing — sampling continues. While frozen, drag left/right to move through history. Tap the graph for a point value; a second tap places a second marker and measures the time between them.</p><h4>History</h4><p>The device keeps up to 30,000 records in flash, even while the app is disconnected. After a gap (lost connection, screen off) the app requests them back on its own and fills the graph in.</p>",
  hData:"Saving and export", hDataT:"<h4>Save JSON</h4><p>Saves the whole buffer with all channels and record IDs. This is the only format <b>Open JSON</b> can load back.</p><h4>Save TXT</h4><p>A readable table for further work in a spreadsheet. It cannot be loaded back.</p><h4>PNG</h4><p>An image of all three graphs together — for a report or fault documentation.</p><h4>Open JSON</h4><p>Loads a saved snapshot. The live buffer is <b>kept</b> meanwhile; <b>Live</b> returns to it and merges whatever arrived in the meantime.</p><h4>Clear</h4><p>Erases only the buffer shown in the app. History on the device stays.</p><h4>Sync now</h4><p>Manually triggers the same sync that otherwise happens automatically on every connection: deletes local records the device no longer holds, and fetches whatever is missing up to its current state.</p>",
  hOffline:"Safety features", hOfflineT:"<h4>Absence detection</h4><p>When enabled, after the configured time without the app the device <b>stops everything</b> — relays, blinking, oscillation — and drives the outputs to 0. It is <b>off</b> by default, because long tests with a locked phone must not be interrupted.</p><p>The timeout is configurable (minimum 5 s, default 60 s). When the app reconnects, operation is neither interrupted nor changed — the app simply picks up the current state.</p><h4>Restore state on boot</h4><p>Off (default): after a power cut all outputs go to 0. On: the device restores its last saved state. Blinking restarts from the beginning of the cycle in both cases.</p><h4>Source of truth</h4><p>Both settings live on the <b>device</b>, not the phone. The app takes them from the device on every connect, so they are identical on every phone.</p>",
  hSim:"Operating modes", hSimT:"<p>Each device has its own mode (⚙ → Mode):</p><h4>Real operation</h4><p>Commands go over MQTT to the real device and data comes back from it. This is normal use.</p><h4>Local simulation</h4><p>A virtual device runs inside the phone, without MQTT. Useful for learning the interface and for testing without hardware.</p><h4>Broker simulation</h4><p>The virtual device sends and receives <b>real</b> MQTT messages. This exercises the whole path — topics, record format, behaviour on dropout — without an ESP32.</p><h4>Log</h4><p>At the bottom of the Scope tab there is a diagnostic log: connections, commands sent, records received, gaps and errors. When something goes wrong, copy it and attach it.</p>",
  hSettings:"Device settings", hSettingsT:"<h4>Device</h4><p><b>Name</b> is free text. <b>ID</b> is the last 6 hex characters of the ESP32 MAC address — find it in the device WiFi portal or on the serial output at boot.</p><p><b>MQTT server</b> must match the one in the device, in the form <code>host:port</code>. The app connects over WebSocket.</p><h4>Multiple devices</h4><p>You can add several devices and switch between them with the dropdown in the header. Each has its own buffer and its own settings.</p><h4>Appearance</h4><p>Settings also holds the colour scheme and the language (Slovenian / English).</p>",
  hTrouble:"Troubleshooting", hTroubleT:"<h4>It says OFFLINE</h4><p>Check that the device and the app use the same MQTT server and the same ID. If the device is off WiFi, it reopens the <b>IO</b>+ID portal by itself.</p><h4>Versions do not match</h4><p><code>V60 / FW V54</code> means the new firmware was not flashed. Most protocol-level problems come from here.</p><h4>The graph is empty or sparse</h4><p>At very fast time bases the limit is the connection, not the device. Compare <i>rate</i> with the selected base; if it is far lower, pick a slower base or move closer to the access point.</p><h4>A command was not confirmed</h4><p>Commands use QoS 0 (no broker acknowledgement). The app repeats each manual command once after 500 ms if the device does not report the expected state.</p><h4>Readings are off</h4><p>Correct <code>DIVIDER_RATIO</code> in the firmware and reflash. If the value is unstable, the likely cause is the divider output impedance being too high.</p><h4>None of this helps</h4><p>Scope → <b>Copy log</b> and attach the output.</p>",
  oscNoData:"No data.", oscTapHint:"Tap the graph for a point value", oscNow:"now",

function T(k){ return (I18N[LANG] && I18N[LANG][k]) || (I18N.sl[k]) || k; }

function applyLang(id){
  LANG = id; lsSetPlain('rs_lang', id);
  document.documentElement.setAttribute('lang', id);
  document.querySelectorAll('[data-i]').forEach(el=>{ el.textContent = T(el.getAttribute('data-i')); });
  buildLangGrid(); buildKeepAwakeGrid();
  renderAll();
}
function buildKeepAwakeGrid(){
  const lbl = document.getElementById('kaLbl'); if(lbl) lbl.textContent = T('keepAwake');
  const hint = document.getElementById('kaHint'); if(hint) hint.textContent = T('keepAwakeHint');
  const box = document.getElementById('kaGrid'); if(!box) return;
  box.innerHTML = '';
  [[true,'onLbl'],[false,'offLbl']].forEach(([v,k])=>{
    const b = document.createElement('button');
    b.type='button'; b.textContent = T(k);
    b.setAttribute('aria-pressed', v===KEEP_AWAKE ? 'true':'false');
    b.onclick = ()=>{ setKeepAwake(v); buildKeepAwakeGrid(); };
    box.appendChild(b);
  });
}
function buildLangGrid(){
  const box = document.getElementById('langGrid'); if(!box) return;
  box.innerHTML = '';
  LANGS.forEach(l=>{
    const b = document.createElement('button');
    b.type='button'; b.textContent=l.n;
    b.setAttribute('aria-pressed', l.id===LANG ? 'true':'false');
    b.onclick=()=>applyLang(l.id);
    box.appendChild(b);
  });
}

function ensureSim(id){
  if(!SIMS[id]) SIMS[id] = {
    rele:[
      {mode:'static', state:false, ton:1, toff:1, phaseOn:true, last:0},
      {mode:'static', state:false, ton:1, toff:1, phaseOn:true, last:0},
      {mode:'static', state:false, ton:1, toff:1, phaseOn:true, last:0},
      {mode:'static', state:false, ton:1, toff:1, phaseOn:true, last:0}
    ],
    binMode:false, binVal:0,
    servo:[
      {mode:'static', pos:0, posA:0, posB:255, ton:1, toff:1, rampMs:0, phase:'RAMP_A', phaseStart:0, rampFrom:0, target:0, last:0},
      {mode:'static', pos:0, posA:0, posB:255, ton:1, toff:1, rampMs:0, phase:'RAMP_A', phaseStart:0, rampFrom:0, target:0, last:0}
    ],
    analog:{a1:0,a2:0,a3:0,a4:0},
    binPeriod:1, binLast:0
  };
  if(SIMS[id].binPeriod===undefined) SIMS[id].binPeriod = 1;
  SIMS[id].servo.forEach(sv=>{
    if(sv.rampMs===undefined) sv.rampMs = 0;
    if(sv.phase===undefined) sv.phase = 'RAMP_A';
    if(sv.phaseStart===undefined) sv.phaseStart = 0;
    if(sv.rampFrom===undefined) sv.rampFrom = sv.pos||0;
    if(sv.target===undefined) sv.target = sv.pos||0;
  });
  if(SIMS[id].binLast===undefined) SIMS[id].binLast = 0;
  return SIMS[id];
}

/* ============================================================
   IndexedDB shramba
   ============================================================ */
const DB_NAME = 'io_scope', DB_VER = 2;
const CHUNK = 500, REC = 19;
const DISK_MAX_RECORDS = 30000;
let _db = null, _dbFailed = false, _quotaWarned = false;

function dbOpen(){
  if(_db) return Promise.resolve(_db);
  if(_dbFailed) return Promise.resolve(null);
  return new Promise(res=>{
    let rq;
    try{ rq = indexedDB.open(DB_NAME, DB_VER); }
    catch(e){ _dbFailed = true; logDebug(`SHRAMBA: ni na voljo (${e.message})`, true); return res(null); }
    rq.onupgradeneeded = ()=>{
      const db = rq.result;
      if(db.objectStoreNames.contains('chunks')) db.deleteObjectStore('chunks');
      if(db.objectStoreNames.contains('meta'))   db.deleteObjectStore('meta');
      if(!db.objectStoreNames.contains('chunks')){
        const st = db.createObjectStore('chunks', { keyPath:'k' });
        st.createIndex('dev', 'dev');
        st.createIndex('devboot', ['dev','boot']);
      }
      if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath:'dev' });
    };
    rq.onsuccess = ()=>{ _db = rq.result; res(_db); };
    rq.onerror   = ()=>{ _dbFailed = true; logDebug('SHRAMBA: odpiranje ni uspelo', true); res(null); };
    rq.onblocked = ()=>{ _dbFailed = true; res(null); };
  });
}
function tx(store, mode){
  return dbOpen().then(db=>{
    if(!db) return null;
    try{ return db.transaction(store, mode).objectStore(store); }catch(e){ return null; }
  });
}
function req2p(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function storeFail(e){
  const name = e && e.name || '?';
  const isQuota = (name === 'QuotaExceededError');
  if(!isQuota){ logDebug(`SHRAMBA: zapis ni uspel (${name})`, true); return; }
  if(_quotaWarned) return;
  _quotaWarned = true;
  logDebug(`SHRAMBA: kvota je polna`, true);
  showToast(T('storeFull'));
}

let WQ = {};
let _flushTimer = null;
const FLUSH_MS = 2000;
const OFF_SAMPLES = 10;
let SESS_OFF = {};
function sessionOffset(dev, boot, off, isHist){
  let e = SESS_OFF[dev];
  if(!e || e.boot !== boot){
    e = SESS_OFF[dev] = { boot, off, n: isHist ? 0 : 1 };
    return e.off;
  }
  if(isHist) return e.off;
  if(e.n < OFF_SAMPLES){
    e.n++;
    if(off < e.off) e.off = off;
  }
  return e.off;
}
function storePush(dev, boot, recId, bytes, off, isHist){
  if(_dbFailed || !boot) return;
  if(!WQ[dev]) WQ[dev] = { boot, recs:new Map() };
  const q = WQ[dev];
  if(q.boot !== boot){ q.boot = boot; q.recs.clear(); }
  sessionOffset(dev, boot, off, isHist);
  q.recs.set(recId, bytes);
  if(q.recs.size >= CHUNK) flushStore();
  else if(!_flushTimer) _flushTimer = setTimeout(flushStore, FLUSH_MS);
}
// V97: zaklep - med zapisom se nov zapis ne zacne (prej so se isti podatki
// zapisali 3-4x vzporedno, ker se vrsta izprazni sele po koncu zapisa).
var _flushing = false, _flushAgain = false;
async function flushStore(){
  if(_flushing){ _flushAgain = true; return; }
  _flushing = true;
  try{ await flushStoreInner(); }
  finally{
    _flushing = false;
    if(_flushAgain){ _flushAgain = false; setTimeout(flushStore, 0); }
  }
}
async function flushStoreInner(){
  if(_flushTimer){ clearTimeout(_flushTimer); _flushTimer = null; }
  const devs = Object.keys(WQ).filter(d=>WQ[d].recs.size);
  if(!devs.length) return;
  const done = [];
  for(const dev of devs){
    const q = WQ[dev]; const boot = q.boot;
    const byBlk = new Map();
    for(const [rid, b] of q.recs){
      const blk = Math.floor((rid-1)/CHUNK);
      if(!byBlk.has(blk)) byBlk.set(blk, []);
      byBlk.get(blk).push([rid, b]);
    }
    let allOk = true, _wrote = 0;
    for(const [blk, items] of byBlk){
      const st = await tx('chunks','readwrite');
      if(!st){ allOk = false; break; }
      try{
        const key = `${dev}|${boot}|${blk}`;
        let c = await req2p(st.get(key));
        if(!c) c = { k:key, dev, boot, blk, buf:new Uint8Array(CHUNK*REC), present:new Uint8Array(CHUNK), cnt:0 };
        for(const [rid, b] of items){
          const i = (rid-1) % CHUNK;
          if(!c.present[i]) c.cnt++;
          c.present[i] = 1;
          c.buf.set(b, i*REC);
        }
        c.lastTm = Date.now();
        await req2p(st.put(c));
        for(const [rid] of items) q.recs.delete(rid);
        XFER_STORE.lastWriteAt = Date.now(); XFER_STORE.written += items.length; _wrote += items.length;
      }catch(e){ storeFail(e); allOk = false; break; }
    }
    if(allOk) done.push(dev);
    if(_wrote >= 20) logDebug(`DISK ${dev}: zapisanih ${_wrote} zapisov (${byBlk.size} blokov)${allOk?'':' - NAPAKA pri zapisu'}`, !allOk);
  }
  for(const dev of done){
    const e = SESS_OFF[dev];
    if(!e) continue;
    const m = await metaGet(dev);
    if(m && m.boot === e.boot && m.off !== e.off){ m.off = e.off; await metaPut(m); }
  }
  for(const dev of done) trimStore(dev).catch(()=>{});
}
// V96: NAJDEN VZROK "ob vsakem zagonu se del podatkov prenasa znova".
// Prej je trimStore bloke razvrstil po CASU ZADNJEGA ZAPISA (lastTm) in
// brisal tiste, ki so bili najdlje nazaj ZAPISANI, cim je bilo skupaj vec
// kot DISK_MAX_RECORDS (30000). Naprava pa hrani VEC kot 30000 zapisov
// (npr. 30200) - zato je bil ob vsakem zapisu en blok vedno "prevec" in je
// bil izbrisan, ne glede na to, kateri ID-ji so v njem. Ob naslednjem zagonu
// ga ni bilo na disku -> backfill ga je prenesel znova -> izbrisan je bil
// drug blok ... Zdaj: omejitev je dvakrat vecja od zmogljivosti naprave,
// brise se po ID-jih (najstarejsi bloki trenutne seje zadnji), bloki,
// starejsi od tega, kar naprava se hrani, pa se brisejo v syncWithDevice.
const DISK_KEEP_RECORDS = 60000;
async function trimStore(dev){
  const m = await metaGet(dev);
  const cur = m && m.boot;
  const st = await tx('chunks','readwrite'); if(!st) return;
  const all = await req2p(st.index('dev').getAll(dev));
  all.sort((a,b)=>{
    const ac = a.boot === cur, bc = b.boot === cur;
    if(ac !== bc) return ac ? -1 : 1;            // trenutna seja ima prednost
    if(ac) return b.blk - a.blk;                 // znotraj seje: najnovejsi ID-ji prvi
    return (b.lastTm || 0) - (a.lastTm || 0);    // stare seje: po casu
  });
  let keep = 0, del = 0, delRecs = 0;
  for(const c of all){
    keep += c.cnt;
    if(keep > DISK_KEEP_RECORDS){ st.delete(c.k); del++; delRecs += c.cnt; }
  }
  if(del) logDebug(`DISK ${dev}: izbrisanih ${del} najstarejsih blokov (${delRecs} zapisov) - preko omejitve ${DISK_KEEP_RECORDS}`);
}
async function metaGet(dev){
  const st = await tx('meta','readonly'); if(!st) return null;
  try{ return await req2p(st.get(dev)) || null; }catch(e){ return null; }
}
async function metaPut(m){
  const st = await tx('meta','readwrite'); if(!st) return;
  try{ await req2p(st.put(m)); }catch(e){ storeFail(e); }
}
async function storeSetBoot(dev, boot){
  if(!boot || _dbFailed) return false;
  const m = await metaGet(dev) || { dev, boot:0, prevBoot:0, lastId:0 };
  if(m.boot === boot) return false;
  const isRestart = !!m.boot;
  await metaPut({ dev, boot, prevBoot: m.boot||0, lastId:0, off: undefined, resets: m.resets || [], updated:Date.now() });
  delete SESS_OFF[dev];
  if(isRestart) logDebug(`SHRAMBA ${dev}: nova seja ${boot} (prejsnja ${m.boot} ostaja)`);
  return isRestart;
}
async function loadAllIdsFromDisk(dev){
  if(_dbFailed) return 0;
  const m = await metaGet(dev);
  if(!m || !m.boot) return 0;
  const st = await tx('chunks','readonly'); if(!st) return 0;
  let all;
  try{ all = await req2p(st.index('devboot').getAll([dev, m.boot])); }catch(e){ return 0; }
  if(!all || !all.length) return 0;
  const S = seenSet(dev);
  let added = 0;
  const data = [];   // V94: [recId, tm] za segmentacijo po zagonih
  for(const c of all){
    const dv = new DataView(c.buf.buffer, c.buf.byteOffset, c.buf.byteLength);
    for(let j=0; j<CHUNK; j++){
      if(!c.present[j]) continue;
      const recId = dv.getUint32(j*REC, true);
      const tm = dv.getUint32(j*REC+4, true);
      const rb = dv.getUint8(j*REC+8);
      if(rb === 0xFF) segAddMark(dev, recId, tm); else data.push([recId, tm]);
      const key = rk(dev, recId, m.boot);
      if(!S.has(key)){ S.add(key); added++; }
    }
  }
  for(const [recId, tm] of data) segNoteData(dev, recId, tm);
  return added;
}
async function storeLoad(dev, want){
  if(_dbFailed) return null;
  const m = await metaGet(dev);
  if(!m || !m.boot) return null;
  const st = await tx('chunks','readonly'); if(!st) return null;
  let all;
  try{ all = await req2p(st.index('devboot').getAll([dev, m.boot])); }catch(e){ return null; }
  if(!all || !all.length) return null;
  const sessOff = (m.off !== undefined) ? m.off : (all[0].off !== undefined ? all[0].off : 0);
  // V94: sessOff velja SAMO za zadnji (zivi) zagon naprave; starejsi zagoni
  // dobijo svoj odmik iz tabele zagonov (glej segOff/recTime).
  { const SS = segState(dev); if(SS.diskOff !== sessOff){ SS.diskOff = sessOff; segInvalidate(dev); } }
  all.sort((a,b)=>a.blk-b.blk);
  const out = []; let maxId = 0;
  for(let i=all.length-1; i>=0 && out.length < want; i--){
    const c = all[i];
    const dv = new DataView(c.buf.buffer, c.buf.byteOffset, c.buf.byteLength);
    for(let j=CHUNK-1; j>=0 && out.length < want; j--){
      if(!c.present[j]) continue;
      const o = j*REC;
      const recId = dv.getUint32(o, true), tm = dv.getUint32(o+4, true);
      const rb = dv.getUint8(o+8);
      if(rb === 0xFF){ segAddMark(dev, recId, tm); continue; }   // V94: oznake vklopa -> tabela zagonov
      const rt = recTime(dev, recId, tm);
      out.push({
        recId, boot: m.boot, tm,
        t: (rt !== null) ? rt : tm + sessOff,
        rele:[!!(rb&1),!!(rb&2),!!(rb&4),!!(rb&8)],
        servo:[dv.getUint8(o+9), dv.getUint8(o+10)],
        analog:{ a1:dv.getUint16(o+11,true)/10, a2:dv.getUint16(o+13,true)/10,
                 a3:dv.getUint16(o+15,true)/10, a4:dv.getUint16(o+17,true)/10 }
      });
      if(recId > maxId) maxId = recId;
    }
  }
  out.reverse();
  return { boot:m.boot, samples:out, maxId };
}
async function storeUsage(dev){
  const st = await tx('chunks','readonly'); if(!st) return null;
  try{
    const all = await req2p(st.index('dev').getAll(dev));
    let recs = 0, bytes = 0;
    for(const c of all){ recs += c.cnt; bytes += c.buf.byteLength + c.present.byteLength; }
    return { chunks: all.length, recs, bytes, boots:[...new Set(all.map(c=>c.boot))].length };
  }catch(e){ return null; }
}
async function storeClear(dev){
  const st = await tx('chunks','readwrite'); if(!st) return;
  try{
    const all = await req2p(st.index('dev').getAll(dev));
    for(const c of all) st.delete(c.k);
  }catch(e){}
  const ms = await tx('meta','readwrite');
  if(ms){ try{ await req2p(ms.delete(dev)); }catch(e){} }
  delete WQ[dev];
}
async function storeRename(oldId, newId){
  if(oldId === newId || _dbFailed) return;
  const st = await tx('chunks','readwrite'); if(!st) return;
  try{
    const all = await req2p(st.index('dev').getAll(oldId));
    for(const c of all){
      st.delete(c.k);
      c.dev = newId; c.k = `${newId}|${c.boot}|${c.blk}`;
      st.put(c);
    }
  }catch(e){}
  const m = await metaGet(oldId);
  if(m){ m.dev = newId; await metaPut(m);
         const ms = await tx('meta','readwrite');
         if(ms){ try{ await req2p(ms.delete(oldId)); }catch(e){} } }
}

/* ============================================================
   OSCBUF / pomnilniski buffer
   ============================================================ */
let OSCBUF = {};
const OSC_BASE_CAP = 3000;
let BUF_CAP = {};
function bufCap(id){ return BUF_CAP[id] || OSC_BASE_CAP; }
function diskWantCount(){
  const need = Math.ceil((typeof OSC_SAMPLES === 'number' ? OSC_SAMPLES : 3000) * 1.2);
  return Math.max(3000, Math.min(DISK_MAX_RECORDS, need));
}
function syncBufCap(id){
  const cap = diskWantCount();
  if(cap !== bufCap(id)){
    BUF_CAP[id] = cap;
    logDebug(`BUFFER ${id}: zgornja meja ${cap} zapisov (sirina okna ${OSC_SAMPLES})`);
  }
  return cap;
}
function lowerBound(arr, tMin){
  let lo = 0, hi = arr.length;
  while(lo < hi){ const m = (lo+hi)>>1; if(arr[m].t < tMin) lo = m+1; else hi = m; }
  return lo;
}

let BOOT_ID = {};
function SITE_IS_REAL(id){ const x = CFG.sites.find(y=>y.id===id); return !!x && x.opMode === 'real'; }
let LOADED = {};

async function onDeviceBoot(id, boot){
  if(!boot || boot === '0') return;
  if(BOOT_ID[id] === boot) return;
  const prev = BOOT_ID[id];
  BOOT_ID[id] = boot;
  logDebug(`SEJA ${id}: oznaka ${boot}${prev ? ` (prej ${prev})` : ''}`);
  await storeSetBoot(id, boot);
  if(prev){
    delete LAST_REC_ID[id];
    delete histLoadedFrom[id];
    delete HIST_INFO[id];
    delete SYNCED_ONCE[id];
    if(BACKFILL[id]){ try{ clearTimeout(BACKFILL[id].timer); }catch(e){} delete BACKFILL[id]; }
    hrqReset(id, 'nov zagon naprave'); delete ARCH_FULL[id];
    delete CLOCK_OFF[id]; delete CLOCK_MIN[id]; delete CLOCK_N[id];
    delete LOADED[id]; delete DISK_READY[id]; delete DISK_WAIT[id];
    noteReset(id, Date.now());
    renderOscFull();
  }
  loadFromDisk(id);
}

let LAST_TM = {};
function checkLegacyBoot(id, recId, tm){
  if(BOOT_ID[id] && BOOT_ID[id] !== 'legacy') return;
  if(!BOOT_ID[id]){ BOOT_ID[id] = 'legacy'; LAST_TM[id] = tm; return; }
  if(wasRequested(id, recId)) return;
  const last = LAST_REC_ID[id], lastTm = LAST_TM[id];
  const restarted = last !== undefined && lastTm !== undefined && recId < last - 100 && tm < lastTm - 1000;
  if(restarted){
    logDebug(`SEJA ${id}: zaznan ponovni zagon - zacenjam novo sejo`, true);
    BOOT_ID[id] = 'legacy' + Date.now();
    storeSetBoot(id, BOOT_ID[id]);
    OSCBUF[id] = []; delete LAST_REC_ID[id]; delete SEEN[id]; delete GAP_REQUESTED[id];
  }
  if(lastTm === undefined || tm > lastTm) LAST_TM[id] = tm;
}

/* ============================================================
   V92: bufKeySet - zbirka kljucev, ki so ZE v OSCBUF
   ============================================================ */
function bufKeySet(id){
  const s = new Set();
  const buf = OSCBUF[id];
  if(buf) for(const p of buf) if(p.recId) s.add(rk(id, p.recId, p.boot));
  return s;
}

// V96: dopolnjevanje/sinhronizacija se NE sme zaceti, preden je disk nalozen
// (SEEN/LAST_REC_ID prazna -> app bi zahteval cel arhiv znova).
var DISK_READY = {}, DISK_WAIT = {};
function diskReady(id){
  if(DISK_READY[id]) return true;
  if(!DISK_WAIT[id]) DISK_WAIT[id] = Date.now();
  if(Date.now() - DISK_WAIT[id] > 15000){
    DISK_READY[id] = true;
    logDebug(`SHRAMBA ${id}: nalaganje z diska se ni koncalo v 15 s - nadaljujem brez`, true);
  }
  return !!DISK_READY[id];
}
function markDiskReady(id){
  DISK_READY[id] = true; delete DISK_WAIT[id];
  const S = SEEN[id];
  logDebug(`SHRAMBA ${id}: disk pripravljen - znanih ID ${S ? S.size : 0}, v RAM ${(OSCBUF[id]||[]).length}, zadnji ID ${LAST_REC_ID[id] !== undefined ? LAST_REC_ID[id] : '-'}`);
}
async function loadFromDisk(id){
  const site = CFG.sites.find(x=>x.id===id);
  if(!site || site.opMode !== 'real') return;
  if(LOADED[id]) return;
  LOADED[id] = true;
  await loadResets(id);
  const idsAdded = await loadAllIdsFromDisk(id);
  if(idsAdded) logDebug(`SHRAMBA ${id}: SEEN dopolnjen z ${idsAdded} ID-ji s celega diska`);
  const want = Math.floor(syncBufCap(id) * 0.85);
  const r = await storeLoad(id, want);
  if(!r || !r.samples.length){
    logDebug(`SHRAMBA ${id}: na disku ni zapisov te seje`);
    markDiskReady(id);
    return;
  }
  const buf = OSCBUF[id] || (OSCBUF[id] = []);
  const S = seenSet(id);
  const bufKeys = bufKeySet(id);
  let added = 0;
  for(const smp of r.samples){
    const k = rk(id, smp.recId, smp.boot);
    if(bufKeys.has(k)) continue;
    buf.push(smp); S.add(k); bufKeys.add(k); added++;
  }
  buf.sort((a,b)=>a.t-b.t);
  if(LAST_REC_ID[id] !== undefined && LAST_REC_ID[id] > r.maxId + 1){
    const from = r.maxId + 1, to = LAST_REC_ID[id] - 1;
    const miss = countMissing(id, from, to);
    if(miss > 0){
      logDebug(`SHRAMBA ${id}: disk do ID ${r.maxId}, prvi zivi ${LAST_REC_ID[id]} - zahtevam ${from}..${to}`, true);
      requestGapFill(id, from, to - from + 1);
    }
  }
  if(LAST_REC_ID[id] === undefined || r.maxId > LAST_REC_ID[id]) LAST_REC_ID[id] = r.maxId;
  {
    let minId = null, maxId = null, idList = [];
    for(const p of buf){ if(p.recId){ idList.push(p.recId); if(minId===null||p.recId<minId) minId=p.recId; if(maxId===null||p.recId>maxId) maxId=p.recId; } }
    idList.sort((a,b)=>a-b);
    const gaps = [];
    for(let k=1;k<idList.length;k++){
      const gap = idList[k]-idList[k-1]-1;
      if(gap>0) gaps.push([idList[k-1]+1, idList[k]-1]);
    }
    DISK_GAPS[id] = gaps;
    logDebug(`SHRAMBA ${id}: nalozenih ${added} zapisov z diska (do ID ${r.maxId})`);
    logDebug(`SHRAMBA-DIAG ${id}: obseg ID ${minId}..${maxId} (${idList.length} razlicnih, ${gaps.length} vrzeli)`);
  }
  markDiskReady(id);
  renderOscFull();
}

async function widenFromDisk(id){
  const site = CFG.sites.find(x=>x.id===id);
  if(!site || site.opMode !== 'real') return;
  const want = syncBufCap(id);
  const buf = OSCBUF[id] || [];
  if(buf.length >= want) return;
  const r = await storeLoad(id, want);
  if(!r || !r.samples.length) return;
  const S = seenSet(id);
  const bufKeys = bufKeySet(id);
  let added = 0;
  for(const smp of r.samples){
    const k = rk(id, smp.recId, smp.boot);
    if(bufKeys.has(k)) continue;
    buf.push(smp); S.add(k); bufKeys.add(k); added++;
  }
  if(added){
    OSCBUF[id] = buf.sort((a,b)=>a.t-b.t);
    logDebug(`SHRAMBA ${id}: dolozenih ${added} zapisov z diska za sirse okno`);
    renderOscFull();
  }
}

let SEEN = {};
let RATE = {};
const RATE_WIN_MS = 5000;
const BLK_EVENT = 1, BLK_HISTORY = 2;
function rateNote(id, nRecs, lagMs, firstId, lastId, flags){
  let r = RATE[id];
  const boot = BOOT_ID[id];
  if(!r || r.boot !== boot) r = RATE[id] = { recs:[], blocks:[], lags:[], evts:[], ids:new Set(), boot };
  const now = Date.now();
  if(flags & BLK_HISTORY) return;
  if(flags & BLK_EVENT){
    for(let k=0;k<nRecs;k++) r.evts.push(now);
  } else {
    for(let k=0;k<nRecs;k++) r.recs.push(now);
    r.blocks.push(now);
    if(lagMs >= 0) r.lags.push([now, lagMs]);
    for(let i=firstId; i<=lastId; i++) r.ids.add(i);
  }
  const cut = now - RATE_WIN_MS;
  while(r.recs.length   && r.recs[0]   < cut) r.recs.shift();
  while(r.blocks.length && r.blocks[0] < cut) r.blocks.shift();
  while(r.lags.length   && r.lags[0][0] < cut) r.lags.shift();
  while(r.evts.length   && r.evts[0]   < cut) r.evts.shift();
}
function rateStats(id){
  const r = RATE[id];
  if(!r || !r.recs.length) return null;
  const secs = RATE_WIN_MS/1000;
  const lags = r.lags.map(x=>x[1]).sort((a,b)=>a-b);
  const med = lags.length ? lags[Math.floor(lags.length/2)] : 0;
  let loss = 0;
  if(r.ids.size > 1){
    const arr = [...r.ids];
    const span = Math.max(...arr) - Math.min(...arr) + 1;
    if(span > 0) loss = Math.max(0, Math.round((1 - r.ids.size/span)*1000)/10);
  }
  if(r.ids.size > 5000) r.ids = new Set([...r.ids].slice(-3000));
  return { hz: Math.round(r.recs.length/secs), bps: Math.round(r.blocks.length/secs*10)/10,
           evt: Math.round((r.evts||[]).length/secs), lag: med, loss };
}

function reportToDevice(){
  const s = currentSite();
  if(!s || s.opMode !== 'real') return;
  const L = ensureLive(s.id);
  if(!L.online) return;
  if(currentTab !== 'osciloskop') return;
  const st = rateStats(s.id);
  if(!st) return;
  sendCommand(s, 'klient/stanje', { client_hz: st.hz, lag_ms: st.lag, loss_pct: Math.round(st.loss) }, true);
}
setInterval(reportToDevice, 5000);

function seenSet(id){ if(!SEEN[id]) SEEN[id] = new Set(); return SEEN[id]; }
function rk(id, recId, boot){ return (boot || BOOT_ID[id] || '?') + ':' + recId; }

let RESETS = {};
/* ============================================================
   V94: TABELA ZAGONOV NAPRAVE (segmentacija zgodovine)
   ------------------------------------------------------------
   ID zapisov na napravi tece naprej cez ponovne zagone, millis() pa se
   ob vsakem zagonu zacne pri 0. Firmware ob zagonu zapise oznako vklopa
   (relBits=0xFF). Zapisi med dvema oznakama so en zagon ("segment").
   - zivi segment (tisti, v katerem je zadnji zivi ID) ima odmik CLOCK_OFF
     (naucen iz zivih podatkov) oz. shranjen odmik seje z diska;
   - starejsi segment: njegov zadnji zapis (najvecji millis) postavimo
     SEG_GAP_MS pred zacetek naslednjega zagona (millis=0 naslednjega).
     Cas izpada naprave ni znan - starejsi podatki so zamaknjeni za
     trajanje izpada, oblika signala pa je pravilna.
   ============================================================ */
const SEG_GAP_MS = 1000;
let BOOTSEG = {};
function segState(id){
  return BOOTSEG[id] || (BOOTSEG[id] = { marks:[], segMax:new Map(), maxId:0,
    diskOff:undefined, cache:new Map(), dirty:false, lastLiveOff:undefined });
}
function segInvalidate(id){ const S = segState(id); S.cache.clear(); S.dirty = true; }
function segAddMark(id, recId, tm){
  const S = segState(id);
  if(S.marks.some(m=>m.id===recId)) return false;
  S.marks.push({ id:recId, tm });
  S.marks.sort((a,b)=>a.id-b.id);
  segInvalidate(id);
  logDebug(`ZAGONI ${id}: oznaka vklopa ID ${recId} (skupaj ${S.marks.length})`);
  return true;
}
function segKeyOf(id, recId){
  let k = 0;
  for(const m of segState(id).marks){ if(m.id <= recId) k = m.id; else break; }
  return k;
}
function segLiveId(id){ return (LAST_REC_ID[id] !== undefined) ? LAST_REC_ID[id] : segState(id).maxId; }
function segLiveOff(id){
  if(CLOCK_OFF[id] !== undefined) return CLOCK_OFF[id];
  const so = SESS_OFF[id]; if(so && so.n > 0) return so.off;
  return segState(id).diskOff;
}
function segNoteData(id, recId, tm){
  const S = segState(id);
  if(recId > S.maxId) S.maxId = recId;
  const k = segKeyOf(id, recId);
  const cur = S.segMax.get(k);
  if(cur === undefined || tm > cur){
    S.segMax.set(k, tm);
    if(k !== segKeyOf(id, segLiveId(id))) segInvalidate(id);   // zivi segment ne vpliva na starejse
  }
}
function segOff(id, k){
  const S = segState(id);
  if(S.cache.has(k)) return S.cache.get(k);
  let off = null;
  const liveK = segKeyOf(id, segLiveId(id));
  if(k === liveK){ const o = segLiveOff(id); off = (o === undefined) ? null : o; }
  else if(k < liveK){
    const next = S.marks.find(m=>m.id > k);   // oznaka, ki zacne naslednji zagon
    const mx = S.segMax.get(k);
    if(next && mx !== undefined){
      const nOff = segOff(id, next.id);
      if(nOff !== null) off = nOff - SEG_GAP_MS - mx;
    }
  }
  S.cache.set(k, off);
  return off;
}
function recTime(id, recId, tm){
  const off = segOff(id, segKeyOf(id, recId));
  return (off === null) ? null : tm + off;
}
// ponovni izracun casa ze prikazanih zapisov, ko se tabela zagonov spremeni
function retimeBuf(id){
  const buf = OSCBUF[id]; if(!buf || !buf.length) return 0;
  let changed = 0;
  for(const p of buf){
    if(p.tm === undefined || !p.recId) continue;
    const t = recTime(id, p.recId, p.tm);
    if(t !== null && Math.abs(t - p.t) > 1){ p.t = t; changed++; }
  }
  if(changed) buf.sort((a,b)=>a.t-b.t);
  return changed;
}
function rebuildResets(id){
  const S = segState(id);
  if(!S.marks.length) return;
  const ts = [];
  for(const m of S.marks){ const t = recTime(id, m.id, m.tm); if(t !== null) ts.push(t); }
  RESETS[id] = ts.slice(-50);
  saveResets(id);
}
setInterval(()=>{
  Object.keys(BOOTSEG).forEach(id=>{
    const S = segState(id);
    const lo = segLiveOff(id);
    if(lo !== undefined && (S.lastLiveOff === undefined || Math.abs(lo - S.lastLiveOff) > 1000)){
      S.lastLiveOff = lo; segInvalidate(id);
    }
    if(!S.dirty) return;
    S.dirty = false;
    const n = retimeBuf(id);
    rebuildResets(id);
    if(n){
      logDebug(`ZAGONI ${id}: preracunan cas ${n} zapisov (${S.marks.length} oznak vklopa)`);
      const cs = currentSite();
      if(currentTab === 'osciloskop' && cs && cs.id === id) renderOscFull();
    }
  });
}, 1000);
let GAPMUTE = {};

/* ============================================================
   V93: DOLO?ANJE RESETA IZ VRZELI V BUFFERJU
   ------------------------------------------------------------
   ?e je med dvema zaporednima zapisoma v bufferju ve? kot
   RESET_GAP_MS, to pomeni reset modula / izpad napajanja.
   Takrat nari?emo reset ?rto in prekinemo ?rto grafa.
   Vrzel je dolo?ena v milisekundah.
   ============================================================ */
const RESET_GAP_MS = 120000;   // 120 s = reset

function getResetPoints(siteId){
  const pts = new Set(RESETS[siteId] || []);
  const buf = (SNAPSHOT ? SNAPSHOT.data : OSCBUF[siteId]) || [];
  for(let i=1;i<buf.length;i++){
    if(buf[i].t - buf[i-1].t > RESET_GAP_MS) pts.add(buf[i].t);
  }
  return [...pts].sort((a,b)=>a-b);
}

function noteReset(id, t){
  if(!RESETS[id]) RESETS[id] = [];
  RESETS[id].push(t);
  if(RESETS[id].length > 50) RESETS[id].shift();
  saveResets(id);
  logDebug(`SEJA ${id}: reset naprave ob ${new Date(t).toLocaleTimeString()}`);
}
async function saveResets(id){
  const m = await metaGet(id);
  if(!m) return;
  m.resets = RESETS[id].slice();
  await metaPut(m);
}
async function loadResets(id){
  const m = await metaGet(id);
  if(m && Array.isArray(m.resets)) RESETS[id] = m.resets.slice();
}

const COUNT_MISSING_MAX = 5000;
function countMissing(id, from, to){
  const span = to - from + 1;
  if(span > COUNT_MISSING_MAX) return span;
  const S = seenSet(id);
  let n = 0;
  for(let r = from; r <= to; r++) if(!S.has(rk(id, r))) n++;
  return n;
}

const GAP_TTL = 30000;
let GAP_REQUESTED = {};
function markRequested(id, from, to){
  if(!GAP_REQUESTED[id]) GAP_REQUESTED[id] = new Map();
  GAP_REQUESTED[id].set((BOOT_ID[id]||'?')+'|'+from+'-'+to, Date.now());
}
function alreadyRequested(id, from, to){
  const M = GAP_REQUESTED[id];
  if(!M) return false;
  const key = (BOOT_ID[id]||'?')+'|'+from+'-'+to;
  const t = M.get(key);
  if(t === undefined) return false;
  if(Date.now() - t > GAP_TTL){ M.delete(from+'-'+to); return false; }
  return true;
}
function wasRequested(id, recId){
  const M = GAP_REQUESTED[id];
  if(!M) return false;
  const cur = (BOOT_ID[id]||'?') + '|';
  for(const key of M.keys()){
    if(!key.startsWith(cur)) continue;
    const [a,b] = key.slice(cur.length).split('-').map(Number);
    if(recId >= a && recId <= b) return true;
  }
  return false;
}

let DUP_COUNT = {}, DUP_LOG = {};
function pushOscSample(id, sample){
  if(!OSCBUF[id]) OSCBUF[id] = [];
  const buf = OSCBUF[id];
  if(sample.recId){
    const key = rk(id, sample.recId, sample.boot);
    const S = seenSet(id);
    if(S.has(key)){
      DUP_COUNT[id] = (DUP_COUNT[id]||0) + 1;
      if(!DUP_LOG[id] || Date.now()-DUP_LOG[id] > 30000){
        DUP_LOG[id] = Date.now();
        logDebug(`scope ${id}: ${DUP_COUNT[id]} podvojenih zapisov zavrnjenih`);
        DUP_COUNT[id] = 0;
      }
      return;
    }
    S.add(key);
  }
  if(buf.length === 0 || sample.t >= buf[buf.length-1].t){
    buf.push(sample);
  } else {
    let lo = 0, hi = buf.length;
    while(lo < hi){ const mid = (lo+hi)>>1; if(buf[mid].t <= sample.t) lo = mid+1; else hi = mid; }
    buf.splice(lo, 0, sample);
  }
  if(buf.length > bufCap(id)) buf.shift();
}

let mqttClients = {};
function brokerWsUrl(broker){
  const parts = String(broker).split('|');
  const host = parts[0].split(':')[0].trim();
  const wsPort = (parts[1] && parseInt(parts[1])) || 8084;
  const scheme = (parts[2] || '').trim().toLowerCase() === 'ws' ? 'ws' : 'wss';
  return `${scheme}://${host}:${wsPort}/mqtt`;
}
const CLIENT_STATUS_TOPIC = 'nadzor/status';
function getClient(broker){
  if(mqttClients[broker]) return mqttClients[broker];
  if(typeof mqtt === 'undefined'){ logDebug('MQTT: mqtt.js knjižnica ni na voljo', true); return null; }
  try{
    const url = brokerWsUrl(broker);
    logDebug(`MQTT connect() poskus -> ${url}`);
    const opts = { reconnectPeriod: 4000, keepalive: 60 };
    opts.will = { topic: CLIENT_STATUS_TOPIC, payload:'offline', qos:1, retain:true };
    const client = mqtt.connect(url, opts);
    client.on('error', (err)=>{ logDebug(`MQTT ERROR (${broker}): ${err&&err.message}`, true); renderConnPill(); });
    client.on('reconnect', ()=>{ xferG(broker).reconnects++; logDebug(`MQTT reconnect poskus (${broker})`); });
    client.on('connect', ()=>{ xferG(broker).connects++; xferG(broker).connectedAt = Date.now(); logDebug(`MQTT CONNECTED (${broker})`); renderConnPill(); resubscribeAll(broker); publishClientPresence(broker, true); });
    client.on('close', ()=>{ logDebug(`MQTT CLOSED (${broker})`, true); renderConnPill(); });
    client.on('offline', ()=>{ logDebug(`MQTT OFFLINE (${broker})`, true); renderConnPill(); });
    client.on('message', (topic, payload)=>{ const g = xferG(broker); g.lastMsgAt = Date.now(); g.bytes += payload.length; g.msgs++; logDebug(`MQTT <- ${topic} (${payload.length}B)`); onMqttMsg(topic, payload); });
    mqttClients[broker] = client;
    return client;
  }catch(e){ logDebug(`MQTT connect() izjema: ${e.message}`, true); return null; }
}
function publishClientPresence(broker, online){
  const c = mqttClients[broker];
  if(!c || !c.connected) return;
  c.publish(CLIENT_STATUS_TOPIC, online?'online':'offline', {qos:1, retain:true});
  CFG.sites.forEach(s=>{
    if(s.mqtt!==broker) return;
    c.publish(`naprava/${s.id}/client/status`, online?'online':'offline', {qos:1, retain:true});
  });
  if(publishClientPresence._last !== online){
    publishClientPresence._last = online;
    logDebug(`KLIENT -> ${CLIENT_STATUS_TOPIC} = ${online?'ONLINE':'OFFLINE'}`, !online);
  }
}
setInterval(()=>{ Object.keys(mqttClients).forEach(b=>publishClientPresence(b, true)); }, 5000);
function resubscribeAll(broker){
  CFG.sites.forEach(s=>{
    if(s.mqtt===broker){
      const c = mqttClients[broker];
      c.subscribe(`naprava/${s.id}/status`); logDebug(`SUB naprava/${s.id}/status`);
      if(s.opMode === 'real'){
        const diskLoad = loadFromDisk(s.id);
        const diskTimeout = new Promise(res=>setTimeout(res, 2000));
        Promise.race([diskLoad, diskTimeout]).finally(()=>{
          c.subscribe(`naprava/${s.id}/scope/data`);
          logDebug(`SUB naprava/${s.id}/scope/data (po branju z diska)`);
        });
      } else {
        c.subscribe(`naprava/${s.id}/scope/data`); logDebug(`SUB naprava/${s.id}/scope/data`);
      }
      c.subscribe(`naprava/${s.id}/hist/info`);
      c.subscribe(`naprava/${s.id}/scope/ping`);
      c.subscribe(`naprava/${s.id}/config/stanje`);
      c.subscribe(`naprava/${s.id}/stanje/izhodi`);
      ensureSimBrokerListening(s);
    }
  });
}
function ensureLive(id){
  if(!LIVE[id]) LIVE[id] = { online:false, stale:true, lastSeen:0, rele:[false,false,false,false], binarno:0, binMode:false, servo:[0,0], analog:{},
                             binOn:false, binPeriod:1, offlineGuard:false, bootRestore:false, cfgFromDevice:false };
  return LIVE[id];
}

let CLOCK_OFF = {}, CLOCK_MIN = {}, CLOCK_N = {}, CLOCK_LAST = {};
function deviceTime(devId, tm, isHist){
  if(isHist) return tm + (CLOCK_OFF[devId] !== undefined ? CLOCK_OFF[devId] : (Date.now() - tm));
  const diff = Date.now() - tm;
  CLOCK_LAST[devId] = diff;
  if(CLOCK_OFF[devId] === undefined){
    CLOCK_OFF[devId] = diff; CLOCK_MIN[devId] = diff; CLOCK_N[devId] = 0;
  } else {
    if(CLOCK_MIN[devId] === undefined || diff < CLOCK_MIN[devId]) CLOCK_MIN[devId] = diff;
    if(diff < CLOCK_OFF[devId]) CLOCK_OFF[devId] = diff;
    if(++CLOCK_N[devId] >= 200){
      if(CLOCK_MIN[devId] > CLOCK_OFF[devId]) CLOCK_OFF[devId] += 1;
      CLOCK_MIN[devId] = diff; CLOCK_N[devId] = 0;
    }
  }
  return tm + CLOCK_OFF[devId];
}

let LAST_REC_ID = {};

           + `adc=${p.analog.a1.toFixed(1)}/${p.analog.a2.toFixed(1)}/${p.analog.a3.toFixed(1)}/${p.analog.a4.toFixed(1)}`);
