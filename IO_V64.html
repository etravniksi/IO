function ensureSim(id){
  if(!SIMS[id]) SIMS[id] = {
    rele:[
      {mode:'static', state:false, ton:1, toff:1, phaseOn:true, last:0},
      {mode:'static', state:false, ton:1, toff:1, phaseOn:true, last:0},
      {mode:'static', state:false, ton:1, toff:1, phaseOn:true, last:0},
      {mode:'static', state:false, ton:1, toff:1, phaseOn:true, last:0}
    ],
    binMode:false, binVal:0,
    servo:[
      {mode:'static', pos:0, posA:0, posB:255, ton:1, toff:1, rampMs:0, phase:'RAMP_A', phaseStart:0, rampFrom:0, target:0, last:0},
      {mode:'static', pos:0, posA:0, posB:255, ton:1, toff:1, rampMs:0, phase:'RAMP_A', phaseStart:0, rampFrom:0, target:0, last:0}
    ],
    analog:{a1:0,a2:0,a3:0,a4:0},
    binPeriod:1, binLast:0
  };
  if(SIMS[id].binPeriod===undefined) SIMS[id].binPeriod = 1; // migracija starih zapisov
  SIMS[id].servo.forEach(sv=>{ // migracija na 4-fazni cikel z rampo
    if(sv.rampMs===undefined) sv.rampMs = 0;
    if(sv.phase===undefined) sv.phase = 'RAMP_A';
    if(sv.phaseStart===undefined) sv.phaseStart = 0;
    if(sv.rampFrom===undefined) sv.rampFrom = sv.pos||0;
    if(sv.target===undefined) sv.target = sv.pos||0;
  });
  if(SIMS[id].binLast===undefined) SIMS[id].binLast = 0;
  return SIMS[id];
}


/* ============================================================
   V57: LOKALNA SHRAMBA ZAPISOV (IndexedDB)
   ------------------------------------------------------------
   Prej se je ob vsakem odprtju aplikacije zahtevalo zadnjih 500 zapisov in
   nato se postopno dopolnjevanje nazaj - vse prek javnega brokerja, cetudi
   so bili isti zapisi ze veckrat preneseni. Zdaj se prejeti zapisi shranijo
   v telefon; ob naslednjem odprtju se graf napolni z diska, od naprave pa se
   zahteva SAMO tisto, cesar se nimamo.

   ZAKAJ IndexedDB in ne localStorage:
     localStorage ima ~5 MB, je sinhron in hrani samo nize. 30000 zapisov v
     obliki JSON bi bilo ~3 MB in bi ob branju blokiralo izris. IndexedDB je
     asinhron, ima bistveno vecjo kvoto in zna hraniti binarne podatke.

   ZAKAJ BINARNO in ne objekti:
     shranjuje se SUROVIH 19 B na zapis, tako kot pride z naprave. Kos 500
     zapisov je 9.5 kB namesto ~100 kB v JSON. Razpakiranje v objekte se
     zgodi sele ob nalaganju v OSCBUF.

   SEJE (moznost C):
     Ob ponovnem zagonu naprave gre recId nazaj na 1 in millis() na 0, zato
     bi se novi zapisi zlili s starimi. Naprava zato javlja bootId; ob
     spremembi se zacne nova seja. Hranita se TEKOCA in ENA PREJSNJA seja -
     nepricakovan reset (izpad, programiranje, watchdog) tako ne unici
     podatkov, hkrati pa se izognemo seznamu sej in izbirnikom.
   ============================================================ */
// Y4 (V60): DB_VER 1 -> 2. Po ponovnem flashanju je zgodovina na napravi
// prazna in recId se zacne pri 1, zato stari zapisi v telefonu ne pripadajo
// nobeni obstojeci seji - pretvorba nima smisla. Brskalnik ob dvigu razlicice
// stare shrambe zavrze in ustvari nove.
const DB_NAME = 'io_scope', DB_VER = 2;
const CHUNK = 500;                  // zapisov na kos
const REC = 19;                     // bajtov na zapis
const DISK_MAX_RECORDS = 30000;     // na sejo in napravo (~600 kB)
let _db = null, _dbFailed = false, _quotaWarned = false;

function dbOpen(){
  if(_db) return Promise.resolve(_db);
  if(_dbFailed) return Promise.resolve(null);
  return new Promise(res=>{
    let rq;
    try{ rq = indexedDB.open(DB_NAME, DB_VER); }
    catch(e){ _dbFailed = true; logDebug(`SHRAMBA: ni na voljo (${e.message})`, true); return res(null); }
    rq.onupgradeneeded = ()=>{
      const db = rq.result;
      // Y4: cist zacetek - stare shrambe zavrzemo
      if(db.objectStoreNames.contains('chunks')) db.deleteObjectStore('chunks');
      if(db.objectStoreNames.contains('meta'))   db.deleteObjectStore('meta');
      if(!db.objectStoreNames.contains('chunks')){
        const st = db.createObjectStore('chunks', { keyPath:'k' });
        st.createIndex('dev', 'dev');
        st.createIndex('devboot', ['dev','boot']);
      }
      if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath:'dev' });
    };
    rq.onsuccess = ()=>{ _db = rq.result; res(_db); };
    rq.onerror   = ()=>{ _dbFailed = true; logDebug('SHRAMBA: odpiranje ni uspelo', true); res(null); };
    // zasebno okno / zavrnjeno dovoljenje
    rq.onblocked = ()=>{ _dbFailed = true; res(null); };
  });
}
function tx(store, mode){
  return dbOpen().then(db=>{
    if(!db) return null;
    try{ return db.transaction(store, mode).objectStore(store); }catch(e){ return null; }
  });
}
function req2p(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }

// D4: ob zavrnjenem zapisu (polna kvota, zasebno okno) aplikacija deluje
// naprej kot doslej, samo brez shranjevanja - in to JAVI, enkrat.
function storeFail(e){
  const name = e && e.name || '?';
  // P4 (V58): zaprta transakcija NI polna kvota. Prej je oboje javljalo
  // "shramba je polna", kar je pri prehodni napaki zavajalo.
  const isQuota = (name === 'QuotaExceededError');
  if(!isQuota){
    logDebug(`SHRAMBA: zapis ni uspel (${name}) - poskusim znova ob naslednjem paketu`, true);
    return;   // prehodna napaka: vrsta ostane, poskusimo pozneje
  }
  if(_quotaWarned) return;
  _quotaWarned = true;
  logDebug(`SHRAMBA: kvota je polna - delam naprej brez shranjevanja`, true);
  showToast(T('storeFull'));
}

/* ---------- cakalna vrsta (A4) ----------
   Zapisi se zbirajo v pomnilniku in gredo na disk PAKETNO, nikoli po enem
   naenkrat - sicer bi vsak prispeli blok sprozil svojo transakcijo in izris
   bi se zatikal. */
let WQ = {};              // dev -> { boot, off, recs:Map(recId -> Uint8Array(19)) }
let _flushTimer = null;
const FLUSH_MS = 2000;

/* ODMIK URE — en sam na SEJO (V58)
   ------------------------------------------------------------
   Naprava poslje samo millis() od svojega zagona; absolutni cas je
   millis + odmik. Odmik niha (omrezni zamik + razlika ur) in se v praksi
   premakne za nekaj sto ms v nekaj minutah.

   V57 se je hranil ODMIK NA KOS in se ob vsakem dodajanju prepisal z
   najnovejsim. To je povzrocalo SKOK na stiku med kosoma: zadnji zapis
   kosa A in prvi zapis kosa B sta bila preracunana z razlicnima odmikoma,
   kar je videti kot navidezna vrzel ali prekrivanje.

   Odmik NA ZAPIS bi bil se slabsi: razmiki ZNOTRAJ kosa bi se pokvarili,
   ceprav so v surovih millis vrednostih popolnoma tocni.

   Zdaj: en odmik na sejo, v `meta`. Vsi zapisi ene seje izvirajo iz iste
   neprekinjene naprave, torej iz ENE monotone casovne osi - z enim odmikom
   so vsi razmiki v celotni seji tocni in skokov na stikih ni.

   Odmik ocenimo iz prvih OFF_SAMPLES zapisov in vzamemo NAJMANJSEGA:
   najmanjsi zamik pomeni najcistejsi prenos, vecje vrednosti nosijo
   omrezno cakanje. Absolutna postavitev na uro telefona je lahko za nekaj
   sto ms mimo - za osciloskop nepomembno, ker se bere razmike. */
const OFF_SAMPLES = 10;
let SESS_OFF = {};      // dev -> { boot, off, n }

function sessionOffset(dev, boot, off){
  let e = SESS_OFF[dev];
  if(!e || e.boot !== boot){ e = SESS_OFF[dev] = { boot, off, n:1 }; return e.off; }
  if(e.n < OFF_SAMPLES){
    e.n++;
    if(off < e.off) e.off = off;    // najmanjsi = najcistejsi prenos
  }
  return e.off;
}

function storePush(dev, boot, recId, bytes, off){
  if(_dbFailed || !boot) return;
  if(!WQ[dev]) WQ[dev] = { boot, recs:new Map() };
  const q = WQ[dev];
  if(q.boot !== boot){ q.boot = boot; q.recs.clear(); }   // nova seja
  sessionOffset(dev, boot, off);
  q.recs.set(recId, bytes);
  if(q.recs.size >= CHUNK) flushStore();
  else if(!_flushTimer) _flushTimer = setTimeout(flushStore, FLUSH_MS);
}

async function flushStore(){
  if(_flushTimer){ clearTimeout(_flushTimer); _flushTimer = null; }
  const devs = Object.keys(WQ).filter(d=>WQ[d].recs.size);
  if(!devs.length) return;
  const done = [];
  for(const dev of devs){
    const q = WQ[dev]; const boot = q.boot;
    // razporedi po kosih
    const byBlk = new Map();
    for(const [rid, b] of q.recs){
      const blk = Math.floor((rid-1)/CHUNK);
      if(!byBlk.has(blk)) byBlk.set(blk, []);
      byBlk.get(blk).push([rid, b]);
    }
    let allOk = true;
    for(const [blk, items] of byBlk){
      // P4 (V58): LOCENA transakcija na kos. Prej je ena transakcija tekla
      // cez vec `await`; IndexedDB tako transakcijo zapre sama, ce se zanka
      // zavlece, in zapis odpove s TransactionInactiveError - kar je prejsnja
      // koda prikazala kot "shramba je polna".
      const st = await tx('chunks','readwrite');
      if(!st){ allOk = false; break; }
      try{
        const key = `${dev}|${boot}|${blk}`;
        let c = await req2p(st.get(key));
        if(!c) c = { k:key, dev, boot, blk, buf:new Uint8Array(CHUNK*REC),
                     present:new Uint8Array(CHUNK), cnt:0 };
        for(const [rid, b] of items){
          const i = (rid-1) % CHUNK;
          if(!c.present[i]) c.cnt++;
          c.present[i] = 1;
          c.buf.set(b, i*REC);
        }
        // Y4: cas zadnjega zapisa v kosu - podlaga za obrezovanje po starosti
        c.lastTm = Date.now();
        await req2p(st.put(c));
        // P5 (V58): iz vrste odstranimo SELE PO potrjenem zapisu. Prej je
        // `q.recs.clear()` tekel pred zapisom in je ob prehodni napaki
        // zapise izgubil dvakrat - iz vrste in iz baze.
        for(const [rid] of items) q.recs.delete(rid);
      }catch(e){
        storeFail(e); allOk = false; break;
      }
    }
    if(allOk) done.push(dev);
  }
  // C (V58): odmik seje se hrani v `meta`, ne v kosih
  for(const dev of done){
    const e = SESS_OFF[dev];
    if(!e) continue;
    const m = await metaGet(dev);
    if(m && m.boot === e.boot && m.off !== e.off){ m.off = e.off; await metaPut(m); }
  }
// D1: krozno brisanje najstarejsih kosov nad mejo
  for(const dev of done) trimStore(dev).catch(()=>{});
}

// D1: na sejo in napravo hranimo najvec DISK_MAX_RECORDS zapisov.
async function trimStore(dev){
  const st = await tx('chunks','readwrite'); if(!st) return;
  const all = await req2p(st.index('dev').getAll(dev));
  // Y4 (V60): obrezovanje po STAROSTI, ne po sejah. Kose uredimo po casu
  // zadnjega zapisa in odrezemo tiste, ki presegajo skupno mejo.
  const withT = all.map(c=>({ c, t: c.lastTm || 0 }));
  withT.sort((a,b)=>b.t - a.t);     // najnovejsi najprej
  let keep = 0;
  for(const e of withT){
    keep += e.c.cnt;
    if(keep > DISK_MAX_RECORDS) st.delete(e.c.k);
  }
}

/* ---------- seje (C2) ---------- */
async function metaGet(dev){
  const st = await tx('meta','readonly'); if(!st) return null;
  try{ return await req2p(st.get(dev)) || null; }catch(e){ return null; }
}
async function metaPut(m){
  const st = await tx('meta','readwrite'); if(!st) return;
  try{ await req2p(st.put(m)); }catch(e){ storeFail(e); }
}

// C2: ob novi seji obdrzimo TEKOCO in ENO PREJSNJO; vse starejse pobrisemo.
async function storeSetBoot(dev, boot){
  if(!boot || _dbFailed) return false;
  const m = await metaGet(dev) || { dev, boot:0, prevBoot:0, lastId:0 };
  if(m.boot === boot) return false;
  const isRestart = !!m.boot;
  // Y4 (V60): seje se NE brisejo vec. Prej sta se hranili tekoca in ena
  // prejsnja, starejse pa so sle takoj - s tem je uporabnik ob drugem resetu
  // izgubil material prvega. Zdaj je zaloga neprekinjena, obrezuje pa se po
  // STAROSTI (trimStore), tako da je meja neodvisna od stevila resetov.
  await metaPut({ dev, boot, prevBoot: m.boot||0, lastId:0,
                  off: undefined, resets: m.resets || [], updated:Date.now() });
  delete SESS_OFF[dev];   // C (V58): nova seja = nov odmik
  if(isRestart) logDebug(`SHRAMBA ${dev}: nova seja ${boot} (prejsnja ${m.boot} ostaja)`);
  return isRestart;
}

/* ---------- nalaganje (B1) ----------
   Naloze najvec `want` NAJNOVEJSIH zapisov tekoce seje. Odgovor na vprasanje
   "koliko naloziti": toliko, kolikor jih prikaz res potrebuje - glej
   diskWantCount(). */
async function storeLoad(dev, want){
  if(_dbFailed) return null;
  const m = await metaGet(dev);
  if(!m || !m.boot) return null;
  const st = await tx('chunks','readonly'); if(!st) return null;
  let all;
  try{ all = await req2p(st.index('devboot').getAll([dev, m.boot])); }catch(e){ return null; }
  if(!all || !all.length) return null;
  const sessOff = (m.off !== undefined) ? m.off
                : (all[0].off !== undefined ? all[0].off : 0);   // zdruzljivost z V57
  all.sort((a,b)=>a.blk-b.blk);
  const out = []; let maxId = 0;
  // od zadaj naprej, dokler ne zberemo dovolj
  for(let i=all.length-1; i>=0 && out.length < want; i--){
    const c = all[i];
    const dv = new DataView(c.buf.buffer, c.buf.byteOffset, c.buf.byteLength);
    for(let j=CHUNK-1; j>=0 && out.length < want; j--){
      if(!c.present[j]) continue;
      const o = j*REC;
      const recId = dv.getUint32(o, true), tm = dv.getUint32(o+4, true);
      const rb = dv.getUint8(o+8);
      // AP (V63): zapis o vklopu tudi z DISKA ne sme v OSCBUF - sicer bi se
      // po ponovnem odprtju izrisal kot vsi stirje releji hkrati.
      if(rb === 0xFF){
        const bt = tm + sessOff;
        if(!RESETS[dev]) RESETS[dev] = [];
        if(!RESETS[dev].some(x=>Math.abs(x - bt) < 2000)) RESETS[dev].push(bt);
        continue;
      }
      out.push({
        recId, boot: m.boot,      // Y2 (V60)
        t: tm + sessOff,          // C (V58): en odmik za celo sejo
        rele:[!!(rb&1),!!(rb&2),!!(rb&4),!!(rb&8)],
        servo:[dv.getUint8(o+9), dv.getUint8(o+10)],
        analog:{ a1:dv.getUint16(o+11,true)/10, a2:dv.getUint16(o+13,true)/10,
                 a3:dv.getUint16(o+15,true)/10, a4:dv.getUint16(o+17,true)/10 }
      });
      if(recId > maxId) maxId = recId;
    }
  }
  out.reverse();
  return { boot:m.boot, samples:out, maxId };
}

async function storeUsage(dev){
  const st = await tx('chunks','readonly'); if(!st) return null;
  try{
    const all = await req2p(st.index('dev').getAll(dev));
    let recs = 0, bytes = 0;
    for(const c of all){ recs += c.cnt; bytes += c.buf.byteLength + c.present.byteLength; }
    return { chunks: all.length, recs, bytes, boots:[...new Set(all.map(c=>c.boot))].length };
  }catch(e){ return null; }
}

// D3 / E1: brisanje diska je LOCENO dejanje - "Pocisti" pri grafu brise
// samo prikazani buffer v aplikaciji, zgodovina na napravi in na disku ostane.
async function storeClear(dev){
  const st = await tx('chunks','readwrite'); if(!st) return;
  try{
    const all = await req2p(st.index('dev').getAll(dev));
    for(const c of all) st.delete(c.k);
  }catch(e){}
  const ms = await tx('meta','readwrite');
  if(ms){ try{ await req2p(ms.delete(dev)); }catch(e){} }
  delete WQ[dev];
}

// E2: sprememba ID naprave v nastavitvah mora prenesti tudi shrambo
async function storeRename(oldId, newId){
  if(oldId === newId || _dbFailed) return;
  const st = await tx('chunks','readwrite'); if(!st) return;
  try{
    const all = await req2p(st.index('dev').getAll(oldId));
    for(const c of all){
      st.delete(c.k);
      c.dev = newId; c.k = `${newId}|${c.boot}|${c.blk}`;
      st.put(c);
    }
  }catch(e){}
  const m = await metaGet(oldId);
  if(m){ m.dev = newId; await metaPut(m);
         const ms = await tx('meta','readwrite');
         if(ms){ try{ await req2p(ms.delete(oldId)); }catch(e){} } }
}

// osciloskop - krozni buffer vzorcev na napravo (v pomnilniku, ne persistira)
let OSCBUF = {}; // id -> [{t, analog:{}}]  (DD2: samo ADC vzorci)
// Pri 20s oknu in gostem prometu (ADC + dogodki + interpolacija) je 3000
// vzorcev lahko premalo - starejsi del okna bi se izrinil. 8000 pokrije
// najsirse okno z rezervo.
// D4 (V55): znizano s 30000 na 3000 zapisov NA NAPRAVO. 30000 objektov z
// vgnezdenimi polji je na telefonu pomenilo vec MB na napravo (in veckratnik
// tega pri vec napravah), kar je povzrocalo zatikanje izrisa in odpiranje
// zavihkov. Najsirse okno osciloskopa je 30 s, zato zivi prikaz tega ne
// obcuti; omeji pa globino, ki jo postopno dopolnjevanje naloze nazaj -
// pri 100 ms bazi ~5 min, pri 1 s bazi ~50 min zgodovine. Za globlji pregled
// sluzi izvoz/posnetek, ne zivi buffer.
// P6 (V58): meja je odslej NA NAPRAVO. Prej je bila ena sama globalna
// vrednost: izbira sirine 30k na eni napravi je dvignila mejo vsem, zozanje
// okna pa je takoj obrezalo bufferje vseh naprav - ob naslednji razsiritvi
// se je isto branje z diska ponovilo.
const OSC_BASE_CAP = 3000;   // EE4 / D4
let BUF_CAP = {};            // dev -> zgornja meja zapisov v RAM
function bufCap(id){ return BUF_CAP[id] || OSC_BASE_CAP; }
// D2 (V57): RAM ostane 3000 kot IZHODISCE, a se razsiri, kadar izbrana
// sirina okna zahteva vec. Disk je globlji od RAM; ce prikaz res potrebuje
// 30000 zapisov, jih toliko tudi nalozimo - a sele takrat, ne vnaprej.
function diskWantCount(){
  const need = Math.ceil((typeof OSC_SAMPLES === 'number' ? OSC_SAMPLES : 3000) * 1.2);
  return Math.max(3000, Math.min(DISK_MAX_RECORDS, need));
}
function syncBufCap(id){
  const cap = diskWantCount();
  if(cap !== bufCap(id)){
    BUF_CAP[id] = cap;
    logDebug(`BUFFER ${id}: zgornja meja ${cap} zapisov (sirina okna ${OSC_SAMPLES})`);
  }
  return cap;
}
// V1: vzorci prihajajo iz dveh virov z RAZLICNIM izracunom casovnega ziga -
// ADC nazaj datiran (Date.now() - n*tbMs), interpolacija s trenutnim casom.
// Ce jih le pripenjamo, buffer ni urejen po casu in krivulja dobi zareze.
// Zato vstavljamo na pravo mesto (obicajno na konec - hitra pot).
// EE7: prvi indeks z vzorcem/dogodkom, katerega t >= tMin. Buffer je urejen
// po casu, zato binarno iskanje. Prej je vsak izris preletel CELOTEN buffer
// (filter/forEach) - pri 30000 vnosih in 20 slikah/s je to 1.8M primerjav/s
// za tri grafe, kar telefon opazno upocasni.
function lowerBound(arr, tMin){
  let lo = 0, hi = arr.length;
  while(lo < hi){ const m = (lo+hi)>>1; if(arr[m].t < tMin) lo = m+1; else hi = m; }
  return lo;
}

// A3 (V56): evidenca ID-jev, ki jih ZE imamo. Brez nje je aplikacija znova
// in znova zahtevala iste zapise: dopolnjeni (starejsi) zapis je znizal
// LAST_REC_ID, naslednji zivi zapis je zato izgledal kot skok naprej, kar
// je sprozilo novo zahtevo - in tako v krogu, brez konca.
let BOOT_ID = {};     // C1 (V57): oznaka seje po napravi
// E3: na disk gredo SAMO podatki resnicnih naprav, ne simulacij
function SITE_IS_REAL(id){ const x = CFG.sites.find(y=>y.id===id); return !!x && x.opMode === 'real'; }
let LOADED = {};      // B1: iz katere naprave smo ze nalozili disk

/* C1/C3 (V57): naprava je javila oznako seje.
   Ce je nova, zacnemo novo sejo na disku (tekoca + ena prejsnja - moznost C).
   Ce naprava oznake NE javlja (starejsa firmware), uporabimo nadomestno
   oznako 'legacy': zapisi se se vedno shranjujejo, le ponovnega zagona ne
   zaznamo zanesljivo - takrat pomaga se padec recId (glej checkLegacyBoot). */
async function onDeviceBoot(id, boot){
  if(!boot || boot === '0') return;
  if(BOOT_ID[id] === boot) return;
  const prev = BOOT_ID[id];
  BOOT_ID[id] = boot;
  logDebug(`SEJA ${id}: oznaka ${boot}${prev ? ` (prej ${prev})` : ''}`);
  await storeSetBoot(id, boot);
  if(prev){
    // ============================================================
    // Y1 (V60): PRIKAZ SE OB RESETU NE BRISE VEC.
    // Prej se je zivi graf zacel na cisto - uporabnik je ob vsakem resetu
    // naprave izgubil sliko dogajanja TIK PRED resetom, kar je najbolj
    // zanimiv del. Zdaj buffer ostane in se preprosto nadaljuje: cas tece
    // naprej, zapisi nove seje se vrinejo za stare.
    //
    // Y14 (V60): ponastaviti pa je treba vse, kar se nanasa na obseg recId,
    // ker se ta po resetu vrne na 1:
    //   LAST_REC_ID je MONOTONI MAKSIMUM (A2 iz V56). Ce bi ostal na 22800,
    //   bi bil VSAK nov zapis razglasen za zgodovinskega, prikaz bi se
    //   ustavil in dnevnik bi se polnil z "nepricakovan starejsi ID".
    //   histLoadedFrom, HIST_INFO in BACKFILL se prav tako sklicujejo na
    //   obseg ID-jev, ki po resetu ne obstaja vec.
    // ============================================================
    delete LAST_REC_ID[id];
    delete histLoadedFrom[id];
    delete HIST_INFO[id];
    if(BACKFILL[id]){ try{ clearTimeout(BACKFILL[id].timer); }catch(e){} delete BACKFILL[id]; }
    delete CLOCK_OFF[id]; delete CLOCK_MIN[id]; delete CLOCK_N[id];
    delete LOADED[id];
    // Y6: zabelezi trenutek reseta, da ga lahko oznacimo v grafu
    noteReset(id, Date.now());
    renderOscFull();
  }
  loadFromDisk(id);
}

/* C3: naprava brez oznake seje. Ponovni zagon prepoznamo po tem, da recId
   pade na zacetek IN da millis() pade - oboje hkrati se med normalnim
   delovanjem ne zgodi. */
let LAST_TM = {};   // P2 (V58): zadnji videni millis() naprave
function checkLegacyBoot(id, recId, tm){
  if(BOOT_ID[id] && BOOT_ID[id] !== 'legacy') return;   // naprava javlja oznako
  if(!BOOT_ID[id]){ BOOT_ID[id] = 'legacy'; LAST_TM[id] = tm; return; }
  // P2 (V58): prejsnja razlicica je primerjala `tm` (millis naprave, nekaj
  // sto tisoc) s CLOCK_LAST (ODMIK URE, ~1.789e12). Pogoj je bil zato VEDNO
  // izpolnjen in casovna preverba ni delala nicesar - ostal je samo padec
  // recId, kar pa velja za VSAK dopolnjen zapis iz zgodovine. Rezultat bi bil
  // en navidezen "ponovni zagon" ob prvem dopolnjevanju, ki bi izbrisal
  // OSCBUF in SEEN.
  if(wasRequested(id, recId)) return;   // to smo sami zahtevali - ni zagon
  const last = LAST_REC_ID[id], lastTm = LAST_TM[id];
  const restarted = last !== undefined && lastTm !== undefined
                 && recId < last - 100 && tm < lastTm - 1000;
  if(restarted){
    logDebug(`SEJA ${id}: zaznan ponovni zagon (brez oznake seje) - zacenjam novo sejo`, true);
    BOOT_ID[id] = 'legacy' + Date.now();
    storeSetBoot(id, BOOT_ID[id]);
    OSCBUF[id] = []; delete LAST_REC_ID[id]; delete SEEN[id]; delete GAP_REQUESTED[id];
  }
  if(lastTm === undefined || tm > lastTm) LAST_TM[id] = tm;
}

/* B1 (V57): napolni graf z DISKA, preden karkoli zahtevamo od naprave.
   B2: sele nato zahtevamo tisto, cesar nimamo - namesto vseh 500 zapisov,
   kot je delala prejsnja verzija ob vsakem odprtju. */
// AA3 (V61): funkcija je `async`, torej vedno vraca Promise - tudi ob
// predcasnem izhodu. Narocilo na scope/data se nanjo veze prek .finally().
async function loadFromDisk(id){
  const site = CFG.sites.find(x=>x.id===id);
  if(!site || site.opMode !== 'real') return;   // E3: simulacij ne shranjujemo
  if(LOADED[id]) return;
  LOADED[id] = true;
  await loadResets(id);   // Y6: oznake resetov prezivijo zaprtje aplikacije
  /* AD2 (V62): z diska nalozimo najvec 85 % zgornje meje. Prej smo nalozili
     natanko bufCap in buffer je bil poln ze pred prvim zivim zapisom - vsaka
     vrzel med diskom in sprotnim tokom je takoj naletela na varovalo.
     Rezerva 15 % pusti prostor za dopolnjevanje in za sprotni tok. */
  const want = Math.floor(syncBufCap(id) * 0.85);
  const r = await storeLoad(id, want);
  if(!r || !r.samples.length){
    logDebug(`SHRAMBA ${id}: na disku ni zapisov te seje`);
    return;
  }
  const buf = OSCBUF[id] || (OSCBUF[id] = []);
  const S = seenSet(id);
  let added = 0;
  for(const smp of r.samples){
    if(S.has(rk(id, smp.recId, smp.boot))) continue;   // Y2
    buf.push(smp); S.add(rk(id, smp.recId, smp.boot)); added++;
  }
  buf.sort((a,b)=>a.t-b.t);
  /* AA1 (V61): VAROVALO. Ce je kljub AA3 kaksen zivi zapis prehitel branje,
     je LAST_REC_ID ze visji od tega, kar je dal disk - vmesni zapisi pa
     manjkajo. Prej se je v tem primeru zgodilo NIC: pogoj `r.maxId >
     LAST_REC_ID` ni bil izpolnjen in luknja je ostala neopazena.
     Zdaj razliko izrecno zahtevamo. */
  if(LAST_REC_ID[id] !== undefined && LAST_REC_ID[id] > r.maxId + 1){
    const from = r.maxId + 1, to = LAST_REC_ID[id] - 1;
    const miss = countMissing(id, from, to);
    if(miss > 0){
      logDebug(`SHRAMBA ${id}: disk do ID ${r.maxId}, prvi zivi ${LAST_REC_ID[id]}`
             + ` - zahtevam ${from}..${to} (${miss} manjka)`, true);
      requestGapFill(id, from, to - from + 1);
    }
  }
  if(LAST_REC_ID[id] === undefined || r.maxId > LAST_REC_ID[id]) LAST_REC_ID[id] = r.maxId;
  // AA4: da je stanje ob vsaki prijavi razvidno tudi, ce se kaj ponovi
  logDebug(`SHRAMBA ${id}: nalozenih ${added} zapisov z diska (do ID ${r.maxId})`);
  renderOscFull();
}

/* D2 (V57): uporabnik je razsiril okno - iz diska dolozi, kar manjka.
   Odgovor na "koliko naloziti": toliko, kolikor prikaz res potrebuje. */
async function widenFromDisk(id){
  const site = CFG.sites.find(x=>x.id===id);
  if(!site || site.opMode !== 'real') return;
  const want = syncBufCap(id);
  const buf = OSCBUF[id] || [];
  if(buf.length >= want) return;
  const r = await storeLoad(id, want);
  if(!r || !r.samples.length) return;
  const S = seenSet(id);
  let added = 0;
  for(const smp of r.samples){
    if(S.has(rk(id, smp.recId, smp.boot))) continue;   // Y2
    buf.push(smp); S.add(rk(id, smp.recId, smp.boot)); added++;
  }
  if(added){
    OSCBUF[id] = buf.sort((a,b)=>a.t-b.t);
    logDebug(`SHRAMBA ${id}: dolozenih ${added} zapisov z diska za sirse okno`);
    renderOscFull();
  }
}

let SEEN = {};   // id naprave -> Set(recId)
/* ============================================================
   R1 (V60): MERJENJE DEJANSKE DOSTAVE
   ------------------------------------------------------------
   Doslej je bila izpisana hitrost izracunana iz `tbMs`, ki ga naprava SAMA
   zapise v glavo bloka - torej iz njenega povprecnega razmika med vzorci.
   Ce so se bloki izgubljali ali zamujali pri brokerju, se to v stevilki ni
   poznalo prav nic.

   Zdaj merimo, kaj DEJANSKO pride v telefon, v drsecem oknu 5 s:
     zapisov/s  - dostava
     blokov/s   - koliko sporocil MQTT pride
     zamik      - MEDIANA (ne povprecje: en zakasnjen blok sicer popaci vse)
     izguba %   - manjkajoci recId glede na prejete, znotraj TEKOCE seje
   ============================================================ */
const RATE_WIN_MS = 5000;
let RATE = {};   // dev -> { recs:[t,...], blocks:[t,...], lags:[ms,...], ids:Set, boot }

/* AC1/AD3: dostava se racuna SAMO iz rednih sprotnih blokov.
   Dogodkovni zapisi (naprava jih poslje ob vsakem preklopu izhoda) in
   zgodovinski (odgovor na zahtevo) so steti loceno - sicer bi izpis kazal
   vec ali manj, kot naprava dejansko vzorci. */
const BLK_EVENT = 1, BLK_HISTORY = 2;

function rateNote(id, nRecs, lagMs, firstId, lastId, flags){
  let r = RATE[id];
  const boot = BOOT_ID[id];
  if(!r || r.boot !== boot) r = RATE[id] = { recs:[], blocks:[], lags:[], evts:[], ids:new Set(), boot };
  const now = Date.now();
  if(flags & BLK_HISTORY){
    // zgodovina ne pove nicesar o sprotni dostavi - preskoci v celoti
    return;
  }
  if(flags & BLK_EVENT){
    for(let k=0;k<nRecs;k++) r.evts.push(now);
  } else {
    for(let k=0;k<nRecs;k++) r.recs.push(now);
    r.blocks.push(now);
    if(lagMs >= 0) r.lags.push([now, lagMs]);
    for(let i=firstId; i<=lastId; i++) r.ids.add(i);
  }
  const cut = now - RATE_WIN_MS;
  while(r.recs.length   && r.recs[0]   < cut) r.recs.shift();
  while(r.blocks.length && r.blocks[0] < cut) r.blocks.shift();
  while(r.lags.length   && r.lags[0][0] < cut) r.lags.shift();
  while(r.evts.length   && r.evts[0]   < cut) r.evts.shift();
}

function rateStats(id){
  const r = RATE[id];
  if(!r || !r.recs.length) return null;
  const secs = RATE_WIN_MS/1000;
  const lags = r.lags.map(x=>x[1]).sort((a,b)=>a-b);
  const med = lags.length ? lags[Math.floor(lags.length/2)] : 0;
  // izguba: razpon prejetih ID-jev proti dejansko prejetim, znotraj seje
  let loss = 0;
  if(r.ids.size > 1){
    const arr = [...r.ids];
    const span = Math.max(...arr) - Math.min(...arr) + 1;
    if(span > 0) loss = Math.max(0, Math.round((1 - r.ids.size/span)*1000)/10);
  }
  if(r.ids.size > 5000) r.ids = new Set([...r.ids].slice(-3000));
  return { hz: Math.round(r.recs.length/secs), bps: Math.round(r.blocks.length/secs*10)/10,
           evt: Math.round((r.evts||[]).length/secs), lag: med, loss };
}

/* S1/V6 (V60): porocilo napravi po LASTNI temi. Na scope/set ne sme iti -
   tako sporocilo bi padlo skozi do dna obdelave in vsakih 5 s ponastavilo
   prav tisto prilagajanje, ki ga naj bi izboljsalo.
   V6: ne porocamo, kadar je naprava offline ali osciloskop ni odprt - sicer
   bi posiljali meritve, ki jih nihce ne bere, in nicle, ki bi jih naprava
   lahko napacno razumela. */
function reportToDevice(){
  const s = currentSite();
  if(!s || s.opMode !== 'real') return;
  const L = ensureLive(s.id);
  if(!L.online) return;
  if(currentTab !== 'osciloskop') return;
  const st = rateStats(s.id);
  if(!st) return;
  sendCommand(s, 'klient/stanje',
              { client_hz: st.hz, lag_ms: st.lag, loss_pct: Math.round(st.loss) }, true);
}
setInterval(reportToDevice, 5000);

function seenSet(id){ if(!SEEN[id]) SEEN[id] = new Set(); return SEEN[id]; }

/* ============================================================
   Y2 (V60): SESTAVLJEN KLJUC `seja:recId`
   ------------------------------------------------------------
   Po resetu naprave se recId vrne na 1. Ker prikaz odslej prezivi reset
   (Y1), bi goli recId trcil z zapisom iz prejsnje seje: zapis st. 42 iz
   danasnjega zagona bi veljal za ze videnega, ker smo st. 42 videli tudi
   vceraj. Zato je kljuc vedno vezan na sejo.
   ============================================================ */
function rk(id, recId, boot){ return (boot || BOOT_ID[id] || '?') + ':' + recId; }

/* Y6 (V60): trenutki resetov. Ker buffer prezivi reset in se bere z diska,
   morajo tudi oznake preziveti - zato gredo v `meta`, ne le v pomnilnik. */
let RESETS = {};   // dev -> [cas, ...]
let GAPMUTE = {};  // Y13: da obvestilo ne ponavljamo pogosteje kot na 30 s
function noteReset(id, t){
  if(!RESETS[id]) RESETS[id] = [];
  RESETS[id].push(t);
  if(RESETS[id].length > 50) RESETS[id].shift();
  saveResets(id);
  logDebug(`SEJA ${id}: reset naprave ob ${new Date(t).toLocaleTimeString()}`);
}
async function saveResets(id){
  const m = await metaGet(id);
  if(!m) return;
  m.resets = RESETS[id].slice();
  await metaPut(m);
}
async function loadResets(id){
  const m = await metaGet(id);
  if(m && Array.isArray(m.resets)) RESETS[id] = m.resets.slice();
}

// A3: koliko ID-jev iz razpona nam dejansko manjka
function countMissing(id, from, to){
  const S = seenSet(id);
  let n = 0;
  for(let r = from; r <= to; r++) if(!S.has(rk(id, r))) n++;   // Y2
  return n;
}

// A4 (V56): kaj smo ze zahtevali. Brez tega je aplikacija isti razpon
// zahtevala znova ob vsakem prihodu odgovora - v dnevniku desetine
// enakih zahtev zapored. Vnos velja GAP_TTL, nato ga sme zahtevati znova
// (ce zapisi res niso prispeli).
const GAP_TTL = 30000;
let GAP_REQUESTED = {};   // id -> Map("from-to" -> cas zahteve)
function markRequested(id, from, to){
  if(!GAP_REQUESTED[id]) GAP_REQUESTED[id] = new Map();
  // Y2/Y3: zahteva velja SAMO za tekoco sejo - naprava starih sej nima
  GAP_REQUESTED[id].set((BOOT_ID[id]||'?')+'|'+from+'-'+to, Date.now());
}
function alreadyRequested(id, from, to){
  const M = GAP_REQUESTED[id];
  if(!M) return false;
  const key = (BOOT_ID[id]||'?')+'|'+from+'-'+to;
  const t = M.get(key);
  if(t === undefined) return false;
  if(Date.now() - t > GAP_TTL){ M.delete(from+'-'+to); return false; }
  return true;
}
// A5: je ta starejsi ID posledica NASE zahteve? Ce da, ni napaka.
function wasRequested(id, recId){
  const M = GAP_REQUESTED[id];
  if(!M) return false;
  const cur = (BOOT_ID[id]||'?') + '|';
  for(const key of M.keys()){
    if(!key.startsWith(cur)) continue;              // Y3: samo tekoca seja
    const [a,b] = key.slice(cur.length).split('-').map(Number);
    if(recId >= a && recId <= b) return true;
  }
  return false;
}

let DUP_COUNT = {}, DUP_LOG = {};   // AB2

function pushOscSample(id, sample){
  if(!OSCBUF[id]) OSCBUF[id] = [];
  const buf = OSCBUF[id];
  /* AB1 (V61): ZAVRNI PODVOJEN ZAPIS.
     Doslej je podvojitve lovilo samo nalaganje z diska; sprotni tok jih je
     spuscal naprej. V dnevniku 13:02:48 je isti id=14326 prisel dvakrat v
     16 ms (naprava ga je poslala kot odgovor na zahtevo zgodovine IN kot
     sproten zapis) in oba sta koncala v bufferju - na grafu podvojena tocka. */
  if(sample.recId){
    const key = rk(id, sample.recId, sample.boot);
    const S = seenSet(id);
    if(S.has(key)){
      DUP_COUNT[id] = (DUP_COUNT[id]||0) + 1;
      // AB2: izpis zbrano na 30 s, ne vsaka podvojitev posebej
      if(!DUP_LOG[id] || Date.now()-DUP_LOG[id] > 30000){
        DUP_LOG[id] = Date.now();
        logDebug(`scope ${id}: ${DUP_COUNT[id]} podvojenih zapisov zavrnjenih`);
        DUP_COUNT[id] = 0;
      }
      return;
    }
    S.add(key);   // Y2
  }
  if(buf.length === 0 || sample.t >= buf[buf.length-1].t){
    buf.push(sample);                     // hitra pot: nov vzorec je najnovejsi
  } else {
    let lo = 0, hi = buf.length;          // binarno iskanje mesta vstavitve
    while(lo < hi){ const mid = (lo+hi)>>1; if(buf[mid].t <= sample.t) lo = mid+1; else hi = mid; }
    buf.splice(lo, 0, sample);
  }
  if(buf.length > bufCap(id)){
    const drop = buf.shift();
    if(drop && drop.recId) seenSet(id).delete(rk(id, drop.recId, drop.boot));   // A3/Y2
  }
}

/* ============================================================
   DEBUG LOG (zavihek Simulator) - krozni buffer 1000 vnosov,
   VEDNO aktiven (ni potrebno posebej vklopiti). Zajema celotno pot:
   MQTT connect/subscribe/publish/message, ukazni tok sendCommand->
   applySimCommand->pushSimStateNow, dekodiranje scope/data, napake.
   ============================================================ */
let DEBUGLOG = [];
const DEBUG_CAP = 5000;   // LL4: ~15 min pri ~6 vnosih/s
function logDebug(msg, isErr){
  const t = new Date();
  const ts = String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')+':'+
             String(t.getSeconds()).padStart(2,'0')+'.'+String(t.getMilliseconds()).padStart(3,'0');
  DEBUGLOG.unshift({ts, msg, isErr:!!isErr});   // zbiranje tece VEDNO
  if(DEBUGLOG.length > DEBUG_CAP) DEBUGLOG.length = DEBUG_CAP;
  // LL2: izris se NE sprozi samodejno - vsebina se prikaze sele ob kliku na
  // "Prikazi". Pri gostem prometu je izris ob vsakem vnosu drag, zgodovina
  // pa se kljub temu zbira ves cas.
}
// LL2: rocni prikaz vsebine dnevnika
function showDebugLog(){
  const el = document.getElementById('debugLogBox');
  if(!el) return;
  renderDebugLog(el);
  const info = document.getElementById('debugInfo');
  if(info) info.textContent = `${DEBUGLOG.length} / ${DEBUG_CAP}`;
}

function renderDebugLog(el){
  if(!el) return;
  el.innerHTML = DEBUGLOG.map(e=>{
    const line = `[${e.ts}] ${e.msg}`;
    return e.isErr ? `<span class="err">${line}</span>` : line;
  }).join('\n');
}
// Neblokirajoce obvestilo (nadomesca alert(), ki na mobilnem zamrzne UI)
let _toastTo = null;
function showToast(msg){
  const el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTo);
  _toastTo = setTimeout(()=>el.classList.remove('show'), 2600);
}

function clearDebugLog(){
  DEBUGLOG = [];
  const el = document.getElementById('debugLogBox');
  if(el) el.innerHTML = '';
}
// O4: navigator.clipboard obstaja SAMO v varnem kontekstu (https/localhost).
// Datoteka, odprta prek content:// ali file://, tega nima - zato rezervna
// pot prek zacasnega <textarea> + execCommand('copy'), ki deluje povsod.
function copyDebugLog(){
  const text = DEBUGLOG.slice().reverse().map(e=>`[${e.ts}] ${e.msg}`).join('\n');
  if(!text){ showToast(T('logEmpty')); return; }
  const fallback = ()=>{
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta);
      ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      showToast(ok ? T('logCopied') : T('logCopyFail'));
    }catch(e){ showToast(T('logCopyFail')); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text)
      .then(()=>showToast(T('logCopied')))
      .catch(fallback);   // zavrnjeno dovoljenje -> rezervna pot
  } else fallback();
}

/* ============================================================
   MQTT
   ============================================================ */
let mqttClients = {};
// JJ4: WS naslov ni vec trdo 8084. Zapis brokerja: "gostitelj[:tcpPort][|wsPort][|ws|wss]"
// npr. "broker.emqx.io", "mojbroker.si:1883|9001|ws"
// JJ12: cel niz ostane KLJUC za identifikacijo brokerja (mqttClients[broker]),
// zato se dva razlicna zapisa istega gostitelja stejeta kot razlicna brokerja.
function brokerWsUrl(broker){
  const parts = String(broker).split('|');
  const host = parts[0].split(':')[0].trim();
  const wsPort = (parts[1] && parseInt(parts[1])) || 8084;
  const scheme = (parts[2] || '').trim().toLowerCase() === 'ws' ? 'ws' : 'wss';
  return `${scheme}://${host}:${wsPort}/mqtt`;
}

function getClient(broker){
  if(mqttClients[broker]) return mqttClients[broker];
  if(typeof mqtt === 'undefined'){ logDebug('MQTT: mqtt.js knjižnica ni na voljo (CDN nedosegljiv?)', true); console.warn('mqtt.js ni na voljo'); return null; }
  try{
    const url = brokerWsUrl(broker);
    logDebug(`MQTT connect() poskus -> ${url}`);
    // OBRATEN LWT: naprava mora vedeti, ali je NADZORNI KLIENT prisoten.
    // Broker sam objavi "offline" na client/status ob nepricakovani prekinitvi.
    // LWT velja za eno temo, zato ga vezemo na prvo napravo tega brokerja;
    // prisotnost "online" pa aktivno objavimo za VSE naprave (glej publishClientPresence).
    // JJ1: MQTT dovoli SAMO EN will na povezavo. Prej je bil vezan na prvo
    // napravo, zato pri vec napravah druge niso dobile "offline" in njihov
    // Offline Guard se ni sprozil. Zdaj skupna tema, ki jo poslusajo vse.
    // TT2: keepalive 60s - povezava prezivi kratko ozadje brez ponovnega
    // vzpostavljanja; reconnectPeriod ostane kratek za hitro obnovo.
    const opts = { reconnectPeriod: 4000, keepalive: 60 };
    opts.will = { topic: CLIENT_STATUS_TOPIC, payload:'offline', qos:1, retain:true };
    const client = mqtt.connect(url, opts);
    client.on('error', (err)=>{ logDebug(`MQTT ERROR (${broker}): ${err&&err.message}`, true); console.warn('MQTT napaka ('+broker+'):', err&&err.message); renderConnPill(); });
    client.on('reconnect', ()=>{ logDebug(`MQTT reconnect poskus (${broker})`); });
    client.on('connect', ()=>{ logDebug(`MQTT CONNECTED (${broker})`); renderConnPill(); resubscribeAll(broker); publishClientPresence(broker, true); });
    client.on('close', ()=>{ logDebug(`MQTT CLOSED (${broker})`, true); renderConnPill(); });
    client.on('offline', ()=>{ logDebug(`MQTT OFFLINE (${broker})`, true); });
    client.on('message', (topic, payload)=>{
      logDebug(`MQTT <- ${topic} (${payload.length}B)`);
      onMqttMsg(topic, payload);
    });
    mqttClients[broker] = client;
    return client;
  }catch(e){ logDebug(`MQTT connect() izjema: ${e.message}`, true); console.warn('MQTT connect napaka:', e); return null; }
}

// Aktivno javi napravam, da je nadzorni klient prisoten (dopolnjuje LWT,
// ki pokriva le nepricakovano prekinitev in samo eno temo).
// JJ1: skupna tema za prisotnost nadzorne aplikacije
const CLIENT_STATUS_TOPIC = 'nadzor/status';
function publishClientPresence(broker, online){
  const c = mqttClients[broker];
  if(!c || !c.connected) return;
  // JJ11: retain je nujen (nova naprava mora ob prijavi takoj izvedeti stanje),
  // a pomeni, da zadnji "offline" ostane na brokerju - zato ob vsaki povezavi
  // TAKOJ objavimo "online", da ga prepisemo.
  c.publish(CLIENT_STATUS_TOPIC, online?'online':'offline', {qos:1, retain:true});
  // zdruzljivost nazaj: se naprej javimo tudi po stari temi vsake naprave
  CFG.sites.forEach(s=>{
    if(s.mqtt!==broker) return;
    c.publish(`naprava/${s.id}/client/status`, online?'online':'offline', {qos:1, retain:true});
  });
  // LL3: heartbeat je pogost (5s), zato ga zapisemo le ob SPREMEMBI stanja
  if(publishClientPresence._last !== online){
    publishClientPresence._last = online;
    logDebug(`KLIENT -> ${CLIENT_STATUS_TOPIC} = ${online?'ONLINE':'OFFLINE'}`, !online);
  }
}
// periodicna potrditev prisotnosti (heartbeat) - broker/naprava tako ve,
// da je klient se vedno tu tudi po morebitnem re-connectu
// JJ13: 5s (prej 20s) - pri spodnji meji timeouta 5s je Offline Guard
// sicer sprozil izklop, ceprav je bil klient prisoten.
setInterval(()=>{ Object.keys(mqttClients).forEach(b=>publishClientPresence(b, true)); }, 5000);

function resubscribeAll(broker){
  // SMER PODATKOV: HTML->ESP32 gredo samo ukazi (.../set, glej sendCommand()).
  // Vse povratne informacije (stanje relejev/servo/analog) prihajajo
  // IZKLJUCNO preko scope/data (binarni blok) - locenih "stanje" tem NI VEC.
  CFG.sites.forEach(s=>{
    if(s.mqtt===broker){
      const c = mqttClients[broker];
      c.subscribe(`naprava/${s.id}/status`); logDebug(`SUB naprava/${s.id}/status`);
      /* ============================================================
         AA3 (V61): NAROCILO NA scope/data SELE PO BRANJU Z DISKA
         ------------------------------------------------------------
         loadFromDisk() je asinhron (bere IndexedDB). Doslej smo se naroctli
         takoj, zato je prvi ZIVI zapis lahko prispel PREJ, kot se je branje
         koncalo. V tistem trenutku je bil LAST_REC_ID se undefined, zato
         zaznavanje vrzeli ni steklo - prvi zapis po prijavi nima s cim
         primerjati. Ko je nalaganje koncalo, je bil LAST_REC_ID ze visji od
         tega, kar je dal disk, in pogoj `r.maxId > LAST_REC_ID` ni bil
         izpolnjen: manjkajoci zapisi niso bili NIKOLI zahtevani in v dnevniku
         ni bilo niti ene vrstice `vrzel`.

         V dnevniku 13:02:44 je to vidno kot luknja 14309..14315: disk je dal
         do 14308, prvi zivi zapis je bil 14316.

         Resitev pri VIRU: dokler ne vemo, kje smo ostali, se na sprotni tok
         sploh ne narocimo. Zamik je nekaj deset milisekund.
         ============================================================ */
      if(s.opMode === 'real'){
        loadFromDisk(s.id).finally(()=>{
          c.subscribe(`naprava/${s.id}/scope/data`);
          logDebug(`SUB naprava/${s.id}/scope/data (po branju z diska)`);
        });
      } else {
        c.subscribe(`naprava/${s.id}/scope/data`); logDebug(`SUB naprava/${s.id}/scope/data`);
      }
      c.subscribe(`naprava/${s.id}/hist/info`);   // AG4
      c.subscribe(`naprava/${s.id}/scope/ping`);   // AL1
      c.subscribe(`naprava/${s.id}/config/stanje`); logDebug(`SUB naprava/${s.id}/config/stanje`);
      c.subscribe(`naprava/${s.id}/stanje/izhodi`); logDebug(`SUB naprava/${s.id}/stanje/izhodi`);   // T3 (V58)
      ensureSimBrokerListening(s); // virtualna naprava posluša ukaze TAKOJ, ne šele ob Start
    }
  });
}

function ensureLive(id){
  if(!LIVE[id]) LIVE[id] = { online:false, stale:true, lastSeen:0, rele:[false,false,false,false], binarno:0, binMode:false, servo:[0,0], analog:{},
                             binOn:false, binPeriod:1, offlineGuard:false, bootRestore:false, cfgFromDevice:false };
  return LIVE[id];
}

// D1 (V55): funkcija encodeScopeBlock() je bila ODSTRANJENA. Bila je mrtva
// koda iz formata V6 (8 B na vzorec, samo ADC, releji in servo po loceni
// poti scope/event). Ta pot je bila odstranjena ze v GG1/GG5, edini veljavni
// zapisovalnik je simEncodeRecord() z enotnim 19 B zapisom. Ohranjena stara
// funkcija je pri iskanju napak zavajala, ker je opisovala format, ki ga
// nobena stran vec ne uporablja.

// Zadnje znano stanje relejev/servo po napravi (gradi se iz dogodkov).
// Servo hrani tudi tekoco rampo, da lahko klient interpolira vmesne lege.
// GG5: dogodkovni model (EVSTATE/EVLOG/handleScopeEvent/relayStateAt/
// servoPosAt/pushEvent) ODSTRANJEN - vse prihaja v enotnem 19B zapisu v
// en sam buffer (OSCBUF), zato ni vec dveh virov, ki bi si nasprotovala.


// scope/data zdaj nosi SAMO ADC vzorce.
// GG1: ENOTEN 19B zapis - releji, servo IN adc v istem vzorcu, po eni poti.
// glava 8B [u32 timebase_ms][u16 n][u16 rezerv], nato n x 19B:
//   [id u32][tm u32][relBits u8][s1 u8][s2 u8][a1..a4 u16 LE]
// tm je millis() NAPRAVE - vzorce umestimo po njem, zato zakasnitev omrezja
// ne premika vec stopnic.
let CLOCK_OFF = {};   // id -> odmik (Date.now() - millis naprave)
// SS1/SS2: odmik ure po NAJMANJSI opazeni zakasnitvi.
// Prej se je odmik popravljal z 2% ob VSAKEM zapisu, `Date.now()` pa je cas
// PRISPETJA, ki niha z zakasnitvijo omrezja (150-400ms). Odmik se je zato
// nenehno premikal in z njim CELOTNA casovna os - od tod skakanje robov,
// ceprav so preklopi na napravi natanko doloceni.
// Najmanjsa opazena razlika (Date.now()-tm) ustreza prenosu z najmanjso
// zakasnitvijo in je najboljsa ocena pravega odmika (standardni postopek
// pri sinhronizaciji ur).
let CLOCK_MIN = {};    // najmanjsa opazena razlika v tekocem oknu
let CLOCK_N   = {};    // stevec zapisov v oknu
let CLOCK_LAST = {};   // zadnja opazena razlika (za diagnostiko)
function deviceTime(devId, tm){
  const diff = Date.now() - tm;
  CLOCK_LAST[devId] = diff;
  if(CLOCK_OFF[devId] === undefined){
    CLOCK_OFF[devId] = diff; CLOCK_MIN[devId] = diff; CLOCK_N[devId] = 0;
  } else {
    if(CLOCK_MIN[devId] === undefined || diff < CLOCK_MIN[devId]) CLOCK_MIN[devId] = diff;
    // SS2: navzdol TAKOJ (nasli smo hitrejsi prenos = boljso oceno)
    if(diff < CLOCK_OFF[devId]) CLOCK_OFF[devId] = diff;
    // navzgor zelo pocasi - ura ESP32 drsi le nekaj ppm (~1ms na 15 min).
    // Okno 200 zapisov: ce je najmanjsa v oknu vecja od trenutnega odmika,
    // se je ura res premaknila -> popravimo za majhen korak.
    if(++CLOCK_N[devId] >= 200){
      if(CLOCK_MIN[devId] > CLOCK_OFF[devId]) CLOCK_OFF[devId] += 1;
      CLOCK_MIN[devId] = diff; CLOCK_N[devId] = 0;
    }
  }
  return tm + CLOCK_OFF[devId];
}

let LAST_REC_ID = {};   // zaznavanje izgubljenih zapisov
// AG4/AG5: kaj naprava se hrani (najstarejsi/najnovejsi ID). Deklaracija mora
// biti pred obravnavo sporocil, ki jo uporabljajo.
let HIST_INFO = {};
let TB_MISMATCH = {};   // PP1: od kdaj se javljena baza ne ujema z izbrano
let LAST_TB = {};       // XX6: zadnja DEJANSKA vzorcevalna baza iz naprave

function decodeScopeBlock(id, arrBuf){
  try{
    const dv = new DataView(arrBuf);
    if(dv.byteLength < 8) return;
    const tbMs = dv.getUint32(0, true) || 1;
    const n = dv.getUint16(4, true);
    const blkFlags = dv.getUint8(6);   // AD3 (V62): bit0=dogodek, bit1=zgodovina
    const L = ensureLive(id);
    let off = 8, last = null, firstRecId = null;   // R1 (V60)
    for(let i=0;i<n;i++){
      if(off+19 > dv.byteLength) break;
      const recId = dv.getUint32(off, true);
      const tm    = dv.getUint32(off+4, true);
      const rb    = dv.getUint8(off+8);
      const s1    = dv.getUint8(off+9), s2 = dv.getUint8(off+10);
      const sample = {
        recId,                      // AI9: za ugotavljanje, kaj nam se manjka
        t: deviceTime(id, tm),
        rele: [!!(rb&1), !!(rb&2), !!(rb&4), !!(rb&8)],
        servo: [s1, s2],
        analog: { a1: dv.getUint16(off+11,true)/10, a2: dv.getUint16(off+13,true)/10,
                  a3: dv.getUint16(off+15,true)/10, a4: dv.getUint16(off+17,true)/10 }
      };
      // A2 (V56): LAST_REC_ID je odslej MONOTONI MAKSIMUM. Prej ga je vsak
      // zapis brezpogojno prepisal - tudi dopolnjeni iz zgodovine, ki je po
      // definiciji STAREJSI. Naslednji zivi zapis je zato izgledal kot skok
      // naprej in sprozil novo zahtevo za zgodovino: zanka, ki se je v
      // dnevniku vrtela neprekinjeno in trgala graf na koscke.
      // A5: nad zapisi iz zgodovine se zaznavanje vrzeli sploh ne izvaja.
      const isHist = (LAST_REC_ID[id] !== undefined && recId <= LAST_REC_ID[id]);
      if(isHist){
        if(!wasRequested(id, recId))
          logDebug(`scope ${id}: nepricakovan starejsi ID ${recId} (zadnji ${LAST_REC_ID[id]}) `
                 + `- na isti temi objavlja se en vir (druga odprta seja ali star retain zapis)`, true);
      } else {
        if(LAST_REC_ID[id] !== undefined && recId > LAST_REC_ID[id] + 1){
          // A3: zahtevaj SAMO tiste ID-je, ki jih v bufferju res ni.
          const from = LAST_REC_ID[id] + 1, to = recId - 1;
          const miss = countMissing(id, from, to);
          if(miss > 0){
            logDebug(`scope ${id}: vrzel ${miss} zapisov (${LAST_REC_ID[id]} -> ${recId})`, true);
            requestGapFill(id, from, to - from + 1);
          }
        }
        LAST_REC_ID[id] = recId;
      }
      if(i === 0){
        // PP1/PP3: naprava javlja DEJANSKO vzorcevalno bazo. Ce se ne ujema
        // z izbrano dlje kot 5s, scope/set ni prisel skozi -> ponovimo ga.
        // Prej se je ukaz poslal le ob odprtju zavihka in ob menjavi baze;
        // ce se je izgubil, je naprava ostala v pocasnem nacinu (1 zapis/s)
        // in graf pri 1ms/10ms bazi je bil prakticno prazen.
        const site = CFG.sites.find(x=>x.id===id);
        if(site && site.opMode === 'real' && currentTab === 'osciloskop'){
          const want = OSC_TIMEBASE;
          const mismatch = Math.abs(tbMs - want) > Math.max(2, want*0.5);
          if(mismatch){
            // D5 (V55): vzrok neujemanja je odpravljen v firmwareu (A3 -
            // zahteva zgodovine ne resetira vec baze na 100 ms), zato je ta
            // detektor zdaj le se varovalka za izgubljen ukaz. Prag s 5 s na
            // 10 s, da med dopolnjevanjem zgodovine ne poslja ukazov po nepotrebnem.
            if(!TB_MISMATCH[id]) TB_MISMATCH[id] = Date.now();
            else if(Date.now() - TB_MISMATCH[id] > 10000){
              TB_MISMATCH[id] = Date.now();
              logDebug(`OSC ${id}: naprava vzorci na ${tbMs}ms, izbrano ${want}ms `
                     + `- ponovno posiljam scope/set`, true);
              sendCommand(site, 'scope/set', { timebase_ms: want });
            }
          } else TB_MISMATCH[id] = 0;
        }
        // LL3: diagnostika prvega zapisa v bloku
        const hz = tbMs > 0 ? (1000/tbMs).toFixed(1) : '?';
        LAST_TB[id] = tbMs;   // XX6
        logDebug(`REC ${id}: id=${recId} millis=${tm} odmik=${Math.round(CLOCK_OFF[id])}ms `
               + `dejansko=${tbMs}ms (${hz}Hz) zakasnitev=${Math.round(CLOCK_LAST[id] - CLOCK_OFF[id])}ms `
               + `rele=${sample.rele.map(b=>b?1:0).join('')} servo=${s1},${s2} `
               + `adc=${sample.analog.a1.toFixed(1)}/${sample.analog.a2.toFixed(1)}/`
               + `${sample.analog.a3.toFixed(1)}/${sample.analog.a4.toFixed(1)} `
               + `n=${n} tb=${tbMs}ms buf=${(OSCBUF[id]||[]).length}`);
      }
      /* ============================================================
         AP (V63): ZAPIS O VKLOPU NAPRAVE
         ------------------------------------------------------------
         Naprava ob vsakem zagonu zapise poseben zapis z relBits = 0xFF
         (v normalnem delovanju so v rabi le stirje spodnji biti, binarno
         stetje gre do 0x0F). Brez te obravnave bi se izrisal kot stanje, v
         katerem so VSI STIRJE RELEJI vklopljeni naenkrat.
         Zapis ne gre v OSCBUF in ne steje v hitrost dostave - gre v RESETS,
         ki ze prezivi na disku in se izrise kot navpicna oznaka.
         AP5: starejsi firmware takih zapisov ne posilja, zato se nic ne
         spremeni, ce jih ni. */
      if(rb === 0xFF){
        const bootLo = s1 | (s2 << 8);
        const t = tm + (CLOCK_OFF[id] || 0);
        if(!RESETS[id]) RESETS[id] = [];
        if(!RESETS[id].some(x=>Math.abs(x - t) < 2000)){
          RESETS[id].push(t);
          if(RESETS[id].length > 50) RESETS[id].shift();
          saveResets(id);
          logDebug(`SEJA ${id}: zapis o vklopu naprave ob ${new Date(t).toLocaleTimeString()}`
                 + ` (bootId ...${bootLo})`);
        }
        last = null;            // ne steje kot podatkovni zapis
        off += 19;
        continue;
      }
      if(firstRecId === null) firstRecId = recId;   // R1
      sample.boot = BOOT_ID[id];   // Y2 (V60): seja zapisa
      pushOscSample(id, sample);
      // A2 (V57): na disk gre SUROVIH 19 B, natanko tako, kot je prislo z
      // naprave - brez razpakiranja v objekt. Skupaj z njimi shranimo odmik
      // ure, ki je veljal ob prejemu, da lahko ob nalaganju izracunamo
      // absolutni cas (millis() naprave sam po sebi ne pove nicesar).
      checkLegacyBoot(id, recId, tm);   // C3: zaznaj zagon brez oznake seje
      // E3: simulacijskih nacinov ne shranjujemo na disk
      if(BOOT_ID[id] && SITE_IS_REAL(id)){
        storePush(id, BOOT_ID[id], recId,
                  new Uint8Array(arrBuf.slice(off, off+19)),
                  CLOCK_OFF[id] || 0);
      }
      last = sample;
      off += 19;
    }
    if(last){
      L.online = true; L.stale = false; L.lastSeen = Date.now();
      L.pinging = false;   // AL2/AL6: poln tok je stekel - Nadzor spet kaze stanje
      L.rele = last.rele.slice(); L.servo = last.servo.slice(); L.analog = last.analog;
      // R1 (V60): zabelezi DEJANSKO dostavo. To je edina stevilka, ki pove,
      // kaj res pride v telefon - `tbMs` iz glave bloka pove le, kaj naprava
      // misli, da poslje.
      const lag = Date.now() - last.t;
      /* AD3 (V62): vrsto bloka odslej pove NAPRAVA (bajt 6 v glavi), ne
         ugibanje po razmiku. Prejsnja heuristika je pri utripajocih relejih
         razglasila za dogodek prakticno vsak zapis - izpis je kazal
         "0 Hz prejeto (+3 dogodek/s)", kar je bilo narobe v obe smeri. */
      rateNote(id, n, lag > 0 ? lag : 0, firstRecId, last.recId, blkFlags);
    }
    renderSiteMenu(); renderConnPill();
    if(currentTab==='nadzor') updateNadzorState();
  }catch(e){ logDebug(`decodeScopeBlock ${id}: ${e.message}`, true); }
}

function onMqttMsg(topic, payload){
  const m = topic.match(/^naprava\/([0-9A-Fa-f]{6})\/(.+)$/);
  if(!m){ logDebug(`onMqttMsg: tema ne ustreza vzorcu naprava/ID/... : ${topic}`, true); return; }
  const id = m[1].toUpperCase(), sub = m[2];

  // AG4: naprava javi, kaj bo poslala - prej je aplikacija cakala na podatke,
  // ki ob zahtevi izven obsega niso nikoli prisli.
  // AL1/AL6: cist ping (naprava ni v aktivnem podatkovnem toku) - samo
  // "sem tu", BREZ stanja. Nadzor med tem ne prikazuje relejev/servo/ADC,
  // sicer bi kazal zastarele vrednosti kot da so sveze.
  if(sub==='scope/ping'){
    const L = ensureLive(id);
    L.online = true; L.stale = false; L.lastSeen = Date.now();
    L.pinging = true;   // AL6: Nadzor uporabi to za prikaz "cakam na podatke"
    renderSiteMenu(); renderConnPill();
    if(currentTab==='nadzor') updateNadzorState();
    return;
  }
  if(sub==='hist/info'){
    try{
      const d = JSON.parse(payload.toString());
      HIST_INFO[id] = Object.assign({}, HIST_INFO[id], d);   // AJ2: ohrani prejsnje polje, ce jih to sporocilo ne nosi
      if(d.status === 'sending')
        logDebug(`ZGODOVINA ${id}: naprava poslja ID ${d.histFrom}..${d.histTo} (hrani ${d.oldest}..${d.newest})`);
      else if(d.status === 'out_of_range')
        logDebug(`ZGODOVINA ${id}: zahteva izven obsega (hrani ${d.oldest}..${d.newest})`, true);
      else if(d.status === 'done'){
        logDebug(`ZGODOVINA ${id}: prenos koncan`);
        histQueueAck(id);   // AI3: naslednji kos sele zdaj
      }
    }catch(e){}
    return;
  }
  if(sub==='scope/data'){
    const buf = payload.buffer ? payload.buffer.slice(payload.byteOffset, payload.byteOffset+payload.byteLength) : payload;
    decodeScopeBlock(id, buf);
    return;
  }
  if(sub==='status'){
    const L = ensureLive(id);
    L.lastSeen = Date.now(); L.stale = false;
    const wasOnline = L.online;
    L.online = (payload.toString()==='online');
    if(wasOnline !== L.online)
      logDebug(`STATUS ${id}: ${wasOnline?'online':'offline'} -> ${L.online?'ONLINE':'OFFLINE'}`, !L.online);
    renderSiteMenu(); renderConnPill();
  }
  /* ============================================================
     T3 (V58): STANJE IZHODOV Z NAPRAVE
     ------------------------------------------------------------
     Naprava je odslej vir resnice tudi za NACIN, ne le za stanje. Kartice
     se izrisejo iz tega sporocila; UICMD je le se predpomnilnik za prikaz
     do prve povezave (W1).

     Prej je bilo natanko obratno: kartice so se risale iz localStorage,
     syncDeviceToUI() pa je za realne naprave takoj vrnil. Po ponovnem
     zagonu naprave (bootRestore=false -> vse na 0, nacini staticni) je
     aplikacija zato kazala "Perioda", naprava pa ni delala nicesar.
     ============================================================ */
  if(sub==='stanje/izhodi'){
    try{
      const d = JSON.parse(payload.toString());
      const uc = ensureUICmd(id);
      const L  = ensureLive(id);
      const ch = [];   // V2: v dnevnik samo SPREMEMBE

      if(Array.isArray(d.rele)){
        d.rele.forEach((r,i)=>{
          if(i>3) return;
          if(cardLocked(id,'rele',i)) return;   // T5: uporabnik pravkar ureja
          const m = (r.m==='blink') ? 'period' : 'manual';
          if(uc.rele[i].mode !== m) ch.push(`R${i+1} nacin ${uc.rele[i].mode}->${m}`);
          if(m==='period'){
            if(uc.rele[i].ton !== r.ton || uc.rele[i].toff !== r.toff)
              ch.push(`R${i+1} ${r.ton}/${r.toff}s`);
            uc.rele[i].ton = r.ton; uc.rele[i].toff = r.toff;
          } else {
            uc.rele[i].on = !!r.s;
          }
          uc.rele[i].mode = m;
          L.rele[i] = !!r.s;            // V1: dejansko stanje z naprave
        });
      }
      if(Array.isArray(d.servo)){
        d.servo.forEach((v,i)=>{
          if(i>1) return;
          if(cardLocked(id,'servo',i)) return;   // T5
          const m = (v.m==='oscillate') ? 'period' : 'manual';
          if(uc.servo[i].mode !== m) ch.push(`S${i+1} nacin ${uc.servo[i].mode}->${m}`);
          uc.servo[i].mode = m;
          uc.servo[i].posA = v.a; uc.servo[i].posB = v.b;
          uc.servo[i].posOff = v.off; uc.servo[i].posOn = v.on;
          uc.servo[i].ton = v.ton; uc.servo[i].toff = v.toff;
          uc.servo[i].rampMsP = v.ramp;
          uc.servo[i].on = (Math.abs(v.pos - v.on) < Math.abs(v.pos - v.off));
          L.servo[i] = v.pos;
        });
      }
      L.forcedOff = !!d.forced;
      // D10 (V59): diagnostika hitrosti vzorcenja z naprave
      if(d.effMs!==undefined)  L.effMs  = d.effMs;
      if(d.slowMs!==undefined) L.slowMs = d.slowMs;
      // S5/N1/Y11 (V60): kaj je naprava dejansko upostevala + diagnostika
      if(d.prio!==undefined)    L.prio    = d.prio;
      if(d.heap!==undefined)    L.heap    = d.heap;
      if(d.histCap!==undefined) L.histCap = d.histCap;
      if(d.cliHz!==undefined)   L.cliHz   = d.cliHz;
      if(d.cliLag!==undefined)  L.cliLag  = d.cliLag;
      if(d.cliLoss!==undefined) L.cliLoss = d.cliLoss;
      L.outFromDevice = true;   // V3: prvo sporocilo je prispelo
      saveUICmd();
      if(ch.length) logDebug(`IZHODI ${id}: ${ch.join(', ')}`);
      outPendingClear(id, d);   // T6: potrdi cakajoce ukaze
      if(currentTab==='nadzor') renderNadzorControls();
    }catch(e){ logDebug(`IZHODI ${id}: neveljavno sporocilo (${e.message})`, true); }
    return;
  }

  if(sub==='config/stanje'){
    // NAPRAVA JE VIR RESNICE za nastavitvi nacinov - klient jih ob online prevzame.
    try{
      const d = JSON.parse(payload.toString());
      const L = ensureLive(id);
      if(d.fw!==undefined) L.fw = String(d.fw);   // B1: verzija firmware
      // C1/C3 (V57): oznaka seje. Ce je naprava na starejsi firmware in je
      // ne javi, si pomagamo z nadomestno oznako (C3) - manj zanesljivo, a
      // bolje kot mesati zapise dveh zagonov na isti casovni osi.
      if(d.boot!==undefined) onDeviceBoot(id, String(d.boot));
      if(d.offlineGuard!==undefined) L.offlineGuard = !!d.offlineGuard;
      if(d.samplePriority!==undefined) L.samplePriority = d.samplePriority|0;   // N1
      if(d.heartbeatMs!==undefined) L.heartbeatMs = d.heartbeatMs|0;   // AT (V63)
      if(d.adcPct!==undefined)  L.adcPct  = d.adcPct|0;
      if(d.adcMinT!==undefined) L.adcMinT = d.adcMinT|0;
      if(d.logAll!==undefined)  L.logAll  = d.logAll|0;
      if(d.baseMs!==undefined)  L.baseMs  = d.baseMs|0;
      if(d.bootRestore!==undefined)  L.bootRestore  = !!d.bootRestore;
      if(d.offlineTimeoutS!==undefined) L.offlineTimeoutS = d.offlineTimeoutS;
      // AG5: obseg zgodovine na napravi - da vemo, kaj je sploh se na voljo,
      // preden zahtevamo dopolnitev vrzeli
      if(d.histOldest!==undefined){
        HIST_INFO[id] = Object.assign({}, HIST_INFO[id], {
          oldest: d.histOldest, newest: d.histNewest,
          oldestTm: d.histOldestTm, newestTm: d.histNewestTm,   // AJ2
          fsBlocks: d.fsBlocks, fsTotal: d.fsTotal   // AI6
        });
      }
      // legi OFF/ON sta shranjeni na napravi -> prevzemi ju v UICMD, da sta
      // znani tudi ob dostopu z drugega telefona (F5)
      if(Array.isArray(d.posOff) || Array.isArray(d.posOn)){
        const uc = ensureUICmd(id);
        for(let i=0;i<2;i++){
          if(Array.isArray(d.posOff) && d.posOff[i]!==undefined) uc.servo[i].posOff = d.posOff[i];
          if(Array.isArray(d.posOn)  && d.posOn[i]!==undefined)  uc.servo[i].posOn  = d.posOn[i];
        }
        saveUICmd();
      }
      if(d.binOn!==undefined)        L.binOn        = !!d.binOn;
      if(d.binPeriod!==undefined)    L.binPeriod    = d.binPeriod;
      L.cfgFromDevice = true;
      // P1 (V58): OBA klica MORATA biti TU, pod razclembo polj. Prej sta bila
      // nad njo in sta zato brala PREJSNJE stanje: logCfgDiff je javljal
      // navidezne spremembe (`timeout 0s->60s` takoj po prvi povezavi),
      // cfgPendingTick pa je primerjal s starimi vrednostmi in je lahko
      // zgresil potrditev ter po nepotrebnem ponovil ukaz.
      logCfgDiff(id);        // S8
      cfgPendingTick();      // S2
      // S6: osvezi osnutek, ce ga uporabnik ni rocno spreminjal
      if(DRAFT && !DRAFT.dirty && DRAFT.cfg && DRAFT.cfg[id]){
        DRAFT.cfg[id] = { offlineGuard:!!L.offlineGuard, bootRestore:!!L.bootRestore,
                          offlineTimeoutS: L.offlineTimeoutS||60,
                          samplePriority: L.samplePriority|0,
                          heartbeatMs: L.heartbeatMs||1000, adcPct: L.adcPct===undefined?10:L.adcPct,
                          adcMinT: L.adcMinT===undefined?3:L.adcMinT, logAll: L.logAll|0 };
        renderSettings();
      }
      logDebug(`CONFIG ${id}: fw=${L.fw||'?'} offlineGuard=${L.offlineGuard} timeout=${L.offlineTimeoutS||60}s `
             + `bootRestore=${L.bootRestore} binOn=${L.binOn} binPeriod=${L.binPeriod}s`);
      if(currentTab==='nadzor') renderNadzorControls(); // binOn spremeni zaklep rele kartic
      renderSettings();
    }catch(e){ logDebug(`CONFIG ${id}: napaka parsanja: ${e.message}`, true); }
  }
}

// SMER: HTML -> ESP32 (ukazi). sim_local nima MQTT ozadja - ukaz se
// izvrsi direktno na virtualni napravi (glej applySimCommand).
// JJ6: QoS 0 je hiter (brez cakanja na PUBACK), a brez jamstva dostave.
// Zato po 500ms preverimo, ali je naprava javila PRICAKOVANO stanje; ce ne,
// ukaz enkrat ponovimo. Velja le za ROCNE ukaze - pri utripanju/nihanju
// enoznacnega ciljnega stanja ni.
const PENDING = {};   // kljuc -> {expect, tries, timer}
function expectAfterCommand(site, subtopic, obj){
  let check = null;
  const relM = subtopic.match(/^rele\/(\d)\/set$/);
  const srvM = subtopic.match(/^servo\/(\d)\/set$/);
  if(relM && obj.mode === 'static'){
    const i = parseInt(relM[1])-1;
    check = ()=> !!ensureLive(site.id).rele[i] === !!obj.state;
  } else if(srvM && obj.mode === 'static'){
    const i = parseInt(srvM[1])-1;
    check = ()=> Math.abs((ensureLive(site.id).servo[i]||0) - (obj.pos||0)) <= 2;
  } else if(subtopic === 'binarno/set'){
    check = ()=> !!ensureLive(site.id).binOn === !!obj.on;
  }
  if(!check) return;   // periodicni ukazi - brez preverjanja

  const key = site.id + '/' + subtopic;
  if(PENDING[key]) clearTimeout(PENDING[key].timer);
  const tries = (PENDING[key] ? PENDING[key].tries : 0) + 1;
  PENDING[key] = { tries, timer: setTimeout(()=>{
    if(check()){ logDebug(`UKAZ ${subtopic}: potrjen`); delete PENDING[key]; return; }
    if(tries < 2){
      logDebug(`UKAZ ${subtopic}: NI potrjen po 500ms - ponavljam (${tries}/2)`, true);
      // D14 (V59): vnos pobrisi PRED ponovnim posiljanjem. Ce sendCommand
      // odpove ze na zacetku (ni MQTT klienta), se expectAfterCommand ne
      // poklice in vnos bi ostal v PENDING za vedno - z mrtvim casovnikom in
      // referenco na staro stanje.
      delete PENDING[key];
      sendCommand(site, subtopic, obj);
    } else {
      delete PENDING[key];
      logDebug(`UKAZ ${subtopic}: NI POTRJEN po 2 poskusih - naprava se ne odziva`, true);
      showToast(T('cmdFailed'));
    }
  }, 500) };
}

function sendCommand(site, subtopic, obj, quiet){
  // `quiet`: porocilo klienta gre vsakih 5 s in bi sicer zasulo dnevnik,
  // v katerem se iscejo prave napake.
  if(!quiet) logDebug(`sendCommand naprava/${site.id}/${subtopic} ${JSON.stringify(obj)} [opMode=${site.opMode}]`);
  if(site.opMode==='sim_local'){
    applySimCommand(site, subtopic, obj); // ta zdaj ze sam poklice pushSimStateNow() -> updateNadzorState()
    return;
  }
  const c = getClient(site.mqtt);
  if(!c){ logDebug(`sendCommand: NI MQTT klienta (${site.mqtt}) - ukaz ZAVRZEN`, true); showToast(T('alertNoMqtt')); return; }
  if(!c.connected){ logDebug(`sendCommand: MQTT klient obstaja a NI povezan (connected=false) - publish bo morda zavrzen/zamujen`, true); }
  const payload = JSON.stringify(obj);
  // GG11: QoS 0 - QoS 1 je cakal na PUBACK brokerja, kar je pri javnem
  // brokerju prek WebSocketa dodalo cel obhod pred dostavo napravi.
  // Ukaz je majhen; ob izgubi ga popravi naslednje stanje iz naprave.
  c.publish(`naprava/${site.id}/${subtopic}`, payload, {qos:0});
  expectAfterCommand(site, subtopic, obj);   // JJ6

  if(!quiet) logDebug(`PUB -> naprava/${site.id}/${subtopic} (${payload.length}B) qos0`);
}

// Poenostavljeno na DVE stanji: dokler ni potrjeno online, vedno OFFLINE.
// KK3: klik na znacko sprozi ponovno povezavo (vidneje od gumba Uporabi)
// ============================================================
// TT: DELOVANJE V OZADJU
// Brskalnik na Androidu zavihek v ozadju zadusi: casovniki se upocasnijo na
// ~1x/min, po nekaj minutah se stran lahko zamrzne ali odstrani iz pomnilnika.
// Tega z JavaScriptom ni mogoce povsem zaobiti. Kar naredimo:
//  TT2 - povezavo drzimo pri zivljenju (keepalive), da se ob vrnitvi ni treba
//        znova povezovati
//  TT3 - ob vrnitvi v ospredje takoj preverimo povezavo in prerisemo graf
//  TT4 - Wake Lock: dokler je zaslon prizgan in aplikacija odprta, prepreci
//        uspavanje (edina zanesljiva pot; telefon mora ostati odklenjen)
// Za DOLGE teste ostaja zanesljiva pot: Offline Guard IZKLOPLJEN - naprava
// dela avtonomno, telefon podatke pobere ob vrnitvi.
// ============================================================
/* ============================================================
   AE (V63): ZASLON NAJ OSTANE PRIZGAN
   ------------------------------------------------------------
   Screen Wake Lock API zahteva VAREN KONTEKST (HTTPS ali localhost).
   Aplikacija se odpira prek content:// oz. file://, zato brskalnik zahtevo
   zavrne - v dnevniku "Wake Lock permission request denied". To ni stvar
   dovoljenj in se ne bo popravilo samo.

   Nadomestna pot: predvajanje neslisnega videa v zanki. Android zaslona med
   predvajanjem ne ugasne, ker to obravnava kot dejavno medijsko sejo, in to
   deluje tudi zunaj varnega konteksta.

   AE2: video stece SELE, ce Wake Lock odpove - na HTTPS ga ne potrebujemo.
   AE4: samodejno predvajanje je blokirano, dokler uporabnik ni nicesar tapnil,
        zato pocakamo na prvo potezo.
   ============================================================ */
let KEEP_AWAKE = (lsGetPlain('rs_keepawake','1') !== '0');   // AE6
let _kaVideo = null, _kaArmed = false;

// Najmanjsi veljaven MP4: en crn okvir, brez zvoka. Vgrajen, da aplikacija
// ostane ena sama datoteka brez zunanjih odvisnosti.
const KA_MP4 = 'data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAAAr1tZGF0AAACrgYF//+q3EXpvebZSLeWLNgg2SPu73gyNjQgLSBjb3JlIDE1NSByMjkwMSA3ZDBmZjIyIC0gSC4yNjQvTVBFRy00IEFWQyBjb2RlYyAtIENvcHlsZWZ0IDIwMDMtMjAxOCAtIGh0dHA6Ly93d3cudmlkZW9sYW4ub3JnL3gyNjQuaHRtbAAAAABJ4QAAAAtliIQAP//+9vD+BTY7mNCXEc3onTMfvxW4';

function kaEnsureVideo(){
  if(_kaVideo) return _kaVideo;
  const v = document.createElement('video');
  v.src = KA_MP4;
  v.muted = true; v.defaultMuted = true;   // AE3: brez tega Android ne dovoli
  v.loop = true; v.playsInline = true; v.setAttribute('playsinline','');
  v.setAttribute('webkit-playsinline','');
  v.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;bottom:0;left:0';
  document.body.appendChild(v);
  _kaVideo = v;
  return v;
}
function kaStart(){
  if(!KEEP_AWAKE) return;
  const v = kaEnsureVideo();
  v.play().then(()=>logDebug('ZASLON: video tece, zaslon ne bo ugasnil'))
          .catch(e=>{
            if(!_kaArmed){
              _kaArmed = true;
              logDebug('ZASLON: cakam na prvi dotik (brskalnik blokira samodejno predvajanje)');
              const once = ()=>{ document.removeEventListener('touchstart', once);
                                 document.removeEventListener('click', once); kaStart(); };
              document.addEventListener('touchstart', once, {once:true});
              document.addEventListener('click', once, {once:true});
            }
          });
}
function setKeepAwake(on){
  KEEP_AWAKE = !!on;
  lsSetPlain('rs_keepawake', on ? '1' : '0');
  if(on){ requestWakeLock(); kaStart(); } else { kaStop(); }
  logDebug(`ZASLON: ${on ? 'ostane prizgan' : 'sme ugasniti'}`);
}
function kaStop(){ if(_kaVideo){ try{ _kaVideo.pause(); }catch(e){} } }   // AE5

let _bgSince = 0;   // AJ3 (V63)
let _wakeLock = null;
async function requestWakeLock(){
  try{
    if(!('wakeLock' in navigator)) return;
    _wakeLock = await navigator.wakeLock.request('screen');
    _wakeLock.addEventListener('release', ()=>logDebug('WakeLock: sproscen'));
    logDebug('WakeLock: aktiven (zaslon ne bo ugasnil)');
  }catch(e){
    // AE2/AE7: jasno povej, katera pot je dejavna
    logDebug(`ZASLON: Wake Lock ni na voljo (${e.message}) - uporabljam video`);
    kaStart();
  }
}

document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){
    logDebug('APP: v ozadju - izris ustavljen, sprejem podatkov tece naprej');
    _bgSince = Date.now();
    kaStop();          // AE5: video v ozadju ne rabi teci
    flushStore();      // AL2 (V63): vrsto takoj na disk - ob nenadnem zaprtju
                       // zavihka se je doslej izgubilo do 2 s zapisov
    return;
  }
  logDebug('APP: nazaj v ospredju');
    kaStart();   // AE5
    /* AJ1/AJ3 (V63): ob vrnitvi TAKOJ preveri vrzel, ne cakaj na naslednji
       zivi zapis. Doslej je vrzel nastala med zaklepom telefona, zaznala pa
       se je sele ob naslednjem prispelem zapisu - do tedaj je graf molcal. */
    const bgMs = _bgSince ? (Date.now() - _bgSince) : 0;
    _bgSince = 0;
    const sb = currentSite();
    if(sb && sb.opMode === 'real'){
      const L = ensureLive(sb.id), hi = HIST_INFO[sb.id];
      logDebug(`APP: v ozadju ${Math.round(bgMs/1000)}s`
             + (hi ? ` - naprava hrani ID ${hi.oldest}..${hi.newest}, mi do ${LAST_REC_ID[sb.id]||'-'}` : ''));
      if(hi && hi.newest && LAST_REC_ID[sb.id] && hi.newest > LAST_REC_ID[sb.id]){
        const from = Math.max(hi.oldest, LAST_REC_ID[sb.id] + 1);
        if(from <= hi.newest) requestGapFill(sb.id, from, hi.newest - from + 1);
      }
    }
  requestWakeLock();                       // TT4: wake lock se ob skritju sprosti
  kaStart();                               // AE5: video znova ob vrnitvi
  // TT3: povezavo lahko brskalnik med tem prekine - preveri in po potrebi obnovi
  Object.keys(mqttClients).forEach(b=>{
    const c = mqttClients[b];
    if(c && !c.connected){
      logDebug(`APP: povezava ${b} prekinjena med ozadjem - obnavljam`, true);
      histLoadedFrom = {};   // AB2: po vrnitvi znova prevzemi manjkajoci odsek
      try{ c.reconnect(); }catch(e){}
    }
  });
  Object.keys(mqttClients).forEach(b=>publishClientPresence(b, true));
  if(currentTab==='osciloskop') renderOscFull();
  if(currentTab==='nadzor') updateNadzorState();
});

let currentTab = 'nadzor';
function tabsForSite(){
  const s = currentSite();
  // vrstni red: Nadzor -> Osciloskop -> Simulator
  // Simulator je skrit, kadar naprava tece v nacinu Realno delovanje.
  const tabs = [{k:'nadzor', label:T('tabControl')}, {k:'osciloskop', label:T('tabOsc')}];
  if(!s || s.opMode!=='real') tabs.push({k:'simulator', label:T('tabSim')});
  return tabs;
}
function renderTabs(){
  const tabs = tabsForSite();
  setTimeout(syncTopHeight, 0); // po izrisu zavihkov osvezi visino glave
  if(!tabs.find(t=>t.k===currentTab)) currentTab = 'nadzor';
  const bar = document.getElementById('tabsBar');
  bar.innerHTML = '';
  tabs.forEach(t=>{
    const b = document.createElement('button');
    b.textContent = t.label;
    b.setAttribute('aria-selected', t.k===currentTab ? 'true':'false');
    b.onclick = ()=>switchTab(t.k);
    bar.appendChild(b);
  });
  document.getElementById('tab-nadzor').classList.toggle('show', currentTab==='nadzor');
  document.getElementById('tab-simulator').classList.toggle('show', currentTab==='simulator');
  document.getElementById('tab-osciloskop').classList.toggle('show', currentTab==='osciloskop');
}
function switchTab(t){
  currentTab = t;
  renderTabs();
  if(t==='nadzor'){
    renderNadzorControls();
    // AL2: Nadzor sam sprozi poln podatkovni tok - scope/set se je prej
    // posiljal SAMO ob odprtju Osciloskopa, zato bi Nadzor ob prvi prijavi
    // ostal trajno v "cakam na podatke" (AL6), ce uporabnik nikoli ne odpre
    // zavihka Osciloskop.
    const st = currentSite();
    if(st && st.opMode === 'real') sendCommand(st, 'scope/set', { timebase_ms: OSC_TIMEBASE });
  }
  if(t==='simulator') renderSimulatorControls();
  if(t==='osciloskop'){
    renderOscFull();
    const st = currentSite();   // DD6: takoj zahtevaj izbrano casovno bazo
    if(st && st.opMode === 'real'){
      sendCommand(st, 'scope/set', { timebase_ms: OSC_TIMEBASE });
      // B1/B2 (V57): NAJPREJ napolni graf z diska, SELE NATO zahtevaj od
      // naprave - in to samo tisto, cesar nimamo. Prej se je ob vsakem
      // odprtju brezpogojno zahtevalo zadnjih 500 zapisov prek javnega
      // brokerja, tudi ce so bili isti zapisi ze veckrat preneseni.
      loadFromDisk(st.id).then(()=>{
        if(histLoadedFrom[st.id]) return;
        const have = LAST_REC_ID[st.id] || 0;
        const info = HIST_INFO[st.id];
        if(have > 0){
          // imamo zapise z diska - zahtevaj samo novejse od zadnjega
          let from = have + 1;
          if(info && info.oldest && from < info.oldest) from = info.oldest;
          histLoadedFrom[st.id] = from;
          logDebug(`ZGODOVINA ${st.id}: z diska imamo do ID ${have} - zahtevam samo od ${from} naprej`);
          setTimeout(()=>requestHistory(st, from, HIST_FIRST), 600);
        } else {
          const from = Math.max(1, (LAST_REC_ID[st.id]||1) - HIST_FIRST);
          histLoadedFrom[st.id] = from;
          setTimeout(()=>requestHistory(st, from, HIST_FIRST), 600);
        }
      });
    }
  }
}

/* ============================================================
   ZAVIHEK: NADZOR
   POMEMBNA ARHITEKTURNA LOCITEV (popravek napake - polje/select se
   je prej zaprlo takoj ob dotiku, ker je periodicen prihod podatkov
   sprozil poln innerHTML rebuild):
   - renderNadzorControls() gradi UREJEVALNE kontrole (kartice,
     gumbi, polja) in se klice SAMO ob menjavi zavihka/naprave/jezika.
   - updateNadzorState() periodicno osvezuje SAMO prikaz trenutnega
     stanja (badge-i, analogne vrednosti) preko direktnega DOM zapisa
     (textContent/classList) - NIKOLI ne pokliče innerHTML na kontrolah.
   ============================================================ */
const STEP_VALUES = [0.5,1,2,5,10,20,30,50];
let relUIMode = {0:'manual',1:'manual',2:'manual',3:'manual'};
let srvUIMode = {0:'manual',1:'manual'};

// Trajno shranjeno "zadnje poslano stanje" vsakega releja/servota, per
// naprava - popravek: kartice so se prej ob vsakem izrisu (npr. vrnitev
// iz Osciloskopa) resetirale na trdo kodirane privzete vrednosti namesto
// da bi pokazale dejansko zadnje stanje.
let UICMD = lsGet('rs_uicmd', {});
function saveUICmd(){ lsSet('rs_uicmd', UICMD); }
/* ============================================================
   T5 (V58): ZASCITA KARTICE MED UREJANJEM
   ------------------------------------------------------------
   stanje/izhodi je RETAINED in prispe kadarkoli. Brez te zascite bi
   uporabniku povozilo vnos sredi tipkanja Ton/Toff ali takoj po pritisku
   na Perioda, se preden bi naprava ukaz sprejela.

   Kartica je "zaklenjena" od trenutka, ko jo uporabnik spremeni, do
   potrditve z naprave ali do izteka CARD_LOCK_MS.
   ============================================================ */
const CARD_LOCK_MS = 6000;
let CARD_LOCK = {};   // "dev|rele|0" -> cas zaklepa

function cardKey(dev, kind, i){ return `${dev}|${kind}|${i}`; }
function cardLock(dev, kind, i){ CARD_LOCK[cardKey(dev,kind,i)] = Date.now(); }
function cardUnlock(dev, kind, i){ delete CARD_LOCK[cardKey(dev,kind,i)]; }
function cardLocked(dev, kind, i){
  const t = CARD_LOCK[cardKey(dev,kind,i)];
  if(t === undefined) return false;
  if(Date.now() - t > CARD_LOCK_MS){ cardUnlock(dev,kind,i); return false; }
  return true;
}

/* T6 (V58): ko naprava javi stanje, ki se ujema z nasim ukazom, je ukaz
   POTRJEN - zaklep spustimo. Prej je potrditev slonela na ugibanju iz
   relBits v scope/data, kar za NACIN sploh ni bilo mogoce preveriti. */
function outPendingClear(dev, d){
  if(Array.isArray(d.rele)) d.rele.forEach((r,i)=>{
    if(i>3 || !cardLocked(dev,'rele',i)) return;
    const uc = ensureUICmd(dev);
    const m = (r.m==='blink') ? 'period' : 'manual';
    if(uc.rele[i].mode !== m) return;
    if(m==='period' && (uc.rele[i].ton !== r.ton || uc.rele[i].toff !== r.toff)) return;
    if(m==='manual' && !!uc.rele[i].on !== !!r.s) return;
    cardUnlock(dev,'rele',i);
    logDebug(`IZHODI ${dev}: R${i+1} potrjen z naprave`);
  });
  if(Array.isArray(d.servo)) d.servo.forEach((v,i)=>{
    if(i>1 || !cardLocked(dev,'servo',i)) return;
    const uc = ensureUICmd(dev);
    const m = (v.m==='oscillate') ? 'period' : 'manual';
    if(uc.servo[i].mode !== m) return;
    cardUnlock(dev,'servo',i);
    logDebug(`IZHODI ${dev}: S${i+1} potrjen z naprave`);
  });
}

function ensureUICmd(id){
  if(!UICMD[id]) UICMD[id] = {
    rele: [0,1,2,3].map(()=>({mode:'manual', on:false, ton:1, toff:1})),
    servo: [0,1].map(()=>({mode:'manual', on:false, posOff:0, posOn:255, pos:0, rampMs:0, posA:0, posB:255, ton:1, toff:1, rampMsP:0}))
  };
  UICMD[id].servo.forEach(sv=>{ // migracija starejsih zapisov
    if(sv.on===undefined) sv.on=false;
    if(sv.posOff===undefined) sv.posOff=0;
    if(sv.posOn===undefined) sv.posOn=255;
  });
  return UICMD[id];
}

function nearestStepIdx(v){
  let bi=0, bd=Infinity;
  STEP_VALUES.forEach((sv,i)=>{ const d=Math.abs(sv-v); if(d<bd){bd=d; bi=i;} });
  return bi;
}

function relayCardHtml(i, r){
