  // Razlika med "nastavljeno" in "dejansko" je tako vidna brez odpiranja
  // osciloskopa - prav ta razlika je bila prej neopazna.
  const st = currentSite();
  const live = st ? ensureLive(st.id) : null;
  const isLive = !!(live && live.rele && live.rele[i]);
  const dot = `<span class="livedot ${isLive?'on':''}" id="relLive${i}"
                     title="${T('actualState')}"></span>`;
  return `<div class="unit-card" id="relayCard${i}">
    <div class="uc-head"><span class="nm">${T('relayN')} ${i+1}</span>${dot}</div>
    <div class="mtog">

    </div>
    <div id="relManual${i}" style="display:${r.mode==='manual'?'block':'none'}">
      <button class="onoff-btn ${onCls}" id="relOnOff${i}" onclick="toggleRelOnOff(${i})">${onTxt}</button>
    </div>
    <div id="relPeriod${i}" style="display:${r.mode==='period'?'block':'none'}">
      <div class="tblock"><div class="trow">

function stepSliderChange(fieldId, idx){
  document.getElementById(fieldId).value = STEP_VALUES[parseInt(idx)];
}
function syncStepSlider(fieldId, sliderId){
  const v = parseFloat(document.getElementById(fieldId).value)||1;
  document.getElementById(sliderId).value = nearestStepIdx(v);
}
// Gumb "Poslji" je ukinjen - vsaka sprememba (klik ON/OFF, sprememba
// Ton/Toff/pozicije, preklop Rocno/Perioda) se poslje takoj IN se shrani
// v UICMD, da se ob naslednjem izrisu kartice pravilno obnovi.
function setRelMode(i,m){
  relUIMode[i]=m;
  document.querySelectorAll(`#relayCard${i} .mtog button`).forEach(b=>b.classList.toggle('active', b.dataset.m===m));
  document.getElementById('relManual'+i).style.display = m==='manual' ? 'block':'none';
  document.getElementById('relPeriod'+i).style.display = m==='period' ? 'block':'none';
  sendRelay(i);
}
function setSrvMode(i,m){
  srvUIMode[i]=m;
  document.querySelectorAll(`#servoCard${i} .mtog button`).forEach(b=>b.classList.toggle('active', b.dataset.m===m));
  document.getElementById('srvManual'+i).style.display = m==='manual' ? 'block':'none';
  document.getElementById('srvPeriod'+i).style.display = m==='period' ? 'block':'none';
  sendServo(i);
}
function toggleRelOnOff(i){
  const btn = document.getElementById('relOnOff'+i);
  const goingOn = btn.classList.contains('off');
  btn.classList.toggle('on', goingOn);
  btn.classList.toggle('off', !goingOn);
  btn.textContent = goingOn ? T('lblOn') : T('lblOff');
  // GG12: stanje zapisemo TAKOJ v lokalni model (optimisticno) - badge in
  // graf se odzoveta v istem trenutku, ne sele po dvojnem obhodu prek
  // brokerja. Ko prispe pravo stanje iz naprave, ga prepise.
  const s = currentSite();
  if(s){ const L = ensureLive(s.id); L.rele[i] = goingOn; }
  sendRelay(i);
  updateNadzorState();   // GG13: takoj, ne sele ob naslednjem 250ms ciklu
}

function renderNadzorControls(){
  const el = document.getElementById('tab-nadzor');
  const s = currentSite();
  if(!s){ el.innerHTML = `<div class="empty">${T('emptyNoDevice')}</div>`; return; }

  // AL6: naprava trenutno posilja samo ping (klient se ni pridruzil aktivnemu
  // toku) - prikaz stanja bi bil zavajajoc, ker je zastarel.
  const L1 = ensureLive(s.id);
  if(L1.pinging && s.opMode === 'real'){
    el.innerHTML = `<div class="empty">${T('waitingForData')}</div>`;
    return;
  }
  /* V5 (V60): stanje/izhodi je RETAINED. Ko naprava ugasne, LWT postavi
     status na offline, retained sporocilo pa OSTANE na brokerju - aplikacija
     bi torej se naprej kazala "Perioda, Ton 1", ceprav ni nikogar, ki bi to
     izvajal. Pri napravi, ki krmili resnicno opremo, je to najslabsa vrsta
     zavajanja, zato prikaz izrecno oznacimo kot zadnje znano stanje. */
  if(s.opMode === 'real' && L1.outFromDevice && !L1.online){
    el.classList.add('stale-outputs');
    el.setAttribute('data-stale', T('outStale'));
    for(let i=0;i<4;i++){ const dd=document.getElementById('relLive'+i); if(dd) dd.classList.remove('on'); }
  } else {
    el.classList.remove('stale-outputs');
  }
  // V3 (V58): dokler prvo stanje/izhodi ne prispe, ne kazemo vrednosti iz
  // prejsnje seje - te so po ponovnem zagonu naprave lahko povsem napacne.
  if(s.opMode === 'real' && !L1.outFromDevice){
    el.innerHTML = `<div class="empty">${T('waitingOutputs')}</div>`;
    return;
  }

  const uc = ensureUICmd(s.id);
  relUIMode = {}; srvUIMode = {};
  for(let i=0;i<4;i++) relUIMode[i] = uc.rele[i].mode;
  for(let i=0;i<2;i++) srvUIMode[i] = uc.servo[i].mode;

  const L0 = ensureLive(s.id);
  const binOn = !!L0.binOn;
  const binPeriod = L0.binPeriod || 1;

  // Ko tece binarno periodicno stetje, so posamezne rele kartice zaklenjene
  // (krmili jih stevec). Zaklep velja tudi, dokler naprava ni online.
  let relBody = '';
  if(binOn) relBody += `<div class="locknote">${T('binLockNote')}</div>`;
  relBody += `<div class="${binOn?'locked':''}">`;
  for(let i=0;i<4;i++) relBody += relayCardHtml(i, uc.rele[i]);
  relBody += `</div>`;
  relBody += `<div class="unit-card sep">
    <div class="uc-head"><span class="nm">${T('lblBinCounter')}</span>
      <span class="tag ${binOn?'on':''}" id="binBadge">${binOn?T('stateActive'):T('stateInactive')}</span></div>
    <button class="onoff-btn ${binOn?'on':'off'}" id="binOnOff" onclick="toggleBinCounter()">${binOn?T('lblOn'):T('lblOff')}</button>
    <div class="tblock" style="margin-top:8px"><div class="trow">
      <label>${T('lblBinPeriod')}</label>
      <input type="number" inputmode="decimal" id="binPeriod" value="${binPeriod}" min="0.1" max="50" step="0.1" onclick="this.select()" onfocus="this.select()"
             onchange="syncStepSlider('binPeriod','binPeriodSl'); sendBinary();">
      <span class="small" id="binValShow">${T('lblBinValue')}: 0</span>
    </div><input type="range" class="stepslider" id="binPeriodSl" min="0" max="7" value="${nearestStepIdx(binPeriod)}"
           oninput="stepSliderChange('binPeriod', this.value)" onchange="sendBinary()"></div>
  </div>`;

  let srvBody = '';
  for(let i=0;i<2;i++) srvBody += servoCardHtml(i, uc.servo[i]);

  let anBody = '<div class="analog">';
  for(let i=1;i<=4;i++){
    anBody += `<div class="a"><b id="anVal${i}">—</b><span>${T('inputN')} ${i} [V]</span></div>`;
  }
  anBody += '</div>';

  let h = '';
  h += cardHtml('releji', T('cardRelays'), 'hRelays', relBody);
  h += cardHtml('servo', T('cardServo'), 'hServo', srvBody);
  h += cardHtml('analog', T('cardAnalog'), 'hAnalog', anBody);

  // Dokler naprava ni online, so VSE kontrole onemogocene - stanje se
  // pridobi iz naprave, ne iz lokalnega predpomnilnika.
  if(!isDeviceOnline()) h = `<div class="locknote">${T('waitOnline')}</div>` +
                            `<div class="locked">${h}</div>`;

  el.innerHTML = h;

  updateNadzorState(); // takoj napolni vrednosti z zadnjim znanim stanjem naprave
}

// Periodicna, NEDESTRUKTIVNA osvezitev.
// Locene "Trenutno" znacke so odstranjene - gumb ON/OFF in polje Pozicija
// STA SAMA prikaz resnicnega stanja naprave (sinhronizirata se s tem, kar
// naprava javi, ne le s tem, kar smo poslali iz tega brskalnika).
let lastOnlineFlag = null, lastBinOnFlag = null;
let lastPingingFlag = null;   // AL6
function updateNadzorState(){
  if(currentTab!=='nadzor') return;
  const s = currentSite(); if(!s) return;
  const L = ensureLive(s.id);

  // Sprememba online ali binOn zahteva PONOVEN IZRIS (zaklep/odklep kontrol)
  const on = isDeviceOnline();
  if(lastOnlineFlag !== on || lastBinOnFlag !== !!L.binOn){
    lastOnlineFlag = on; lastBinOnFlag = !!L.binOn;
    renderNadzorControls();
    return;
  }

  // Releji: gumb ON/OFF odraza DEJANSKO stanje naprave
  for(let i=0;i<4;i++){
    const btn = document.getElementById('relOnOff'+i);
    if(!btn) continue;
    const isOn = !!L.rele[i];
    if(btn.classList.contains('on') !== isOn){
      btn.classList.toggle('on', isOn);
      btn.classList.toggle('off', !isOn);
      btn.textContent = isOn ? T('lblOn') : T('lblOff');
    }
  }
  const binBadge = document.getElementById('binBadge');
  if(binBadge){ binBadge.textContent = L.binOn?T('stateActive'):T('stateInactive'); binBadge.classList.toggle('on', !!L.binOn); }
  const binValShow = document.getElementById('binValShow');
  if(binValShow) binValShow.textContent = T('lblBinValue')+': '+(L.binarno||0);

  // Servo: gumb ON/OFF odraza, v kateri legi je naprava dejansko
  // (primerja se z definiranima legama posOff/posOn, s toleranco za rampo)
  const ucS = ensureUICmd(s.id);
  for(let i=0;i<2;i++){
    const btn = document.getElementById('srvOnOff'+i);
    if(!btn) continue;
    const cur = L.servo[i]||0;
    const dOn = Math.abs(cur - (ucS.servo[i].posOn||255));
    const dOff = Math.abs(cur - (ucS.servo[i].posOff||0));
    const isOn = dOn < dOff;
    if(btn.classList.contains('on') !== isOn){
      btn.classList.toggle('on', isOn); btn.classList.toggle('off', !isOn);
      btn.textContent = isOn ? T('lblOn') : T('lblOff');
    }
  }
  // V1: pika sledi dejanskemu stanju z naprave (relBits iz scope/data)
  for(let i=0;i<4;i++){
    const dot = document.getElementById('relLive'+i);
    if(dot) dot.classList.toggle('on', !!(L.rele && L.rele[i]));
  }
  for(let i=1;i<=4;i++){
    const v = L.analog['a'+i];
    const el = document.getElementById('anVal'+i);
    if(el) el.textContent = v!==undefined ? v.toFixed(1) : '—';
  }
}

// Namenski neodvisen cikel (0.25s) - NE čaka na dogodek (MQTT/sim tick),
// ampak redno prebere trenutno LIVE stanje in ga izriše. Prej se je
// osvežitev zanašala izključno na dogodke, kar je skupaj z zgornjim
// bug-om (tiha prekinitev) delovalo šele po dolgi zakasnitvi ali sploh ne.
setInterval(()=>{ updateNadzorState(); }, 250);

function sendRelay(i){
  const s = currentSite(); if(!s) return;
  const uc = ensureUICmd(s.id);
  cardLock(s.id, 'rele', i);   // T5: do potrditve naprava tega vnosa ne povozi
  const mode = relUIMode[i]||'manual';
  uc.rele[i].mode = mode;
  if(mode==='manual'){
    const isOn = document.getElementById('relOnOff'+i).classList.contains('on');
    uc.rele[i].on = isOn;
    sendCommand(s, `rele/${i+1}/set`, { mode:'static', state: isOn });
  } else {
    const tonV = parseFloat(document.getElementById('relTon'+i).value);
    const toffV = parseFloat(document.getElementById('relToff'+i).value);
    const ton = isNaN(tonV)?1:tonV, toff = isNaN(toffV)?1:toffV;
    uc.rele[i].ton = ton; uc.rele[i].toff = toff;
    sendCommand(s, `rele/${i+1}/set`, { mode:'blink', ton, toff });
  }
  saveUICmd();
}
// Binarno periodicno stetje: {"on":bool,"perioda":sekunde}
// (staticni binarni nacin z vrednostjo 0-15 je odstranjen - za rocno
// kombinacijo zadostuje rocni ON/OFF na vsakem releju posebej)
function sendBinary(){
  const s = currentSite(); if(!s) return;
  const L = ensureLive(s.id);
  const perioda = Math.max(0.1, parseFloat(document.getElementById('binPeriod').value)||1);
  sendCommand(s, 'binarno/set', { on: !!L.binOn, perioda });
}
function toggleBinCounter(){
  const s = currentSite(); if(!s) return;
  const L = ensureLive(s.id);
  const perioda = Math.max(0.1, parseFloat(document.getElementById('binPeriod').value)||1);
  sendCommand(s, 'binarno/set', { on: !L.binOn, perioda });
}
// Rocni servo: vnesene vrednosti se uveljavijo SELE ob kliku na ON/OFF.
function toggleSrvOnOff(i){
  const btn = document.getElementById('srvOnOff'+i);
  const goingOn = btn.classList.contains('off');
  btn.classList.toggle('on', goingOn);
  btn.classList.toggle('off', !goingOn);
  btn.textContent = goingOn ? T('lblOn') : T('lblOff');
  const s = currentSite(); if(!s) return;
  const uc = ensureUICmd(s.id);
  const posOff = parseInt(document.getElementById('srvPosOff'+i).value); 
  const posOn  = parseInt(document.getElementById('srvPosOn'+i).value);
  // M2: cas prehoda pod 50ms je pri vzorcenju neviden -> ali 0 (takojsen
  // skok) ali najmanj 50ms; vmesne vrednosti dvignemo na 50.
  let rampMs = parseInt(document.getElementById('srvRampM'+i).value)||0;
  if(rampMs > 0 && rampMs < 50){ rampMs = 50; document.getElementById('srvRampM'+i).value = 50; }
  uc.servo[i].posOff = isNaN(posOff)?0:posOff;
  uc.servo[i].posOn  = isNaN(posOn)?255:posOn;
  uc.servo[i].rampMs = rampMs;
  uc.servo[i].on = goingOn;
  uc.servo[i].mode = 'manual';
  saveUICmd();
  const targetPos = goingOn ? uc.servo[i].posOn : uc.servo[i].posOff;
  const L = ensureLive(s.id); L.servo[i] = targetPos;   // GG12: optimisticno
  sendCommand(s, `servo/${i+1}/set`, {
    mode:'static', pos: targetPos,
    posOff: uc.servo[i].posOff, posOn: uc.servo[i].posOn, rampMs });
  updateNadzorState();   // GG13
}

function sendServo(i){
  const s = currentSite(); if(!s) return;
  cardLock(s.id, 'servo', i);   // T5
  const uc = ensureUICmd(s.id);
  const mode = srvUIMode[i]||'manual';
  uc.servo[i].mode = mode;
  if(mode==='manual'){
    // O1: ob preklopu Perioda->Rocno je treba napravi POVEDATI, da preneha
    // nihati. Prejsnji `return` je pomenil, da ukaz ni bil poslan in je
    // servo nihal naprej, dokler uporabnik ni kliknil ON/OFF.
    const uc2 = uc.servo[i];
    let rampMs = parseInt(document.getElementById('srvRampM'+i).value)||0;
    if(rampMs > 0 && rampMs < 50){ rampMs = 50; document.getElementById('srvRampM'+i).value = 50; }
    const posOff = parseInt(document.getElementById('srvPosOff'+i).value);
    const posOn  = parseInt(document.getElementById('srvPosOn'+i).value);
    uc2.posOff = isNaN(posOff)?0:posOff;
    uc2.posOn  = isNaN(posOn)?255:posOn;
    uc2.rampMs = rampMs;
    saveUICmd();
    sendCommand(s, `servo/${i+1}/set`, {
      mode:'static', pos: uc2.on ? uc2.posOn : uc2.posOff,
      posOff: uc2.posOff, posOn: uc2.posOn, rampMs });
    return;
  } else {
    const posA = parseInt(document.getElementById('srvPosA'+i).value)||0;
    const posB = parseInt(document.getElementById('srvPosB'+i).value)||255;
    const tonV = parseFloat(document.getElementById('srvTon'+i).value);
    const toffV = parseFloat(document.getElementById('srvToff'+i).value);
    const ton = isNaN(tonV)?1:tonV, toff = isNaN(toffV)?1:toffV;
    let rampMs = parseInt(document.getElementById('srvRampP'+i).value)||0;
    if(rampMs > 0 && rampMs < 50){ rampMs = 50; document.getElementById('srvRampP'+i).value = 50; }
    uc.servo[i].posA=posA; uc.servo[i].posB=posB; uc.servo[i].ton=ton; uc.servo[i].toff=toff; uc.servo[i].rampMsP=rampMs;
    sendCommand(s, `servo/${i+1}/set`, { mode:'oscillate', posA, posB, ton, toff, rampMs });
  }
  saveUICmd();
}

/* ============================================================
   NASTAVITVE - seznam naprav
   ============================================================ */
// A: gumb SHRANI je EDINI nacin shranjevanja. Polja pisejo samo v osnutek
// (DRAFT); nic se ne shrani lokalno in nic ne poslje napravi do klika Shrani.
let DRAFT = null;
/* ============================================================
   S2/S4/S8 (V57): POTRJEVANJE NASTAVITEV
   ------------------------------------------------------------
   expectAfterCommand() je pokrival rele/servo/binarno - ti se ob
   nepotrditvi po 500 ms samodejno ponovijo. config/set NI bil na seznamu,
   zato se je izguba tiho pozrla: brez ponovitve, brez opozorila. Zato je
   izgledalo, da "gumbi delujejo, nastavitve pa ne".
   ============================================================ */
let CFG_PENDING = {};     // id -> { want, tries, at }
let CFG_LAST = {};        // id -> zadnje potrjeno stanje (za S8 izpis razlik)
const CFG_RETRY_MS = 800, CFG_TRIES = 3;

function cfgMatches(id, want){
  const L = ensureLive(id);
  if(!!L.offlineGuard !== !!want.offlineGuard) return false;
  if(!!L.bootRestore  !== !!want.bootRestore)  return false;
  if((L.offlineTimeoutS|0) !== (want.offlineTimeoutS|0)) return false;
  // N7 (V60): vsaka nastavitev, ki gre prek config/set, MORA biti tudi tu.
  // Brez tega bi nova nastavitev vedno veljala za potrjeno - tudi ce je
  // naprava sploh ne bi prejela. Natanko ta tiha napaka je bila izhodisce
  // celotnega sklopa S iz V57.
  if((L.samplePriority|0) !== (want.samplePriority|0)) return false;
  // AT4/N7 (V63): tudi nove nastavitve morajo biti tu, sicer bi vedno veljale
  // za potrjene, tudi ce jih naprava ne bi prejela.
  if((L.heartbeatMs|0) !== (want.heartbeatMs|0)) return false;
  if((L.adcPct|0)  !== (want.adcPct|0))  return false;
  if((L.adcMinT|0) !== (want.adcMinT|0)) return false;
  if((L.logAll|0)  !== (want.logAll|0))  return false;
  return true;
}

// zaganja se ob vsakem prejetem config/stanje in periodicno
function cfgPendingTick(){
  for(const id of Object.keys(CFG_PENDING)){
    const p = CFG_PENDING[id];
    const site = CFG.sites.find(x=>x.id===id);
    if(!site){ delete CFG_PENDING[id]; continue; }
    if(cfgMatches(id, p.want)){
      logDebug(`NASTAVITVE ${id}: potrjene z naprave`);
      delete CFG_PENDING[id];
      renderSettings();
      continue;
    }
    if(Date.now() - p.at < CFG_RETRY_MS) continue;
    p.tries++;
    if(p.tries < CFG_TRIES){
      p.at = Date.now();
      logDebug(`NASTAVITVE ${id}: NI potrditve - ponavljam (${p.tries}/${CFG_TRIES-1})`, true);
      sendCommand(site, 'config/set', p.want);
    } else {

function logCfgDiff(id){
  const L = ensureLive(id);
  const now = { g:!!L.offlineGuard, b:!!L.bootRestore, t:L.offlineTimeoutS|0, fw:L.fw||'?' };
  const was = CFG_LAST[id];
  CFG_LAST[id] = now;
  if(!was) return;
  const ch = [];
  if(was.g !== now.g) ch.push(`offlineGuard ${was.g}->${now.g}`);
  if(was.b !== now.b) ch.push(`bootRestore ${was.b}->${now.b}`);
  if(was.t !== now.t) ch.push(`timeout ${was.t}s->${now.t}s`);
  if(was.fw !== now.fw) ch.push(`firmware ${was.fw}->${now.fw}`);
  if(ch.length) logDebug(`NASTAVITVE ${id}: naprava javlja spremembo - ${ch.join(', ')}`);
}

function ensureDraft(){
  if(!DRAFT){
    DRAFT = { sites: JSON.parse(JSON.stringify(CFG.sites)), cfg:{} };
    CFG.sites.forEach(s=>{
      const L = ensureLive(s.id);
      DRAFT.cfg[s.id] = { offlineGuard:!!L.offlineGuard, bootRestore:!!L.bootRestore,
                          offlineTimeoutS: L.offlineTimeoutS||60,
                          samplePriority: L.samplePriority|0,
                          heartbeatMs: L.heartbeatMs||1000, adcPct: L.adcPct===undefined?10:L.adcPct,
                          adcMinT: L.adcMinT===undefined?3:L.adcMinT, logAll: L.logAll|0 };
    });

}

// NN2/NN3/NN4: ob spremembi ID je treba PRESELITI vse, kar je indeksirano
// po starem ID (DRAFT.cfg, UICMD, LIVE). Prav to je bilo prej razbito in
// zato je bil ID zaklenjen - zdaj je vzrok odpravljen namesto zaobiden.
function draftSetId(i, raw){
  const d = ensureDraft();
  const oldId = d.sites[i].id;
  // NN4: normalizacija - velike crke, samo hex, najvec 6 znakov
  const newId = String(raw||'').toUpperCase().replace(/[^0-9A-F]/g,'').slice(0,6);
  if(!newId || newId === oldId){ renderSettings(); return; }

  d.sites[i].id = newId;
  if(d.cfg[oldId]){ d.cfg[newId] = d.cfg[oldId]; delete d.cfg[oldId]; }
  if(UICMD[oldId]){ UICMD[newId] = UICMD[oldId]; delete UICMD[oldId]; saveUICmd(); }
  if(LIVE[oldId]){ LIVE[newId] = LIVE[oldId]; delete LIVE[oldId]; }
  if(SIMS[oldId]){ SIMS[newId] = SIMS[oldId]; delete SIMS[oldId]; saveSims(); }
  delete LAST_REC_ID[oldId]; delete CLOCK_OFF[oldId];
  // E2 (V57): s preimenovanjem naprave se mora preseliti tudi njena lokalna
  // shramba, sicer bi zapisi obviseli pod starim ID in bi se graf zacel
  // graditi znova z nic.
  if(SEEN[oldId]){ SEEN[newId] = SEEN[oldId]; delete SEEN[oldId]; }
  if(BOOT_ID[oldId]){ BOOT_ID[newId] = BOOT_ID[oldId]; delete BOOT_ID[oldId]; }
  if(OSCBUF[oldId]){ OSCBUF[newId] = OSCBUF[oldId]; delete OSCBUF[oldId]; }
  delete LOADED[oldId]; delete LOADED[newId];
  storeRename(oldId, newId);
  logDebug(`ID naprave spremenjen: ${oldId} -> ${newId} (nastavitve in lokalna shramba prenesene)`);
  markDirty(); renderSettings();
}

/* ============================================================
   SIMULATOR (per naprava, glede na opMode)
   ============================================================ */
function tickRelaySim(r, now){
  if(r.mode!=='blink') return;
  const durMs = (r.phaseOn ? r.ton : r.toff) * 1000;
  if(now - r.last >= durMs){ r.phaseOn = !r.phaseOn; r.state = r.phaseOn; r.last = now; }
}
// Vrne true, ko je rampa dokoncana. Identicno firmware advanceRamp():
// cas prehoda je HITROST premika, pozicija se interpolira med legama.
// Virtualna naprava (sim_broker) objavi zacetek rampe kot dogodek -
// enak protokol kot firmware startServoRamp().
// GG8: simPublishRamp odstranjen - rampa je vidna skozi zaporedne zapise

function advanceRampSim(sv, now){
  if(sv.pos === sv.target) return true;
  if(!sv.rampMs){ sv.pos = sv.target; return true; }
  const frac = (now - (sv.rampStart||0)) / sv.rampMs;
  if(frac >= 1) sv.pos = sv.target;
  else sv.pos = Math.max(0, Math.min(255, Math.round(sv.rampFrom + (sv.target - sv.rampFrom) * frac)));
  return sv.pos === sv.target;
}

// 4-FAZNI CIKEL (identicno firmware tickServos):
//   RAMP_A (rampMs) -> HOLD_A (ton) -> RAMP_B (rampMs) -> HOLD_B (toff) -> ...
// Cas prehoda se PRISTEVA zadrzevalnemu casu, ne tece vzporedno z njim.
function tickServoSim(sv, now, site, idx){
  if(sv.mode!=='oscillate'){
    advanceRampSim(sv, now); // rocni nacin: samo dokoncaj morebitno rampo
    return;
  }
  switch(sv.phase){
    case 'RAMP_A':
      if(advanceRampSim(sv, now)){ sv.phase='HOLD_A'; sv.phaseStart=now; }
      break;
    case 'HOLD_A':
      if(now - sv.phaseStart >= sv.ton*1000){
        sv.rampFrom = sv.pos; sv.target = sv.posB;
        sv.rampStart = now; sv.phase='RAMP_B'; sv.phaseStart = now;
      }
      break;
    case 'RAMP_B':
      if(advanceRampSim(sv, now)){ sv.phase='HOLD_B'; sv.phaseStart=now; }
      break;
    case 'HOLD_B':
      if(now - sv.phaseStart >= sv.toff*1000){
        sv.rampFrom = sv.pos; sv.target = sv.posA;
        sv.rampStart = now; sv.phase='RAMP_A'; sv.phaseStart = now;
      }
      break;
    default: sv.phase='RAMP_A'; sv.phaseStart=now;
  }
}

// POPOLNOMA POENOSTAVLJENA LOGIKA (popravek): prej je applySimCommand()
// posodobil SAMO interni `sim` objekt - povezava do LIVE (od koder se
// bere prikaz) je tekla IZKLJUCNO skozi periodicni tick, ta pa je bil
// pogojen z "sim.running" (Start). Ce simulator ni bil zagnan, se ukaz
// ni nikoli prikazal - "vklop/izklop se ni prenesel".
// Zdaj: vsak ukaz TAKOJ izracuna in zapise trenutno stanje (klic spodaj),
// "running" pa vpliva SAMO na to, ali Ton/Toff/nihanje casovniki tecejo
// naprej (blinka/niha) - ne vec na to, ali se stanje sploh prikaze.
// GG8/GG9: virtualna naprava oddaja ENAK enoten 19B zapis kot firmware -
// ena sama pot, brez dogodkov. sim_local zapise naravnost v buffer,
// sim_broker pa objavi prek MQTT in prejme nazaj (test prave poti).
let SIM_REC_ID = {};
function simEncodeRecord(sim, releState, servoState, now){
  const buf = new ArrayBuffer(8 + 19);
  const dv = new DataView(buf);
  dv.setUint32(0, 100, true);      // timebase (informativno)
  dv.setUint16(4, 1, true);        // n = 1 zapis
  dv.setUint16(6, 0, true);
  const relBits = releState.reduce((a,b,i)=>a|(b?(1<<i):0), 0);
  dv.setUint32(8, ++sim._recId, true);
  // MM2: cas od ZAGONA STRANI (kot millis() na ESP32), ne odrezan Unix cas.
  // Prej je bil zapisan `Date.now() >>> 0`, zato je bil izracunani odmik ure
  // ~1.79e12 ms (56 let) in vsi vzorci so pristali na napacnem casu.
  dv.setUint32(12, Math.round(performance.now()) >>> 0, true);
  dv.setUint8(16, relBits);
  dv.setUint8(17, servoState[0]); dv.setUint8(18, servoState[1]);
  dv.setUint16(19, Math.round((sim.analog.a1||0)*10), true);
  dv.setUint16(21, Math.round((sim.analog.a2||0)*10), true);
  dv.setUint16(23, Math.round((sim.analog.a3||0)*10), true);
  dv.setUint16(25, Math.round((sim.analog.a4||0)*10), true);
  return new Uint8Array(buf);
}

// JJ7: virtualna naprava simulira CELOTEN Offline Guard mehanizem -
// izguba klienta -> cakanje timeouta -> prisilni OFF -> ponovna prijava.
// Prej je simulator config/set le shranil, delovanja pa ni posnemal, zato
// tega dela protokola ni bilo mogoce preizkusiti brez prave naprave.
function simOfflineGuardTick(site, sim, now){
  const L = ensureLive(site.id);
  if(!L.offlineGuard){ sim._forcedOff = false; sim._clientGoneAt = 0; return false; }
  // klient je "prisoten", dokler tece heartbeat (v simulaciji: stran je odprta)
  const clientOnline = !document.hidden;
  if(clientOnline){
    if(sim._forcedOff) logDebug(`SIM ${site.id}: klient spet prisoten - guard sproscen`);
    sim._forcedOff = false; sim._clientGoneAt = 0;
    return false;
  }
  if(!sim._clientGoneAt) sim._clientGoneAt = now;
  const timeoutMs = Math.max(5, L.offlineTimeoutS||60) * 1000;
  if(!sim._forcedOff && now - sim._clientGoneAt >= timeoutMs){
    sim._forcedOff = true;
    sim.rele.forEach(r=>{ r.state = false; r.mode = 'static'; });
    sim.servo.forEach(sv=>{ sv.pos = 0; sv.target = 0; sv.mode = 'static'; });
    sim.binMode = false;
    logDebug(`SIM ${site.id}: OFFLINE GUARD - izhodi na 0 po ${timeoutMs/1000}s`, true);
  }
  return sim._forcedOff;
}

function pushSimStateNow(site, sim){
  const now = Date.now();
  simOfflineGuardTick(site, sim, now);   // JJ7
  if(sim._recId === undefined) sim._recId = 0;
  const releState = sim.binMode ? [0,1,2,3].map(i=>!!((sim.binVal>>i)&1)) : sim.rele.map(r=>r.state);
  const servoState = sim.servo.map(x=>x.pos);
  const L = ensureLive(site.id);

  if(site.opMode==='sim_local'){
    // GG9: enak zapis kot pri pravi napravi, le brez MQTT poti
    pushOscSample(site.id, { t: now, rele: releState.slice(), servo: servoState.slice(),
                             analog: Object.assign({}, sim.analog) });
    L.online = true; L.stale = false; L.lastSeen = now;
    L.rele = releState; L.binarno = sim.binVal; L.binMode = sim.binMode;
    L.binOn = !!sim.binMode; L.binPeriod = sim.binPeriod||1;
    L.servo = servoState; L.analog = sim.analog;
  } else if(site.opMode==='sim_broker'){
    const c = getClient(site.mqtt);
    if(c && c.connected){
      if(!sim._lastPub) sim._lastPub = { adc:0, status:0 };
      const lp = sim._lastPub;
      // GG8: en zapis na ~200ms (kot firmware), plus takoj ob spremembi
      const relKey = releState.map(b=>b?1:0).join('') + '|' + servoState.join(',');
      const changed = (lp.key !== relKey);
      if(changed || now - lp.adc >= 200){
        lp.adc = now; lp.key = relKey;
        c.publish(`naprava/${site.id}/scope/data`, simEncodeRecord(sim, releState, servoState, now));
      }
      if(now - lp.status >= 5000){
        lp.status = now;
        c.publish(`naprava/${site.id}/status`, 'online', {retain:true});
        c.publish(`naprava/${site.id}/config/stanje`, JSON.stringify({
          offlineGuard: !!L.offlineGuard, bootRestore: !!L.bootRestore,
          binOn: !!sim.binMode, binPeriod: sim.binPeriod||1 }), {retain:true});
      }
    } else {
      logDebug(`pushSimStateNow ${site.id}: MQTT ni povezan`, true);
    }
  }
  if(currentSite() && currentSite().id===site.id){
    renderSiteMenu();
    if(currentTab==='nadzor') updateNadzorState();
  }
}

// Izvrsi ukaz (isti kot bi ga ESP32 firmware) na virtualni napravi.
// Uporabljeno tako za sim_local (direktni klic iz sendCommand) kot za
// sim_broker (prejeto preko MQTT .../set - glej ensureSimBrokerListening).
function applySimCommand(site, subtopic, d){
  logDebug(`applySimCommand ${site.id} ${subtopic} <- ${JSON.stringify(d)}`);
  const sim = ensureSim(site.id);
  const relM = subtopic.match(/^rele\/(\d)\/set$/);
  const srvM = subtopic.match(/^servo\/(\d)\/set$/);
  if(relM){
    const i = parseInt(relM[1])-1;
    if(sim.binMode) return; // med binarnim stetjem so posamezni releji zaklenjeni
    const mode = d.mode||'static';
    sim.rele[i].mode = mode;
    if(mode==='static'){
      // S3: zakljucek cikla -> rele v mirovanje (0), razen ce je ukazan ON
      sim.rele[i].state = !!d.state;
    } else {
      // S2: ciklicno delovanje se VEDNO zacne od zacetka (faza ON)
      sim.rele[i].ton = d.ton ?? 1; sim.rele[i].toff = d.toff ?? 1;
      sim.rele[i].phaseOn = true; sim.rele[i].state = true; sim.rele[i].last = Date.now();
    }
  } else if(srvM){
    const i = parseInt(srvM[1])-1;
    const mode = d.mode||'static';
    const sv = sim.servo[i];
    sv.mode = mode;
    if(d.rampMs!==undefined) sv.rampMs = d.rampMs|0;   // cas prehoda (0 = takojsen skok)
    const now = Date.now();
    // M1: `||` pozre veljavno vrednost 0 (npr. Pozicija OFF = 0) - povsod ??
    if(d.posOff!==undefined) sv.posOff = d.posOff;
    if(d.posOn!==undefined)  sv.posOn  = d.posOn;
    if(mode==='static'){
      // O3/S3: zakljucek cikla - pocisti fazo, servo gre na ROCNO lego
      // (posOff/posOn iz ukaza), ne na 0
      sv.phase = 'RAMP_A'; sv.phaseStart = now;
      // rocni gumb ON/OFF: premik na ciljno lego z rampo (ne skok)
      sv.rampFrom = sv.pos; sv.target = d.pos ?? 0; sv.rampStart = now;
      if(!sv.rampMs) sv.pos = sv.target;
    } else {
      sv.posA = d.posA ?? 0; sv.posB = d.posB ?? 255;
      sv.ton = d.ton ?? 1; sv.toff = d.toff ?? 1;
      // S2: cikel se VEDNO zacne od zacetka - iz trenutne lege na PozA
      sv.rampFrom = sv.pos; sv.target = sv.posA; sv.rampStart = now;
      sv.phase = 'RAMP_A'; sv.phaseStart = now;   // cikel se zacne s PREHODOM
      if(!sv.rampMs) sv.pos = sv.target;
    }
  } else if(subtopic==='binarno/set'){
    // binarno PERIODICNO stetje (staticni nacin je odstranjen)
    const wasOn = sim.binMode;
    if(d.on!==undefined) sim.binMode = !!d.on;
    if(d.perioda!==undefined) sim.binPeriod = Math.max(0.1, d.perioda);
    // S2: ob vklopu se stetje VEDNO zacne od 0
    if(sim.binMode && !wasOn){ sim.binVal = 0; sim.binLast = Date.now(); }
    // S3: ob izklopu binarnega stetja gredo releji v mirovanje (0)
    if(!sim.binMode && wasOn){
      sim.rele.forEach(r=>{ if(r.mode!=='blink'){ r.state = false; } });
    }
    const Lb = ensureLive(site.id);
    Lb.binOn = sim.binMode; Lb.binPeriod = sim.binPeriod||1;
  } else if(subtopic==='config/set'){
    const Lc = ensureLive(site.id);
    if(d.offlineGuard!==undefined) Lc.offlineGuard = !!d.offlineGuard;
    if(d.bootRestore!==undefined)  Lc.bootRestore  = !!d.bootRestore;
    logDebug(`SIM config ${site.id}: offlineGuard=${Lc.offlineGuard} bootRestore=${Lc.bootRestore}`);
  } else {
    logDebug(`applySimCommand ${site.id}: neprepoznan subtopic "${subtopic}"`, true);
  }
  saveSims();
  pushSimStateNow(site, sim); // takoj odrazi spremembo - ne caka na tick/running
}

// Virtualna naprava "tece" ~10x/s (0.1s) - realtime obcutek za utripanje/nihanje.
// POPRAVEK: prejsnja verzija je imela `if(!sim.running) return;` PRED
// klicem pushSimStateNow(), kar je prekinilo cel cikel za to napravo -
// stanje se torej NI objavljalo/osvezevalo, ce Simulator ni bil zagnan,
// ne glede na to, da je applySimCommand() ze klical pushSimStateNow()
// enkrat ob ukazu (ena sama objava je lahko izgubljena/zakasnjena na
// javnem MQTT brokerju, brez ponovitve). Zdaj: pushSimStateNow() tece
// VEDNO na vsakih 100ms za VSAKO sim napravo (ne glede na running) -
// "running" vpliva SAMO se na to, ali Ton/Toff/nihanje casovniki
// napredujejo (ali rele/servo dejansko preklaplja fazo).
setInterval(()=>{
  const now = Date.now();
  CFG.sites.forEach(site=>{
    if(site.opMode==='real') return;
    const sim = ensureSim(site.id);
    // L1: virtualna naprava dela VEDNO - enako kot pravi firmware, ki nima
    // nobenega "Start" gumba. Kar uporabnik vklopi v Nadzoru (binarno stetje,
    // utripanje, nihanje), se izvaja takoj. Prejsnji pogoj sim.running je
    // povzrocil, da se stevec ni premikal, ceprav je pisalo AKTIVNO.
    if(sim._forcedOff) return;   // JJ7: guard je izklopil izhode - vse ustavljeno
    if(sim.binMode){
      const stepMs = Math.max(100, (sim.binPeriod||1)*1000);
      if(now - (sim.binLast||0) >= stepMs){
        sim.binLast = now;
        sim.binVal = ((sim.binVal||0) + 1) & 0x0F;
      }
    } else {
      sim.rele.forEach(r=>tickRelaySim(r, now));
    }
    sim.servo.forEach((sv,idx)=>tickServoSim(sv, now, site, idx));
    pushSimStateNow(site, sim); // vedno - zagotavlja neprekinjeno samodejno osvezitev/popravek stanja
  });
}, 100);

// sim_broker: virtualna naprava se narocni na iste .../set teme kot pravi
// firmware in izvede applySimCommand() - enak potek kot Nadzor->ESP32.
// POPRAVEK: prej se je to zgodilo SAMO ob kliku "Zaženi" v Simulator
// zavihku - ce uporabnik ni pritisnil Start, ukazi iz Nadzora niso sli
// nikamor (nihce ni poslusal teme). Zdaj se poklice takoj ob dodajanju/
// povezavi naprave (glej connectAll/resubscribeAll), Start/Stop pa
// vpliva samo se na to, ali Ton/Toff/nihanje casovniki napredujejo.
// idempotentno - varuje pred podvojenimi 'message' listenerji.
let simBrokerListening = new Set();
function ensureSimBrokerListening(site){
  if(site.opMode!=='sim_broker') return;
  if(simBrokerListening.has(site.id)){ logDebug(`ensureSimBrokerListening ${site.id}: ze narocen (preskok)`); return; }
  const c = getClient(site.mqtt);
  if(!c){ logDebug(`ensureSimBrokerListening ${site.id}: NI MQTT klienta za ${site.mqtt}`, true); return; }
  c.subscribe(`naprava/${site.id}/rele/+/set`);
  c.subscribe(`naprava/${site.id}/servo/+/set`);
  c.subscribe(`naprava/${site.id}/binarno/set`);
  c.subscribe(`naprava/${site.id}/config/set`);
  logDebug(`ensureSimBrokerListening ${site.id}: SUB rele/+/set, servo/+/set, binarno/set, config/set`);
  c.on('message', (topic, payload)=>{
    if(!topic.startsWith(`naprava/${site.id}/`) || !topic.endsWith('/set')) return;
    logDebug(`SIM <- ukaz ${topic} (${payload.length}B)`);
    try{
      const d = JSON.parse(payload.toString());
      const subtopic = topic.slice((`naprava/${site.id}/`).length);
      applySimCommand(site, subtopic, d);
    }catch(e){ logDebug(`SIM ukaz ${topic}: napaka parsanja JSON: ${e.message}`, true); }
  });
  simBrokerListening.add(site.id);
}

        oninput="ensureSim('${s.id}').analog.a${i}=parseFloat(this.value); this.nextElementSibling.textContent=this.value+'V'; saveSims();">
      <span style="min-width:45px">${(sim.analog['a'+i]||0)}V</span>

function updateSimulatorState(){
  if(currentTab!=='simulator') return;
  const s = currentSite(); if(!s || s.opMode==='real') return;
  const sim = ensureSim(s.id);
  const releState = sim.binMode ? [0,1,2,3].map(i=>!!((sim.binVal>>i)&1)) : sim.rele.map(r=>r.state);

  for(let i=0;i<4;i++){
    const t = document.getElementById('simRelTag'+i);
    if(!t) continue; // ta badge se ni izrisan - NE prekini cele funkcije (prej: return)
    t.textContent = `${T('relayN')} ${i+1}: ${releState[i]?T('lblOn'):T('lblOff')}`;
    t.classList.toggle('on', releState[i]);
    t.classList.toggle('off', !releState[i]);
  }
  const binInfo = document.getElementById('simBinInfo');
  if(binInfo){
    binInfo.style.display = sim.binMode ? 'block':'none';
    binInfo.textContent = `${T('lblBinary')}: ${sim.binVal} (0-15)`;
  }
  for(let i=0;i<2;i++){
    const t = document.getElementById('simSrvTag'+i);
    if(t) t.textContent = `${T('servoN')} ${i+1}: ${sim.servo[i].pos}`;
  }
}

// realtime osvezitev BADGE-ov (ne drsnikov!) v Simulator zavihku - 0.25s, enotno z Nadzorom

/* ============================================================
   OSCILOSKOP
   ============================================================ */
let OSC_TIMEBASE = 1000; // SS4: privzeto 1s
// AH1: enakomernejsi koraki (~5x) + 1min za zelo dolge teste, kjer 20s po
// nepotrebnem polni buffer naprave.
const OSC_TIMEBASES = [1,5,10,50,100,500,1000,2000,5000,20000,60000];
// HH2: zoom = KOLIKO ZADNJIH VZORCEV iz bufferja se prikaze v oknu.
// Sirina okna v casu = stevilo vzorcev x casovna baza.
// Pri ~900px zaslona je 900 vzorcev "en vzorec na piksel" (optimalno);
// vec kot to se zlije, manj pa razpotegne.
// RR1: dodane fine stopnje (250/100/50) za podroben pregled posameznih
// preklopov. Pri 900 vzorcih je ~1 vzorec na piksel, nizje pa razpotegnjeno.
// AH2: 10 stopenj je bilo prevec za dve vrstici gumbov, 15k in 30k pa sta
// pri ~900px zaslona prakticno nerazlocljiva (33 oz. 17 vzorcev na piksel).
// Razmerje ~3x je dovolj gosto; 30 in 15 za podroben pregled preklopov.
const OSC_ZOOMS = [30000, 10000, 3000, 1000, 300, 100, 30, 15];
// AH: shranjena izbira iz prejsnje verzije se preslika na najblizjo
// razpolozljivo vrednost, da nastavitve ne odpovejo.
function nearestOf(arr, v){ return arr.reduce((a,b)=>Math.abs(b-v)<Math.abs(a-v)?b:a); }
let OSC_SAMPLES = 100;   // privzeto
// ce sta bili shranjeni vrednosti iz starega nabora, ju priblizamo
try{
  const sv = parseInt(lsGetPlain('rs_osc_samples','')||'');
  if(sv) OSC_SAMPLES = nearestOf(OSC_ZOOMS, sv);
  const tv = parseInt(lsGetPlain('rs_osc_tb','')||'');
  if(tv) OSC_TIMEBASE = nearestOf(OSC_TIMEBASES, tv);
}catch(e){}
let OSC_ZOOM = 1; // 1 = privzeta sirina okna (ohranjeno za scipanje)
// EE3: zamrznjen prikaz - zbiranje podatkov tece naprej, le izris stoji.
// OSC_FROZEN_AT je "zdaj" v trenutku ustavitve, OSC_PAN pa odmik pri
// drsenju nazaj po zgodovini (v ms; pozitivno = nazaj v preteklost).
// XX2: rocna skala poleg MAX/AUTO
// YY2: en sam nabor - AUTO ali ena od fiksnih skal. Prej sta bila MAX in
// izbrana skala lahko vklopljena hkrati, kar je bilo protislovno.
/* Z1 (V60): KALIBRACIJA ADC ODSTRANJENA IZ APLIKACIJE.
   Delilnik je odslej izkljucno v firmware (DIVIDER_RATIO); naprava poslje ze
   preracunane desetinke volta in aplikacija jih samo prikaze.

   Stranski ucinek, ki popravi obstojeco napako: izvoz TXT je vrednosti pisal
   SUROVO, graf pa je nanje uporabil kalibracijo. Pri kalibraciji, razlicni od
   100 %, sta bila graf in tabela v neskladju in nikjer ni bilo zapisano,
   kateri je pravi. Zdaj graf, TXT in JSON kazejo isto stevilko. */
function adcVs(raw){ return raw; }

const ADC_SCALES = [5, 10, 20, 40];
let ADC_SCALE = parseInt(lsGetPlain('rs_adcscale','40')) || 40;
let ADC_AUTO = lsGetPlain('rs_adcauto','0') === '1';
function setAdcScale(v){   // v = 0 pomeni AUTO
  if(v === 0){ ADC_AUTO = true; lsSetPlain('rs_adcauto','1'); }
  else { ADC_AUTO = false; ADC_SCALE = v;
         lsSetPlain('rs_adcauto','0'); lsSetPlain('rs_adcscale', String(v)); }
  logDebug(`ADC merilo: ${ADC_AUTO ? 'AUTO' : '0-'+v+'V'}`);
  renderOscFull();
}

let OSC_RUNNING = true;
let OSC_FROZEN_AT = 0;
let OSC_PAN = 0;

// Desni rob okna: pri zivem prikazu "zdaj", pri zamrznjenem trenutek
// ustavitve, zamaknjen za drsenje.
function oscNowRef(){
  return (OSC_RUNNING ? Date.now() : OSC_FROZEN_AT) - OSC_PAN;
}

// HH4: oznaka, kje v bufferju smo (koliko nazaj od najnovejsega podatka)
function updateOscPosInfo(){
  const el = document.getElementById('oscPosInfo');
  if(!el) return;
  if(OSC_RUNNING && OSC_PAN === 0){
    // XX6/XX9: poleg okna se DEJANSKA hitrost - omejitev je praviloma
    // povezava (pri 1ms se sistem ustali pri ~200Hz, kar ni okvara)
    const s2 = currentSite();
    const real = s2 && LAST_TB[s2.id] ? Math.round(1000/LAST_TB[s2.id]) : null;
    const want = Math.round(1000/OSC_TIMEBASE);
    // AJ3: takoj po preklopu baze kaze SE VEDNO stevilko iz PREJSNJEGA bloka
    // (blok se izprazni sele, ko je poln ali ob naslednjem preklopu) - to ni
    // napaka, temvec zakasnitev nekaj sekund do prvega novega zapisa.
    /* R2 (V60): TRI stevila namesto enega - kaj si zahteval, kaj naprava zmore,
     kaj dejansko pride. Doslej je bila vidna samo srednja stevilka, in ta je
     bila izracunana iz glave bloka, torej iz tega, kar naprava MISLI, da
     poslje - ne iz tega, kar v telefon res pride. */
  const s2r = currentSite();
  const Lr  = s2r ? LIVE[s2r.id] : null;
  const eff = Lr && Lr.effMs;
  const devHz = eff ? Math.round(1000/eff) : real;
  const st  = s2r ? rateStats(s2r.id) : null;
  const gotHz = st ? st.hz : null;
  // R4: ce prejeto pade pod 70 % tega, kar naprava poslje, je tezava v
  // povezavi, ne v napravi - in to mora biti vidno na prvi pogled.
  const weak = (gotHz !== null && devHz && gotHz < devHz * 0.7);
  const evtTxt = (st && st.evt) ? ` (+${st.evt} ${T('oscEvt')}/s)` : '';   // AC1
  const gotTxt = gotHz !== null
    ? ` / <span style="color:${weak?'var(--warn,#E2A03F)':'inherit'}">${gotHz} Hz ${T('oscGot')}</span>${evtTxt}`
    : '';
  /* AS2 (V63): od kar naprava belezi SPREMEMBE (AR), prejeto stevilo ne pove
     vec hitrosti vzorcenja, ampak hitrost DOGAJANJA. Ob mirujocih izhodih je
     pravilno nizko in ne pomeni izgube - zato drugacen napis in brez
     opozorilne barve, ki bi zavajala. */
  const hbS = (Lr && Lr.heartbeatMs) ? (Lr.heartbeatMs/1000) : 1;
  const chgTxt = (gotHz !== null) ? ` / ${gotHz} ${T('oscChg')}` : '';
  const rate = real
    ? ` · ${T('oscRate')}: ${want} Hz ${T('oscWant')} / ${devHz} Hz ${T('oscDev')}${chgTxt}`
      + ` · ${T('oscHb')} ${hbS}s`
    : '';
  /* R3 (V60): podrobnosti SAMO pod 100 ms. Nad tem so nezanimive in bi samo
     jemale prostor na telefonskem zaslonu. */
  let detail = '';
  if(OSC_TIMEBASE < 100 && st){
    const prio = (Lr && Lr.prio) ? T('prioFull') : T('prioLive');
    detail = `<br><span class="small">${T('oscBlocks')} ${st.bps}/s · ${T('oscLag')} ${st.lag} ms`
           + ` · ${T('oscLoss')} ${st.loss} % · eff ${eff||'?'} ms · ${prio}</span>`;
  }
    // AI6: koliko zgodovine je na voljo na napravi in koliko je je v flashu
    const hi = s2 ? HIST_INFO[s2.id] : null;
    let hist = '';
    if(hi && hi.oldest){
      // AJ1: prej je bilo stevilo_zapisov x TRENUTNO IZBRANA baza - napacno,
      // ker so zapisi lahko posneti pri RAZLICNIH bazah skozi cas (od tod
      // neskladne vrednosti 119min/15min/44s/2.1h/89s samo ob preklopu gumba).
      // Zdaj dejanski cas iz millis() najstarejsega/najnovejsega zapisa.
      if(hi.oldestTm !== undefined && hi.newestTm !== undefined && hi.newestTm > hi.oldestTm){
        const span = hi.newestTm - hi.oldestTm;
        hist = ` · ${T('histAvail')}: ${fmtDur(span, span)}`;
      }
      if(hi.fsTotal) hist += ` (flash ${Math.round(100*hi.fsBlocks/hi.fsTotal)}%)`;
    }
    // R2/R4: `rate` vsebuje barvno oznako, zato innerHTML namesto textContent.
    // Vsebina je v celoti nasa (stevilke in prevodi), nic ne prihaja z omrezja.
    el.innerHTML = `${T('oscWinInfo')}: ${OSC_SAMPLES} × ${OSC_TIMEBASE<1000?OSC_TIMEBASE+'ms':(OSC_TIMEBASE/1000)+'s'} = ${fmtDur(oscWindowMs(), oscWindowMs())}${rate}${hist}${detail}`;
  } else {
    const backSamples = Math.round(OSC_PAN / Math.max(1, OSC_TIMEBASE));
    el.textContent = `${T('oscPos')}: −${fmtDur(OSC_PAN, OSC_PAN)} (≈ ${backSamples} ${T('oscSamples')})`;
  }
}

// ============================================================
// WW3: IZVOZ (JSON + TXT) in UVOZ (samo JSON)
// TXT je za Excel; njegovo razclenjevanje nazaj (rocno urejene datoteke,
// decimalne vejice) ni vredno tveganja, zato uvoz sprejema samo JSON.
// ============================================================
let SNAPSHOT = null;   // nalozen posnetek (null = zivi prikaz)
// AG1: zivi buffer, shranjen med pregledom posnetka. Deklaracija mora biti
// TU (pred vsemi uporabami) - `let` je v temporal dead zone, zato bi uporaba
// pred njo vrgla ReferenceError in prekinila izris.
let LIVE_BACKUP = null;

// AG2a/AG2c: dopolnjevanje vrzeli iz kroznega bufferja naprave.
// Zahteve zdruzujemo (debounce), da ob dolgi vrzeli ne posljemo na desetine
// ukazov; obenem si zapomnimo, kaj smo ze zahtevali, da ne ponavljamo.
let GAP_PENDING = {};   // id -> {from, count, timer}
function requestGapFill(id, fromId, count){
  const site = CFG.sites.find(x=>x.id===id);
  if(!site || site.opMode !== 'real') return;
  // ============================================================
  // Y13 (V60): V NACINU A (popolno vzorcenje) SPROTNEGA DOPOLNJEVANJA NI.
  // Naprava tam vzorci hitreje, kot aplikacija zmore sprejeti, zato je vsak
  // nedostavljen zapis za nas "vrzel". Pri 1 ms bazi bi to pomenilo na
  // tisoce zahtev na sekundo - zasitile bi prav tisto povezavo, ki je ze
  // ozko grlo, in zanka bi se sama hranila. Zgodovina je v flashu popolna
  // in se prevzame namensko: ob ustavitvi prikaza ali na zahtevo.
  // ============================================================
  if(ensureLive(id).prio){
    if(!GAPMUTE[id] || Date.now()-GAPMUTE[id] > 30000){
      GAPMUTE[id] = Date.now();
      logDebug(`ZGODOVINA ${id}: nacin popolnega vzorcenja - sprotno dopolnjevanje je izklopljeno`);
    }
    return;
  }
  // D3 (V55): ista zascita kot v backfillTick. Ko je lokalni buffer poln, se
  // dopolnjeni (starejsi) vzorec vstavi na zacetek, takoj zatem pa ga shift()
  // v pushOscSample vrze ven - naprava bi torej po nepotrebnem posiljala
  // podatke, ki jih ni mogoce obdrzati, in pri tem zasedala povezavo.
  /* ============================================================
     AD1 (V62): VAROVALO POLNEGA BUFFERJA JE BILO PRESIROKO
     ------------------------------------------------------------
     Varovalo (D3 iz V55) je bilo misljeno za nekaj drugega: prepreciti naj bi
     vlecenje VEDNO STAREJSE zgodovine v ze poln buffer. Zavracalo pa je
     VSAKO dopolnjevanje.
     Ker ob prijavi z diska nalozimo natanko bufCap zapisov, je bil buffer
     poln ze v prvi sekundi in vrzel med diskom in sprotnim tokom se ni mogla
     nikoli zapolniti:
        nalozenih 3000 zapisov z diska (do ID 15420)
        vrzel 268 zapisov (15420 -> 15689)
        lokalni buffer je poln (3000) - vrzeli ne dopolnjujem
     Ta vrzel je na NOVEM koncu; njeno dopolnjevanje samo izrine najstarejse
     zapise, kar je povsem v redu. Zavrnemo torej le zahteve, ki so
     STAREJSE od tega, kar ze imamo.
     ============================================================ */
  const cur = OSCBUF[id] || [];
  if(cur.length >= bufCap(id)){
    const oldestHave = cur.length ? cur[0].recId : 0;
    const wantsOlder = oldestHave && fromId < oldestHave;
    if(wantsOlder){
      logDebug(`ZGODOVINA ${id}: buffer poln (${bufCap(id)}) - starejsih od ID ${oldestHave} ne dopolnjujem`);
      return;
    }
    // vrzel na novem koncu: dopolnimo in pustimo, da najstarejsi odpadejo
  }
  const info = HIST_INFO[id];
  if(info && info.oldest && fromId < info.oldest){
    logDebug(`ZGODOVINA ${id}: del vrzeli je ze prepisan (najstarejsi ${info.oldest})`, true);
    fromId = info.oldest;
  }
  const p = GAP_PENDING[id];
  if(p){ clearTimeout(p.timer); p.count = Math.max(p.count, count); }
  else GAP_PENDING[id] = { from: fromId, count };
  GAP_PENDING[id].timer = setTimeout(()=>{
    const g = GAP_PENDING[id]; delete GAP_PENDING[id];
    if(!g) return;
    // A3: razpon skrci na to, kar nam res manjka - robni zapisi so pogosto
    // ze prispeli, medtem ko je zahteva cakala na zdruzevanje.
    let from = g.from, to = g.from + g.count - 1;
    const S = seenSet(id);
    while(from <= to && S.has(rk(id, from))) from++;   // Y2
    while(to >= from && S.has(rk(id, to))) to--;
    if(to < from){ logDebug(`ZGODOVINA ${id}: vrzel je medtem ze zapolnjena`); return; }
    // A4: istega razpona ne zahtevamo znova
    if(alreadyRequested(id, from, to)){
      logDebug(`ZGODOVINA ${id}: ID ${from}..${to} je ze zahtevan - preskakujem`);
      return;
    }
    markRequested(id, from, to);
    sendCommand(site, 'scope/set', { history_from_id: from, count: to - from + 1 });
    logDebug(`ZGODOVINA ${id}: dopolnjujem vrzel od ID ${from} (${to - from + 1} zapisov)`);
  }, 800);
}

// ============================================================
// AI7/AI8/AI9: POSTOPNO DOPOLNJEVANJE ZGODOVINE
// Naprava hrani do 30000 zapisov (flash). Prenos vsega naenkrat je ~570 KB
// in pri javnem brokerju traja 2-5 minut, zato bi blokiral sprotni prikaz.
// Zato: najprej najnovejsi blok (hitro), nato postopoma nazaj, dokler je
// pasovna sirina prosta. Ko lokalni buffer pokriva ves razpon naprave,
// se dopolnjevanje ustavi.
// ============================================================
const BACKFILL_CHUNK = 214;      // en blok naprave
let BACKFILL = {};               // id -> {active, nextFrom, timer}

function backfillTick(id){
  const site = CFG.sites.find(x=>x.id===id);
  const info = HIST_INFO[id];
  const buf = OSCBUF[id] || [];
  if(!site || site.opMode !== 'real' || !info || !info.oldest){ return; }

  // AI9: kaj nam se manjka? Najstarejsi ID, ki ga ze imamo.
  let haveOldest = null;
  for(const p of buf){ if(p.recId && (haveOldest===null || p.recId < haveOldest)) haveOldest = p.recId; }
  if(haveOldest === null) haveOldest = LAST_REC_ID[id] || info.newest;

  if(haveOldest <= info.oldest){
    if(BACKFILL[id] && BACKFILL[id].active){
      BACKFILL[id].active = false;
      logDebug(`ZGODOVINA ${id}: dopolnjena (imamo od ID ${info.oldest})`);
    }
    return;   // buffer pokriva vse, kar naprava hrani
  }
  // AD1 (V62): TU je varovalo pravilno in ostaja. Postopno dopolnjevanje
  // vlece VEDNO STAREJSE zapise; ce je buffer poln, bi jih shift() takoj vrgel
  // ven. Drugace je pri requestGapFill(), kjer je vrzel lahko na NOVEM koncu.
  if(buf.length >= bufCap(id)) return;   // lokalni buffer je poln

  const from = Math.max(info.oldest, haveOldest - BACKFILL_CHUNK);
  const cnt  = haveOldest - from;
  if(cnt <= 0) return;
  BACKFILL[id] = { active: true, nextFrom: from };
  markRequested(id, from, haveOldest - 1);   // A4/A5: tudi to je NASA zahteva
  sendCommand(site, 'scope/set', { history_from_id: from, count: cnt });
  logDebug(`ZGODOVINA ${id}: dopolnjujem ID ${from}..${haveOldest-1} (${cnt}), ostane do ${info.oldest}`);
}

// AI8: v ozadju, redko - sprotni podatki imajo prednost
setInterval(()=>{
  if(currentTab !== 'osciloskop' || document.hidden) return;
  const s = currentSite(); if(!s || s.opMode !== 'real') return;
  backfillTick(s.id);
}, 4000);

const HIST_FIRST = 500;
let histLoadedFrom = {};
// WW2: postopni prevzem. 4000 zapisov (76KB) ob VSAKI prijavi bi pri slabi
// povezavi trajalo minuto in blokiralo sprotni prikaz, zato najprej le
// zadnjih HIST_FIRST, preostalo na zahtevo.
/* ============================================================
   AI (V63): PREVZEM ZGODOVINE PO KOSIH
   ------------------------------------------------------------
   En sam zahtevek za vec tisoc zapisov naprava razdeli po svoje, povezava pa
   se zasiti in odgovori se izgubljajo. Zato zahtevamo po 200 zapisov, vsak
   naslednji kos sele po prispetju prejsnjega.
   AI4: kos brez odgovora v 5 s enkrat ponovimo, nato preskocimo in zabelezimo -
   doslej se je izgubljen kos tiho pozabil in vrzel je ostala za vedno.
   ============================================================ */
const HIST_CHUNK = 200, HIST_CHUNK_TIMEOUT = 5000;
let HQ = {};   // dev -> { from, to, cur, tries, timer }

function histQueueStart(site, fromId, toId){
  const id = site.id;
  histQueueStop(id);
  HQ[id] = { from: fromId, to: toId, cur: fromId, tries: 0, timer: null };
  logDebug(`ZGODOVINA ${id}: prevzem ${fromId}..${toId} (${toId-fromId+1} zapisov) po ${HIST_CHUNK}`);
  histQueueNext(site);
}
function histQueueStop(id){
  if(HQ[id] && HQ[id].timer) clearTimeout(HQ[id].timer);
  delete HQ[id];
}
function histQueueNext(site){
  const id = site.id, q = HQ[id];
  if(!q) return;
  if(q.cur > q.to){
    logDebug(`ZGODOVINA ${id}: prevzem koncan`);
    histQueueStop(id); return;
  }
  const n = Math.min(HIST_CHUNK, q.to - q.cur + 1);
  markRequested(id, q.cur, q.cur + n - 1);
  sendCommand(site, 'scope/set', { history_from_id: q.cur, count: n });
  q.timer = setTimeout(()=>{
    if(!HQ[id]) return;
    q.tries++;
    if(q.tries === 1){
      logDebug(`ZGODOVINA ${id}: kos od ${q.cur} ni prispel v 5s - ponavljam`, true);
      histQueueNext(site);
    } else {
      logDebug(`ZGODOVINA ${id}: kos od ${q.cur} preskocen po 2 poskusih`, true);
      q.cur += n; q.tries = 0; histQueueNext(site);
    }
  }, HIST_CHUNK_TIMEOUT);
}
// poklice se ob prispelem "prenos koncan" za tekoci kos
function histQueueAck(id){
  const q = HQ[id]; if(!q) return;
  const site = CFG.sites.find(x=>x.id===id); if(!site){ histQueueStop(id); return; }
  if(q.timer) clearTimeout(q.timer);
  q.cur += Math.min(HIST_CHUNK, q.to - q.cur + 1);
  q.tries = 0;
  histQueueNext(site);
}

function requestHistory(site, fromId, count){
  if(!site || site.opMode !== 'real') return;
  // AI2/AI3: vecji prevzem gre skozi vrsto po kosih
  if(count > HIST_CHUNK){ histQueueStart(site, fromId, fromId + count - 1); return; }
  // P3 (V58): registriraj zahtevo, sicer A5 iz V56 zapise, ki jih SAMI
  // zahtevamo, javlja kot "nepricakovan starejsi ID ... objavlja se en vir".
  markRequested(site.id, fromId, fromId + count - 1);
  sendCommand(site, 'scope/set', { history_from_id: fromId, count });
  logDebug(`ZGODOVINA ${site.id}: zahtevam od ID ${fromId}, ${count} zapisov`);
}

// XX3: burst nacin odstranjen - 1ms se obnasa kot vse druge baze.

function exportGraph(fmt){
  const s = currentSite(); if(!s) return;
  const buf = (SNAPSHOT ? SNAPSHOT.data : OSCBUF[s.id]) || [];
  if(!buf.length){ showToast(T('oscNoData')); return; }
  const stamp = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  let content, mime, name;
  if(fmt === 'json'){
    content = JSON.stringify({
      app: APP_VERSION, device: s.id, name: s.name,
      exported: new Date().toISOString(), count: buf.length,
      data: buf
    });
    mime = 'application/json'; name = `graf_${s.id}_${stamp}.json`;
  } else {
    const head = 'cas\tR1\tR2\tR3\tR4\tS1\tS2\tA1\tA2\tA3\tA4';
    const rows = buf.map(p=>[
      new Date(p.t).toISOString(),
      ...p.rele.map(b=>b?1:0), p.servo[0], p.servo[1],
      p.analog.a1.toFixed(1), p.analog.a2.toFixed(1),
      p.analog.a3.toFixed(1), p.analog.a4.toFixed(1)
    ].join('\t'));
    content = head + '\n' + rows.join('\n');
    mime = 'text/plain'; name = `graf_${s.id}_${stamp}.txt`;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type:mime}));
  a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  logDebug(`IZVOZ ${fmt.toUpperCase()}: ${buf.length} zapisov -> ${name}`);
  showToast(T('exported'));
}

function importGraph(){
  const inp = document.createElement('input');
  // AF1: BREZ accept filtra - na Androidu prek content:// je izbirnik datotek
  // pogosto prevec omejeval in datoteke ni bilo mogoce izbrati.
  inp.type = 'file';
  inp.onchange = ()=>{
    const f = inp.files && inp.files[0];
    if(!f){ logDebug('UVOZ: datoteka ni izbrana', true); return; }
    logDebug(`UVOZ: datoteka '${f.name}' (${f.size}B, tip='${f.type||'?'}')`);
    const rd = new FileReader();
    // AF4: brez tega je bilo branje ob napaki povsem tiho
    rd.onerror = ()=>{ showToast(T('errRead')); logDebug(`UVOZ: branje ni uspelo - ${rd.error&&rd.error.name}`, true); };
    rd.onload = ()=>{
      let txt = rd.result;
      // AF2: preveri vsebino PREDEN jo poskusimo razcleniti
      if(typeof txt !== 'string'){ showToast(T('errRead')); logDebug('UVOZ: rezultat branja ni besedilo', true); return; }
      txt = txt.replace(/^\uFEFF/, '').trim();   // odstrani BOM in prazne robove
      if(!txt){ showToast(T('errEmptyFile')); logDebug('UVOZ: datoteka je prazna', true); return; }
      // AF3: prvih 200 znakov v dnevnik - takoj vidno, ce je vsebina obrezana,
      // v napacnem kodiranju ali sploh ni JSON
      logDebug(`UVOZ: vsebina (${txt.length} znakov): ${txt.slice(0,200)}`);
      let d;
      try{ d = JSON.parse(txt); }
      catch(e){ showToast(T('errBadJson')); logDebug(`UVOZ: neveljaven JSON - ${e.message}`, true); return; }
      if(!d || typeof d !== 'object'){ showToast(T('errBadJson')); logDebug('UVOZ: vsebina ni objekt', true); return; }
      if(!Array.isArray(d.data)){ showToast(T('errNoData')); logDebug('UVOZ: manjka polje "data"', true); return; }
      if(d.data.length === 0){ showToast(T('errEmpty')); logDebug('UVOZ: posnetek je prazen', true); return; }
      const bad = d.data.find(p=>!p || typeof p.t !== 'number' || !Array.isArray(p.rele));
      if(bad){ showToast(T('errBadRec')); logDebug('UVOZ: zapis nima pricakovane oblike', true); return; }

      // AG1: zivi buffer SHRANIMO (prej se je pobrisal) in ga ob vrnitvi
      // obnovimo; manjkajoce zapise medtem dopolni naprava iz svojega
      // kroznega bufferja.
      const cur = currentSite();
      if(cur){
        LIVE_BACKUP = { id: cur.id, data: OSCBUF[cur.id] || [], lastId: LAST_REC_ID[cur.id] };
        logDebug(`POSNETEK: zivi buffer shranjen (${LIVE_BACKUP.data.length} zapisov)`);
        OSCBUF[cur.id] = [];
      }
      SNAPSHOT = d;
      OSC_RUNNING = false; OSC_PAN = 0;
      OSC_FROZEN_AT = d.data[d.data.length-1].t;
      logDebug(`UVOZ: ${d.data.length} zapisov, naprava ${d.device||'?'}, ${d.exported||''}`);
      renderOscFull();
      showToast(T('imported'));
    };
    rd.readAsText(f);
  };
  inp.click();
}

// ZZ1: brisanje bufferja grafa (loceno od Clear v diagnostiki)
// AC2: MERJENJE CASA med dvema tockama. Tapneš prvo, nato drugo - dobiš
// razliko v ms in ustrezno frekvenco. Pri diagnostiki utripanja ali odskoka
// kontakta je to obicajno tisto, kar dejansko potrebujes.
let MARK_A = null, MARK_B = null;
function addTimeMark(t){
  if(MARK_A === null){ MARK_A = t; MARK_B = null; logDebug(`MERJENJE: tocka A`); }
  else if(MARK_B === null){
    MARK_B = t;
    const dt = Math.abs(MARK_B - MARK_A);
    const hz = dt > 0 ? (1000/dt) : 0;
    const msg = `Δt = ${dt < 1000 ? dt.toFixed(0)+' ms' : (dt/1000).toFixed(2)+' s'}`
              + (dt > 0 ? `  ·  ${hz < 1 ? hz.toFixed(2) : hz.toFixed(1)} Hz` : '');
    logDebug(`MERJENJE: ${msg}`);
    showToast(msg);
  } else { MARK_A = t; MARK_B = null; logDebug('MERJENJE: nova tocka A'); }
  renderOscFull();
}
function clearMarks(){ MARK_A = MARK_B = null; renderOscFull(); }

// AC3: izvoz slike grafa - za porocilo ali dokumentacijo okvare je slika
// uporabnejsa od podatkovne datoteke.
function exportPng(){
  const s = currentSite(); if(!s) return;
  const grps = ['rele','servo','analog'].map(g=>document.getElementById('oscCanvas_full_'+g)).filter(Boolean);
  if(!grps.length){ showToast(T('oscNoData')); return; }
  const w = Math.max(...grps.map(c=>c.width));
  const h = grps.reduce((a,c)=>a+c.height+10, 0);
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  const ctx = out.getContext('2d');
  const cs = getComputedStyle(document.documentElement);
  ctx.fillStyle = (cs.getPropertyValue('--ink')||'#000').trim();
  ctx.fillRect(0,0,w,h);
  let y = 0;
  grps.forEach(c=>{ ctx.drawImage(c, 0, y); y += c.height + 10; });
  const stamp = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  const a = document.createElement('a');
  a.href = out.toDataURL('image/png');
  a.download = `graf_${s.id}_${stamp}.png`;
  a.click();
  logDebug(`IZVOZ PNG: ${w}x${h}`);
  showToast(T('exported'));
}

function clearGraph(){
  const s = currentSite(); if(!s) return;
  OSCBUF[s.id] = [];
  delete LAST_REC_ID[s.id]; delete CLOCK_OFF[s.id];
  delete CLOCK_MIN[s.id]; delete CLOCK_N[s.id];
  delete SEEN[s.id]; delete GAP_REQUESTED[s.id];   // A3/A4: evidenci gresta z bufferjem
  logDebug(`GRAF ${s.id}: buffer pobrisan`);
  renderOscFull();
  showToast(T('graphCleared'));
}

function closeSnapshot(){
  SNAPSHOT = null; OSC_RUNNING = true; OSC_PAN = 0;
  // AG1: obnovi shranjeni zivi buffer in ga zdruzi s tem, kar je medtem prislo
  if(LIVE_BACKUP){
    const id = LIVE_BACKUP.id;
    const now = OSCBUF[id] || [];
    OSCBUF[id] = LIVE_BACKUP.data.concat(now);
    if(OSCBUF[id].length > bufCap(id)) OSCBUF[id] = OSCBUF[id].slice(-bufCap(id));
    logDebug(`POSNETEK zaprt: obnovljenih ${LIVE_BACKUP.data.length} + ${now.length} novih zapisov`);
    // AG2a: kar je nastalo med pregledom, dopolni naprava
    if(LIVE_BACKUP.lastId && LAST_REC_ID[id] && LAST_REC_ID[id] > LIVE_BACKUP.lastId + 1){
      requestGapFill(id, LIVE_BACKUP.lastId + 1, LAST_REC_ID[id] - LIVE_BACKUP.lastId - 1);
    }
    LIVE_BACKUP = null;
  } else logDebug('POSNETEK zaprt - nazaj v zivi prikaz');
  renderOscFull();
}

function toggleOscRun(){
  OSC_RUNNING = !OSC_RUNNING;
  logDebug(`OSC: prikaz ${OSC_RUNNING?'V ZIVO':'USTAVLJEN'}`);
  if(OSC_RUNNING){ OSC_PAN = 0; }          // nazaj na zivi prikaz
  else { OSC_FROZEN_AT = Date.now(); }     // zamrzni na tem trenutku
  renderOscFull();
}

// U1: izbrana casovna baza je SIRINA OKNA (gumb "2s" = 2s prikaza), razen
// pri zelo hitrih bazah, kjer okno ostane 2s (1ms okno bi bilo neuporabno).
// Prej je bil skok z 1s (okno 2s) na 2s (okno 20s) - nelogicno in nezvezno.
// HH1/HH2: casovna baza je FREKVENCA vzorcenja, zoom pa doloca, koliko
// zadnjih vzorcev je v oknu. Sirina okna = vzorci x baza.
function oscWindowMs(){
  return Math.max(200, (OSC_SAMPLES * OSC_TIMEBASE) / OSC_ZOOM);
}
