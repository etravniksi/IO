        ${ADC_SCALES.map(v=>`<button aria-pressed="${(!ADC_AUTO&&ADC_SCALE===v)?'true':'false'}" onclick="setAdcScale(${v})">${v}V</button>`).join('')}
      </div>`;
    h += `<div class="osc-grp">
      <div class="lbl2"><span>${title}</span></div>
      ${adcBar}
      <div class="osc-canvas-wrap" id="oscCanvasWrap_full_${grp}">
        <canvas id="oscCanvas_full_${grp}"></canvas>
        <div class="osc-tip" id="oscTip_full_${grp}"></div>
      </div>
      <div class="osc-legend">${legend}</div>
    </div>`;
  });
  h += `<p class="small">${T('oscTapHint')}</p>`;
  // LL1: diagnosticni dnevnik na dnu zavihka Osciloskop
  h += `<div class="sep" style="margin-top:12px">
    <div class="chead" style="padding:0 0 8px"><h3>${T('cardDebug')}</h3></div>
    <div class="row2">
      <button class="btn primary" onclick="showDebugLog()">${T('btnShowLog')}</button>
      <button class="btn" onclick="copyDebugLog()">${T('btnCopy')}</button>
      <button class="btn" onclick="clearDebugLog()">${T('btnClear')}</button>
      <span class="small" id="debugInfo"></span>
    </div>
    <pre id="debugLogBox" class="debug-box"></pre>
  </div>`;
  return h;
}

// L3: enoto doloci CELOTNO okno, ne vsaka oznaka posebej - sicer je na isti
// osi mesanica (-1.8s ... -921ms). windowMs je referenca za vse oznake.
// AH3/AH4: enote se izberejo po SIRINI OKNA (ref), da so na celotni osi
// dosledne, in segajo do dni - prej so bila dolga okna izpisana v sekundah
// (npr. "3000s"), kar je tezko brati.
function fmtDur(ms, windowMs){
  const ref = (windowMs===undefined) ? ms : windowMs;
  const s = ms/1000;
  if(ref < 1000)      return Math.round(ms)+'ms';
  if(ref < 10000)     return s.toFixed(1)+'s';
  if(ref < 120000)    return Math.round(s)+'s';
  if(ref < 7200000)   return (s/60).toFixed(s/60<10?1:0)+'min';
  if(ref < 172800000) return (s/3600).toFixed(1)+'h';
  return (s/86400).toFixed(1)+'d';
}

// LL3: povzetek okolja - zapise se ob prvem odprtju osciloskopa, da je v
// dnevniku vedno kontekst (katera naprava, kateri broker, kateri nacin).
let _diagSummaryDone = false;
function logDiagSummary(){
  if(_diagSummaryDone) return;
  _diagSummaryDone = true;
  const s = currentSite();
  logDebug(`--- DIAGNOSTIKA ---`);
  logDebug(`app=${APP_VERSION}  naprave=${CFG.sites.length}  jezik=${LANG}`);
  if(s) logDebug(`aktivna: '${s.name}' id=${s.id} broker=${s.mqtt} nacin=${s.opMode}`);
  logDebug(`osc: baza=${OSC_TIMEBASE}ms vzorcev=${OSC_SAMPLES} buffer=${bufCap(currentSite()?currentSite().id:'')} dnevnik=${DEBUG_CAP}`);
  logDebug(`brskalnik: ${navigator.userAgent.substring(0,80)}`);
  logDebug(`-------------------`);
}

function renderOscFull(){
  logDiagSummary();
  const el = document.getElementById('tab-osciloskop');
  const s = currentSite();
  if(!s){ el.innerHTML = `<div class="empty">${T('emptyNoDevice')}</div>`; return; }
  el.innerHTML = `<div class="card"><div class="cbody" style="max-height:none;padding-top:14px">${oscChannelHtml('full', s.id)}</div></div>`;

  const bar = document.getElementById('oscTbBar');
  OSC_TIMEBASES.forEach(tb=>{
    const b = document.createElement('button');
    // AH1: 60000 se izpise kot "1min", ne "60s"
    b.textContent = tb < 1000 ? tb+'ms' : (tb >= 60000 ? (tb/60000)+'min' : (tb/1000)+'s');
    b.setAttribute('aria-pressed', tb===OSC_TIMEBASE ? 'true':'false');
    b.onclick = ()=>{
      OSC_TIMEBASE=tb; OSC_ZOOM=1; lsSetPlain('rs_osc_tb', String(tb));
      logDebug(`OSC: casovna baza=${tb<1000?tb+'ms':(tb/1000)+'s'}, okno=${fmtDur(oscWindowMs(), oscWindowMs())}`);
      // posreduj novo casovno bazo pravi napravi (samo Realno delovanje -
      // simulacijski nacini imajo fiksno vzorcevalno periodo v tem UI-ju)
      if(s.opMode==='real') sendCommand(s, 'scope/set', { timebase_ms: tb });
      renderOscFull();
    };
    bar.appendChild(b);
  });

  // HH2: gumbi za zoom (stevilo vzorcev v oknu)
  const zb = document.getElementById('oscZoomBar');
  if(zb){
    OSC_ZOOMS.forEach(n=>{
      const b = document.createElement('button');
      b.textContent = n >= 1000 ? (n/1000)+'k' : String(n);
      b.setAttribute('aria-pressed', n===OSC_SAMPLES ? 'true':'false');
      b.onclick = ()=>{ OSC_SAMPLES = n; OSC_ZOOM = 1; lsSetPlain('rs_osc_samples', String(n));
        logDebug(`OSC: zoom=${n} vzorcev, okno=${fmtDur(oscWindowMs(), oscWindowMs())}`);
        renderOscFull();
        // D2 (V57): sirse okno lahko potrebuje vec zapisov, kot jih je v RAM -
        // dolozi jih z diska (ne od naprave; teh podatkov ze imamo).
        const cs = currentSite(); if(cs) widenFromDisk(cs.id); };
      zb.appendChild(b);
    });
  }
  updateOscPosInfo();

  ['rele','servo','analog'].forEach(grp=>drawOscGroup('full_'+grp, s.id, grp));
  attachOscGestures('full_rele', s.id, 'rele');
  attachOscGestures('full_servo', s.id, 'servo');
  attachOscGestures('full_analog', s.id, 'analog');
}

// Barve grafa se berejo iz trenutne palete (ne trdo zapisane),
// da osciloskop ustreza izbrani temi tudi pri svetlih paletah.
let OSC_COLORS = ['#FFD23F','#86B06A','#62A8C4','#D3543A'];
let GRID_COLOR = '#38423C';
let WARN_COLOR = '#E2A03F';   // Y6 (V60): oznaka reseta naprave
let AXIS_TXT_COLOR = '#8A968F';
// T1: barve SLEDI so FIKSNE in med seboj kar najbolj razlocne - prej so se
// brale iz palete, zato so bile pri temah kot "Terminal" vse odtenki zelene
// in kanalov ni bilo mogoce lociti. Mreza/okvir/osi ostanejo vezani na paleto.
const TRACE_DARK  = ['#FFD23F','#4FD37C','#4FA8FF','#FF5A3D']; // za temne teme
const TRACE_LIGHT = ['#8A5200','#0F5B33','#00417A','#A80000']; // za svetle teme
function isLightTheme(){
  const ink = (getComputedStyle(document.documentElement).getPropertyValue('--ink')||'').trim();
  const h = ink.replace('#','');
  if(h.length < 6) return false;
  const r = parseInt(h.slice(0,2),16), g2 = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return (r+g2+b) > 380;   // enak prag kot pri EF projektu
}
function syncOscColors(){
  const cs = getComputedStyle(document.documentElement);
  const g = n => (cs.getPropertyValue('--'+n)||'').trim();
  OSC_COLORS = isLightTheme() ? TRACE_LIGHT.slice() : TRACE_DARK.slice();
  GRID_COLOR = g('line')||GRID_COLOR;
  WARN_COLOR = g('warn')||WARN_COLOR;   // Y6
  AXIS_TXT_COLOR = g('mute')||AXIS_TXT_COLOR;
}

// AD2: ovojnica z lovljenjem napak. Napaka pri izrisu je bila doslej TIHA -
// graf je preprosto izginil, brez sledi v diagnostiki, kar je bilo tezko
// najti (natanko to se je zgodilo pri AD1).
let _drawErrShown = {};
function drawOscGroup(key, siteId, grp){
  try{ drawOscGroupInner(key, siteId, grp); }
  catch(e){
    if(!_drawErrShown[grp]){
      _drawErrShown[grp] = true;
      logDebug(`IZRIS ${grp}: NAPAKA - ${e.message}`, true);
      console.error('drawOscGroup', grp, e);
    }
  }
}

function drawOscGroupInner(key, siteId, grp){
  const canvas = document.getElementById('oscCanvas_'+key);
  const wrap = document.getElementById('oscCanvasWrap_'+key);
  if(!canvas || !wrap) return;
  const dpr = window.devicePixelRatio || 1;
  const w = wrap.clientWidth || 300, h = wrap.clientHeight || 64;
  canvas.width = w*dpr; canvas.height = h*dpr;
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);

  const isMini = key.startsWith('mini');
  // levo: prostor za y-skalo; spodaj: prostor za casovno os (samo v "full" pogledu)
  const marginL = isMini ? 4 : 30;
  const marginB = isMini ? 0 : 14;
  const marginT = 4, marginR = 4;
  const plotX = marginL, plotY = marginT;
  const plotW = w - marginL - marginR, plotH = h - marginT - marginB;

  // okvir
  ctx.strokeStyle = GRID_COLOR; ctx.lineWidth = 1;
  ctx.strokeRect(plotX+0.5, plotY+0.5, plotW-1, plotH-1);

  // WW3: ce je nalozen posnetek, rise se iz njega (ne iz zivega bufferja)
  const buf = (SNAPSHOT ? SNAPSHOT.data : OSCBUF[siteId]) || [];
  const windowMs = oscWindowMs();
  const now = oscNowRef();   // EE3: pri zamrznjenem prikazu je to trenutek ustavitve (+ drsenje)
  const samples = buf.slice(lowerBound(buf, now-windowMs));   // EE7

  // AD1: meje analogne osi MORAJO biti izracunane PRED izrisom osi in mreze,
  // ki ju uporabljata. Prej sta bili deklarirani nize; `let` je v temporal
  // dead zone, zato je izris osi vrgel ReferenceError, funkcija se je
  // prekinila in graf se sploh ni narisal - vsi trije grafi so bili prazni.
  let vMin = 0, vMax = ADC_SCALE;
  if(grp==='analog' && ADC_AUTO && samples.length){
    vMin = Infinity; vMax = -Infinity;
    samples.forEach(p=>{
      ['a1','a2','a3','a4'].forEach(k=>{
        const v = adcVs((p.analog && p.analog[k]) || 0);
        if(v < vMin) vMin = v; if(v > vMax) vMax = v;
      });
    });
    const pad = Math.max(0.5, (vMax - vMin) * 0.1);
    vMin = Math.max(0, vMin - pad); vMax = Math.min(40, vMax + pad);
    if(vMax - vMin < 1) vMax = vMin + 1;
  }

  if(!isMini){
    // navpicne pomozne crte (4 delitve) + casovna os spodaj
    ctx.strokeStyle = GRID_COLOR; ctx.lineWidth = 1;
    ctx.font = '9px monospace'; ctx.fillStyle = AXIS_TXT_COLOR;
    for(let d=0; d<=4; d++){
      const x = plotX + plotW*(d/4);
      ctx.beginPath(); ctx.moveTo(x, plotY); ctx.lineTo(x, plotY+plotH); ctx.stroke();
      const label = d===4 ? T('oscNow') : '-'+fmtDur(windowMs*(4-d)/4, windowMs);
      ctx.textAlign = d===0?'left':(d===4?'right':'center');
      ctx.fillText(label, x, h-2);
    }
    // Q1/Q2 (V60): pri RELEJIH mreza ni smiselna - crta na polovici visine je
    // padla med R2 in R3 in ni pomenila nicesar. Namesto nje stiri NICELNE
    // CRTE, vsaka v barvi svojega releja: takoj je vidno, kje je nic in kateri
    // kanal je kje, tudi ko so vsi signali dolgo v isti legi.
    // Servo in analog ohranita obicajno mrezo (Q3).
    if(grp === 'rele'){
      const rowH0 = plotH/4;
      ctx.save();
      ctx.globalAlpha = 0.35;          // zatemnjeno, da ne tekmuje s signalom
      ctx.setLineDash([2,3]);
      for(let ch=0; ch<4; ch++){
        ctx.strokeStyle = OSC_COLORS[ch];
        const y = plotY + ch*rowH0 + rowH0 - 3;   // ista lega kot yOff signala
        ctx.beginPath(); ctx.moveTo(plotX, y); ctx.lineTo(plotX+plotW, y); ctx.stroke();
      }
      ctx.restore();
      ctx.strokeStyle = GRID_COLOR;   // povrni barvo mreze za nadaljnji izris
    } else {
      for(let d=0; d<=2; d++){
        const y = plotY + plotH*(d/2);
        ctx.beginPath(); ctx.moveTo(plotX, y); ctx.lineTo(plotX+plotW, y); ctx.stroke();
      }
    }
    ctx.textAlign = 'right';
    if(grp==='servo'){
      ctx.fillText('255', marginL-3, plotY+8);
      ctx.fillText('0', marginL-3, plotY+plotH-1);
    } else if(grp==='analog'){
      // YY4: v AUTO se izpise DEJANSKI izracunani razpon
      const f = (v)=> (vMax-vMin) < 10 ? v.toFixed(1)+'V' : Math.round(v)+'V';
      ctx.fillText(f(vMax), marginL-3, plotY+8);
      ctx.fillText(f((vMin+vMax)/2), marginL-3, plotY+plotH/2+3);
      ctx.fillText(f(vMin), marginL-3, plotY+plotH-1);
    } else if(grp==='rele'){
      const rowH = plotH/4;
      ['R1','R2','R3','R4'].forEach((nm,i)=>{ ctx.fillText(nm, marginL-3, plotY+i*rowH+rowH/2+3); });
    }
  }


  if(samples.length < 2){
    ctx.fillStyle = AXIS_TXT_COLOR; ctx.font = '11px monospace'; ctx.textAlign='left';
    ctx.fillText(T('oscNoData'), plotX+8, plotY+plotH/2);
    return;
  }

  const t0 = now-windowMs, t1 = now;
  const xOf = (t)=> plotX + ((t-t0)/(t1-t0)) * plotW;

  /* Y6 (V60): OZNAKA RESETA NAPRAVE.
     Ker prikaz odslej prezivi reset (Y1), bi bila prekinitev videti kot
     navadna vrzel v meritvi. Tanka navpicnica pove, da je bil to reset -
     torej da manjkajoci del ne obstaja in ga ni smiselno iskati. */
  /* AK1 (V63): obdobje PRED najstarejsim zapisom, ki ga naprava se hrani, je
     nepovratno izgubljeno - ni ga smiselno iskati. Sivo osencimo, da se loci
     od vrzeli, ki jo je se mogoce dopolniti. */
  if(!isMini){
    const hiA = HIST_INFO[siteId];
    const bufA = (SNAPSHOT ? SNAPSHOT.data : OSCBUF[siteId]) || [];
    if(hiA && hiA.oldestTm && bufA.length && hiA.oldestTm > 0){
      const devOldest = hiA.oldestTm + (CLOCK_OFF[siteId] || 0);
      if(devOldest > t0){
        const x2 = Math.min(xOf(devOldest), plotX + plotW);
        if(x2 > plotX + 1){
          ctx.save();
          ctx.fillStyle = 'rgba(127,127,127,0.13)';
          ctx.fillRect(plotX, plotY, x2 - plotX, plotH);
          if(grp === 'rele'){
            ctx.fillStyle = AXIS_TXT_COLOR; ctx.font = '9px monospace'; ctx.textAlign = 'left';
            ctx.fillText(T('noDataBand'), plotX + 4, plotY + plotH - 4);
          }
          ctx.restore();
        }
      }
    }
  }
  if(!isMini && RESETS[siteId]){
    ctx.save();
    ctx.strokeStyle = WARN_COLOR;
    ctx.setLineDash([3,3]); ctx.lineWidth = 1;
    RESETS[siteId].forEach(rt=>{
      if(rt < t0 || rt > t1) return;
      const rx = xOf(rt);
      ctx.beginPath(); ctx.moveTo(rx, plotY); ctx.lineTo(rx, plotY+plotH); ctx.stroke();
      if(grp === 'rele'){
        ctx.setLineDash([]); ctx.fillStyle = WARN_COLOR; ctx.font = '9px monospace';
        ctx.textAlign = 'left'; ctx.fillText('RESET', rx+2, plotY+9);
        ctx.setLineDash([3,3]);
      }
    });
    ctx.restore();
  }

  if(grp==='rele'){
    // DD3: stopnicasta crta IZ DOGODKOV - stopnica stoji na tocnem casu
    // preklopa, ne glede na izbrano casovno bazo. Med dogodkoma je stanje
    // po definiciji nespremenjeno, zato ravna crta.
    // GG6: stopnicasto iz zaporednih vzorcev - vrednost velja do naslednjega
    for(let ch=0; ch<4; ch++){
      ctx.strokeStyle = OSC_COLORS[ch]; ctx.lineWidth = 1.5; ctx.beginPath();
      const rowH = plotH/4, yOn = plotY+ch*rowH+3, yOff = plotY+ch*rowH+rowH-3;
      let prevY = samples[0].rele[ch] ? yOn : yOff;
      ctx.moveTo(xOf(samples[0].t), prevY);
      for(let i=1;i<samples.length;i++){
        const x = xOf(samples[i].t), y = samples[i].rele[ch] ? yOn : yOff;
        if(y !== prevY){ ctx.lineTo(x, prevY); ctx.lineTo(x, y); prevY = y; }
        else ctx.lineTo(x, y);
      }
      ctx.lineTo(plotX+plotW, prevY);
      ctx.stroke();
    }
    // AC2: navpicni oznaki merjenja
    [MARK_A, MARK_B].forEach((mt,mi)=>{
      if(mt === null || mt < t0 || mt > t1) return;
      ctx.save();
      ctx.strokeStyle = OSC_COLORS[mi===0?0:3]; ctx.setLineDash([4,3]); ctx.lineWidth = 1;
      const mx = xOf(mt);
      ctx.beginPath(); ctx.moveTo(mx, plotY); ctx.lineTo(mx, plotY+plotH); ctx.stroke();
      ctx.restore();
    });
  } else if(grp==='servo'){
    // DD4: pozicija se za VSAK x-piksel izracuna iz rampe, ki takrat velja -
    // gladka krivulja pri katerikoli bazi, brez odvisnosti od vzorcenja.
    // GG6: iz zaporednih vzorcev (rampa je vidna tako gosto, kot je vzorcenje)
    for(let ch=0; ch<2; ch++){
      ctx.strokeStyle = OSC_COLORS[ch]; ctx.lineWidth = 1.5; ctx.beginPath();
      samples.forEach((p,i)=>{
        const x = xOf(p.t), y = plotY + plotH - (p.servo[ch]/255)*plotH;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.stroke();
    }
  } else { // analog
    // WW5: AUTO merilo - razpon se prilagodi vrednostim v oknu, da so vidna
    // majhna nihanja (npr. 15.8-17.2V se raztegne cez celotno visino).
    ['a1','a2','a3','a4'].forEach((k,ch)=>{
      ctx.strokeStyle = OSC_COLORS[ch]; ctx.lineWidth = 1.5; ctx.beginPath();
      samples.forEach((p,idx)=>{
        const v = adcVs((p.analog && p.analog[k]) || 0);   // AC1
        // WW5: merilo je MAX (0-40V) ali AUTO (prilagojeno oknu)
        const vc = Math.max(vMin, Math.min(vMax, v));
        const x = xOf(p.t); const y = plotY + plotH - ((vc-vMin)/(vMax-vMin))*plotH;
        if(idx===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.stroke();
    });
  }
}

function attachOscGestures(key, siteId, grp){
  const wrap = document.getElementById('oscCanvasWrap_'+key);
  const tip = document.getElementById('oscTip_'+key);
  if(!wrap) return;
  let pinchStartDist = null, pinchStartZoom = 1;

  wrap.addEventListener('touchstart', (e)=>{
    if(e.touches.length===2){
      pinchStartDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      pinchStartZoom = OSC_ZOOM;
    }
  }, {passive:true});
  wrap.addEventListener('touchmove', (e)=>{
    if(e.touches.length===2 && pinchStartDist){
      e.preventDefault(); // prepreci privzeto brskalnikovo obnasanje SAMO med scipanjem z 2 prstoma
      const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      let z = pinchStartZoom * (d/pinchStartDist);
      OSC_ZOOM = Math.max(0.2, Math.min(8, z));
      ['rele','servo','analog'].forEach(g=>drawOscGroup('full_'+g, siteId, g)); // takojsen odziv na scipanje
    }
    // z 1 prstom preventDefault NI klican - touch-action:pan-y v CSS
    // prepusti navpicno drsenje strani brskalniku.
  }, {passive:false});
  // HH4: drsenje po bufferju deluje VEDNO (tudi med zivim prikazom).
  // Ob zacetku drsenja se zivo sledenje prekine, sicer bi novi podatki
  // premikali okno pod prstom. Ko poteg doseze skrajni desni rob (PAN=0),
  // se zivo sledenje obnovi.
  let panStartX = null, panStartY = null, panStartVal = 0;
  wrap.addEventListener('touchstart', (e)=>{
    if(e.touches.length===1){
      panStartX = e.touches[0].clientX; panStartY = e.touches[0].clientY; panStartVal = OSC_PAN;
    }
  }, {passive:true});
  wrap.addEventListener('touchmove', (e)=>{
    if(panStartX===null || e.touches.length!==1) return;
    const dx = e.touches[0].clientX - panStartX;
    const dy = e.touches[0].clientY - (panStartY||0);
    // GG7: prag 20px IN pretezno vodoraven premik - tap za odcitek in
    // navpicno drsenje strani ne smeta ustaviti prikaza (prej je ze rahel
    // premik pri tapu sprozil ustavitev).
    if(Math.abs(dx) < 20 || Math.abs(dx) < Math.abs(dy)) return;
    e.preventDefault();
    if(OSC_RUNNING){                          // prvi premik ustavi sledenje
      OSC_RUNNING = false; OSC_FROZEN_AT = Date.now();
      // GG7: med potezo NE renderOscFull() (preri\u0161e cel zavihek in prekine
      // potezo) - stanje gumba osvezimo sele ob koncu poteze
    }
    // poteg desno = nazaj v preteklost; omejeno na dolzino bufferja
    const buf = OSCBUF[siteId] || [];
    const oldestT = buf.length ? buf[0].t : Date.now();
    const maxPan = Math.max(0, (OSC_FROZEN_AT || Date.now()) - oldestT);
    OSC_PAN = Math.max(0, Math.min(maxPan, panStartVal + (dx / wrap.clientWidth) * oscWindowMs()));
    if(OSC_PAN === 0 && dx < 0){              // nazaj na desni rob -> zivo
      OSC_RUNNING = true; renderOscFull(); panStartX = null; return;
    }
    updateOscPosInfo();
    ['rele','servo','analog'].forEach(g=>drawOscGroup('full_'+g, siteId, g));
  }, {passive:false});

  wrap.addEventListener('touchend', (e)=>{
    pinchStartDist = null;
    if(panStartX!==null && Math.abs((e.changedTouches[0]||{}).clientX - panStartX) > 20){
      panStartX = panStartY = null;
      renderOscFull();   // GG7: sele zdaj osvezi gumb/oznako polozaja
      return;
    }
    panStartX = panStartY = null;
    if(e.changedTouches && e.changedTouches.length===1 && (!e.touches || e.touches.length===0)){
      showOscTip(key, siteId, grp, e.changedTouches[0].clientX, wrap, tip);
    }
  });
  wrap.addEventListener('click', (e)=>{ showOscTip(key, siteId, grp, e.clientX, wrap, tip); });
}

function showOscTip(key, siteId, grp, clientX, wrap, tip){
  // AC2: tap poleg vrednosti postavi tudi casovno oznako za merjenje
  const windowMs = oscWindowMs();
  const now = oscNowRef();   // EE3
  const rect = wrap.getBoundingClientRect();
  const frac = Math.max(0, Math.min(1, (clientX-rect.left)/rect.width));
  const t0 = now-windowMs, t1 = now;
  const targetT = t0 + frac*(t1-t0);

  // GG6: vsi kanali iz istega bufferja - poiscemo najblizji vzorec
  // D13 (V59): ko je nalozen posnetek, mora odcitek in meritev brati NJEGOVE
  // podatke. Prej je bral zivi buffer, zato je tap po grafu posnetka vracal
  // vrednosti iz cisto drugega casa - ali "ni podatka", ce je bil buffer prazen.
  const buf = (SNAPSHOT ? SNAPSHOT.data : OSCBUF[siteId]) || [];
  const from = lowerBound(buf, t0);
  if(from >= buf.length) return;
  let nearest = buf[from], best = Infinity;
  for(let i=from;i<buf.length && buf[i].t<=t1;i++){
    const d = Math.abs(buf[i].t - targetT);
    if(d < best){ best = d; nearest = buf[i]; }
  }
  addTimeMark(nearest.t);   // AC2
  let txt = new Date(nearest.t).toLocaleTimeString() + ' · ';
  if(grp==='rele') txt += 'R:' + nearest.rele.map(b=>b?'1':'0').join('');
  else if(grp==='servo') txt += 'S1:'+nearest.servo[0]+' S2:'+nearest.servo[1];
  else txt += Object.keys(nearest.analog||{}).map(k=>k+':'+adcVs(nearest.analog[k]).toFixed(1)+'V').join(' ');

  tip.textContent = txt;
  tip.style.display = 'block';
  clearTimeout(tip._to);
  tip._to = setTimeout(()=>{ tip.style.display='none'; }, 3000);
}

// V2: DRSECI izris - preris ~20x/s prek requestAnimationFrame, zato se
// casovno okno premika zvezno in krivulja gladko drsi z desne proti levi.
// Prej je bil preris na 500ms, zato je celotna slika poskocila za pol
// sekunde naenkrat. 20 slik/s je vizualno gladko, a varcno z baterijo.
// DD6: firmware po 30s brez scope/set preklopi na pocasno vzorcenje (1/s).
// Dokler je zavihek Osciloskop odprt, zahtevo osvezujemo vsakih 10s, sicer
// ADC preneha prihajati v izbrani casovni bazi.
setInterval(()=>{
  if(currentTab !== 'osciloskop') return;
  const s = currentSite();
  if(s && s.opMode === 'real') sendCommand(s, 'scope/set', { timebase_ms: OSC_TIMEBASE });
}, 10000);

const OSC_FPS = 20, OSC_FRAME_MS = 1000/OSC_FPS;
let _lastOscFrame = 0;
function oscFrame(ts){
  requestAnimationFrame(oscFrame);
  if(ts - _lastOscFrame < OSC_FRAME_MS) return;
  _lastOscFrame = ts;
  if(currentTab !== 'osciloskop') return;
  // TT1: izris preskocimo (platno ni vidno), SPREJEM podatkov pa tece naprej -
  // zapisi se zbirajo v buffer in se ob vrnitvi takoj izrisejo.
  if(document.hidden) return;
  if(!OSC_RUNNING) return;                 // EE3: zamrznjeno - izris sprozi drsenje
  const s = currentSite(); if(!s) return;
  ['rele','servo','analog'].forEach(g=>drawOscGroup('full_'+g, s.id, g));
}
requestAnimationFrame(oscFrame);

/* ============================================================
   ZAGON
   ============================================================ */
// H3: visina fiksne glave ni konstantna (vrstica z nacinom delovanja se
// pri realnem nacinu ne izpise, besedilo se lahko prelomi pri drugem jeziku),
// zato jo izmerimo in prenesemo v CSS spremenljivko --topH.
function syncTopHeight(){
  const top = document.querySelector('.top');
  if(!top) return;
  document.documentElement.style.setProperty('--topH', top.getBoundingClientRect().height + 'px');
}
window.addEventListener('resize', syncTopHeight);
window.addEventListener('orientationchange', ()=>setTimeout(syncTopHeight, 150));

// Q1: UI je VIR RESNICE. Ob nalaganju strani ali preklopu naprave posljemo
// napravi celotno stanje iz UICMD (4 releji + 2 serva), da se ne razideta.
// Prej se to ni zgodilo: UI se je izrisal iz UICMD (Rocno/OFF), virtualna
// naprava pa obnovila iz SIMS (npr. se vedno oscillate) in nihala naprej -
// gumb je pisal OFF, graf pa je kazal nihanje.
let _syncedSites = new Set();
function syncDeviceToUI(site, force){
  if(!site) return;
  // JJ2: pri REALNI napravi je vir resnice NAPRAVA (ima svoj NVS in obnovljeno
  // stanje). Prej je aplikacija ob zagonu poslala staro stanje iz localStorage
  // in s tem prepisala dejansko stanje naprave. Pri simulaciji ostane, ker
  // virtualna naprava lastnega trajnega stanja nima.
  if(site.opMode === 'real'){
    logDebug(`syncDeviceToUI ${site.id}: preskoceno (realna naprava je vir resnice)`);
    return;
  }
  if(!force && _syncedSites.has(site.id)) return;
  _syncedSites.add(site.id);
  const uc = ensureUICmd(site.id);
  const L = ensureLive(site.id);
  // S5: ukazi ZAPOREDNO z zamikom - ob posiljanju vseh v isti milisekundi
  // jih je javni broker deloma zavrgel (servo ukaza nista nikoli prispela).
  const queue = [];
  for(let i=0;i<4;i++){
    const r = uc.rele[i];
    queue.push([`rele/${i+1}/set`, r.mode === 'period'
      ? {mode:'blink', ton:r.ton, toff:r.toff}
      : {mode:'static', state:!!r.on}]);
  }
  for(let i=0;i<2;i++){
    const v = uc.servo[i];
    queue.push([`servo/${i+1}/set`, v.mode === 'period'
      ? {mode:'oscillate', posA:v.posA, posB:v.posB, ton:v.ton, toff:v.toff, rampMs:v.rampMsP}
      : {mode:'static', pos: v.on ? v.posOn : v.posOff, posOff:v.posOff, posOn:v.posOn, rampMs:v.rampMs}]);
  }
  // S5: uskladi tudi binarno stetje - prej izpusceno, zato je ostalo
  // vklopljeno iz prejsnje seje, ceprav ga v UI ni bilo vklopljeno
  queue.push(['binarno/set', {on: !!L.binOn, perioda: L.binPeriod||1}]);

  queue.forEach(([topic, payload], k)=>{
    setTimeout(()=>sendCommand(site, topic, payload), k*120);
  });
  logDebug(`syncDeviceToUI ${site.id}: v vrsti ${queue.length} ukazov (zamik 120ms)`);
}

function renderAll(){
  renderSiteMenu();
  renderConnPill();
  if(currentTab==='nadzor') renderNadzorControls();
  if(currentTab==='simulator') renderSimulatorControls();
  if(currentTab==='osciloskop') renderOscFull();
}

applyTheme(lsGetPlain('rs_theme','pasnik'));  // uveljavi shranjeno paleto
syncOscColors();
document.documentElement.setAttribute('lang', LANG);
document.querySelectorAll('[data-i]').forEach(el=>{ el.textContent = T(el.getAttribute('data-i')); });
fixSiteIdx();   // OO1: enotna logika tudi ob zagonu
requestWakeLock();   // TT4
connectAll(); // ze poskrbi za ensureSimBrokerListening() na VSEH sim_broker napravah, ne le tekocih
renderTabs();
renderAll();
buildLangGrid();
syncTopHeight();
window.addEventListener('load', syncTopHeight);
// Q1: uskladi napravo z UI stanjem; z zamikom, da se MQTT povezava vzpostavi
setTimeout(()=>{ CFG.sites.forEach(site=>syncDeviceToUI(site)); }, 1200);

document.addEventListener('click', (e)=>{
  const box=document.getElementById('headbox'), menu=document.getElementById('siteMenu');
  if(!box.contains(e.target) && !menu.contains(e.target)){
    menu.classList.remove('open'); box.setAttribute('data-open','0');
  }
});
