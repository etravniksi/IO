<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161A17">
<title>Rele-Servo Tester</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
:root{
  --ink:#161A17; --panel:#1E2421; --panel2:#262E29; --line:#38423C;
  --paper:#E4E7E2; --mute:#8A968F;
  --volt:#FFD23F; --sage:#86B06A; --rust:#D3543A; --sky:#62A8C4; --amber:#FFA23F;
  --disp:"Archivo Narrow","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono","Roboto Mono",Consolas,monospace;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:15px;line-height:1.45;
     -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font-family:var(--mono);background:var(--panel2);border:1px solid var(--line);color:var(--paper);
             padding:7px 9px;border-radius:7px;font-size:13px}
:focus-visible{outline:2px solid var(--volt);outline-offset:2px;border-radius:4px}
/* M3: vecja rezerva pod fiksno glavo - pri 4px se je vrh vsebine se vedno
   skril pod vrstico zavihkov (zaokrozevanje visine + senca). */
.wrap{max-width:560px;margin:0 auto;padding:calc(var(--topH, 132px) + 14px) 14px 40px}
.card{scroll-margin-top:calc(var(--topH, 132px) + 14px)}

/* ---------- glava ---------- */
/* H3: FIKSNA glava - drsenje se zacne POD njo (sticky je pustil vsebino
   pod glavo in povzrocal prekrivanje naslovov). Visina se meri dinamicno
   (--topH), ker vrstica z nacinom delovanja ni vedno prisotna.
   H8: z-index 55 = nad zatemnitvijo (.scrim 50), da spustni seznam naprav
   (.sitemenu, znotraj glave) ne pade pod zatemnitev; panel Nastavitve (60)
   ostane nad glavo. */
.top{position:fixed;top:0;left:0;right:0;z-index:55;background:var(--ink);padding:12px 14px 0}
.tophead{display:flex;align-items:center;gap:8px;margin-bottom:10px;position:relative}
.headbox{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;background:var(--panel);
         border:1px solid var(--line);border-radius:10px;padding:8px 12px;transition:border-color .15s}
.headbox[data-multi="1"]{cursor:pointer}
.headbox[data-multi="1"]:hover{background:var(--panel2);border-color:var(--mute)}
.headbox[data-multi="1"][data-open="1"]{border-color:var(--volt);background:var(--panel2)}
.hline{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hline b{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.04em;color:var(--paper);
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
      border:1px solid var(--line);border-radius:100px;padding:3px 9px;color:var(--mute);flex:0 0 auto}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--mute)}
.pill.on{color:var(--sage);border-color:color-mix(in srgb, var(--sage) 45%, var(--line))}
.pill.on .dot{background:var(--sage);box-shadow:0 0 6px var(--sage)}
.pill.off{color:var(--rust);border-color:color-mix(in srgb, var(--rust) 45%, var(--line))}
.pill.off .dot{background:var(--rust)}
.opmodetag{font-size:10px;color:var(--sky);letter-spacing:.05em;text-transform:uppercase;font-family:var(--mono)}
.headright{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.gear{font-size:24px;color:var(--mute);padding:4px 6px;line-height:1}
.gear:hover{color:var(--paper)}
.hb{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--volt);
    position:relative;
    background:var(--panel2);color:var(--volt);font-family:var(--disp);font-size:13px;font-weight:700;
    line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0}
.hb::before{content:"?"}
/* H5: nevidno razsirjeno klikalno obmocje do 44px (tarca za prst) */
.hb::after{content:"";position:absolute;top:50%;left:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
.hb:hover{background:var(--volt);color:var(--ink)}
.chev{flex:0 0 auto;width:44px;height:44px;color:var(--mute);font-size:28px;transition:transform .2s;
      display:inline-flex;align-items:center;justify-content:center}
.chev.open{transform:rotate(180deg)}
.sitemenu{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:60;background:var(--panel2);
          border:1px solid var(--volt);border-radius:var(--r);padding:7px;box-shadow:0 14px 38px rgba(0,0,0,.6);
          display:none;flex-direction:column;gap:6px}
.sitemenu.open{display:flex}
.sitemenu .row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;
                border-radius:7px;cursor:pointer}
.sitemenu .row:hover{background:var(--ink)}
.sitemenu .row.cur{color:var(--volt)}
.sitemenu small{display:block;color:var(--mute);font-size:10px;font-family:var(--mono)}
.relbits{display:flex;gap:3px;margin-left:6px}
.relbits span{width:6px;height:6px;border-radius:2px;background:var(--mute);display:inline-block}
.relbits span.on{background:var(--sage)}

/* ---------- zavihki (dinamicno izrisani) ---------- */
.tabs{display:flex;border-bottom:1px solid var(--line);margin-top:4px}
.tabs button{flex:1;padding:11px 6px;font-family:var(--disp);font-size:12.5px;letter-spacing:.08em;
             text-transform:uppercase;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--volt);border-bottom-color:var(--volt)}
.page{display:none;padding-top:12px}
.page.show{display:block}

/* ---------- kartice / zlozljive sekcije ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:0;margin-bottom:10px;overflow:hidden}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px;cursor:pointer}
.chead h3{font-family:var(--disp);font-size:11.5px;font-weight:600;letter-spacing:.14em;
          text-transform:uppercase;color:var(--mute);flex:1}
.cbody{padding:0 14px 14px;overflow:hidden;transition:max-height .25s ease, padding .25s ease}
.cbody.collapsed{max-height:0!important;padding-top:0;padding-bottom:0}
.row2{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
label.lbl{color:var(--mute);font-size:11.5px;min-width:56px;font-family:var(--body)}
input[type=number]{width:64px}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--paper);padding:7px 13px;
     border-radius:7px;font-family:var(--disp);letter-spacing:.03em;font-size:13px}
.btn:hover{border-color:var(--volt)}
.btn.primary{background:var(--volt);color:var(--ink);border-color:var(--volt);font-weight:700}
.btn.ghost{background:none;color:var(--mute);border:1px solid var(--line)}
.sep{border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.small{font-size:11px;color:var(--mute)}
.analog{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.analog .a{background:var(--panel2);border-radius:8px;padding:10px;text-align:center}
.analog .a b{display:block;font-size:20px;color:var(--volt);font-family:var(--mono)}
.analog .a span{color:var(--mute);font-size:11px}
.tag{display:inline-block;padding:3px 9px;border-radius:100px;font-size:10.5px;letter-spacing:.06em;
     text-transform:uppercase;background:var(--panel2);color:var(--mute);border:1px solid var(--line)}
.tag.on{color:var(--sage);border-color:color-mix(in srgb, var(--sage) 45%, var(--line))}
.tag.off{color:var(--rust);border-color:color-mix(in srgb, var(--rust) 45%, var(--line))}
.empty{color:var(--mute);text-align:center;padding:34px 14px}

/* ---------- osciloskop ---------- */
.osc-tb{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.osc-tb button{padding:6px 10px;border:1px solid var(--line);border-radius:7px;font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.osc-tb button[aria-pressed="true"]{border-color:var(--volt);color:var(--volt)}
.osc-grp{margin-bottom:10px}
.osc-grp .lbl2{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:4px;
               font-family:var(--disp);display:flex;justify-content:space-between}
.osc-canvas-wrap{position:relative;background:var(--panel2);border-radius:8px;border:1px solid var(--line);
                  touch-action:pan-y;overflow:hidden}
.osc-canvas-wrap canvas{display:block;width:100%}
.osc-tip{position:absolute;top:4px;left:6px;background:rgba(0,0,0,.65);border:1px solid var(--volt);
         border-radius:6px;padding:4px 8px;font-family:var(--mono);font-size:10.5px;color:var(--paper);
         pointer-events:none;display:none;white-space:nowrap;z-index:5}
.osc-legend{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap}
.osc-legend span{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--mute);font-family:var(--mono)}
.osc-legend i{width:9px;height:9px;border-radius:2px;display:inline-block}

/* ---------- rele/servo kartice (posamezni okvirji) ---------- */
.unit-card{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:9px}
.uc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.uc-head span.nm{font-family:var(--disp);font-size:12.5px;letter-spacing:.04em;color:var(--paper)}
.livebadge{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:100px;background:var(--panel);
           color:var(--mute);border:1px solid var(--line)}
.livebadge.on{color:var(--sage);border-color:color-mix(in srgb, var(--sage) 45%, var(--line))}
.livebadge.off{color:var(--rust);border-color:color-mix(in srgb, var(--rust) 45%, var(--line))}
.mtog{display:flex;gap:0;margin-bottom:9px;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.mtog button{flex:1;padding:11px 7px;font-family:var(--disp);font-size:11.5px;letter-spacing:.04em;color:var(--mute);background:var(--panel)}
.mtog button.active{background:var(--volt);color:var(--ink);font-weight:700}
.onoff-btn{width:100%;padding:12px;border-radius:7px;font-family:var(--disp);font-size:14px;font-weight:700;
           letter-spacing:.08em;border:1.5px solid var(--line)}
.onoff-btn.on{background:var(--sage);color:#10160f;border-color:var(--sage)}
.onoff-btn.off{background:var(--rust);color:#1a0d0a;border-color:var(--rust)}
.tblock{margin-bottom:8px}
.tblock .trow{display:flex;gap:8px;align-items:center}
.tblock label{color:var(--mute);font-size:11px;min-width:36px}
.tblock input[type=number]{width:58px}
.stepslider{flex:1;accent-color:var(--volt);height:22px}
.pos-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.pos-row label{color:var(--mute);font-size:11px;min-width:52px}
.pos-row input[type=number]{width:64px}
.osc-full .osc-canvas-wrap{height:110px}
.osc-empty{color:var(--mute);text-align:center;padding:24px;font-size:12.5px}

/* onemogocene kontrole (naprava ni online, ali binarno stetje zaklene releje) */
.locked{opacity:.42;pointer-events:none;filter:grayscale(.5)}
.locknote{font-size:11.5px;color:var(--amber);padding:8px 10px;border:1px solid var(--line);
          border-radius:8px;background:var(--panel2);margin-bottom:10px}

/* ---------- debug polje (Simulator) ---------- */
.debug-box{background:#0c100e;border:1px solid var(--line);border-radius:8px;padding:8px;
           max-height:320px;overflow-y:auto;font-family:var(--mono);font-size:10.5px;line-height:1.5;
           color:#9fd18a;white-space:pre-wrap;word-break:break-all;margin-top:8px}
.debug-box .err{color:var(--rust)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none}
.scrim.show{display:block}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--panel);
        border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:10px 16px 24px;
        max-height:82vh;overflow-y:auto;transform:translateY(105%);transition:transform .22s;
        box-shadow:0 -14px 40px rgba(0,0,0,.5)}
.drawer.open{transform:translateY(0)}
.grip{width:38px;height:4px;border-radius:3px;background:var(--line);margin:2px auto 12px}
.hrow{display:flex;align-items:center;gap:8px;margin:16px 0 9px}
.hrow:first-of-type{margin-top:2px}
.hrow h3{font-family:var(--disp);font-size:14px;font-weight:700;letter-spacing:.06em;color:var(--paper);flex:1}
.hrow h4{font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
         color:var(--mute);flex:1}
.sitelist .r{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.sitelist .r .r1{display:flex;gap:6px}
.sitelist input{flex:1;min-width:0}
.sitelist select{width:100%}
.hclose{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);color:var(--mute);
        display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.hclose:hover{color:var(--paper);border-color:var(--paper)}
.hback{color:var(--mute);font-size:13px;font-family:var(--disp)}
#helpBody p{font-size:13px;line-height:1.6;margin-bottom:10px;color:var(--paper)}
#helpBody.hidx button{display:block;width:100%;text-align:left;padding:11px 12px;margin-bottom:6px;
                       border:1px solid var(--line);border-radius:9px;color:var(--paper);font-family:var(--body)}
#helpBody.hidx button:hover{border-color:var(--volt);color:var(--volt)}
/* K4: izbirnik barvnih palet (prevzeto iz EF projekta) */
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.themes button{display:flex;align-items:center;gap:9px;border:1px solid var(--line);
               border-radius:9px;padding:8px;color:var(--paper);text-align:left}
.themes button[aria-pressed="true"]{border-color:var(--volt);background:var(--panel2)}
.themes .sw{display:flex;gap:2px;padding:5px;border:1px solid;border-radius:5px;flex:0 0 auto}
.themes .sw i{width:7px;height:14px;border-radius:2px;display:block}
.themes .tn{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* visok kontrast (palete z oznako +): debelejse crte, berljivo na soncu */
body.hc .card,body.hc .unit-card,body.hc .btn,body.hc .mtog,body.hc .onoff-btn,
body.hc .themes button,body.hc .langGrid button,body.hc input,body.hc select,
body.hc .osc-canvas-wrap,body.hc .headbox,body.hc .pill{border-width:2px}
body.hc .chead h3,body.hc .uc-head span.nm{font-weight:700}

.langGrid{display:flex;gap:8px}
.langGrid button{flex:1;padding:10px;border:1px solid var(--line);border-radius:9px;font-family:var(--disp);
                  letter-spacing:.04em}
.langGrid button[aria-pressed="true"]{border-color:var(--volt);color:var(--volt)}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,90px);background:var(--panel2);
       border:1px solid var(--line);border-radius:100px;padding:9px 18px;font-size:12.5px;z-index:70;
       transition:transform .25s;max-width:88vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="top">
  <div class="tophead">
    <div class="headbox" id="headbox" onclick="toggleSiteMenu()">
      <div class="hline">
        <b id="siteName" data-i="noDevice">—</b>
        <span class="pill" id="connPill" onclick="event.stopPropagation();reconnectNow()" title="—"><span class="dot"></span><span id="connPillTxt">—</span></span>
      </div>
      <div class="opmodetag"><span id="opModeTag"></span> <span id="verTag" style="color:var(--mute)"></span></div>
    </div>
    <div class="headright">
      <button class="hb" onclick="openHelp('index')" aria-label="Help"></button>
      <button class="gear" onclick="openDrawer()" aria-label="Settings">⚙</button>
    </div>
    <div class="sitemenu" id="siteMenu"></div>
  </div>

  <div class="tabs" role="tablist" id="tabsBar"></div>
</div>

<div class="wrap">
  <div id="tab-nadzor" class="page show"></div>
  <div id="tab-simulator" class="page"></div>
  <div id="tab-osciloskop" class="page"></div>
</div>

<!-- ===== NASTAVITVE (drawer) ===== -->
<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer" role="dialog" aria-label="Settings">
  <div class="grip"></div>
  <div class="hrow"><h3 data-i="cfgTitle">Nastavitve</h3>
    <button class="hclose" onclick="closeDrawer()" aria-label="Close">✕</button></div>

  <div class="hrow"><h4 data-i="cfgDevices">Naprave</h4>
    <button class="hb" onclick="openHelp('hSettings')" aria-label="?"></button></div>
  <div class="sitelist" id="siteList"></div>
  <div class="row2" style="margin-top:10px">
    <button class="btn" onclick="addSite()" data-i="cfgAddDevice">+ Dodaj napravo</button>
  </div>
  <div class="row2" style="margin-top:12px">
    <button class="btn" id="saveBtn" onclick="saveSettings()" data-i="btnSave">Shrani</button>
    <button class="btn" onclick="applySettings()" data-i="btnApply">Uporabi</button>
  </div>

  <div class="hrow"><h4 data-i="cfgTheme">Barvna paleta</h4></div>
  <div class="themes" id="themeGrid"></div>

  <div class="hrow"><h4 data-i="cfgLang">Jezik / Language</h4></div>
  <div class="langGrid" id="langGrid"></div>
</div>

<!-- ===== POMOČ (drawer) ===== -->
<div class="scrim" id="hscrim" onclick="closeHelp()"></div>
<div class="drawer help" id="helpSheet" role="dialog" aria-label="Help">
  <div class="grip"></div>
  <div class="hrow">
    <button class="hback" id="helpBack" onclick="openHelp('index')" hidden>‹</button>
    <h3 id="helpTitle" style="flex:1">—</h3>
    <button class="hclose" onclick="closeHelp()" aria-label="Close">✕</button>
  </div>
  <div id="helpBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   I18N
   ============================================================ */
// K2: verzija na ENEM mestu - prikaze se v glavi
const APP_VERSION = 'V42';

// ============================================================
// K4: BARVNE PALETE (prevzete iz EF/Pastir projekta)
// 5 nocnih + 6 z visokim kontrastom za delo na soncu (oznaka +).
// ============================================================
const THEMES=[
 {id:"pasnik", n:"Pašnik",  c:{ink:"#161A17",panel:"#1E2421",panel2:"#262E29",line:"#38423C",
    paper:"#E4E7E2",mute:"#8A968F",volt:"#FFD23F",sage:"#86B06A",rust:"#D3543A",sky:"#62A8C4",amber:"#FFA23F"}},
 {id:"nocna",  n:"Noč",     c:{ink:"#0E141F",panel:"#161E2C",panel2:"#1E293A",line:"#2E3D52",
    paper:"#DDE6F2",mute:"#7D8DA5",volt:"#5AD1F0",sage:"#5FD3A6",rust:"#F0576B",sky:"#8B9CF5",amber:"#FFB454"}},
 {id:"jantar", n:"Jantar",  c:{ink:"#1A1410",panel:"#241C16",panel2:"#2E241C",line:"#463629",
    paper:"#F0E3D3",mute:"#A08D77",volt:"#FFB454",sage:"#B5C25E",rust:"#E05A3C",sky:"#6FB5C9",amber:"#FF8F3C"}},
 {id:"gozd",   n:"Gozd",    c:{ink:"#0D1710",panel:"#132018",panel2:"#1A2C20",line:"#274434",
    paper:"#DCEEDF",mute:"#7C9C87",volt:"#B8E62E",sage:"#4FD37C",rust:"#E85D4A",sky:"#4FC3D9",amber:"#FFC24A"}},
 {id:"vino",   n:"Vino",    c:{ink:"#180F16",panel:"#22161F",panel2:"#2D1E29",line:"#452F3F",
    paper:"#F2DFEC",mute:"#A2849A",volt:"#FF7FB0",sage:"#9BDF6E",rust:"#F04D6A",sky:"#9C8CF0",amber:"#FFA95C"}},
 {id:"termnoc",n:"Terminal noč", c:{ink:"#0A0503",panel:"#140906",panel2:"#1E0F09",line:"#3D1F16",
    paper:"#E8A87C",mute:"#8C5A45",volt:"#FF8F52",sage:"#E8B86A",rust:"#FF5A3D",sky:"#D98A5C",amber:"#FFB347"}},
 {id:"jeklo",  n:"Jeklo +", hc:1, c:{ink:"#0A0C0E",panel:"#14181C",panel2:"#1F262C",line:"#5A6873",
    paper:"#FFFFFF",mute:"#BAC6D1",volt:"#FFB000",sage:"#3CD060",rust:"#FF3B30",sky:"#40C4FF",amber:"#FF8C00"}},

// osciloskop - krozni buffer vzorcev na napravo (v pomnilniku, ne persistira)
let OSCBUF = {}; // id -> [{t, analog:{}}]  (DD2: samo ADC vzorci)
// Pri 20s oknu in gostem prometu (ADC + dogodki + interpolacija) je 3000
// vzorcev lahko premalo - starejsi del okna bi se izrinil. 8000 pokrije
// najsirse okno z rezervo.
const OSC_MAX_SAMPLES = 30000;   // EE4
// V1: vzorci prihajajo iz dveh virov z RAZLICNIM izracunom casovnega ziga -
// ADC nazaj datiran (Date.now() - n*tbMs), interpolacija s trenutnim casom.
// Ce jih le pripenjamo, buffer ni urejen po casu in krivulja dobi zareze.
// Zato vstavljamo na pravo mesto (obicajno na konec - hitra pot).
// EE7: prvi indeks z vzorcem/dogodkom, katerega t >= tMin. Buffer je urejen
// po casu, zato binarno iskanje. Prej je vsak izris preletel CELOTEN buffer
// (filter/forEach) - pri 30000 vnosih in 20 slikah/s je to 1.8M primerjav/s
// za tri grafe, kar telefon opazno upocasni.
function lowerBound(arr, tMin){
  let lo = 0, hi = arr.length;
  while(lo < hi){ const m = (lo+hi)>>1; if(arr[m].t < tMin) lo = m+1; else hi = m; }
  return lo;
}

function pushOscSample(id, sample){
  if(!OSCBUF[id]) OSCBUF[id] = [];
  const buf = OSCBUF[id];
  if(buf.length === 0 || sample.t >= buf[buf.length-1].t){
    buf.push(sample);                     // hitra pot: nov vzorec je najnovejsi
  } else {
    let lo = 0, hi = buf.length;          // binarno iskanje mesta vstavitve
    while(lo < hi){ const mid = (lo+hi)>>1; if(buf[mid].t <= sample.t) lo = mid+1; else hi = mid; }
    buf.splice(lo, 0, sample);
  }
  if(buf.length > OSC_MAX_SAMPLES) buf.shift();
}

/* ============================================================
   DEBUG LOG (zavihek Simulator) - krozni buffer 1000 vnosov,
   VEDNO aktiven (ni potrebno posebej vklopiti). Zajema celotno pot:
   MQTT connect/subscribe/publish/message, ukazni tok sendCommand->
   applySimCommand->pushSimStateNow, dekodiranje scope/data, napake.
   ============================================================ */
let DEBUGLOG = [];
const DEBUG_CAP = 5000;   // LL4: ~15 min pri ~6 vnosih/s
function logDebug(msg, isErr){
  const t = new Date();
  const ts = String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')+':'+
             String(t.getSeconds()).padStart(2,'0')+'.'+String(t.getMilliseconds()).padStart(3,'0');
  DEBUGLOG.unshift({ts, msg, isErr:!!isErr});   // zbiranje tece VEDNO
  if(DEBUGLOG.length > DEBUG_CAP) DEBUGLOG.length = DEBUG_CAP;
  // LL2: izris se NE sprozi samodejno - vsebina se prikaze sele ob kliku na
  // "Prikazi". Pri gostem prometu je izris ob vsakem vnosu drag, zgodovina
  // pa se kljub temu zbira ves cas.
}
// LL2: rocni prikaz vsebine dnevnika
function showDebugLog(){
  const el = document.getElementById('debugLogBox');
  if(!el) return;
  renderDebugLog(el);
  const info = document.getElementById('debugInfo');
  if(info) info.textContent = `${DEBUGLOG.length} / ${DEBUG_CAP}`;
}

function renderDebugLog(el){
  if(!el) return;
  el.innerHTML = DEBUGLOG.map(e=>{
    const line = `[${e.ts}] ${e.msg}`;
    return e.isErr ? `<span class="err">${line}</span>` : line;
  }).join('\n');
}
// Neblokirajoce obvestilo (nadomesca alert(), ki na mobilnem zamrzne UI)
let _toastTo = null;
function showToast(msg){
  const el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTo);
  _toastTo = setTimeout(()=>el.classList.remove('show'), 2600);
}

function clearDebugLog(){
  DEBUGLOG = [];
  const el = document.getElementById('debugLogBox');
  if(el) el.innerHTML = '';
}
// O4: navigator.clipboard obstaja SAMO v varnem kontekstu (https/localhost).
// Datoteka, odprta prek content:// ali file://, tega nima - zato rezervna
// pot prek zacasnega <textarea> + execCommand('copy'), ki deluje povsod.
function copyDebugLog(){
  const text = DEBUGLOG.slice().reverse().map(e=>`[${e.ts}] ${e.msg}`).join('\n');
  if(!text){ showToast(T('logEmpty')); return; }
  const fallback = ()=>{
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta);
      ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      showToast(ok ? T('logCopied') : T('logCopyFail'));
    }catch(e){ showToast(T('logCopyFail')); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text)
      .then(()=>showToast(T('logCopied')))
      .catch(fallback);   // zavrnjeno dovoljenje -> rezervna pot
  } else fallback();
}

let mqttClients = {};
// JJ4: WS naslov ni vec trdo 8084. Zapis brokerja: "gostitelj[:tcpPort][|wsPort][|ws|wss]"
// npr. "broker.emqx.io", "mojbroker.si:1883|9001|ws"
// JJ12: cel niz ostane KLJUC za identifikacijo brokerja (mqttClients[broker]),
// zato se dva razlicna zapisa istega gostitelja stejeta kot razlicna brokerja.
function brokerWsUrl(broker){
  const parts = String(broker).split('|');
  const host = parts[0].split(':')[0].trim();
  const wsPort = (parts[1] && parseInt(parts[1])) || 8084;
  const scheme = (parts[2] || '').trim().toLowerCase() === 'ws' ? 'ws' : 'wss';
  return `${scheme}://${host}:${wsPort}/mqtt`;
}

function getClient(broker){
  if(mqttClients[broker]) return mqttClients[broker];
  if(typeof mqtt === 'undefined'){ logDebug('MQTT: mqtt.js knjižnica ni na voljo (CDN nedosegljiv?)', true); console.warn('mqtt.js ni na voljo'); return null; }
  try{
    const url = brokerWsUrl(broker);
    logDebug(`MQTT connect() poskus -> ${url}`);
    // OBRATEN LWT: naprava mora vedeti, ali je NADZORNI KLIENT prisoten.
    // Broker sam objavi "offline" na client/status ob nepricakovani prekinitvi.
    // LWT velja za eno temo, zato ga vezemo na prvo napravo tega brokerja;
    // prisotnost "online" pa aktivno objavimo za VSE naprave (glej publishClientPresence).
    // JJ1: MQTT dovoli SAMO EN will na povezavo. Prej je bil vezan na prvo
    // napravo, zato pri vec napravah druge niso dobile "offline" in njihov
    // Offline Guard se ni sprozil. Zdaj skupna tema, ki jo poslusajo vse.
    // TT2: keepalive 60s - povezava prezivi kratko ozadje brez ponovnega
    // vzpostavljanja; reconnectPeriod ostane kratek za hitro obnovo.
    const opts = { reconnectPeriod: 4000, keepalive: 60 };
    opts.will = { topic: CLIENT_STATUS_TOPIC, payload:'offline', qos:1, retain:true };
    const client = mqtt.connect(url, opts);
    client.on('error', (err)=>{ logDebug(`MQTT ERROR (${broker}): ${err&&err.message}`, true); console.warn('MQTT napaka ('+broker+'):', err&&err.message); renderConnPill(); });
    client.on('reconnect', ()=>{ logDebug(`MQTT reconnect poskus (${broker})`); });
    client.on('connect', ()=>{ logDebug(`MQTT CONNECTED (${broker})`); renderConnPill(); resubscribeAll(broker); publishClientPresence(broker, true); });
    client.on('close', ()=>{ logDebug(`MQTT CLOSED (${broker})`, true); renderConnPill(); });
    client.on('offline', ()=>{ logDebug(`MQTT OFFLINE (${broker})`, true); });
    client.on('message', (topic, payload)=>{
      logDebug(`MQTT <- ${topic} (${payload.length}B)`);
      onMqttMsg(topic, payload);
    });
    mqttClients[broker] = client;
    return client;
  }catch(e){ logDebug(`MQTT connect() izjema: ${e.message}`, true); console.warn('MQTT connect napaka:', e); return null; }
}

// Aktivno javi napravam, da je nadzorni klient prisoten (dopolnjuje LWT,
// ki pokriva le nepricakovano prekinitev in samo eno temo).
// JJ1: skupna tema za prisotnost nadzorne aplikacije
const CLIENT_STATUS_TOPIC = 'nadzor/status';
function publishClientPresence(broker, online){
  const c = mqttClients[broker];
  if(!c || !c.connected) return;
  // JJ11: retain je nujen (nova naprava mora ob prijavi takoj izvedeti stanje),
  // a pomeni, da zadnji "offline" ostane na brokerju - zato ob vsaki povezavi
  // TAKOJ objavimo "online", da ga prepisemo.
  c.publish(CLIENT_STATUS_TOPIC, online?'online':'offline', {qos:1, retain:true});
  // zdruzljivost nazaj: se naprej javimo tudi po stari temi vsake naprave
  CFG.sites.forEach(s=>{
    if(s.mqtt!==broker) return;
    c.publish(`naprava/${s.id}/client/status`, online?'online':'offline', {qos:1, retain:true});
  });
  // LL3: heartbeat je pogost (5s), zato ga zapisemo le ob SPREMEMBI stanja
  if(publishClientPresence._last !== online){
    publishClientPresence._last = online;
    logDebug(`KLIENT -> ${CLIENT_STATUS_TOPIC} = ${online?'ONLINE':'OFFLINE'}`, !online);
  }
}
// periodicna potrditev prisotnosti (heartbeat) - broker/naprava tako ve,
// da je klient se vedno tu tudi po morebitnem re-connectu
// JJ13: 5s (prej 20s) - pri spodnji meji timeouta 5s je Offline Guard
// sicer sprozil izklop, ceprav je bil klient prisoten.
setInterval(()=>{ Object.keys(mqttClients).forEach(b=>publishClientPresence(b, true)); }, 5000);

function resubscribeAll(broker){
  // SMER PODATKOV: HTML->ESP32 gredo samo ukazi (.../set, glej sendCommand()).
  // Vse povratne informacije (stanje relejev/servo/analog) prihajajo
  // IZKLJUCNO preko scope/data (binarni blok) - locenih "stanje" tem NI VEC.
  CFG.sites.forEach(s=>{
    if(s.mqtt===broker){
      const c = mqttClients[broker];
      c.subscribe(`naprava/${s.id}/status`); logDebug(`SUB naprava/${s.id}/status`);
      c.subscribe(`naprava/${s.id}/scope/data`); logDebug(`SUB naprava/${s.id}/scope/data`);
      c.subscribe(`naprava/${s.id}/config/stanje`); logDebug(`SUB naprava/${s.id}/config/stanje`);
      ensureSimBrokerListening(s); // virtualna naprava posluša ukaze TAKOJ, ne šele ob Start
    }
  });
}

function ensureLive(id){
  if(!LIVE[id]) LIVE[id] = { online:false, stale:true, lastSeen:0, rele:[false,false,false,false], binarno:0, binMode:false, servo:[0,0], analog:{},
                             binOn:false, binPeriod:1, offlineGuard:false, bootRestore:false, cfgFromDevice:false };
  return LIVE[id];
}

// V6 FORMAT: scope/data nosi SAMO ADC (8B/vzorec) - releji in servo
// prihajajo kot DOGODKI na scope/event, kar mocno zmanjsa promet:
//  - rele: samo ob preklopu {"t":"r","i":0-3,"v":0/1}
//  - servo: samo ob zacetku rampe {"t":"s","i":0-1,"from":x,"to":y,"ms":trajanje}
// Klient med dogodkoma sam interpolira (servo) oz. drzi raven nivo (rele).
// glava 8B [u32 timebase_ms][u16 n][u16 rezerv], nato n x 8B: a1..a4 u16 LE (x0.1V)
function encodeScopeBlock(samples, timebaseMs){
  const n = samples.length;
  const buf = new ArrayBuffer(8 + n*8);
  const dv = new DataView(buf);
  dv.setUint32(0, timebaseMs, true);
  dv.setUint16(4, n, true);
  dv.setUint16(6, 0, true);
  let off = 8;
  samples.forEach(s=>{
    dv.setUint16(off,   Math.round((s.a1||0)*10), true);
    dv.setUint16(off+2, Math.round((s.a2||0)*10), true);
    dv.setUint16(off+4, Math.round((s.a3||0)*10), true);
    dv.setUint16(off+6, Math.round((s.a4||0)*10), true);
    off += 8;
  });
  return new Uint8Array(buf);
}

// Zadnje znano stanje relejev/servo po napravi (gradi se iz dogodkov).
// Servo hrani tudi tekoco rampo, da lahko klient interpolira vmesne lege.
// GG5: dogodkovni model (EVSTATE/EVLOG/handleScopeEvent/relayStateAt/
// servoPosAt/pushEvent) ODSTRANJEN - vse prihaja v enotnem 19B zapisu v
// en sam buffer (OSCBUF), zato ni vec dveh virov, ki bi si nasprotovala.


// scope/data zdaj nosi SAMO ADC vzorce.
// GG1: ENOTEN 19B zapis - releji, servo IN adc v istem vzorcu, po eni poti.
// glava 8B [u32 timebase_ms][u16 n][u16 rezerv], nato n x 19B:
//   [id u32][tm u32][relBits u8][s1 u8][s2 u8][a1..a4 u16 LE]
// tm je millis() NAPRAVE - vzorce umestimo po njem, zato zakasnitev omrezja
// ne premika vec stopnic.
let CLOCK_OFF = {};   // id -> odmik (Date.now() - millis naprave)
// SS1/SS2: odmik ure po NAJMANJSI opazeni zakasnitvi.
// Prej se je odmik popravljal z 2% ob VSAKEM zapisu, `Date.now()` pa je cas
// PRISPETJA, ki niha z zakasnitvijo omrezja (150-400ms). Odmik se je zato
// nenehno premikal in z njim CELOTNA casovna os - od tod skakanje robov,
// ceprav so preklopi na napravi natanko doloceni.
// Najmanjsa opazena razlika (Date.now()-tm) ustreza prenosu z najmanjso
// zakasnitvijo in je najboljsa ocena pravega odmika (standardni postopek
// pri sinhronizaciji ur).
let CLOCK_MIN = {};    // najmanjsa opazena razlika v tekocem oknu
let CLOCK_N   = {};    // stevec zapisov v oknu
let CLOCK_LAST = {};   // zadnja opazena razlika (za diagnostiko)
function deviceTime(devId, tm){
  const diff = Date.now() - tm;
  CLOCK_LAST[devId] = diff;
  if(CLOCK_OFF[devId] === undefined){
    CLOCK_OFF[devId] = diff; CLOCK_MIN[devId] = diff; CLOCK_N[devId] = 0;
  } else {
    if(CLOCK_MIN[devId] === undefined || diff < CLOCK_MIN[devId]) CLOCK_MIN[devId] = diff;
    // SS2: navzdol TAKOJ (nasli smo hitrejsi prenos = boljso oceno)
    if(diff < CLOCK_OFF[devId]) CLOCK_OFF[devId] = diff;
    // navzgor zelo pocasi - ura ESP32 drsi le nekaj ppm (~1ms na 15 min).
    // Okno 200 zapisov: ce je najmanjsa v oknu vecja od trenutnega odmika,
    // se je ura res premaknila -> popravimo za majhen korak.
    if(++CLOCK_N[devId] >= 200){
      if(CLOCK_MIN[devId] > CLOCK_OFF[devId]) CLOCK_OFF[devId] += 1;
      CLOCK_MIN[devId] = diff; CLOCK_N[devId] = 0;
    }
  }
  return tm + CLOCK_OFF[devId];
}

let LAST_REC_ID = {};   // zaznavanje izgubljenih zapisov
let TB_MISMATCH = {};   // PP1: od kdaj se javljena baza ne ujema z izbrano

function decodeScopeBlock(id, arrBuf){
  try{
    const dv = new DataView(arrBuf);
    if(dv.byteLength < 8) return;
    const tbMs = dv.getUint32(0, true) || 1;
    const n = dv.getUint16(4, true);
    const L = ensureLive(id);
    let off = 8, last = null;
    for(let i=0;i<n;i++){
      if(off+19 > dv.byteLength) break;
      const recId = dv.getUint32(off, true);
      const tm    = dv.getUint32(off+4, true);
      const rb    = dv.getUint8(off+8);
      const s1    = dv.getUint8(off+9), s2 = dv.getUint8(off+10);
      const sample = {
        t: deviceTime(id, tm),
        rele: [!!(rb&1), !!(rb&2), !!(rb&4), !!(rb&8)],
        servo: [s1, s2],
        analog: { a1: dv.getUint16(off+11,true)/10, a2: dv.getUint16(off+13,true)/10,
                  a3: dv.getUint16(off+15,true)/10, a4: dv.getUint16(off+17,true)/10 }
      };
      // zaznaj izgubljene zapise (ID je zaporeden)
      // MM3: skok NAPREJ = prava izguba; skok NAZAJ pomeni drug vir na isti
      // temi (druga odprta seja, stari retain zapis) - to ni izguba in bi
      // sicer javljalo lazne "izgubljenih 744 zapisov".
      if(LAST_REC_ID[id] !== undefined){
        if(recId > LAST_REC_ID[id] + 1){
          logDebug(`scope ${id}: izgubljenih ${recId - LAST_REC_ID[id] - 1} zapisov (${LAST_REC_ID[id]} -> ${recId})`, true);
        } else if(recId <= LAST_REC_ID[id]){
          logDebug(`scope ${id}: ID je SKOCIL NAZAJ (${LAST_REC_ID[id]} -> ${recId}) - `
                 + `na isti temi objavlja se en vir (druga odprta seja ali star retain zapis)`, true);
        }
      }
      LAST_REC_ID[id] = recId;
      if(i === 0){
        // PP1/PP3: naprava javlja DEJANSKO vzorcevalno bazo. Ce se ne ujema
        // z izbrano dlje kot 5s, scope/set ni prisel skozi -> ponovimo ga.
        // Prej se je ukaz poslal le ob odprtju zavihka in ob menjavi baze;
        // ce se je izgubil, je naprava ostala v pocasnem nacinu (1 zapis/s)
        // in graf pri 1ms/10ms bazi je bil prakticno prazen.
        const site = CFG.sites.find(x=>x.id===id);
        if(site && site.opMode === 'real' && currentTab === 'osciloskop'){
          const want = OSC_TIMEBASE;
          const mismatch = Math.abs(tbMs - want) > Math.max(2, want*0.5);
          if(mismatch){
            if(!TB_MISMATCH[id]) TB_MISMATCH[id] = Date.now();
            else if(Date.now() - TB_MISMATCH[id] > 5000){
              TB_MISMATCH[id] = Date.now();
              logDebug(`OSC ${id}: naprava vzorci na ${tbMs}ms, izbrano ${want}ms `
                     + `- ponovno posiljam scope/set`, true);
              sendCommand(site, 'scope/set', { timebase_ms: want });
            }
          } else TB_MISMATCH[id] = 0;
        }
        // LL3: diagnostika prvega zapisa v bloku
        const hz = tbMs > 0 ? (1000/tbMs).toFixed(1) : '?';
        logDebug(`REC ${id}: id=${recId} millis=${tm} odmik=${Math.round(CLOCK_OFF[id])}ms `
               + `dejansko=${tbMs}ms (${hz}Hz) zakasnitev=${CLOCK_LAST[id]}ms `
               + `rele=${sample.rele.map(b=>b?1:0).join('')} servo=${s1},${s2} `
               + `adc=${sample.analog.a1.toFixed(1)}/${sample.analog.a2.toFixed(1)}/`
               + `${sample.analog.a3.toFixed(1)}/${sample.analog.a4.toFixed(1)} `
               + `n=${n} tb=${tbMs}ms buf=${(OSCBUF[id]||[]).length}`);
      }
      pushOscSample(id, sample);
      last = sample;
      off += 19;
    }
    if(last){
      L.online = true; L.stale = false; L.lastSeen = Date.now();
      L.rele = last.rele.slice(); L.servo = last.servo.slice(); L.analog = last.analog;
    }
    renderSiteMenu(); renderConnPill();
    if(currentTab==='nadzor') updateNadzorState();
  }catch(e){ logDebug(`decodeScopeBlock ${id}: ${e.message}`, true); }
}

function onMqttMsg(topic, payload){
  const m = topic.match(/^naprava\/([0-9A-Fa-f]{6})\/(.+)$/);
  if(!m){ logDebug(`onMqttMsg: tema ne ustreza vzorcu naprava/ID/... : ${topic}`, true); return; }
  const id = m[1].toUpperCase(), sub = m[2];

  if(sub==='scope/data'){
    const buf = payload.buffer ? payload.buffer.slice(payload.byteOffset, payload.byteOffset+payload.byteLength) : payload;
    decodeScopeBlock(id, buf);
    return;
  }
  if(sub==='status'){
    const L = ensureLive(id);
    L.lastSeen = Date.now(); L.stale = false;
    const wasOnline = L.online;
    L.online = (payload.toString()==='online');
    if(wasOnline !== L.online)
      logDebug(`STATUS ${id}: ${wasOnline?'online':'offline'} -> ${L.online?'ONLINE':'OFFLINE'}`, !L.online);
    renderSiteMenu(); renderConnPill();
  }
  if(sub==='config/stanje'){
    // NAPRAVA JE VIR RESNICE za nastavitvi nacinov - klient jih ob online prevzame.
    try{
      const d = JSON.parse(payload.toString());
      const L = ensureLive(id);
      if(d.offlineGuard!==undefined) L.offlineGuard = !!d.offlineGuard;
      if(d.bootRestore!==undefined)  L.bootRestore  = !!d.bootRestore;
      if(d.offlineTimeoutS!==undefined) L.offlineTimeoutS = d.offlineTimeoutS;
      // legi OFF/ON sta shranjeni na napravi -> prevzemi ju v UICMD, da sta
      // znani tudi ob dostopu z drugega telefona (F5)
      if(Array.isArray(d.posOff) || Array.isArray(d.posOn)){
        const uc = ensureUICmd(id);
        for(let i=0;i<2;i++){
          if(Array.isArray(d.posOff) && d.posOff[i]!==undefined) uc.servo[i].posOff = d.posOff[i];
          if(Array.isArray(d.posOn)  && d.posOn[i]!==undefined)  uc.servo[i].posOn  = d.posOn[i];
        }
        saveUICmd();
      }
      if(d.binOn!==undefined)        L.binOn        = !!d.binOn;
      if(d.binPeriod!==undefined)    L.binPeriod    = d.binPeriod;
      L.cfgFromDevice = true;
      logDebug(`CONFIG ${id}: offlineGuard=${L.offlineGuard} timeout=${L.offlineTimeoutS||60}s `
             + `bootRestore=${L.bootRestore} binOn=${L.binOn} binPeriod=${L.binPeriod}s`);
      if(currentTab==='nadzor') renderNadzorControls(); // binOn spremeni zaklep rele kartic
      renderSettings();
    }catch(e){ logDebug(`CONFIG ${id}: napaka parsanja: ${e.message}`, true); }
  }
}

// SMER: HTML -> ESP32 (ukazi). sim_local nima MQTT ozadja - ukaz se
// izvrsi direktno na virtualni napravi (glej applySimCommand).
// JJ6: QoS 0 je hiter (brez cakanja na PUBACK), a brez jamstva dostave.
// Zato po 500ms preverimo, ali je naprava javila PRICAKOVANO stanje; ce ne,
// ukaz enkrat ponovimo. Velja le za ROCNE ukaze - pri utripanju/nihanju
// enoznacnega ciljnega stanja ni.
const PENDING = {};   // kljuc -> {expect, tries, timer}
function expectAfterCommand(site, subtopic, obj){
  let check = null;
  const relM = subtopic.match(/^rele\/(\d)\/set$/);
  const srvM = subtopic.match(/^servo\/(\d)\/set$/);
  if(relM && obj.mode === 'static'){
    const i = parseInt(relM[1])-1;
    check = ()=> !!ensureLive(site.id).rele[i] === !!obj.state;
  } else if(srvM && obj.mode === 'static'){
    const i = parseInt(srvM[1])-1;
    check = ()=> Math.abs((ensureLive(site.id).servo[i]||0) - (obj.pos||0)) <= 2;
  } else if(subtopic === 'binarno/set'){
    check = ()=> !!ensureLive(site.id).binOn === !!obj.on;
  }
  if(!check) return;   // periodicni ukazi - brez preverjanja

  const key = site.id + '/' + subtopic;
  if(PENDING[key]) clearTimeout(PENDING[key].timer);
  const tries = (PENDING[key] ? PENDING[key].tries : 0) + 1;
  PENDING[key] = { tries, timer: setTimeout(()=>{
    if(check()){ logDebug(`UKAZ ${subtopic}: potrjen`); delete PENDING[key]; return; }
    if(tries < 2){
      logDebug(`UKAZ ${subtopic}: NI potrjen po 500ms - ponavljam (${tries}/2)`, true);
      sendCommand(site, subtopic, obj);
    } else {
      delete PENDING[key];
      logDebug(`UKAZ ${subtopic}: NI POTRJEN po 2 poskusih - naprava se ne odziva`, true);
      showToast(T('cmdFailed'));
    }
  }, 500) };
}

function sendCommand(site, subtopic, obj){
  logDebug(`sendCommand naprava/${site.id}/${subtopic} ${JSON.stringify(obj)} [opMode=${site.opMode}]`);
  if(site.opMode==='sim_local'){
    applySimCommand(site, subtopic, obj); // ta zdaj ze sam poklice pushSimStateNow() -> updateNadzorState()
    return;
  }
  const c = getClient(site.mqtt);
  if(!c){ logDebug(`sendCommand: NI MQTT klienta (${site.mqtt}) - ukaz ZAVRZEN`, true); showToast(T('alertNoMqtt')); return; }
  if(!c.connected){ logDebug(`sendCommand: MQTT klient obstaja a NI povezan (connected=false) - publish bo morda zavrzen/zamujen`, true); }
  const payload = JSON.stringify(obj);
  // GG11: QoS 0 - QoS 1 je cakal na PUBACK brokerja, kar je pri javnem
  // brokerju prek WebSocketa dodalo cel obhod pred dostavo napravi.
  // Ukaz je majhen; ob izgubi ga popravi naslednje stanje iz naprave.
  c.publish(`naprava/${site.id}/${subtopic}`, payload, {qos:0});
  expectAfterCommand(site, subtopic, obj);   // JJ6
  logDebug(`PUB -> naprava/${site.id}/${subtopic} (${payload.length}B) qos1`);
}

setInterval(()=>{
  let changed=false;
  Object.keys(LIVE).forEach(id=>{
    const L=LIVE[id];
    if(!L.stale && Date.now()-L.lastSeen>30000){ L.stale=true; changed=true; }
  });
  if(changed){ renderSiteMenu(); renderConnPill(); if(currentTab==='nadzor') updateNadzorState(); }
}, 5000);

function connectAll(){
  const brokers = [...new Set(CFG.sites.map(s=>s.mqtt).filter(Boolean))];
  brokers.forEach(b=>{ try{ getClient(b); }catch(e){ console.warn('connectAll napaka:', e); } });
  // ce je broker ze bil povezan prej (npr. druga naprava na istem brokerju),
  // 'connect' dogodek se ne bo znova sprozil - zato tudi tu eksplicitno
  // poskrbimo, da vsaka sim_broker naprava posluza svoje ukazne teme.
  CFG.sites.forEach(s=>{ if(s.opMode==='sim_broker') ensureSimBrokerListening(s); });
}

/* ============================================================
   GLAVA
   ============================================================ */
function currentSite(){ return CFG.sites[CFG.siteIdx] || null; }

// OO1: siteIdx se je doslej nastavil SAMO ob zagonu strani in ob rocnem
// preklopu v spustnem seznamu - ta pa se prikaze sele pri dveh napravah.
// Ko si dodal PRVO napravo, je siteIdx ostal -1 in glava je pisala
// "Ni naprave", ceprav je bila naprava shranjena. Enako po brisanju
// aktivne naprave, ko je indeks kazal na neobstojec vnos.
function fixSiteIdx(){
  if(CFG.sites.length === 0){ CFG.siteIdx = -1; return; }
  if(CFG.siteIdx < 0) CFG.siteIdx = 0;
  else if(CFG.siteIdx >= CFG.sites.length) CFG.siteIdx = CFG.sites.length - 1;
}

function toggleSiteMenu(){
  if(CFG.sites.length<=1) return;
  const open = document.getElementById('siteMenu').classList.toggle('open');
  document.getElementById('headbox').setAttribute('data-open', open ? '1':'0');
}

function opModeLabel(m){
  if(m==='sim_local') return T('opSimLocal');
  if(m==='sim_broker') return T('opSimBroker');
  return T('opReal');
}

function renderSiteMenu(){
  const s = currentSite();
  document.getElementById('siteName').textContent = s ? s.name : T('noDevice');
  document.getElementById('headbox').setAttribute('data-multi', CFG.sites.length>1 ? '1':'0');
  document.getElementById('opModeTag').textContent = s ? opModeLabel(s.opMode) : '';
  const vt = document.getElementById('verTag'); if(vt) vt.textContent = APP_VERSION;
  setTimeout(syncTopHeight, 0); // vrstica z nacinom vpliva na visino glave

  const box = document.getElementById('siteMenu');
  box.innerHTML = '';
  CFG.sites.forEach((site, i)=>{
    const L = ensureLive(site.id);
    const row = document.createElement('div');
    row.className = 'row' + (i===CFG.siteIdx ? ' cur' : '');
    const bits = L.rele.map(b=>`<span class="${b?'on':''}"></span>`).join('');
    row.innerHTML = `<div><div>${site.name}</div><small>${site.id} · ${opModeLabel(site.opMode)}</small></div><div class="relbits">${bits}</div>`;
    row.onclick = (e)=>{ e.stopPropagation(); CFG.siteIdx=i; saveCfg(); document.getElementById('siteMenu').classList.remove('open'); renderTabs(); renderAll(); syncDeviceToUI(CFG.sites[i]); };
    box.appendChild(row);
  });
}

// Enotna definicija "naprava je online" - uporabljena tudi za zaklep kontrol.
function isDeviceOnline(){
  const s = currentSite(); if(!s) return false;
  const L = ensureLive(s.id);
  return !!L.online && !L.stale;
}

// Poenostavljeno na DVE stanji: dokler ni potrjeno online, vedno OFFLINE.
// KK3: klik na znacko sprozi ponovno povezavo (vidneje od gumba Uporabi)
// ============================================================
// TT: DELOVANJE V OZADJU
// Brskalnik na Androidu zavihek v ozadju zadusi: casovniki se upocasnijo na
// ~1x/min, po nekaj minutah se stran lahko zamrzne ali odstrani iz pomnilnika.
// Tega z JavaScriptom ni mogoce povsem zaobiti. Kar naredimo:
//  TT2 - povezavo drzimo pri zivljenju (keepalive), da se ob vrnitvi ni treba
//        znova povezovati
//  TT3 - ob vrnitvi v ospredje takoj preverimo povezavo in prerisemo graf
//  TT4 - Wake Lock: dokler je zaslon prizgan in aplikacija odprta, prepreci
//        uspavanje (edina zanesljiva pot; telefon mora ostati odklenjen)
// Za DOLGE teste ostaja zanesljiva pot: Offline Guard IZKLOPLJEN - naprava
// dela avtonomno, telefon podatke pobere ob vrnitvi.
// ============================================================
let _wakeLock = null;
async function requestWakeLock(){
  try{
    if(!('wakeLock' in navigator)) return;
    _wakeLock = await navigator.wakeLock.request('screen');
    _wakeLock.addEventListener('release', ()=>logDebug('WakeLock: sproscen'));
    logDebug('WakeLock: aktiven (zaslon ne bo ugasnil)');
  }catch(e){ logDebug(`WakeLock ni na voljo: ${e.message}`, true); }
}

document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){
    logDebug('APP: v ozadju - izris ustavljen, sprejem podatkov tece naprej');
    return;
  }
  logDebug('APP: nazaj v ospredju');
  requestWakeLock();                       // TT4: wake lock se ob skritju sprosti
  // TT3: povezavo lahko brskalnik med tem prekine - preveri in po potrebi obnovi
  Object.keys(mqttClients).forEach(b=>{
    const c = mqttClients[b];
    if(c && !c.connected){
      logDebug(`APP: povezava ${b} prekinjena med ozadjem - obnavljam`, true);
      try{ c.reconnect(); }catch(e){}
    }
  });
  Object.keys(mqttClients).forEach(b=>publishClientPresence(b, true));
  if(currentTab==='osciloskop') renderOscFull();
  if(currentTab==='nadzor') updateNadzorState();
});

function reconnectNow(){
  if(isDeviceOnline()) return;
  logDebug('KK3: rocna zahteva za ponovno povezavo');
  Object.keys(mqttClients).forEach(b=>{ try{ mqttClients[b].end(true); }catch(e){} });
  mqttClients = {}; simBrokerListening = new Set();
  connectAll();
  showToast(T('reconnecting'));
}

function renderConnPill(){
  const s = currentSite();
  const pill = document.getElementById('connPill');
  const txt = document.getElementById('connPillTxt');
  if(!s){ txt.textContent=T('stNone'); pill.className='pill'; return; }
  if(isDeviceOnline()){ txt.textContent=T('stOnline'); pill.className='pill on'; }
  else{ txt.textContent=T('stOffline'); pill.className='pill off'; }
}

/* ============================================================
   ZAVIHKI - dinamicno glede na opMode izbrane naprave
   ============================================================ */
let currentTab = 'nadzor';
function tabsForSite(){
  const s = currentSite();
  // vrstni red: Nadzor -> Osciloskop -> Simulator
  // Simulator je skrit, kadar naprava tece v nacinu Realno delovanje.
  const tabs = [{k:'nadzor', label:T('tabControl')}, {k:'osciloskop', label:T('tabOsc')}];
  if(!s || s.opMode!=='real') tabs.push({k:'simulator', label:T('tabSim')});
  return tabs;
}
function renderTabs(){
  const tabs = tabsForSite();
  setTimeout(syncTopHeight, 0); // po izrisu zavihkov osvezi visino glave
  if(!tabs.find(t=>t.k===currentTab)) currentTab = 'nadzor';
  const bar = document.getElementById('tabsBar');
  bar.innerHTML = '';
  tabs.forEach(t=>{
    const b = document.createElement('button');
    b.textContent = t.label;
    b.setAttribute('aria-selected', t.k===currentTab ? 'true':'false');
    b.onclick = ()=>switchTab(t.k);
    bar.appendChild(b);
  });
  document.getElementById('tab-nadzor').classList.toggle('show', currentTab==='nadzor');
  document.getElementById('tab-simulator').classList.toggle('show', currentTab==='simulator');
  document.getElementById('tab-osciloskop').classList.toggle('show', currentTab==='osciloskop');
}
function switchTab(t){
  currentTab = t;
  renderTabs();
  if(t==='nadzor') renderNadzorControls();
  if(t==='simulator') renderSimulatorControls();
  if(t==='osciloskop'){
    renderOscFull();
    const st = currentSite();   // DD6: takoj zahtevaj izbrano casovno bazo
    if(st && st.opMode === 'real') sendCommand(st, 'scope/set', { timebase_ms: OSC_TIMEBASE });
  }
}

let SECTIONS = lsGet('rs_sections', { releji:false, servo:false, analog:false });
function saveSections(){ lsSet('rs_sections', SECTIONS); }
function cardHtml(key, title, helpKey, bodyHtml){
  const collapsed = SECTIONS[key] ? 'collapsed' : '';
  const chevOpen = SECTIONS[key] ? '' : 'open';
  return `<div class="card">
    <div class="chead" onclick="toggleSection('${key}')">
      <h3>${title}</h3>
      <button class="hb" onclick="event.stopPropagation();openHelp('${helpKey}')"></button>
      <span class="chev ${chevOpen}">▾</span>
    </div>
    <div class="cbody ${collapsed}" id="cbody-${key}">${bodyHtml}</div>
  </div>`;
}
function toggleSection(key){
  SECTIONS[key] = !SECTIONS[key];
  saveSections();

  const body = document.getElementById('cbody-'+key);
  const chev = body.parentElement.querySelector('.chev');
  body.classList.toggle('collapsed', SECTIONS[key]);
  chev.classList.toggle('open', !SECTIONS[key]);
}

/* ============================================================
   ZAVIHEK: NADZOR
   POMEMBNA ARHITEKTURNA LOCITEV (popravek napake - polje/select se
   je prej zaprlo takoj ob dotiku, ker je periodicen prihod podatkov
   sprozil poln innerHTML rebuild):
   - renderNadzorControls() gradi UREJEVALNE kontrole (kartice,
     gumbi, polja) in se klice SAMO ob menjavi zavihka/naprave/jezika.
   - updateNadzorState() periodicno osvezuje SAMO prikaz trenutnega
     stanja (badge-i, analogne vrednosti) preko direktnega DOM zapisa
     (textContent/classList) - NIKOLI ne pokliče innerHTML na kontrolah.
   ============================================================ */
const STEP_VALUES = [0.5,1,2,5,10,20,30,50];
let relUIMode = {0:'manual',1:'manual',2:'manual',3:'manual'};
let srvUIMode = {0:'manual',1:'manual'};

// Trajno shranjeno "zadnje poslano stanje" vsakega releja/servota, per
// naprava - popravek: kartice so se prej ob vsakem izrisu (npr. vrnitev
// iz Osciloskopa) resetirale na trdo kodirane privzete vrednosti namesto
// da bi pokazale dejansko zadnje stanje.
let UICMD = lsGet('rs_uicmd', {});
function saveUICmd(){ lsSet('rs_uicmd', UICMD); }
function ensureUICmd(id){
  if(!UICMD[id]) UICMD[id] = {
    rele: [0,1,2,3].map(()=>({mode:'manual', on:false, ton:1, toff:1})),
    servo: [0,1].map(()=>({mode:'manual', on:false, posOff:0, posOn:255, pos:0, rampMs:0, posA:0, posB:255, ton:1, toff:1, rampMsP:0}))
  };
  UICMD[id].servo.forEach(sv=>{ // migracija starejsih zapisov
    if(sv.on===undefined) sv.on=false;
    if(sv.posOff===undefined) sv.posOff=0;
    if(sv.posOn===undefined) sv.posOn=255;
  });
  return UICMD[id];
}

function nearestStepIdx(v){
  let bi=0, bd=Infinity;
  STEP_VALUES.forEach((sv,i)=>{ const d=Math.abs(sv-v); if(d<bd){bd=d; bi=i;} });
  return bi;
}

      <button class="${mAct}" data-m="manual" onclick="setRelMode(${i},'manual')">${T('optManual')}</button>
      <button class="${pAct}" data-m="period" onclick="setRelMode(${i},'period')">${T('optPeriod')}</button>
    </div>
    <div id="relManual${i}" style="display:${r.mode==='manual'?'block':'none'}">
      <button class="onoff-btn ${onCls}" id="relOnOff${i}" onclick="toggleRelOnOff(${i})">${onTxt}</button>
    </div>
    <div id="relPeriod${i}" style="display:${r.mode==='period'?'block':'none'}">
      <div class="tblock"><div class="trow">
        <label>${T('lblTonL')}</label>
        <input type="number" inputmode="decimal" id="relTon${i}" value="${r.ton}" min="0.1" max="50" step="0.1" onclick="this.select()" onfocus="this.select()"
               onchange="syncStepSlider('relTon${i}','relTonSl${i}'); sendRelay(${i});">
      </div><input type="range" class="stepslider" id="relTonSl${i}" min="0" max="7" value="${nearestStepIdx(r.ton)}"
             oninput="stepSliderChange('relTon${i}', this.value)" onchange="sendRelay(${i})"></div>
      <div class="tblock"><div class="trow">
        <label>${T('lblToffL')}</label>
        <input type="number" inputmode="decimal" id="relToff${i}" value="${r.toff}" min="0.1" max="50" step="0.1" onclick="this.select()" onfocus="this.select()"
               onchange="syncStepSlider('relToff${i}','relToffSl${i}'); sendRelay(${i});">
      </div><input type="range" class="stepslider" id="relToffSl${i}" min="0" max="7" value="${nearestStepIdx(r.toff)}"
             oninput="stepSliderChange('relToff${i}', this.value)" onchange="sendRelay(${i})"></div>
    </div>
  </div>`;
}

    <div class="uc-head"><span class="nm">${T('servoN')} ${i+1}</span></div>
    <div class="mtog">
      <button class="${mAct}" data-m="manual" onclick="setSrvMode(${i},'manual')">${T('optManual')}</button>
      <button class="${pAct}" data-m="period" onclick="setSrvMode(${i},'period')">${T('optPeriod')}</button>
    </div>
    <div id="srvManual${i}" style="display:${sv.mode==='manual'?'block':'none'}">
      <button class="onoff-btn ${sv.on?'on':'off'}" id="srvOnOff${i}" onclick="toggleSrvOnOff(${i})">${sv.on?T('lblOn'):T('lblOff')}</button>
      <div class="pos-row" style="margin-top:8px"><label>${T('lblPosOff')}</label><input type="number" inputmode="decimal" id="srvPosOff${i}" min="0" max="255" value="${sv.posOff}" onclick="this.select()">
        <label>${T('lblPosOn')}</label><input type="number" inputmode="decimal" id="srvPosOn${i}" min="0" max="255" value="${sv.posOn}" onclick="this.select()"></div>
      <div class="pos-row"><label>${T('lblRampMs')}</label><input type="number" inputmode="decimal" id="srvRampM${i}" min="0" max="10000" step="50" value="${sv.rampMs}" onclick="this.select()"></div>
      <p class="small">${T('srvApplyHint')}</p>
    </div>
    <div id="srvPeriod${i}" style="display:${sv.mode==='period'?'block':'none'}">
      <div class="pos-row"><label>${T('lblPosA')}</label><input type="number" inputmode="decimal" id="srvPosA${i}" min="0" max="255" value="${sv.posA}" onclick="this.select()" onchange="sendServo(${i})">
        <label>${T('lblPosB')}</label><input type="number" inputmode="decimal" id="srvPosB${i}" min="0" max="255" value="${sv.posB}" onclick="this.select()" onchange="sendServo(${i})"></div>
      <div class="tblock"><div class="trow">
        <label>${T('lblTonL')}</label>
        <input type="number" inputmode="decimal" id="srvTon${i}" value="${sv.ton}" min="0.1" max="50" step="0.1" onclick="this.select()" onfocus="this.select()"
               onchange="syncStepSlider('srvTon${i}','srvTonSl${i}'); sendServo(${i});">
      </div><input type="range" class="stepslider" id="srvTonSl${i}" min="0" max="7" value="${nearestStepIdx(sv.ton)}"
             oninput="stepSliderChange('srvTon${i}', this.value)" onchange="sendServo(${i})"></div>
      <div class="tblock"><div class="trow">
        <label>${T('lblToffL')}</label>
        <input type="number" inputmode="decimal" id="srvToff${i}" value="${sv.toff}" min="0.1" max="50" step="0.1" onclick="this.select()" onfocus="this.select()"
               onchange="syncStepSlider('srvToff${i}','srvToffSl${i}'); sendServo(${i});">
      </div><input type="range" class="stepslider" id="srvToffSl${i}" min="0" max="7" value="${nearestStepIdx(sv.toff)}"
             oninput="stepSliderChange('srvToff${i}', this.value)" onchange="sendServo(${i})"></div>
      <div class="pos-row"><label>${T('lblRampMs')}</label><input type="number" inputmode="decimal" id="srvRampP${i}" min="0" max="10000" step="50" value="${sv.rampMsP}" onclick="this.select()" onchange="sendServo(${i})"></div>
    </div>
  </div>`;
}

function stepSliderChange(fieldId, idx){
  document.getElementById(fieldId).value = STEP_VALUES[parseInt(idx)];
}
function syncStepSlider(fieldId, sliderId){
  const v = parseFloat(document.getElementById(fieldId).value)||1;
  document.getElementById(sliderId).value = nearestStepIdx(v);
}
// Gumb "Poslji" je ukinjen - vsaka sprememba (klik ON/OFF, sprememba
// Ton/Toff/pozicije, preklop Rocno/Perioda) se poslje takoj IN se shrani
// v UICMD, da se ob naslednjem izrisu kartice pravilno obnovi.
function setRelMode(i,m){
  relUIMode[i]=m;
  document.querySelectorAll(`#relayCard${i} .mtog button`).forEach(b=>b.classList.toggle('active', b.dataset.m===m));
  document.getElementById('relManual'+i).style.display = m==='manual' ? 'block':'none';
  document.getElementById('relPeriod'+i).style.display = m==='period' ? 'block':'none';
  sendRelay(i);
}
function setSrvMode(i,m){
  srvUIMode[i]=m;
  document.querySelectorAll(`#servoCard${i} .mtog button`).forEach(b=>b.classList.toggle('active', b.dataset.m===m));
  document.getElementById('srvManual'+i).style.display = m==='manual' ? 'block':'none';
  document.getElementById('srvPeriod'+i).style.display = m==='period' ? 'block':'none';
  sendServo(i);
}
function toggleRelOnOff(i){
  const btn = document.getElementById('relOnOff'+i);
  const goingOn = btn.classList.contains('off');
  btn.classList.toggle('on', goingOn);
  btn.classList.toggle('off', !goingOn);
  btn.textContent = goingOn ? T('lblOn') : T('lblOff');
  // GG12: stanje zapisemo TAKOJ v lokalni model (optimisticno) - badge in
  // graf se odzoveta v istem trenutku, ne sele po dvojnem obhodu prek
  // brokerja. Ko prispe pravo stanje iz naprave, ga prepise.
  const s = currentSite();
  if(s){ const L = ensureLive(s.id); L.rele[i] = goingOn; }
  sendRelay(i);
  updateNadzorState();   // GG13: takoj, ne sele ob naslednjem 250ms ciklu
}

function renderNadzorControls(){
  const el = document.getElementById('tab-nadzor');
  const s = currentSite();
  if(!s){ el.innerHTML = `<div class="empty">${T('emptyNoDevice')}</div>`; return; }

  const uc = ensureUICmd(s.id);
  relUIMode = {}; srvUIMode = {};
  for(let i=0;i<4;i++) relUIMode[i] = uc.rele[i].mode;
  for(let i=0;i<2;i++) srvUIMode[i] = uc.servo[i].mode;

  const L0 = ensureLive(s.id);
  const binOn = !!L0.binOn;
  const binPeriod = L0.binPeriod || 1;

  // Ko tece binarno periodicno stetje, so posamezne rele kartice zaklenjene
  // (krmili jih stevec). Zaklep velja tudi, dokler naprava ni online.
  let relBody = '';
  if(binOn) relBody += `<div class="locknote">${T('binLockNote')}</div>`;
  relBody += `<div class="${binOn?'locked':''}">`;
  for(let i=0;i<4;i++) relBody += relayCardHtml(i, uc.rele[i]);
  relBody += `</div>`;
  relBody += `<div class="unit-card sep">
    <div class="uc-head"><span class="nm">${T('lblBinCounter')}</span>
      <span class="tag ${binOn?'on':''}" id="binBadge">${binOn?T('stateActive'):T('stateInactive')}</span></div>
    <button class="onoff-btn ${binOn?'on':'off'}" id="binOnOff" onclick="toggleBinCounter()">${binOn?T('lblOn'):T('lblOff')}</button>
    <div class="tblock" style="margin-top:8px"><div class="trow">
      <label>${T('lblBinPeriod')}</label>
      <input type="number" inputmode="decimal" id="binPeriod" value="${binPeriod}" min="0.1" max="50" step="0.1" onclick="this.select()" onfocus="this.select()"
             onchange="syncStepSlider('binPeriod','binPeriodSl'); sendBinary();">
      <span class="small" id="binValShow">${T('lblBinValue')}: 0</span>
    </div><input type="range" class="stepslider" id="binPeriodSl" min="0" max="7" value="${nearestStepIdx(binPeriod)}"
           oninput="stepSliderChange('binPeriod', this.value)" onchange="sendBinary()"></div>
  </div>`;

  let srvBody = '';
  for(let i=0;i<2;i++) srvBody += servoCardHtml(i, uc.servo[i]);

  let anBody = '<div class="analog">';
  for(let i=1;i<=4;i++){
    anBody += `<div class="a"><b id="anVal${i}">—</b><span>${T('inputN')} ${i} [V]</span></div>`;
  }
  anBody += '</div>';

  let h = '';
  h += cardHtml('releji', T('cardRelays'), 'hRelays', relBody);
  h += cardHtml('servo', T('cardServo'), 'hServo', srvBody);
  h += cardHtml('analog', T('cardAnalog'), 'hAnalog', anBody);

  // Dokler naprava ni online, so VSE kontrole onemogocene - stanje se
  // pridobi iz naprave, ne iz lokalnega predpomnilnika.
  if(!isDeviceOnline()) h = `<div class="locknote">${T('waitOnline')}</div>` +
                            `<div class="locked">${h}</div>`;

  el.innerHTML = h;

  updateNadzorState(); // takoj napolni vrednosti z zadnjim znanim stanjem naprave
}

// Periodicna, NEDESTRUKTIVNA osvezitev.
// Locene "Trenutno" znacke so odstranjene - gumb ON/OFF in polje Pozicija
// STA SAMA prikaz resnicnega stanja naprave (sinhronizirata se s tem, kar
// naprava javi, ne le s tem, kar smo poslali iz tega brskalnika).
let lastOnlineFlag = null, lastBinOnFlag = null;
function updateNadzorState(){
  if(currentTab!=='nadzor') return;
  const s = currentSite(); if(!s) return;
  const L = ensureLive(s.id);

  // Sprememba online ali binOn zahteva PONOVEN IZRIS (zaklep/odklep kontrol)
  const on = isDeviceOnline();
  if(lastOnlineFlag !== on || lastBinOnFlag !== !!L.binOn){
    lastOnlineFlag = on; lastBinOnFlag = !!L.binOn;
    renderNadzorControls();
    return;
  }

  // Releji: gumb ON/OFF odraza DEJANSKO stanje naprave
  for(let i=0;i<4;i++){
    const btn = document.getElementById('relOnOff'+i);
    if(!btn) continue;
    const isOn = !!L.rele[i];
    if(btn.classList.contains('on') !== isOn){
      btn.classList.toggle('on', isOn);
      btn.classList.toggle('off', !isOn);
      btn.textContent = isOn ? T('lblOn') : T('lblOff');
    }
  }
  const binBadge = document.getElementById('binBadge');
  if(binBadge){ binBadge.textContent = L.binOn?T('stateActive'):T('stateInactive'); binBadge.classList.toggle('on', !!L.binOn); }
  const binValShow = document.getElementById('binValShow');
  if(binValShow) binValShow.textContent = T('lblBinValue')+': '+(L.binarno||0);

  // Servo: gumb ON/OFF odraza, v kateri legi je naprava dejansko
  // (primerja se z definiranima legama posOff/posOn, s toleranco za rampo)
  const ucS = ensureUICmd(s.id);
  for(let i=0;i<2;i++){
    const btn = document.getElementById('srvOnOff'+i);
    if(!btn) continue;
    const cur = L.servo[i]||0;
    const dOn = Math.abs(cur - (ucS.servo[i].posOn||255));
    const dOff = Math.abs(cur - (ucS.servo[i].posOff||0));
    const isOn = dOn < dOff;
    if(btn.classList.contains('on') !== isOn){
      btn.classList.toggle('on', isOn); btn.classList.toggle('off', !isOn);
      btn.textContent = isOn ? T('lblOn') : T('lblOff');
    }
  }
  for(let i=1;i<=4;i++){
    const v = L.analog['a'+i];
    const el = document.getElementById('anVal'+i);
    if(el) el.textContent = v!==undefined ? v.toFixed(1) : '—';
  }
}

// Namenski neodvisen cikel (0.25s) - NE čaka na dogodek (MQTT/sim tick),
// ampak redno prebere trenutno LIVE stanje in ga izriše. Prej se je
// osvežitev zanašala izključno na dogodke, kar je skupaj z zgornjim
// bug-om (tiha prekinitev) delovalo šele po dolgi zakasnitvi ali sploh ne.
setInterval(()=>{ updateNadzorState(); }, 250);

function sendRelay(i){
  const s = currentSite(); if(!s) return;
  const uc = ensureUICmd(s.id);
  const mode = relUIMode[i]||'manual';
  uc.rele[i].mode = mode;
  if(mode==='manual'){
    const isOn = document.getElementById('relOnOff'+i).classList.contains('on');
    uc.rele[i].on = isOn;
    sendCommand(s, `rele/${i+1}/set`, { mode:'static', state: isOn });
  } else {
    const tonV = parseFloat(document.getElementById('relTon'+i).value);
    const toffV = parseFloat(document.getElementById('relToff'+i).value);
    const ton = isNaN(tonV)?1:tonV, toff = isNaN(toffV)?1:toffV;
    uc.rele[i].ton = ton; uc.rele[i].toff = toff;
    sendCommand(s, `rele/${i+1}/set`, { mode:'blink', ton, toff });
  }
  saveUICmd();
}
// Binarno periodicno stetje: {"on":bool,"perioda":sekunde}
// (staticni binarni nacin z vrednostjo 0-15 je odstranjen - za rocno
// kombinacijo zadostuje rocni ON/OFF na vsakem releju posebej)
function sendBinary(){
  const s = currentSite(); if(!s) return;
  const L = ensureLive(s.id);
  const perioda = Math.max(0.1, parseFloat(document.getElementById('binPeriod').value)||1);
  sendCommand(s, 'binarno/set', { on: !!L.binOn, perioda });
}
function toggleBinCounter(){
  const s = currentSite(); if(!s) return;
  const L = ensureLive(s.id);
  const perioda = Math.max(0.1, parseFloat(document.getElementById('binPeriod').value)||1);
  sendCommand(s, 'binarno/set', { on: !L.binOn, perioda });
}
// Rocni servo: vnesene vrednosti se uveljavijo SELE ob kliku na ON/OFF.
function toggleSrvOnOff(i){
  const btn = document.getElementById('srvOnOff'+i);
  const goingOn = btn.classList.contains('off');
  btn.classList.toggle('on', goingOn);
  btn.classList.toggle('off', !goingOn);
  btn.textContent = goingOn ? T('lblOn') : T('lblOff');
  const s = currentSite(); if(!s) return;
  const uc = ensureUICmd(s.id);
  const posOff = parseInt(document.getElementById('srvPosOff'+i).value); 
  const posOn  = parseInt(document.getElementById('srvPosOn'+i).value);
  // M2: cas prehoda pod 50ms je pri vzorcenju neviden -> ali 0 (takojsen
  // skok) ali najmanj 50ms; vmesne vrednosti dvignemo na 50.
  let rampMs = parseInt(document.getElementById('srvRampM'+i).value)||0;
  if(rampMs > 0 && rampMs < 50){ rampMs = 50; document.getElementById('srvRampM'+i).value = 50; }
  uc.servo[i].posOff = isNaN(posOff)?0:posOff;
  uc.servo[i].posOn  = isNaN(posOn)?255:posOn;
  uc.servo[i].rampMs = rampMs;
  uc.servo[i].on = goingOn;
  uc.servo[i].mode = 'manual';
  saveUICmd();
  const targetPos = goingOn ? uc.servo[i].posOn : uc.servo[i].posOff;
  const L = ensureLive(s.id); L.servo[i] = targetPos;   // GG12: optimisticno
  sendCommand(s, `servo/${i+1}/set`, {
    mode:'static', pos: targetPos,
    posOff: uc.servo[i].posOff, posOn: uc.servo[i].posOn, rampMs });
  updateNadzorState();   // GG13
}

function sendServo(i){
  const s = currentSite(); if(!s) return;
  const uc = ensureUICmd(s.id);
  const mode = srvUIMode[i]||'manual';
  uc.servo[i].mode = mode;
  if(mode==='manual'){
    // O1: ob preklopu Perioda->Rocno je treba napravi POVEDATI, da preneha
    // nihati. Prejsnji `return` je pomenil, da ukaz ni bil poslan in je
    // servo nihal naprej, dokler uporabnik ni kliknil ON/OFF.
    const uc2 = uc.servo[i];
    let rampMs = parseInt(document.getElementById('srvRampM'+i).value)||0;
    if(rampMs > 0 && rampMs < 50){ rampMs = 50; document.getElementById('srvRampM'+i).value = 50; }
    const posOff = parseInt(document.getElementById('srvPosOff'+i).value);
    const posOn  = parseInt(document.getElementById('srvPosOn'+i).value);
    uc2.posOff = isNaN(posOff)?0:posOff;
    uc2.posOn  = isNaN(posOn)?255:posOn;
    uc2.rampMs = rampMs;
    saveUICmd();
    sendCommand(s, `servo/${i+1}/set`, {
      mode:'static', pos: uc2.on ? uc2.posOn : uc2.posOff,
      posOff: uc2.posOff, posOn: uc2.posOn, rampMs });
    return;
  } else {
    const posA = parseInt(document.getElementById('srvPosA'+i).value)||0;
    const posB = parseInt(document.getElementById('srvPosB'+i).value)||255;
    const tonV = parseFloat(document.getElementById('srvTon'+i).value);
    const toffV = parseFloat(document.getElementById('srvToff'+i).value);
    const ton = isNaN(tonV)?1:tonV, toff = isNaN(toffV)?1:toffV;
    let rampMs = parseInt(document.getElementById('srvRampP'+i).value)||0;
    if(rampMs > 0 && rampMs < 50){ rampMs = 50; document.getElementById('srvRampP'+i).value = 50; }
    uc.servo[i].posA=posA; uc.servo[i].posB=posB; uc.servo[i].ton=ton; uc.servo[i].toff=toff; uc.servo[i].rampMsP=rampMs;
    sendCommand(s, `servo/${i+1}/set`, { mode:'oscillate', posA, posB, ton, toff, rampMs });
  }
  saveUICmd();
}

// A: gumb SHRANI je EDINI nacin shranjevanja. Polja pisejo samo v osnutek
// (DRAFT); nic se ne shrani lokalno in nic ne poslje napravi do klika Shrani.
let DRAFT = null;
function ensureDraft(){
  if(!DRAFT){
    DRAFT = { sites: JSON.parse(JSON.stringify(CFG.sites)), cfg:{} };
    CFG.sites.forEach(s=>{
      const L = ensureLive(s.id);
      DRAFT.cfg[s.id] = { offlineGuard:!!L.offlineGuard, bootRestore:!!L.bootRestore,
                          offlineTimeoutS: L.offlineTimeoutS||60 };
    });
  }
  return DRAFT;
}
function draftSet(i, field, val){ ensureDraft().sites[i][field] = val; markDirty(); }

// NN2/NN3/NN4: ob spremembi ID je treba PRESELITI vse, kar je indeksirano
// po starem ID (DRAFT.cfg, UICMD, LIVE). Prav to je bilo prej razbito in
// zato je bil ID zaklenjen - zdaj je vzrok odpravljen namesto zaobiden.
function draftSetId(i, raw){
  const d = ensureDraft();
  const oldId = d.sites[i].id;
  // NN4: normalizacija - velike crke, samo hex, najvec 6 znakov
  const newId = String(raw||'').toUpperCase().replace(/[^0-9A-F]/g,'').slice(0,6);
  if(!newId || newId === oldId){ renderSettings(); return; }

  d.sites[i].id = newId;
  if(d.cfg[oldId]){ d.cfg[newId] = d.cfg[oldId]; delete d.cfg[oldId]; }
  if(UICMD[oldId]){ UICMD[newId] = UICMD[oldId]; delete UICMD[oldId]; saveUICmd(); }
  if(LIVE[oldId]){ LIVE[newId] = LIVE[oldId]; delete LIVE[oldId]; }
  if(SIMS[oldId]){ SIMS[newId] = SIMS[oldId]; delete SIMS[oldId]; saveSims(); }
  delete LAST_REC_ID[oldId]; delete CLOCK_OFF[oldId];
  logDebug(`ID naprave spremenjen: ${oldId} -> ${newId} (nastavitve prenesene)`);
  markDirty(); renderSettings();
}
function draftCfg(i, field, val){
  const d = ensureDraft(); const id = d.sites[i].id;
  if(!d.cfg[id]) d.cfg[id] = {offlineGuard:false, bootRestore:false, offlineTimeoutS:60};
  d.cfg[id][field] = val; markDirty();
}
