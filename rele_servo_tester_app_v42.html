/* ============================================================
   SIMULATOR (per naprava, glede na opMode)
   ============================================================ */
function tickRelaySim(r, now){
  if(r.mode!=='blink') return;
  const durMs = (r.phaseOn ? r.ton : r.toff) * 1000;
  if(now - r.last >= durMs){ r.phaseOn = !r.phaseOn; r.state = r.phaseOn; r.last = now; }
}
// Vrne true, ko je rampa dokoncana. Identicno firmware advanceRamp():
// cas prehoda je HITROST premika, pozicija se interpolira med legama.
// Virtualna naprava (sim_broker) objavi zacetek rampe kot dogodek -
// enak protokol kot firmware startServoRamp().
// GG8: simPublishRamp odstranjen - rampa je vidna skozi zaporedne zapise

function advanceRampSim(sv, now){
  if(sv.pos === sv.target) return true;
  if(!sv.rampMs){ sv.pos = sv.target; return true; }
  const frac = (now - (sv.rampStart||0)) / sv.rampMs;
  if(frac >= 1) sv.pos = sv.target;
  else sv.pos = Math.max(0, Math.min(255, Math.round(sv.rampFrom + (sv.target - sv.rampFrom) * frac)));
  return sv.pos === sv.target;
}

// 4-FAZNI CIKEL (identicno firmware tickServos):
//   RAMP_A (rampMs) -> HOLD_A (ton) -> RAMP_B (rampMs) -> HOLD_B (toff) -> ...
// Cas prehoda se PRISTEVA zadrzevalnemu casu, ne tece vzporedno z njim.
function tickServoSim(sv, now, site, idx){
  if(sv.mode!=='oscillate'){
    advanceRampSim(sv, now); // rocni nacin: samo dokoncaj morebitno rampo
    return;
  }
  switch(sv.phase){
    case 'RAMP_A':
      if(advanceRampSim(sv, now)){ sv.phase='HOLD_A'; sv.phaseStart=now; }
      break;
    case 'HOLD_A':
      if(now - sv.phaseStart >= sv.ton*1000){
        sv.rampFrom = sv.pos; sv.target = sv.posB;
        sv.rampStart = now; sv.phase='RAMP_B'; sv.phaseStart = now;
      }
      break;
    case 'RAMP_B':
      if(advanceRampSim(sv, now)){ sv.phase='HOLD_B'; sv.phaseStart=now; }
      break;
    case 'HOLD_B':
      if(now - sv.phaseStart >= sv.toff*1000){
        sv.rampFrom = sv.pos; sv.target = sv.posA;
        sv.rampStart = now; sv.phase='RAMP_A'; sv.phaseStart = now;
      }
      break;
    default: sv.phase='RAMP_A'; sv.phaseStart=now;
  }
}

// POPOLNOMA POENOSTAVLJENA LOGIKA (popravek): prej je applySimCommand()
// posodobil SAMO interni `sim` objekt - povezava do LIVE (od koder se
// bere prikaz) je tekla IZKLJUCNO skozi periodicni tick, ta pa je bil
// pogojen z "sim.running" (Start). Ce simulator ni bil zagnan, se ukaz
// ni nikoli prikazal - "vklop/izklop se ni prenesel".
// Zdaj: vsak ukaz TAKOJ izracuna in zapise trenutno stanje (klic spodaj),
// "running" pa vpliva SAMO na to, ali Ton/Toff/nihanje casovniki tecejo
// naprej (blinka/niha) - ne vec na to, ali se stanje sploh prikaze.
// GG8/GG9: virtualna naprava oddaja ENAK enoten 19B zapis kot firmware -
// ena sama pot, brez dogodkov. sim_local zapise naravnost v buffer,
// sim_broker pa objavi prek MQTT in prejme nazaj (test prave poti).
let SIM_REC_ID = {};
function simEncodeRecord(sim, releState, servoState, now){
  const buf = new ArrayBuffer(8 + 19);
  const dv = new DataView(buf);
  dv.setUint32(0, 100, true);      // timebase (informativno)
  dv.setUint16(4, 1, true);        // n = 1 zapis
  dv.setUint16(6, 0, true);
  const relBits = releState.reduce((a,b,i)=>a|(b?(1<<i):0), 0);
  dv.setUint32(8, ++sim._recId, true);
  // MM2: cas od ZAGONA STRANI (kot millis() na ESP32), ne odrezan Unix cas.
  // Prej je bil zapisan `Date.now() >>> 0`, zato je bil izracunani odmik ure
  // ~1.79e12 ms (56 let) in vsi vzorci so pristali na napacnem casu.
  dv.setUint32(12, Math.round(performance.now()) >>> 0, true);
  dv.setUint8(16, relBits);
  dv.setUint8(17, servoState[0]); dv.setUint8(18, servoState[1]);
  dv.setUint16(19, Math.round((sim.analog.a1||0)*10), true);
  dv.setUint16(21, Math.round((sim.analog.a2||0)*10), true);
  dv.setUint16(23, Math.round((sim.analog.a3||0)*10), true);
  dv.setUint16(25, Math.round((sim.analog.a4||0)*10), true);
  return new Uint8Array(buf);
}

// JJ7: virtualna naprava simulira CELOTEN Offline Guard mehanizem -
// izguba klienta -> cakanje timeouta -> prisilni OFF -> ponovna prijava.
// Prej je simulator config/set le shranil, delovanja pa ni posnemal, zato
// tega dela protokola ni bilo mogoce preizkusiti brez prave naprave.
function simOfflineGuardTick(site, sim, now){
  const L = ensureLive(site.id);
  if(!L.offlineGuard){ sim._forcedOff = false; sim._clientGoneAt = 0; return false; }
  // klient je "prisoten", dokler tece heartbeat (v simulaciji: stran je odprta)
  const clientOnline = !document.hidden;
  if(clientOnline){
    if(sim._forcedOff) logDebug(`SIM ${site.id}: klient spet prisoten - guard sproscen`);
    sim._forcedOff = false; sim._clientGoneAt = 0;
    return false;
  }
  if(!sim._clientGoneAt) sim._clientGoneAt = now;
  const timeoutMs = Math.max(5, L.offlineTimeoutS||60) * 1000;
  if(!sim._forcedOff && now - sim._clientGoneAt >= timeoutMs){
    sim._forcedOff = true;
    sim.rele.forEach(r=>{ r.state = false; r.mode = 'static'; });
    sim.servo.forEach(sv=>{ sv.pos = 0; sv.target = 0; sv.mode = 'static'; });
    sim.binMode = false;
    logDebug(`SIM ${site.id}: OFFLINE GUARD - izhodi na 0 po ${timeoutMs/1000}s`, true);
  }
  return sim._forcedOff;
}

function pushSimStateNow(site, sim){
  const now = Date.now();
  simOfflineGuardTick(site, sim, now);   // JJ7
  if(sim._recId === undefined) sim._recId = 0;
  const releState = sim.binMode ? [0,1,2,3].map(i=>!!((sim.binVal>>i)&1)) : sim.rele.map(r=>r.state);
  const servoState = sim.servo.map(x=>x.pos);
  const L = ensureLive(site.id);

  if(site.opMode==='sim_local'){
    // GG9: enak zapis kot pri pravi napravi, le brez MQTT poti
    pushOscSample(site.id, { t: now, rele: releState.slice(), servo: servoState.slice(),
                             analog: Object.assign({}, sim.analog) });
    L.online = true; L.stale = false; L.lastSeen = now;
    L.rele = releState; L.binarno = sim.binVal; L.binMode = sim.binMode;
    L.binOn = !!sim.binMode; L.binPeriod = sim.binPeriod||1;
    L.servo = servoState; L.analog = sim.analog;
  } else if(site.opMode==='sim_broker'){
    const c = getClient(site.mqtt);
    if(c && c.connected){
      if(!sim._lastPub) sim._lastPub = { adc:0, status:0 };
      const lp = sim._lastPub;
      // GG8: en zapis na ~200ms (kot firmware), plus takoj ob spremembi
      const relKey = releState.map(b=>b?1:0).join('') + '|' + servoState.join(',');
      const changed = (lp.key !== relKey);
      if(changed || now - lp.adc >= 200){
        lp.adc = now; lp.key = relKey;
        c.publish(`naprava/${site.id}/scope/data`, simEncodeRecord(sim, releState, servoState, now));
      }
      if(now - lp.status >= 5000){
        lp.status = now;
        c.publish(`naprava/${site.id}/status`, 'online', {retain:true});
        c.publish(`naprava/${site.id}/config/stanje`, JSON.stringify({
          offlineGuard: !!L.offlineGuard, bootRestore: !!L.bootRestore,
          binOn: !!sim.binMode, binPeriod: sim.binPeriod||1 }), {retain:true});
      }
    } else {
      logDebug(`pushSimStateNow ${site.id}: MQTT ni povezan`, true);
    }
  }
  if(currentSite() && currentSite().id===site.id){
    renderSiteMenu();
    if(currentTab==='nadzor') updateNadzorState();
  }
}

// Izvrsi ukaz (isti kot bi ga ESP32 firmware) na virtualni napravi.
// Uporabljeno tako za sim_local (direktni klic iz sendCommand) kot za
// sim_broker (prejeto preko MQTT .../set - glej ensureSimBrokerListening).
function applySimCommand(site, subtopic, d){
  logDebug(`applySimCommand ${site.id} ${subtopic} <- ${JSON.stringify(d)}`);
  const sim = ensureSim(site.id);
  const relM = subtopic.match(/^rele\/(\d)\/set$/);
  const srvM = subtopic.match(/^servo\/(\d)\/set$/);
  if(relM){
    const i = parseInt(relM[1])-1;
    if(sim.binMode) return; // med binarnim stetjem so posamezni releji zaklenjeni
    const mode = d.mode||'static';
    sim.rele[i].mode = mode;
    if(mode==='static'){
      // S3: zakljucek cikla -> rele v mirovanje (0), razen ce je ukazan ON
      sim.rele[i].state = !!d.state;
    } else {
      // S2: ciklicno delovanje se VEDNO zacne od zacetka (faza ON)
      sim.rele[i].ton = d.ton ?? 1; sim.rele[i].toff = d.toff ?? 1;
      sim.rele[i].phaseOn = true; sim.rele[i].state = true; sim.rele[i].last = Date.now();
    }
  } else if(srvM){
    const i = parseInt(srvM[1])-1;
    const mode = d.mode||'static';
    const sv = sim.servo[i];
    sv.mode = mode;
    if(d.rampMs!==undefined) sv.rampMs = d.rampMs|0;   // cas prehoda (0 = takojsen skok)
    const now = Date.now();
    // M1: `||` pozre veljavno vrednost 0 (npr. Pozicija OFF = 0) - povsod ??
    if(d.posOff!==undefined) sv.posOff = d.posOff;
    if(d.posOn!==undefined)  sv.posOn  = d.posOn;
    if(mode==='static'){
      // O3/S3: zakljucek cikla - pocisti fazo, servo gre na ROCNO lego
      // (posOff/posOn iz ukaza), ne na 0
      sv.phase = 'RAMP_A'; sv.phaseStart = now;
      // rocni gumb ON/OFF: premik na ciljno lego z rampo (ne skok)
      sv.rampFrom = sv.pos; sv.target = d.pos ?? 0; sv.rampStart = now;
      if(!sv.rampMs) sv.pos = sv.target;
    } else {
      sv.posA = d.posA ?? 0; sv.posB = d.posB ?? 255;
      sv.ton = d.ton ?? 1; sv.toff = d.toff ?? 1;
      // S2: cikel se VEDNO zacne od zacetka - iz trenutne lege na PozA
      sv.rampFrom = sv.pos; sv.target = sv.posA; sv.rampStart = now;
      sv.phase = 'RAMP_A'; sv.phaseStart = now;   // cikel se zacne s PREHODOM
      if(!sv.rampMs) sv.pos = sv.target;
    }
  } else if(subtopic==='binarno/set'){
    // binarno PERIODICNO stetje (staticni nacin je odstranjen)
    const wasOn = sim.binMode;
    if(d.on!==undefined) sim.binMode = !!d.on;
    if(d.perioda!==undefined) sim.binPeriod = Math.max(0.1, d.perioda);
    // S2: ob vklopu se stetje VEDNO zacne od 0
    if(sim.binMode && !wasOn){ sim.binVal = 0; sim.binLast = Date.now(); }
    // S3: ob izklopu binarnega stetja gredo releji v mirovanje (0)
    if(!sim.binMode && wasOn){
      sim.rele.forEach(r=>{ if(r.mode!=='blink'){ r.state = false; } });
    }
    const Lb = ensureLive(site.id);
    Lb.binOn = sim.binMode; Lb.binPeriod = sim.binPeriod||1;
  } else if(subtopic==='config/set'){
    const Lc = ensureLive(site.id);
    if(d.offlineGuard!==undefined) Lc.offlineGuard = !!d.offlineGuard;
    if(d.bootRestore!==undefined)  Lc.bootRestore  = !!d.bootRestore;
    logDebug(`SIM config ${site.id}: offlineGuard=${Lc.offlineGuard} bootRestore=${Lc.bootRestore}`);
  } else {
    logDebug(`applySimCommand ${site.id}: neprepoznan subtopic "${subtopic}"`, true);
  }
  saveSims();
  pushSimStateNow(site, sim); // takoj odrazi spremembo - ne caka na tick/running
}

// Virtualna naprava "tece" ~10x/s (0.1s) - realtime obcutek za utripanje/nihanje.
// POPRAVEK: prejsnja verzija je imela `if(!sim.running) return;` PRED
// klicem pushSimStateNow(), kar je prekinilo cel cikel za to napravo -
// stanje se torej NI objavljalo/osvezevalo, ce Simulator ni bil zagnan,
// ne glede na to, da je applySimCommand() ze klical pushSimStateNow()
// enkrat ob ukazu (ena sama objava je lahko izgubljena/zakasnjena na
// javnem MQTT brokerju, brez ponovitve). Zdaj: pushSimStateNow() tece
// VEDNO na vsakih 100ms za VSAKO sim napravo (ne glede na running) -
// "running" vpliva SAMO se na to, ali Ton/Toff/nihanje casovniki
// napredujejo (ali rele/servo dejansko preklaplja fazo).
setInterval(()=>{
  const now = Date.now();
  CFG.sites.forEach(site=>{
    if(site.opMode==='real') return;
    const sim = ensureSim(site.id);
    // L1: virtualna naprava dela VEDNO - enako kot pravi firmware, ki nima
    // nobenega "Start" gumba. Kar uporabnik vklopi v Nadzoru (binarno stetje,
    // utripanje, nihanje), se izvaja takoj. Prejsnji pogoj sim.running je
    // povzrocil, da se stevec ni premikal, ceprav je pisalo AKTIVNO.
    if(sim._forcedOff) return;   // JJ7: guard je izklopil izhode - vse ustavljeno
    if(sim.binMode){
      const stepMs = Math.max(100, (sim.binPeriod||1)*1000);
      if(now - (sim.binLast||0) >= stepMs){
        sim.binLast = now;
        sim.binVal = ((sim.binVal||0) + 1) & 0x0F;
      }
    } else {
      sim.rele.forEach(r=>tickRelaySim(r, now));
    }
    sim.servo.forEach((sv,idx)=>tickServoSim(sv, now, site, idx));
    pushSimStateNow(site, sim); // vedno - zagotavlja neprekinjeno samodejno osvezitev/popravek stanja
  });
}, 100);

// sim_broker: virtualna naprava se narocni na iste .../set teme kot pravi
// firmware in izvede applySimCommand() - enak potek kot Nadzor->ESP32.
// POPRAVEK: prej se je to zgodilo SAMO ob kliku "Zaženi" v Simulator
// zavihku - ce uporabnik ni pritisnil Start, ukazi iz Nadzora niso sli
// nikamor (nihce ni poslusal teme). Zdaj se poklice takoj ob dodajanju/
// povezavi naprave (glej connectAll/resubscribeAll), Start/Stop pa
// vpliva samo se na to, ali Ton/Toff/nihanje casovniki napredujejo.
// idempotentno - varuje pred podvojenimi 'message' listenerji.
let simBrokerListening = new Set();
function ensureSimBrokerListening(site){
  if(site.opMode!=='sim_broker') return;
  if(simBrokerListening.has(site.id)){ logDebug(`ensureSimBrokerListening ${site.id}: ze narocen (preskok)`); return; }
  const c = getClient(site.mqtt);
  if(!c){ logDebug(`ensureSimBrokerListening ${site.id}: NI MQTT klienta za ${site.mqtt}`, true); return; }
  c.subscribe(`naprava/${site.id}/rele/+/set`);
  c.subscribe(`naprava/${site.id}/servo/+/set`);
  c.subscribe(`naprava/${site.id}/binarno/set`);
  c.subscribe(`naprava/${site.id}/config/set`);
  logDebug(`ensureSimBrokerListening ${site.id}: SUB rele/+/set, servo/+/set, binarno/set, config/set`);
  c.on('message', (topic, payload)=>{
    if(!topic.startsWith(`naprava/${site.id}/`) || !topic.endsWith('/set')) return;
    logDebug(`SIM <- ukaz ${topic} (${payload.length}B)`);
    try{
      const d = JSON.parse(payload.toString());
      const subtopic = topic.slice((`naprava/${site.id}/`).length);
      applySimCommand(site, subtopic, d);
    }catch(e){ logDebug(`SIM ukaz ${topic}: napaka parsanja JSON: ${e.message}`, true); }
  });
  simBrokerListening.add(site.id);
}

// Simulator = samo-berljiv prikaz stanja virtualne naprave (v realnem casu).
// Krmiljenje relejev/servo poteka IZKLJUCNO iz Nadzora (enako kot pri pravi
// napravi) - tu ni vec urejevalnih polj zanje. Edino urejevalno polje so
// simulirani analogni vhodi (simulacija senzorja, ki ga od drugod ni mogoce ukazati).
// Enak popravek kot pri Nadzoru: STRUKTURA (Start/Stop, analogni drsniki)
// se izriše samo ob menjavi zavihka/naprave; STANJE (badge-i za releje/servo)
// se osvezuje periodicno preko direktnega DOM zapisa - drsniki se med tem
// nikoli ne prerisejo, zato vlecenje prsta ni prekinjeno.
function renderSimulatorControls(){
  const el = document.getElementById('tab-simulator');
  const s = currentSite();
  if(!s){ el.innerHTML = `<div class="empty">${T('emptyNoDevice')}</div>`; return; }
  if(s.opMode==='real'){ el.innerHTML = `<div class="empty">${T('opReal')}</div>`; return; }
  const sim = ensureSim(s.id);

  let h = `<div class="card"><div class="chead"><h3>${T('cardSim')}</h3><button class="hb" onclick="openHelp('hSim')"></button></div>
  <div class="cbody" style="max-height:none">
  <p class="small">${T('simHint')}</p>
  </div></div>`;

  let stB = '<div class="row2" id="simRelBadges">';
  for(let i=0;i<4;i++) stB += `<span class="tag" id="simRelTag${i}" style="min-width:64px;text-align:center">${T('relayN')} ${i+1}: —</span>`;
  stB += '</div>';
  stB += `<p class="small" id="simBinInfo" style="display:none"></p>`;
  stB += '<div class="row2 sep" id="simSrvBadges">';
  for(let i=0;i<2;i++) stB += `<span class="tag on" id="simSrvTag${i}" style="min-width:80px;text-align:center">${T('servoN')} ${i+1}: —</span>`;
  stB += '</div>';
  h += cardHtml('simstate', T('cardRelays')+' / '+T('cardServo'), 'hSim', stB);

  let anB = '';
  for(let i=1;i<=4;i++){
    anB += `<div class="row2"><label class="lbl">${T('inputN')} ${i}</label>
      <input type="range" min="0" max="40" step="0.1" value="${sim.analog['a'+i]||0}" style="flex:1"
        oninput="ensureSim('${s.id}').analog.a${i}=parseFloat(this.value); this.nextElementSibling.textContent=this.value+'V'; saveSims();">
      <span style="min-width:45px">${(sim.analog['a'+i]||0)}V</span>
    </div>`;
  }
  h += cardHtml('simanalog', T('cardSimAnalog'), 'hSim', anB);

  // LL1: Debug kartica je PRESELJENA v zavihek Osciloskop - pri realnem
  // nacinu zavihek Simulator izgine, s tem pa bi izgubili dostop do dnevnika
  // ravno takrat, ko je najbolj potreben.

  el.innerHTML = h;
  updateSimulatorState();
}

function updateSimulatorState(){
  if(currentTab!=='simulator') return;
  const s = currentSite(); if(!s || s.opMode==='real') return;
  const sim = ensureSim(s.id);
  const releState = sim.binMode ? [0,1,2,3].map(i=>!!((sim.binVal>>i)&1)) : sim.rele.map(r=>r.state);

  for(let i=0;i<4;i++){
    const t = document.getElementById('simRelTag'+i);
    if(!t) continue; // ta badge se ni izrisan - NE prekini cele funkcije (prej: return)
    t.textContent = `${T('relayN')} ${i+1}: ${releState[i]?T('lblOn'):T('lblOff')}`;
    t.classList.toggle('on', releState[i]);
    t.classList.toggle('off', !releState[i]);
  }
  const binInfo = document.getElementById('simBinInfo');
  if(binInfo){
    binInfo.style.display = sim.binMode ? 'block':'none';
    binInfo.textContent = `${T('lblBinary')}: ${sim.binVal} (0-15)`;
  }
  for(let i=0;i<2;i++){
    const t = document.getElementById('simSrvTag'+i);
    if(t) t.textContent = `${T('servoN')} ${i+1}: ${sim.servo[i].pos}`;
  }
}

/* ============================================================
   OSCILOSKOP
   ============================================================ */
let OSC_TIMEBASE = 1000; // SS4: privzeto 1s
const OSC_TIMEBASES = [1,10,100,1000,2000,5000,10000,20000];
// HH2: zoom = KOLIKO ZADNJIH VZORCEV iz bufferja se prikaze v oknu.
// Sirina okna v casu = stevilo vzorcev x casovna baza.
// Pri ~900px zaslona je 900 vzorcev "en vzorec na piksel" (optimalno);
// vec kot to se zlije, manj pa razpotegne.
// RR1: dodane fine stopnje (250/100/50) za podroben pregled posameznih
// preklopov. Pri 900 vzorcih je ~1 vzorec na piksel, nizje pa razpotegnjeno.
const OSC_ZOOMS = [30000, 15000, 7000, 3500, 1750, 900, 500, 250, 100, 50];
let OSC_SAMPLES = 50;   // SS4: privzeto 50 zapisov
let OSC_ZOOM = 1; // 1 = privzeta sirina okna (ohranjeno za scipanje)
// EE3: zamrznjen prikaz - zbiranje podatkov tece naprej, le izris stoji.
// OSC_FROZEN_AT je "zdaj" v trenutku ustavitve, OSC_PAN pa odmik pri
// drsenju nazaj po zgodovini (v ms; pozitivno = nazaj v preteklost).
let OSC_RUNNING = true;
let OSC_FROZEN_AT = 0;
let OSC_PAN = 0;

// Desni rob okna: pri zivem prikazu "zdaj", pri zamrznjenem trenutek
// ustavitve, zamaknjen za drsenje.
function oscNowRef(){
  return (OSC_RUNNING ? Date.now() : OSC_FROZEN_AT) - OSC_PAN;
}

// HH4: oznaka, kje v bufferju smo (koliko nazaj od najnovejsega podatka)
function updateOscPosInfo(){
  const el = document.getElementById('oscPosInfo');
  if(!el) return;
  if(OSC_RUNNING && OSC_PAN === 0){
    el.textContent = `${T('oscWinInfo')}: ${OSC_SAMPLES} × ${OSC_TIMEBASE<1000?OSC_TIMEBASE+'ms':(OSC_TIMEBASE/1000)+'s'} = ${fmtDur(oscWindowMs(), oscWindowMs())}`;
  } else {
    const backSamples = Math.round(OSC_PAN / Math.max(1, OSC_TIMEBASE));
    el.textContent = `${T('oscPos')}: −${fmtDur(OSC_PAN, OSC_PAN)} (≈ ${backSamples} ${T('oscSamples')})`;
  }
}

function toggleOscRun(){
  OSC_RUNNING = !OSC_RUNNING;
  logDebug(`OSC: prikaz ${OSC_RUNNING?'V ZIVO':'USTAVLJEN'}`);
  if(OSC_RUNNING){ OSC_PAN = 0; }          // nazaj na zivi prikaz
  else { OSC_FROZEN_AT = Date.now(); }     // zamrzni na tem trenutku
  renderOscFull();
}

// U1: izbrana casovna baza je SIRINA OKNA (gumb "2s" = 2s prikaza), razen
// pri zelo hitrih bazah, kjer okno ostane 2s (1ms okno bi bilo neuporabno).
// Prej je bil skok z 1s (okno 2s) na 2s (okno 20s) - nelogicno in nezvezno.
// HH1/HH2: casovna baza je FREKVENCA vzorcenja, zoom pa doloca, koliko
// zadnjih vzorcev je v oknu. Sirina okna = vzorci x baza.
function oscWindowMs(){
  return Math.max(200, (OSC_SAMPLES * OSC_TIMEBASE) / OSC_ZOOM);
}

// Osciloskop je samo se v svojem zavihku (mini prikaz v Nadzoru odstranjen).

      ${OSC_RUNNING ? '' : `<span class="small">${T('oscPanHint')}</span>`}
    </div>

  h += `<div class="sep" style="margin-top:12px">
    <div class="chead" style="padding:0 0 8px"><h3>${T('cardDebug')}</h3></div>
    <div class="row2">

      <button class="btn" onclick="copyDebugLog()">${T('btnCopy')}</button>

// L3: enoto doloci CELOTNO okno, ne vsaka oznaka posebej - sicer je na isti
// osi mesanica (-1.8s ... -921ms). windowMs je referenca za vse oznake.
function fmtDur(ms, windowMs){
  const ref = (windowMs===undefined) ? ms : windowMs;
  if(ref < 1000) return Math.round(ms)+'ms';
  return (ms/1000).toFixed(ref<10000?1:0)+'s';
}

// LL3: povzetek okolja - zapise se ob prvem odprtju osciloskopa, da je v
// dnevniku vedno kontekst (katera naprava, kateri broker, kateri nacin).
let _diagSummaryDone = false;
function logDiagSummary(){
  if(_diagSummaryDone) return;
  _diagSummaryDone = true;
  const s = currentSite();
  logDebug(`--- DIAGNOSTIKA ---`);
  logDebug(`app=${APP_VERSION}  naprave=${CFG.sites.length}  jezik=${LANG}`);
  if(s) logDebug(`aktivna: '${s.name}' id=${s.id} broker=${s.mqtt} nacin=${s.opMode}`);
  logDebug(`osc: baza=${OSC_TIMEBASE}ms vzorcev=${OSC_SAMPLES} buffer=${OSC_MAX_SAMPLES} dnevnik=${DEBUG_CAP}`);
  logDebug(`brskalnik: ${navigator.userAgent.substring(0,80)}`);
  logDebug(`-------------------`);
}

function renderOscFull(){
  logDiagSummary();
  const el = document.getElementById('tab-osciloskop');
  const s = currentSite();
  if(!s){ el.innerHTML = `<div class="empty">${T('emptyNoDevice')}</div>`; return; }
  el.innerHTML = `<div class="card"><div class="cbody" style="max-height:none;padding-top:14px">${oscChannelHtml('full', s.id)}</div></div>`;

  const bar = document.getElementById('oscTbBar');
  OSC_TIMEBASES.forEach(tb=>{
    const b = document.createElement('button');
    b.textContent = tb<1000 ? tb+'ms' : (tb/1000)+'s';   // 1ms..20s
    b.setAttribute('aria-pressed', tb===OSC_TIMEBASE ? 'true':'false');
    b.onclick = ()=>{
      OSC_TIMEBASE=tb; OSC_ZOOM=1;
      logDebug(`OSC: casovna baza=${tb<1000?tb+'ms':(tb/1000)+'s'}, okno=${fmtDur(oscWindowMs(), oscWindowMs())}`);
      // posreduj novo casovno bazo pravi napravi (samo Realno delovanje -
      // simulacijski nacini imajo fiksno vzorcevalno periodo v tem UI-ju)
      if(s.opMode==='real') sendCommand(s, 'scope/set', { timebase_ms: tb });
      renderOscFull();
    };
    bar.appendChild(b);
  });

  // HH2: gumbi za zoom (stevilo vzorcev v oknu)
  const zb = document.getElementById('oscZoomBar');
  if(zb){
    OSC_ZOOMS.forEach(n=>{
      const b = document.createElement('button');
      b.textContent = n >= 1000 ? (n/1000)+'k' : n;
      b.setAttribute('aria-pressed', n===OSC_SAMPLES ? 'true':'false');
      b.onclick = ()=>{ OSC_SAMPLES = n; OSC_ZOOM = 1;
        logDebug(`OSC: zoom=${n} vzorcev, okno=${fmtDur(oscWindowMs(), oscWindowMs())}`);
        renderOscFull(); };
      zb.appendChild(b);
    });
  }
  updateOscPosInfo();

  ['rele','servo','analog'].forEach(grp=>drawOscGroup('full_'+grp, s.id, grp));
  attachOscGestures('full_rele', s.id, 'rele');
  attachOscGestures('full_servo', s.id, 'servo');
  attachOscGestures('full_analog', s.id, 'analog');
}

// Barve grafa se berejo iz trenutne palete (ne trdo zapisane),
// da osciloskop ustreza izbrani temi tudi pri svetlih paletah.
let OSC_COLORS = ['#FFD23F','#86B06A','#62A8C4','#D3543A'];
let GRID_COLOR = '#38423C';
let AXIS_TXT_COLOR = '#8A968F';
// T1: barve SLEDI so FIKSNE in med seboj kar najbolj razlocne - prej so se
// brale iz palete, zato so bile pri temah kot "Terminal" vse odtenki zelene
// in kanalov ni bilo mogoce lociti. Mreza/okvir/osi ostanejo vezani na paleto.
const TRACE_DARK  = ['#FFD23F','#4FD37C','#4FA8FF','#FF5A3D']; // za temne teme
const TRACE_LIGHT = ['#8A5200','#0F5B33','#00417A','#A80000']; // za svetle teme
function isLightTheme(){
  const ink = (getComputedStyle(document.documentElement).getPropertyValue('--ink')||'').trim();
  const h = ink.replace('#','');
  if(h.length < 6) return false;
  const r = parseInt(h.slice(0,2),16), g2 = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return (r+g2+b) > 380;   // enak prag kot pri EF projektu
}
function syncOscColors(){
  const cs = getComputedStyle(document.documentElement);
  const g = n => (cs.getPropertyValue('--'+n)||'').trim();
  OSC_COLORS = isLightTheme() ? TRACE_LIGHT.slice() : TRACE_DARK.slice();
  GRID_COLOR = g('line')||GRID_COLOR;
  AXIS_TXT_COLOR = g('mute')||AXIS_TXT_COLOR;
}

function drawOscGroup(key, siteId, grp){
  const canvas = document.getElementById('oscCanvas_'+key);
  const wrap = document.getElementById('oscCanvasWrap_'+key);
  if(!canvas || !wrap) return;
  const dpr = window.devicePixelRatio || 1;
  const w = wrap.clientWidth || 300, h = wrap.clientHeight || 64;
  canvas.width = w*dpr; canvas.height = h*dpr;
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);

  const isMini = key.startsWith('mini');
  // levo: prostor za y-skalo; spodaj: prostor za casovno os (samo v "full" pogledu)
  const marginL = isMini ? 4 : 30;
  const marginB = isMini ? 0 : 14;
  const marginT = 4, marginR = 4;
  const plotX = marginL, plotY = marginT;
  const plotW = w - marginL - marginR, plotH = h - marginT - marginB;

  // okvir
  ctx.strokeStyle = GRID_COLOR; ctx.lineWidth = 1;
  ctx.strokeRect(plotX+0.5, plotY+0.5, plotW-1, plotH-1);

  const buf = OSCBUF[siteId] || [];
  const windowMs = oscWindowMs();
  const now = oscNowRef();   // EE3: pri zamrznjenem prikazu je to trenutek ustavitve (+ drsenje)
  const samples = buf.slice(lowerBound(buf, now-windowMs));   // EE7

  if(!isMini){
    // navpicne pomozne crte (4 delitve) + casovna os spodaj
    ctx.strokeStyle = GRID_COLOR; ctx.lineWidth = 1;
    ctx.font = '9px monospace'; ctx.fillStyle = AXIS_TXT_COLOR;
    for(let d=0; d<=4; d++){
      const x = plotX + plotW*(d/4);
      ctx.beginPath(); ctx.moveTo(x, plotY); ctx.lineTo(x, plotY+plotH); ctx.stroke();
      const label = d===4 ? T('oscNow') : '-'+fmtDur(windowMs*(4-d)/4, windowMs);
      ctx.textAlign = d===0?'left':(d===4?'right':'center');
      ctx.fillText(label, x, h-2);
    }
    // vodoravne pomozne crte (3 delitve) + y-skala levo
    for(let d=0; d<=2; d++){
      const y = plotY + plotH*(d/2);
      ctx.beginPath(); ctx.moveTo(plotX, y); ctx.lineTo(plotX+plotW, y); ctx.stroke();
    }
    ctx.textAlign = 'right';
    if(grp==='servo'){
      ctx.fillText('255', marginL-3, plotY+8);
      ctx.fillText('0', marginL-3, plotY+plotH-1);
    } else if(grp==='analog'){
      ctx.fillText('40V', marginL-3, plotY+8);
      ctx.fillText('20V', marginL-3, plotY+plotH/2+3);
      ctx.fillText('0V', marginL-3, plotY+plotH-1);
    } else if(grp==='rele'){
      const rowH = plotH/4;
      ['R1','R2','R3','R4'].forEach((nm,i)=>{ ctx.fillText(nm, marginL-3, plotY+i*rowH+rowH/2+3); });
    }
  }

  // GG6: vsi trije grafi izhajajo iz ISTEGA bufferja (enoten 19B zapis)
  if(samples.length < 2){
    ctx.fillStyle = AXIS_TXT_COLOR; ctx.font = '11px monospace'; ctx.textAlign='left';
    ctx.fillText(T('oscNoData'), plotX+8, plotY+plotH/2);
    return;
  }

  const t0 = now-windowMs, t1 = now;
  const xOf = (t)=> plotX + ((t-t0)/(t1-t0)) * plotW;

  if(grp==='rele'){
    // DD3: stopnicasta crta IZ DOGODKOV - stopnica stoji na tocnem casu
    // preklopa, ne glede na izbrano casovno bazo. Med dogodkoma je stanje
    // po definiciji nespremenjeno, zato ravna crta.
    // GG6: stopnicasto iz zaporednih vzorcev - vrednost velja do naslednjega
    for(let ch=0; ch<4; ch++){
      ctx.strokeStyle = OSC_COLORS[ch]; ctx.lineWidth = 1.5; ctx.beginPath();
      const rowH = plotH/4, yOn = plotY+ch*rowH+3, yOff = plotY+ch*rowH+rowH-3;
      let prevY = samples[0].rele[ch] ? yOn : yOff;
      ctx.moveTo(xOf(samples[0].t), prevY);
      for(let i=1;i<samples.length;i++){
        const x = xOf(samples[i].t), y = samples[i].rele[ch] ? yOn : yOff;
        if(y !== prevY){ ctx.lineTo(x, prevY); ctx.lineTo(x, y); prevY = y; }
        else ctx.lineTo(x, y);
      }
      ctx.lineTo(plotX+plotW, prevY);
      ctx.stroke();
    }
  } else if(grp==='servo'){
    // DD4: pozicija se za VSAK x-piksel izracuna iz rampe, ki takrat velja -
    // gladka krivulja pri katerikoli bazi, brez odvisnosti od vzorcenja.
    // GG6: iz zaporednih vzorcev (rampa je vidna tako gosto, kot je vzorcenje)
    for(let ch=0; ch<2; ch++){
      ctx.strokeStyle = OSC_COLORS[ch]; ctx.lineWidth = 1.5; ctx.beginPath();
      samples.forEach((p,i)=>{
        const x = xOf(p.t), y = plotY + plotH - (p.servo[ch]/255)*plotH;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.stroke();
    }
  } else { // analog
    ['a1','a2','a3','a4'].forEach((k,ch)=>{
      ctx.strokeStyle = OSC_COLORS[ch]; ctx.lineWidth = 1.5; ctx.beginPath();
      samples.forEach((p,idx)=>{
        const v = (p.analog && p.analog[k]) || 0;
        const x = xOf(p.t); const y = plotY + plotH - (Math.min(v,40)/40)*plotH;
        if(idx===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.stroke();
    });
  }
}

function attachOscGestures(key, siteId, grp){
  const wrap = document.getElementById('oscCanvasWrap_'+key);
  const tip = document.getElementById('oscTip_'+key);
  if(!wrap) return;
  let pinchStartDist = null, pinchStartZoom = 1;

  wrap.addEventListener('touchstart', (e)=>{
    if(e.touches.length===2){
      pinchStartDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      pinchStartZoom = OSC_ZOOM;
    }
  }, {passive:true});
  wrap.addEventListener('touchmove', (e)=>{
    if(e.touches.length===2 && pinchStartDist){
      e.preventDefault(); // prepreci privzeto brskalnikovo obnasanje SAMO med scipanjem z 2 prstoma
      const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      let z = pinchStartZoom * (d/pinchStartDist);
      OSC_ZOOM = Math.max(0.2, Math.min(8, z));
      ['rele','servo','analog'].forEach(g=>drawOscGroup('full_'+g, siteId, g)); // takojsen odziv na scipanje
    }
    // z 1 prstom preventDefault NI klican - touch-action:pan-y v CSS
    // prepusti navpicno drsenje strani brskalniku.
  }, {passive:false});
  // HH4: drsenje po bufferju deluje VEDNO (tudi med zivim prikazom).
  // Ob zacetku drsenja se zivo sledenje prekine, sicer bi novi podatki
  // premikali okno pod prstom. Ko poteg doseze skrajni desni rob (PAN=0),
  // se zivo sledenje obnovi.
  let panStartX = null, panStartY = null, panStartVal = 0;
  wrap.addEventListener('touchstart', (e)=>{
    if(e.touches.length===1){
      panStartX = e.touches[0].clientX; panStartY = e.touches[0].clientY; panStartVal = OSC_PAN;
    }
  }, {passive:true});
  wrap.addEventListener('touchmove', (e)=>{
    if(panStartX===null || e.touches.length!==1) return;
    const dx = e.touches[0].clientX - panStartX;
    const dy = e.touches[0].clientY - (panStartY||0);
    // GG7: prag 20px IN pretezno vodoraven premik - tap za odcitek in
    // navpicno drsenje strani ne smeta ustaviti prikaza (prej je ze rahel
    // premik pri tapu sprozil ustavitev).
    if(Math.abs(dx) < 20 || Math.abs(dx) < Math.abs(dy)) return;
    e.preventDefault();
    if(OSC_RUNNING){                          // prvi premik ustavi sledenje
      OSC_RUNNING = false; OSC_FROZEN_AT = Date.now();
      // GG7: med potezo NE renderOscFull() (preri\u0161e cel zavihek in prekine
      // potezo) - stanje gumba osvezimo sele ob koncu poteze
    }
    // poteg desno = nazaj v preteklost; omejeno na dolzino bufferja
    const buf = OSCBUF[siteId] || [];
    const oldestT = buf.length ? buf[0].t : Date.now();
    const maxPan = Math.max(0, (OSC_FROZEN_AT || Date.now()) - oldestT);
    OSC_PAN = Math.max(0, Math.min(maxPan, panStartVal + (dx / wrap.clientWidth) * oscWindowMs()));
    if(OSC_PAN === 0 && dx < 0){              // nazaj na desni rob -> zivo
      OSC_RUNNING = true; renderOscFull(); panStartX = null; return;
    }
    updateOscPosInfo();
    ['rele','servo','analog'].forEach(g=>drawOscGroup('full_'+g, siteId, g));
  }, {passive:false});

  wrap.addEventListener('touchend', (e)=>{
    pinchStartDist = null;
    if(panStartX!==null && Math.abs((e.changedTouches[0]||{}).clientX - panStartX) > 20){
      panStartX = panStartY = null;
      renderOscFull();   // GG7: sele zdaj osvezi gumb/oznako polozaja
      return;
    }
    panStartX = panStartY = null;
    if(e.changedTouches && e.changedTouches.length===1 && (!e.touches || e.touches.length===0)){
      showOscTip(key, siteId, grp, e.changedTouches[0].clientX, wrap, tip);
    }
  });
  wrap.addEventListener('click', (e)=>{ showOscTip(key, siteId, grp, e.clientX, wrap, tip); });
}

function showOscTip(key, siteId, grp, clientX, wrap, tip){
  const windowMs = oscWindowMs();
  const now = oscNowRef();   // EE3
  const rect = wrap.getBoundingClientRect();
  const frac = Math.max(0, Math.min(1, (clientX-rect.left)/rect.width));
  const t0 = now-windowMs, t1 = now;
  const targetT = t0 + frac*(t1-t0);

  // GG6: vsi kanali iz istega bufferja - poiscemo najblizji vzorec
  const buf = OSCBUF[siteId]||[];
  const from = lowerBound(buf, t0);
  if(from >= buf.length) return;
  let nearest = buf[from], best = Infinity;
  for(let i=from;i<buf.length && buf[i].t<=t1;i++){
    const d = Math.abs(buf[i].t - targetT);
    if(d < best){ best = d; nearest = buf[i]; }
  }
  let txt = new Date(nearest.t).toLocaleTimeString() + ' · ';
  if(grp==='rele') txt += 'R:' + nearest.rele.map(b=>b?'1':'0').join('');
  else if(grp==='servo') txt += 'S1:'+nearest.servo[0]+' S2:'+nearest.servo[1];
  else txt += Object.keys(nearest.analog||{}).map(k=>k+':'+nearest.analog[k].toFixed(1)).join(' ');

  tip.textContent = txt;
  tip.style.display = 'block';
  clearTimeout(tip._to);
  tip._to = setTimeout(()=>{ tip.style.display='none'; }, 3000);
}

// V2: DRSECI izris - preris ~20x/s prek requestAnimationFrame, zato se
// casovno okno premika zvezno in krivulja gladko drsi z desne proti levi.
// Prej je bil preris na 500ms, zato je celotna slika poskocila za pol
// sekunde naenkrat. 20 slik/s je vizualno gladko, a varcno z baterijo.
// DD6: firmware po 30s brez scope/set preklopi na pocasno vzorcenje (1/s).
// Dokler je zavihek Osciloskop odprt, zahtevo osvezujemo vsakih 10s, sicer
// ADC preneha prihajati v izbrani casovni bazi.
setInterval(()=>{
  if(currentTab !== 'osciloskop') return;
  const s = currentSite();
  if(s && s.opMode === 'real') sendCommand(s, 'scope/set', { timebase_ms: OSC_TIMEBASE });
}, 10000);

const OSC_FPS = 20, OSC_FRAME_MS = 1000/OSC_FPS;
let _lastOscFrame = 0;
function oscFrame(ts){
  requestAnimationFrame(oscFrame);
  if(ts - _lastOscFrame < OSC_FRAME_MS) return;
  _lastOscFrame = ts;
  if(currentTab !== 'osciloskop') return;
  // TT1: izris preskocimo (platno ni vidno), SPREJEM podatkov pa tece naprej -
  // zapisi se zbirajo v buffer in se ob vrnitvi takoj izrisejo.
  if(document.hidden) return;
  if(!OSC_RUNNING) return;                 // EE3: zamrznjeno - izris sprozi drsenje
  const s = currentSite(); if(!s) return;
  ['rele','servo','analog'].forEach(g=>drawOscGroup('full_'+g, s.id, g));
}
requestAnimationFrame(oscFrame);

/* ============================================================
   ZAGON
   ============================================================ */
// H3: visina fiksne glave ni konstantna (vrstica z nacinom delovanja se
// pri realnem nacinu ne izpise, besedilo se lahko prelomi pri drugem jeziku),
// zato jo izmerimo in prenesemo v CSS spremenljivko --topH.
function syncTopHeight(){
  const top = document.querySelector('.top');
  if(!top) return;
  document.documentElement.style.setProperty('--topH', top.getBoundingClientRect().height + 'px');
}
window.addEventListener('resize', syncTopHeight);
window.addEventListener('orientationchange', ()=>setTimeout(syncTopHeight, 150));

// Q1: UI je VIR RESNICE. Ob nalaganju strani ali preklopu naprave posljemo
// napravi celotno stanje iz UICMD (4 releji + 2 serva), da se ne razideta.
// Prej se to ni zgodilo: UI se je izrisal iz UICMD (Rocno/OFF), virtualna
// naprava pa obnovila iz SIMS (npr. se vedno oscillate) in nihala naprej -
// gumb je pisal OFF, graf pa je kazal nihanje.
let _syncedSites = new Set();
function syncDeviceToUI(site, force){
  if(!site) return;
  // JJ2: pri REALNI napravi je vir resnice NAPRAVA (ima svoj NVS in obnovljeno
  // stanje). Prej je aplikacija ob zagonu poslala staro stanje iz localStorage
  // in s tem prepisala dejansko stanje naprave. Pri simulaciji ostane, ker
  // virtualna naprava lastnega trajnega stanja nima.
  if(site.opMode === 'real'){
    logDebug(`syncDeviceToUI ${site.id}: preskoceno (realna naprava je vir resnice)`);
    return;
  }
  if(!force && _syncedSites.has(site.id)) return;
  _syncedSites.add(site.id);
  const uc = ensureUICmd(site.id);
  const L = ensureLive(site.id);
  // S5: ukazi ZAPOREDNO z zamikom - ob posiljanju vseh v isti milisekundi
  // jih je javni broker deloma zavrgel (servo ukaza nista nikoli prispela).
  const queue = [];
  for(let i=0;i<4;i++){
    const r = uc.rele[i];
    queue.push([`rele/${i+1}/set`, r.mode === 'period'
      ? {mode:'blink', ton:r.ton, toff:r.toff}
      : {mode:'static', state:!!r.on}]);
  }
  for(let i=0;i<2;i++){
    const v = uc.servo[i];
    queue.push([`servo/${i+1}/set`, v.mode === 'period'
      ? {mode:'oscillate', posA:v.posA, posB:v.posB, ton:v.ton, toff:v.toff, rampMs:v.rampMsP}
      : {mode:'static', pos: v.on ? v.posOn : v.posOff, posOff:v.posOff, posOn:v.posOn, rampMs:v.rampMs}]);
  }
  // S5: uskladi tudi binarno stetje - prej izpusceno, zato je ostalo
  // vklopljeno iz prejsnje seje, ceprav ga v UI ni bilo vklopljeno
  queue.push(['binarno/set', {on: !!L.binOn, perioda: L.binPeriod||1}]);

  queue.forEach(([topic, payload], k)=>{
    setTimeout(()=>sendCommand(site, topic, payload), k*120);
  });
  logDebug(`syncDeviceToUI ${site.id}: v vrsti ${queue.length} ukazov (zamik 120ms)`);
}

}

document.querySelectorAll('[data-i]').forEach(el=>{ el.textContent = T(el.getAttribute('data-i')); });
